# Copy outside the source tree and replace all REQUIRED values with files from
# the actual PandarXT 32 unit. Live launch intentionally rejects this template.
lidar:
  - driver:
      use_gpu: false
      source_type: 1
      lidar_udp_type:
        device_ip_address: "REQUIRED_XT32_IP"
        udp_port: 2368
        ptc_port: 9347
        multicast_ip_address: ""
        use_ptc_connected: true
        host_ptc_port: 0
        correction_file_path: "REQUIRED_ACTUAL_UNIT_ANGLE_CORRECTION_FILE"
        firetimes_path: "REQUIRED_ACTUAL_UNIT_FIRETIME_FILE"
        recv_point_cloud_timeout: -1
        ptc_connect_timeout: -1
        host_ip_address: "REQUIRED_HOST_IP"
        fault_message_port: 0
        standby_mode: -1
        speed: 1200
        ptc_mode: 0
      pcap_type:
        pcap_path: ""
        correction_file_path: "REQUIRED_ACTUAL_UNIT_ANGLE_CORRECTION_FILE"
        firetimes_path: "REQUIRED_ACTUAL_UNIT_FIRETIME_FILE"
        pcap_play_synchronization: true
        pcap_play_in_loop: false
        play_rate_: 1.0
      rosbag_type:
        correction_file_path: "REQUIRED_ACTUAL_UNIT_ANGLE_CORRECTION_FILE"
        firetimes_path: "REQUIRED_ACTUAL_UNIT_FIRETIME_FILE"
      use_timestamp_type: 0
      frame_start_azimuth: 0
      thread_num: 4
      transform_flag: false
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
      fov_start: -1
      fov_end: -1
      enable_packet_loss_tool: true
      distance_correction_flag: true
      xt_spot_correction: false
      frame_frequency: 20.0
      default_frame_frequency: 20.0
      echo_mode_filter: 0
    ros:
      ros_frame_id: hesai_lidar_native
      ros_recv_packet_topic: /lidar_packets
      ros_send_packet_topic: /lidar_packets
      ros_send_point_cloud_topic: /lidar_points
      ros_send_imu_topic: /lidar_imu
      ros_send_packet_loss_topic: /lidar_packets_loss
      ros_send_ptp_topic: /lidar_ptp
      ros_send_correction_topic: /lidar_corrections
      ros_recv_correction_topic: /lidar_corrections
      ros_send_every_packet_topic: /lidar_every_packet
      send_packet_ros: false
      send_point_cloud_ros: true
      send_imu_ros: false
