; Gouda ESP32 firmware v4 (ND-17, G-FIRMWARE, REV-027). Design: design/docs/esp32_protocol_v4.md.
; Target: ESP32-DevKitC-VE (ESP32-WROVER-E, 8 MB flash), Arduino framework with the Bluepad32 package (Bluetooth Classic
; gamepad), MCP4922 DAC on SPI. Hardware wiring is the one of the previous firmware (firmware/gouda_dualsense_usb and
; research/joystick270_firmware/extract.md §1): SCK 18 / MOSI 23 / CS 5, relay GPIO32 kept LOW (DEC-037: relay unused).
;
; Build-time configuration is GENERATED from design/generated/params/firmware_config.yaml by tools/gen_build_config.py
; (extra script, runs before every build). No vehicle value is written in the sources (RQ-I076).
;   pio run -e esp32dev          vehicle build: approved / recorded values only (DAC values absent until DEC-077 -> DAC not written)
;   pio run -e esp32dev_trial    DESK/STUB TEST build: also firmware_config.trial.yaml (software trial values). Never flash on the vehicle.
; Host tests of the core (no hardware): test/host/run_host_tests.sh

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
monitor_speed = 460800
monitor_dtr = 0
monitor_rts = 0
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags = -Wall -Wextra -std=gnu++17 -DCORE_DEBUG_LEVEL=0 -Iinclude
extra_scripts = pre:tools/gen_build_config.py

[env:esp32dev]
build_flags = ${env.build_flags} -DGOUDA_TRIAL=0

[env:esp32dev_trial]
build_flags = ${env.build_flags} -DGOUDA_TRIAL=1
