    text: 
      ・人間が明示的に自律走行終了ボタンを押さない限り、自律走行を終了してはならない。また、万が一navigationが異常終了した場合や、一時停止ボタンを押した場合でも、ログ取りは継続する。ログは、PCが受信した入力、判断と理由・状態遷移・各段の指令・通信結果・設定状況（地図作成前後と自律走行開始前後、設定変更後に記録）を記録し、データの欠落があった場合はその範囲も記録する。受信していない値は推測で記録しない。ログ取りはRecordボタンを押せばいつでも開始でき、Stop
      Recordボタンを押せばいつでも終了できる。また、地図作成開始時と自律走行開始時にRecordボタンが押されていない場合は、自動でRecordを開始し、人間が地図作成終了ボタンや自律走行終了ボタンを押したときに停止される。Recordの自動開始の契機は、人が押した地図作成開始ボタンと自律走行開始ボタンのみとする。異常終了後の復帰や再開ボタンでは開始しないが、ログ取得を再開できるようにする。ログ取得に失敗しても走行は止めない。
