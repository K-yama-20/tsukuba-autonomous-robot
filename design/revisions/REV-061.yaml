modifications:
  - id: PRM-12
    set:
      design_status: 承認済み
      adoption: approved
      approval_decision_ref: DEC-122
    set_nested:
      parameter.value: true
      parameter.value_state: approved
      parameter.decision_deadline: 決定済み（DEC-122）
      parameter.software_trial_value: null
      parameter.software_trial_basis: 承認済みの設定選択のため仮値なし
    interpretation_append: 'REV-061: DEC-122 で TwistStamped（true）を承認。ND-11 の購読の型を合わせる。'
  - id: ND-10
    set_nested:
      ros_node.responsibilities:
        - 経路計画・追従・後退・再計画・通過／到達判定（RQ-I011・RQ-I018・RQ-I019）
        - NavigateThroughPoses action の提供（IFD-13）と cmd_vel の発行（IFD-15。velocity_smoother を経た後の値）
        - costmap の SpeedFilter による SpeedLimit の発行と controller への適用（IFD-14、DEC-031）。mask・filter info は標準 server で配信（IFD-42）
        - map_server による静的地図の提供（IFD-24）
        - 設定・プラグイン・BT で拡張し本体は改変しない（RQ-I056・RQ-I057）
        - '構成（DEC-122）: controller は Regulated Pure Pursuit、planner は NavFn、BT は上流の navigate_through_poses_w_replanning_and_recovery.xml の写しに PRM-11・PRM-18 を入れたもの、behaviors は spin・backup・wait、velocity_smoother を使う、collision_monitor は使わない（RQ-I072）、cmd_vel は TwistStamped（PRM-12）'
        - 障害物は XT-32 の点群（IFD-21）を local の VoxelLayer・global の ObstacleLayer に直接入れ、高さの帯（PRM-70・PRM-71）で地面と頭上を除く。track_unknown_space を true にして観測していない所を空きとみなさない（RQ-I012、DEC-122）
        - 設定は上流の nav2_bringup の nav2_params.yaml を雛形に、plugin の選択、frame・topic（IF の名前）と PRM の値だけを差し込んで起動時に作る。雛形のその他の値は変えない。実車の設定（trial なし）で PRM-11・17・18・66〜73 のどれかが未確定なら Nav2 を起動せず理由を記録する（RQ-I076、intent.md:85）
    set:
      issue_refs: [Q-01, V-001, Q-06, Q-12, H-001, H-005, H-011, H-013, Q-04]
    interpretation_append: 'REV-061（DEC-122）: Nav2 は lifecycle_manager の autostart を false にし、ND-03 が自律走行の開始（TR-05）で起動、手動走行への遷移（TR-11・TR-12）で停止する（IFD-36）。手動走行・地図作成では inactive（map→odom の持ち主がない）。'
  - id: ND-09
    set:
      name: 障害物の扱い（独自の node なし。Nav2 costmap の VoxelLayer・ObstacleLayer の設定、DEC-122）
    set_nested:
      ros_node.responsibilities:
        - XT-32 点群（IFD-21）を Nav2 の costmap の観測源として直接使い、高さの帯（PRM-70・PRM-71）で地面と頭上を除く。独自の node は作らない（DEC-122 の案 a）
        - 無点群を周囲安全の証拠にしない（観測外を安全とみなさない：RQ-I012。track_unknown_space）
        - 坂で地面が帯に入り障害物になる場合は、実車の記録で確かめてから独自の地面の除去（旧案、DEC-107 と同じ課題）を提案する
      ros_node.lifecycle: external
      ros_node.process_group: nav2
      ros_node.publishes_refs: []
      ros_node.placement_rationale: 'REV-061（DEC-122）: 独自の node を作らず ND-10 の costmap の設定で実現する。IFD-23（perception/obstacle_points）は発行しない（costmap は IFD-21 を直接購読する）。自己位置推定用の元点群は加工しない。'
  - id: IFD-23
    set_nested:
      designed_interface.time_semantics: 'REV-061（DEC-122）: 発行しない。障害物は ND-10 の costmap が IFD-21 を直接購読して扱う（ND-09 は独自の node を持たない）。以前の定義: header.stamp は元点群の計測時刻。stale を空間が空いた証拠にしない（RQ-I012）'
      designed_interface.publisher_refs: [ND-09]
  - id: IFD-21
    set_nested:
      designed_interface.consumer_refs: [ND-06, ND-07, ND-08, ND-09, ND-10, ND-16, ND-02]
  - id: ND-13
    set_nested:
      ros_node.responsibilities:
        - 'base_link→base_footprint（base_footprint は base_link の真下、z=−PRM-05。REP-103：x前方・y左方・z上方）、base_link→各センサ frame（xt32_link・imu_link・gnss_link・gnss_aux1_link）の静的TFを単独で発行（RQ-I058）。base_footprint を base_link の子にするのは、odom→base_link（IFD-19）と合わせて base_link の親を一つにするため（REV-061 で直した。以前の base_footprint→base_link は IFD-19 と同時に使うと base_link の親が二つになる）'
        - gouda_monitor の /config（IFD-26）で人が指定した LiDAR・IMU の座標方向と取付位置、GNSS の 2 つのアンテナの位置を読み、Nav2 前提の方向への変換を静的TFの回転として表す（DEC-007）
        - '/config の UNKNOWN の項目は中立の値（移動 0、回転なし、軸は base_link の軸）で出し、その一覧を DecisionEvent（static_tf_published）に記録する（RQ-I081・DEC-122。以前の「未入力なら TF を発行しない」を置き換え）'
        - /config の保存（monitor の DecisionEvent settings）で読み直して出し直す
      ros_node.publishes_refs: [IFD-20, IFD-28]
      ros_node.placement_rationale: 'static_transform_publisher ではなく小さな node（gouda_static_tf）。/config の保存で出し直すため。軸の変換は TF のみで行い、点群・IMU データ自体を書き換えない。取付の計算は GLIM の T_lidar_imu と同じ sensor_extrinsics を使う。'
  - id: IFD-20
    set_nested:
      designed_interface.frame: base_link（REP-103）→ base_footprint（z=−PRM-05）, xt32_link, imu_link, gnss_link, gnss_aux1_link（センサの座標方向・取付位置は /config の指定値から ND-13 が変換。UNKNOWN は中立の値：DEC-122）。base_link の親は odom（IFD-19）だけ（REV-061 で base_footprint→base_link を逆向きに直した）
      designed_interface.consumer_refs: [ND-06, ND-07, ND-08, ND-09, ND-10, ND-16, ND-19]
  - id: IFD-26
    set_nested:
      designed_interface.unit: 'm, rad。軸の向き（lidar_axis_mapping・imu_axis_mapping）はセンサ自身の x・y・z 軸が base_link のどちらを向くかの文（例「+x forward, +y left, +z up」。 向きは forward／back／left／right／up／down または 前／後／左／右／上／下）。姿勢は R = R_rpy × A（A の列がセンサ軸、roll・pitch・yaw は base_link で軸の向きの後に適用）。 左手系の指定は回転として使えないため保存時に警告し、使用時は base_link の軸で置き換えて記録する。GNSS の主アンテナ（gnss_main_mount_x/y/z_m）と副アンテナ（gnss_aux1_mount_x/y/z_m）は位置だけ（REV-061）'
  - id: IFD-28
    set_nested:
      designed_interface.publisher_refs: [ND-03, ND-11, ND-12, ND-02, ND-18, ND-13]
  - id: ND-08
    set_nested:
      ros_node.responsibilities:
        - 局所的な車体速度・角速度・姿勢の推定と odom→base_link TF の発行（自律走行・一時停止で単独の発行者）
        - nav_msgs/Odometry の公開（Nav2 controller の odom 入力、記録）
        - '構成（DEC-123）: GLIM（ND-06 と同じ実行ファイル）を odometry だけの設定（enable_local_mapping・enable_global_mapping を false、map_frame_id=odom、odom_frame_id=odom_glim、base_frame_id=base_link、publish_imu2lidar=false）で起動し、中継の node（gouda_local_odometry）が GLIM の ~/odom と IMU の角速度から IFD-25 を作る'
        - TF の木は map →（ND-07）odom →（GLIM、単位行列）odom_glim →（GLIM）base_link。base_link の親は一つ。地図作成の GLIM とは同時に動かさない（RQ-I004）
      ros_node.placement_rationale: '3 案（A・A3・B）に共通（提案 localization_selection.md §3、DEC-123）。ND-07 と別に作る。GLIM の起動・停止は ND-03 が行う（地図作成の GLIM と同じ glim_runner）。'
  - id: G-INIT-POSE-GNSS
    set_nested:
      issue.next_action: >-
        2026-10-17 人が方針（DEC-124）を許可した: 地図作成の時に GNSS と GLIM の軌跡を記録して重ね合わせ、GNSS の座標から地図の座標への変換を原図と一緒に保存する。開始の準備で GNSS の姿勢を自己位置推定の初期値にし、
        monitor に重ねて表示し人が確認してから開始する。GNSS が使えないときは人の指定（IFD-39）。PC 再起動後は「GNSS で取り直して人が確認、または人が指定」（DEC-009 は書き換えず、DEC-124 を新しい判断として扱う）。
        詳細の設計は提案として出してから実装する（DEC-124 の推奨のとおり）。GNSS の取込み（受信・記録・表示）は ND-19・IFD-47〜49（DEC-123）。

