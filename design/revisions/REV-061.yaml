# 変更セット REV-061（2026-10-17 第32便: DEC-120〜124 の許可の記録と、工程 5-6 の設計の正本への反映（GNSS の取込み、Nav2 の構成、静的 TF、ND-08、障害物の扱い））
# 適用: design/tools/apply_revision.py REV-061
id: REV-061
date: '2026-10-17'
summary: >-
  人が DEC-120〜124 をすべて許可した（原文）。許可された設計を正本に反映する。
  GNSS: Septentrio の上流ドライバ（ND-19）を sensor supervisor が起動し、位置・品質・向きを IFD-47〜49 で出す。接続先 PRM-65 と RTK の補正の受け方は人に確認する（DEC-125）。アンテナの位置は /config で人が設定し ND-13 が TF として出す。
  Nav2（ND-10）: RPP・NavFn・上流の BT（PRM-11・18）・spin/backup/wait・velocity_smoother、collision_monitor は使わない、TwistStamped（PRM-12 を承認値 true に）。自律走行・一時停止の間だけ active。
  実車値（速度・加速度・footprint・障害物の高さ・膨張半径）を PRM-66〜73 として宣言し、未確定の間は実車では Nav2 を起動しない（試験だけ仮値）。
  障害物（ND-09）は独自の node を作らず Nav2 の costmap の層の設定で扱う。ND-13 は /config の UNKNOWN を中立の値で出して記録する。ND-08 は GLIM の odometry だけ＋中継。
  設計の直し（自律判断）: IFD-19（odom→base_link）と IFD-20（base_footprint→base_link）を同時に使うと base_link の親が二つになるため、静的 TF を base_link→base_footprint（z=−PRM-05）にした（base_link の親は odom だけ。Nav2・GLIM は base_link を使う）。
  DEC-124（GNSS による初期位置）は方針の承認で、実装の前に詳細の設計を提案として出す（DEC-009 は書き換えない）。
basis_refs: [DEC-120, DEC-121, DEC-122, DEC-123, DEC-124]
intent_version_copy: design/baselines/intent_history/intent_v11_a7a03a313c6d.md

decisions:
  - id: DEC-125
    kind: measurement
    status: pending
    asked_on: '2026-10-17'
    answered_on: null
    channel: chat
    question: >-
      【実測・確認】x86 機と mosaic-go の接続と、ネットワーク RTK の補正の受け方。
      (1) ドライバの接続先（PRM-65）。USB でつないだとき、受信機の USB イーサネット（工場出荷時は tcp://192.168.3.1:28784、上流の設定の既定）を使うか、USB のシリアル（/dev/serial/by-id/ の名前）を使うか。
      x86 機で mosaic-go をつないだ状態の `ls -l /dev/serial/by-id/` と `ip -4 addr` の出力をいただきたい。
      (2) ネットワーク RTK の補正を、受信機の中の NTRIP の機能で受けるか（受信機がインターネットに出られる必要がある）、PC の側で受けて受信機に渡すか。接続先・認証の情報は公開のリポジトリに入れず、x86 機の <data_root>/config/gnss_rtk.yaml に人が置く案。
    answer_verbatim: ''
    affected_refs: [PRM-65, ND-19, ND-18]
    resulting_refs: []
    note: >-
      決まらない場合に止まる作業：x86 機での GNSS のドライバの起動（PRM-65 が未確定の間、supervisor はドライバを起動せず理由を記録する）。補正の受け方が決まらない間は RTK なし（単独測位）で記録する。
      AI は接続先を推測で決めない（上流の既定は工場出荷時の値で、x86 機の実際の接続ではない）。
    disposition: open_human

