  note: >-
    伝達の経路：利用者の発言は分岐したチャット（Claude Code の別のセッション）で行われ、そのセッションが原文を引用してこのチャットに伝えた。この記録の AI は、その発言を直接は見ていない。
    AI の解釈：「一旦」なので、試験の結果（時刻の差、ビルドの成否）で見直しうる方針。setup.sh・drivers.repos の変更とドライバの導入は、この決定とは別に利用者の明示の yes が要る（DEC-106）。XT-32 を本体の時刻にする（DEC-083 の見直し）は含まない。
