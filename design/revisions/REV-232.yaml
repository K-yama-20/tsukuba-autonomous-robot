  question: >-
    （分岐したチャット「ros2ドライバはどのように入れるのが適切か?」での AI の推奨案）
    1 ROS 2 ドライバ（計画の Q4）：公式の Livox-SDK/livox_ros_driver2 を commit で固定して使う（利用者が最も多く、FAST-LIO・GLIM などが前提にしている）。Livox-SDK2 は Ubuntu 24.04 のビルドの修正の後の master の commit に固定する。入れ方は setup.sh・drivers.repos への追加（承認事項）。build.sh は作業場所の build・install を消すので、gouda_ws とは別の作業場所にする。2 番手は TU Darmstadt の fork（jazzy）。
    2 時刻同期：まず同期なし。XT-32 も PC の受信の時刻（PRM-55=1、DEC-083）、公式の Livox ドライバも同期なしでは PC の受信の時刻を付けるので、両方が同じ PC の時計に乗る。P4・P5 の rosbag で受信の遅れ・揺れと 2 台の時刻の差を測り、足りなければ PTP（PC を親、Dell の口はソフトウェアの方式）に進む。
    3 計画の台帳の P5 に XT-32 と MID-360 の時刻の差（平均と揺れ）の項目を足す。
  answer_verbatim: |
    一旦推奨案で行こう。メインチャットに指示せよ
