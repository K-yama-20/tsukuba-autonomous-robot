  - id: IFD-21
    set_nested:
      designed_interface.time_semantics: >-
        PRM-55=1（DEC-083）のとき、header.stamp はその frame の最初の packet の PC 受信時刻（Hesai SDK が gettimeofday で取得。PC の壁時計で、計測時刻ではない）。
        点ごとの field `timestamp`（FLOAT64、秒、絶対時刻）は各 packet の PC 受信時刻で、同じ packet の点は同じ値（firetime 補正は入らない）。
        GLIM 1.2.2 は既定で点の時刻を絶対時刻とみなして相対化し、frame の時刻を最初の点の時刻で上書きする（research/upstream_sensors/README.md）。
        受信遅延とそのばらつきは点群全体の時刻と点ごとの時刻に誤差として残る（大きさは未計測）。古い点群を新しい時刻で再発行しない
      designed_interface.version_dependency:
        status: confirmed_upstream
        evidence:
          - research/upstream_sensors/hesai_sdk_9d5dc4f/sdk_udp6_1_parser.h
          - research/upstream_sensors/hesai_sdk_9d5dc4f/sdk_lidar.h
          - research/upstream_sensors/hesai_ros2_e7e112f/source_driver_ros2.hpp
          - research/upstream_sensors/glim_v1.2.2/glim_v1.2.2_time_keeper.cpp
        note: 上流 HesaiLidar_ROS_2.0 e7e112f（SDK 9d5dc4f）と GLIM v1.2.2 のソースで照合。実車PC に導入された版との一致は導入時に確認する
  - id: IFD-22
    set_nested:
      designed_interface.time_semantics: >-
        header.stamp は adi_imu_driver が publish 時に付ける ROS 時刻（this->now()。use_sim_time なしでは PC の壁時計）で、IMU の計測時刻ではない。
        点群（IFD-21、PC 受信時刻）と同じ時計にそろう。シリアルの受信遅延は誤差として残る（未計測）
  - id: ND-14
    set_nested:
      ros_node.responsibilities:
        - XT-32 の計測を PointCloud2 として提供（IFD-21）
        - 設定は上流の config.yaml を雛形に、generated/params/hesai_ros_driver.yaml（PRM-50〜53・55）を差し込んで起動時に生成する。frame は xt32_link、topic は sensors/xt32/points（IFD-21 の定義から）。雛形のその他の値は変えない
        - 点群の時刻は PC 受信時刻（PRM-55=1、DEC-083）。PTC で本体から角度補正ファイルを取得する（PRM-53）
  - id: ND-15
    set_nested:
      ros_node.responsibilities:
        - IMU の計測を sensor_msgs/Imu として提供（IFD-22）
        - デバイスは by-id の名前だけを使う（PRM-54、DEC-081・DEC-082）。発行周期は PRM-56。frame は imu_link（IFD-22）、topic は imu/data_raw を sensors/imu/data へ remap
        - TF を発行しない（publish_tf=false。ドライバの既定は true で、TF の発行者は ND-13 だけ：RQ-I004）
        - ドライバの停止・再起動で IMU 本体が応答しなくなる既知の現象（docs/stage3_sensor_slam.md）があるため、モードの切替で停止・再起動せず、gouda.sh の起動から終了まで動かし続ける
