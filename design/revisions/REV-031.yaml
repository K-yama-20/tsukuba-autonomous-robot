# 変更セット REV-031（2026-10-13 第20便: IMU デバイス名の事実確認と XT-32 の時刻の扱いの回答を記録。センサ起動に必要な設定と判断事項を追加）
# 適用: design/tools/apply_revision.py REV-031
id: REV-031
date: '2026-10-13'
summary: >-
  人の回答を原文で記録（DEC-082・DEC-083）。IMU のデバイス名を実機の名前に差し替え（PRM-54。シリアル番号は旧 imu.yaml と同じ、STM32 の後は「-」）。
  XT-32 の点群の時刻は PC 受信時刻（PRM-55=1、Hesai 本体の時刻は年単位で遅れている）。上流ソース（research/upstream_sensors/）で帰結を照合し、IFD-21・IFD-22 の時刻の意味を更新
  （点群の header と点の timestamp は packet の PC 受信時刻、IMU は publish 時の ROS 時刻。GLIM 1.2.2 は点の絶対時刻を相対化し frame の時刻を最初の点の時刻で上書き）。
  ND-14・ND-15 の責務にドライバ設定（frame・topic・TF 非発行）を追記。未回答の PTC ポートを DEC-084、IMU の発行周期を DEC-085（PRM-56）、LiDAR–IMU の取付変換（GLIM の T_lidar_imu）の実測を DEC-086 に登録。
basis_refs: [DEC-080, DEC-081, DEC-082, DEC-083]
intent_version_copy: design/baselines/intent_history/intent_v7_f69dd98b9529.md

