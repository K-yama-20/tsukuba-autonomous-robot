decisions:
  - id: DEC-084
    kind: question
    status: pending
    asked_on: '2026-10-13'
    answered_on: null
    channel: chat
    question: >-
      【承認】XT-32 の PTC ポート（PRM-53）。Hesai の工場既定であり、過去の観測（docs/gouda_runbook.md）・上流ドライバの設定例とも同じ 9347 を使ってよいか。XT-32 の Web 画面の保存（FILE-PANDAR-CONSOLE-XT32）と回答には記載がない。
    answer_verbatim: ''
    affected_refs: [PRM-53, ND-14]
    resulting_refs: []
    note: >-
      推奨: 9347 を承認する。ドライバは PTC で XT-32 本体から角度補正ファイルを取得する（use_ptc_connected=true）。値が違うと補正ファイルを取得できず、点群が出ないか誤った角度で出る。
      決まらない場合に止まる作業: XT-32 ドライバの実機起動（ソフト試験は仮値で進む）。
    disposition: open_human
  - id: DEC-085
    kind: question
    status: pending
    asked_on: '2026-10-13'
    answered_on: null
    channel: chat
    question: >-
      【承認】IMU（ADIS16607-2）の発行周期（PRM-56、adi_imu_driver の rate）。旧実装の imu.yaml とドライバの既定はどちらも 100 Hz（旧 imu.yaml の注記: 内部サンプリング 1000 Hz、ROS 発行は 100 Hz に制限）。100 Hz でよいか。
    answer_verbatim: ''
    affected_refs: [PRM-56, ND-15, IFD-22, ND-06]
    resulting_refs: []
    note: >-
      推奨: 100 Hz（旧実装で受信を確認した周期。docs/gouda_development_20260923.md に約 97.8 Hz の観測記録）。GLIM の IMU 予積分の入力周期になる。
      値を宣言しないままドライバを起動すると、ドライバの既定 100 Hz が黙って使われるため、Gouda の起動は未宣言のとき IMU ドライバを起動しない（RQ-I076）。
      決まらない場合に止まる作業: IMU ドライバの実機起動。
    disposition: open_human
  - id: DEC-086
    kind: measurement
    status: pending
    asked_on: '2026-10-13'
    answered_on: null
    channel: chat
    question: >-
      【実測】LiDAR（XT-32）と IMU の取付変換（GLIM の config_sensors.json の T_lidar_imu。IMU 座標の点を LiDAR 座標へ移す並進 x,y,z [m] と回転）。
      GLIM 1.2.2 の設定テンプレートの既定値は Ouster OS0 の値（0.006, -0.012, 0.008、回転なし）で、Gouda の機材の値ではない。現在の起動はテンプレートをそのまま使う。
    answer_verbatim: ''
    affected_refs: [ND-06, IFD-20, IFD-21, IFD-22, TS-27]
    resulting_refs: []
    note: >-
      AI の担当: 計測手順と GLIM 設定への反映。推奨手順: (1) XT-32 の座標軸（Hesai 資料の軸定義）と IMU の軸（ADIS16607-2 の外形図の印字）を機体上で確認し写真を残す、
      (2) 両者の原点間の並進を定規で測る（旧 docs/stage3_sensor_slam.md では IMU は LiDAR の真下と記載）、(3) 回転は軸の対応から 90° 単位で決める。値と写真・日付を research/vehicle_pc/ に保存し、人が採用値を決める。
      代替: 最初の GLIM 試験は回転なし・並進 0 で行い、推定が崩れるかを見る（崩れた場合の原因切り分けが難しくなる）。
      決まらない場合に止まる作業: 地図作成の実機試験で GLIM に正しい取付変換を与えること（試験自体はテンプレートの値でも起動する）。
    disposition: open_human

