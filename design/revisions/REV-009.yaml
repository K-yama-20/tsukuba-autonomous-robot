    question: 判断台帳の pending の分類、DEC-042 の分割、ゲート3 の承認対象の整理の指示
    answer_verbatim: |
      「承認待ちはDEC-042とゲート3」としているが、DEC-021〜029もpendingのままである。項目を次の4つに分類せよ。
      ・既存の決定や回答済み事項で解消済み → 根拠IDを付けて閉じる
      ・ゲート3で一括承認する下位設計案 → 承認対象にまとめる
      ・本当に未決の人の判断 → 選択肢と推奨案を示す
      ・技術調査・実測・実機照合待ち → 人の承認待ちから外す
      ・前回「人の最終判断待ち」に戻されたH-001の台帳上の状態も、あわせて示せ。

      DEC-042は二つに分けて記録する。
      設計前提：基本契約どおり「Bluetoothゲームパッド→ESP32→DAC、手動操作優先」とすること。これは確定である。
      実機照合：実際の配線、書き込まれたfirmware、操作結果がこの前提と一致するか。これは別の事実確認である。

      また、ゲート3について、以下をまとめて示せ。
      承認対象の設計・決定ID
      承認によって着手する機能（下位設計の継続か、車体出力の実装か、実車試験への移行か）
      未確定事項と、それが止める作業
      上位要求からの変更・例外
      C-001〜C-013の各衝突で、置き換えた範囲がintent.mdの該当文の範囲に収まっているか
