  question: 【承認】XT-32 の点群（IFD-21、1 通 1.66 MB、10 Hz）を BEST_EFFORT で受けるノード（ND-07 の子の launch の pcl_ros CropBox ほか）に、点群がほとんど届かない。どう直すか
  answer_verbatim: ''
  affected_refs:
  - IFD-21
  - ND-07
  - ND-08
  - TR-05
  resulting_refs: []
  note: 事実（VM、2026-10-22 00:5x〜01:0x、Gouda は人が起動したもの、main a27de9e、RMW は既定（Fast DDS）、net.core.rmem_default 212992、rmem_max 4194304）：hesai_ros_driver は IFD-21 を RELIABLE で出す（1 通 1664000 バイト、点 64000）。確かめのための一時的な購読（Python、10 秒）で、BEST_EFFORT は 0 通（2 回目は 8 通）、RELIABLE は 73 通（最初の 1 通まで 3.0 秒）。BEST_EFFORT の購読に UDP の受信バッファ 4 MB の Fast DDS の profile（その試験のプロセスだけ）を与えると 75 通。一時的に動かした pcl_ros filter_crop_box_node は入力を BEST_EFFORT で購読し（出力に購読者がいるときだけ購読する）、18 秒で 3 通しか出さなかった。点群そのもの（最大距離 74.75 m、遅れ 0.1 秒、frame xt32_link）は正常。案 a（推奨）：Fast DDS の profile（UDP の受信バッファを大きくし、共有メモリの転送は残す）を設定ファイルとして持ち、gouda.sh start で起動するノードに与える（理由：試験で 75 通／10 秒に戻った。上流の部品を変えずに済む。ほかの BEST_EFFORT の購読者（GLIM、monitor）にも効く）。値（バッファの大きさ）は今回の試験の 4 MB を出発点とし、rmem_max（4194304）を超えない。案 b：点群を RELIABLE で受けて中継する小さなノードを ND-07 の子の launch の先頭に置く（ND-07 の経路だけ直る。GLIM には効かない）。案 c：rmem_default などカーネルの設定を上げる（setup.sh で sysctl。システムの設定の変更なので人の作業）。未確認：GLIM（ND-08）の点群の購読の QoS と、実際に届いている量（今回は GLIM が止まっていて見ていない）。影響を受けるもの：ND-07 の初期化と NDT の更新、ND-08（BEST_EFFORT なら）、monitor の points の表示。決まらない場合に止まる作業：実車での ND-07 の初期化と自律走行（模擬の試験は止まらない）。第115便で登録。
