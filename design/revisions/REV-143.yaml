  question: 【承認】ND-07 の初期化で、ndt_align_srv を呼ぶ前に、NDT が点群を受け取ったことを待つようにするか
  answer_verbatim: ''
  affected_refs:
  - ND-07
  - IFD-53
  - TR-05
  - TR-07
  resulting_refs: []
  note: 事実（VM、2026-10-22 00:48〜00:52 の 5 回、~/.ros/log の A3 の各ノードの記録）：A3 の起動から 1.5〜3 秒で ND-07 が ndt_align_srv を呼び、NDT は「No InputSource. Please check the input lidar topic」で失敗した。今の ND-07（global_localization_node.py の _initialize）は、サービスが現れるのを待つだけで、点群は待たない。Autoware の ndt_scan_matcher 1.9.0 のソース（ndt_scan_matcher_core.cpp）では、点群は届いても、点 0、TF の失敗、最大距離が required_distance（10 m）未満のときは捨てられる。最大距離の不足はログに出ず /diagnostics だけに出る（屋内などで起こりうる）。DEC-279 を直しても、最初の点群は起動から約 3 秒かかる。案 a（推奨）：ND-07 は、NDT の /diagnostics（scan_points）が点群を保存したと示すまで、時間の制限なしで待ってから ndt_align_srv を呼ぶ（サービスの待ちと同じ扱い。人はいつでも一時停止・終了できる）。待つ間、IFD-53 の詳細に「点群を待っている」と、NDT が最後に捨てた理由（例：最大距離 7 m < 10 m）を出す。案 b：届いた点群（points_downsampled）を 1 通見てから呼ぶ（NDT が捨てた場合は今と同じ失敗になる）。案 c：失敗したら決まった回数だけ呼び直す（原因が分からないまま通る。採らない）。振る舞いの違い：案 a・b では、点群が来ないとき「推定不能」ではなく「初期化中（点群待ち）」のまま止まる。影響を受けるもの：ND-07、IFD-53 の表示、TR-05 の待ち（mode manager は ND-07 の状態を待つ）。決まらない場合に止まる作業：実車での ND-07 の初期化（DEC-279 が直れば、案なしでも起動から 3 秒以上たってから呼べば通る見込み。推測、未確認）。第115便で登録。
  disposition: open_human
