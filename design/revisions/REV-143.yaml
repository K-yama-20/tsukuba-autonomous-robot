summary: 第115便：実車（VM）で自律走行開始のたびに ND-07 が「推定不能（init_failed、ndt_align_srv did not succeed）」になる件を調べた。NDT が点群を一つも受け取っていない（No InputSource）。原因は二つ。(1) ND-07 が A3 の起動の直後（1.5〜3 秒）に ndt_align_srv を呼び、最初の点群を待たない。(2) XT-32 の点群（1 通 1.66 MB）を BEST_EFFORT で受けると、既定の受信バッファではほとんど届かない（10 秒で 0〜8 通。pcl_ros の CropBox は BEST_EFFORT で受け、18 秒で 3 通しか出さなかった）。対応の案を承認事項 DEC-279（点群の受け渡し）と DEC-280（初期化の待ち方）として登録する。コードと設定は変えていない。
