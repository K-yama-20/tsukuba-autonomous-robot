    NDT の出力の共分散 0.0225 m²）と、NDT の姿勢の遅れ（VM で最大 0.991 s、第134便）で決まるモデル上の値の可能性が高い（推測）。0.5 m は Autoware の error_ellipse_size 1.5 ÷ ellipse_scale 3 から来た既定。
    リスク：本当にずれたときの検出が遅れる。DEC-305・306・342 で自動の待機をなくすと、このしきい値は警告の意味になる。値は DEC-360 の計測で見直す。EKF の設定や使い方（EKF をやめて NDT と GLIM を直接つなぐ案を含む）の見直しは、
    推定の補い方の調査（別のチャット）とあわせて行う。決まらない場合に止まる作業：PRM-92 の値の変更。
