  question: >-
    （第142便の AI の説明への人の発言）初期位置の推定、確認用の表示、DEC-286・DEC-287
  answer_verbatim: |
    ・推定した自己位置を地図上に出し、行動経路を地図に表示してみる機能を付けてみるのはどうか？本走行では意味のない機能だが、実験走行時やデバッグの際に人間が見て性能を判断するのに便利だと思う。rvizに既にその機能がある場合は新規実装しなくて良いし、ネットに既に似たプログラムがあればそれを使ってくれてもいい。また、探索時は最初は1mにして、初期位置推定が出来なかったら徐々に上限値まで探索半径を広げていくというのはどうか？
    また、以前のVM内での君のテストで、90度ずれていた場合に初期位置の推定に失敗していた気がする。初期位置推定のアルゴリズムに問題があるのではないか？また、地図作成時にあった自転車や車が、自律走行開始時になくなっていたり、周囲に人がたくさん立っていた場合はどうなってしまうの？また、つくばチャレンジでは決められた場所からスタートする。スタート位置には左右にのぼりが立っていて、コースの縁には観客が並んで立っている。lidarでの自己位置推定は出来ない可能性がある。数メートルまっすぐ進めばgnss測位やlidarでの自己位置推定ができるようになる可能性があるんだよね。
    ・DEC-286: EKFのパラメータ調整がおかしいか、あるいはEKFを用いるのが不適切である可能性はないか？さしあたっては、0.7mに拡大して走れるようにしてみるのも一案かと思う。
    ・DEC-287: 自律走行開始ボタンを押した後はなるべく早く動き出すことが望ましいが、その解決案が応急処置としては最善だというなら、それでも良いかもしれない。
  affected_refs:
