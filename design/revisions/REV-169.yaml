    AI の説明（第143便の作業記録）：(1) 以前の失敗は「5 m・90 度」（模擬、REV-128）で、1 m・10 度と 2.8 m・30 度は成功していた。探索は向きを一周一様に試す（Autoware main のソースで確認、apt 1.9.0 は未照合）ので、
    失敗の主因は 5 m の位置のずれ（探索の広がり PRM-84 は標準偏差 0.5 m）と推測。(2) 確認用の表示は、VM に rviz2・nav2_rviz_plugins・nav2_default_view.rviz が入っているので新しい実装は要らない見込み。
