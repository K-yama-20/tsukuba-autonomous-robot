modifications:
- id: RQ-I020
  interpretation_append: REV-104：RQ-I020 の補足（DEC-163）：ESP32 の firmware は、純正のジョイスティックを模倣するため、出力電圧をスティックの可動範囲と同じ円の中に限る。motion_controller の出力（前後＝linear.x÷PRM-39、旋回＝angular.z÷PRM-40、各 −1〜1 に切り詰め）の倒し量 √(前後²＋旋回²) が 1 を超えると、firmware（control.hpp の mapVoltage）は前後と旋回の比を保ったまま倒し量 1 まで縮める。例：前後 1.0・旋回 1.0（倒し量 1.41）は前後 0.71・旋回 0.71 になり、速度・角速度とも 71 % になる。曲がる半径（速度÷角速度）は変わらず、経路の形はずれずに遅くなるだけ。倒し量が 1 以下なら縮めない。これは車体の物理的な制約で、motion_controller が速度を下げるものではないが、cmd_vel より遅くなる唯一の例外として扱う。起きないように、Nav2 の最高速度・最高角速度（PRM-66・67）は (PRM-66÷PRM-39)²＋(PRM-67÷PRM-40)² ≦ 1 を満たす組で決める。
