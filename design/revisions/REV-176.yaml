- id: DEC-350
  set:
    note: >-
      推奨は承認。理由：車輪のエンコーダがなく GNSS も今は使えないので、新しいフィルタを足しても使える情報は増えず、ずれは小さくならない。調整の値が増え、共分散の誤りで 静かにずれる危険が増える（人の懸念と同じ）。今の作りでも NDT が止まると EKF は GLIM の速度で予測しており、ずれは GLIM とほぼ同じ。GLIM の odometry のずれの下限は 50 m あたり p95 で 0.06〜1.18 %（4 回の地図作成、FILE-GLIM-ODOM-DRIFT-OUTPUT。基準は真値でなく下限）。止まっている間は GLIM はずれない（第125便の記録）。 LiDAR のリンク断は 2.7〜4.2 s（2026-10-14 の記録、2026-10-17 の検証の rosbag）で、その間は GLIM も止まるので、止まって待っても失うのは数秒。 固定する理由：NDT は収束しないと姿勢を出さない（autoware_core 1.9.0 ndt_scan_matcher_core.cpp:742）が、収束したと判定した誤った姿勢は EKF に取り込まれる。 EKF の棄却は 2 乗でない距離と pose_gate_dist 49.5 を比べる（ekf_module.cpp:302-306、mahalanobis.cpp）ので、49.5σ を超えるまで棄却せず、実質ない。固定すれば使っているものが二値で記録に残り、再生で再現できる（intent のデバッグ性）。 代替案：今のまま EKF の予測に任せる、IMU の予測で進む（robot_localization）、因子グラフ（fuse、apt にある）。NDT の共分散の推定（上流の covariance_estimation_type）は 段階 2 として、評価（DEC-354）の後に別の承認で出す。新しい値 D・T は DEC-354 で実測。提案 localization_gap_bridging_2026-10-23.md §4・§7。 決まらない場合に止まる作業：原因の区分ごとの扱いの実装。DEC-305・342 が前提（待機に入らない）。 REV-176（第152便）：人の回答「判断1~3は推奨案を許可。」（DEC-382 に全文）。判断 1〜3 は、第151便の後のチャットで AI が示した自己位置推定の判断の材料の項目：判断 1（推定不能のときの基本方針）の推奨「DEC-365 にまとめて答える。故障の種類で分ける案 c'：NDT だけが悪いときは map→odom を固定して GLIM で進み、距離 D・時間 T の予算を超えたら止まって待つ。GLIM も疑わしいとき・LiDAR が来ないときは自律走行モードのまま止まって待つ。どれも待機モードには入らない」。 新しいフィルタは足さない。
    status: answered
    answered_on: '2026-10-24'
    answer_verbatim: |
      判断1~3は推奨案を許可。
    disposition: answered
