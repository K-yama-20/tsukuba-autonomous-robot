- id: DEC-365
  set:
    note: >-
      推奨は承認。理由：KUAMS は WHILL の車輪オドメトリ（LiDAR と独立）で推測航法をしていた（lidar_localization_component.cpp の cloudReceived・odomReceived、KUAMS のコードで確認）。 gouda の GLIM は LiDAR と同じ原因（LAN の途切れ・人混み・特徴の少ない所）で一緒に壊れるので、KUAMS の根拠が成り立つのは (a) だけ。規則上、確認走行区間の外で自律的に止まることは 失敗ではなく時間を使うだけで（必要な平均は 2.2 km／100 分で約 0.37 m/s、計算）、ずれた位置で走るとコース外れ・車道への進入・非常停止で失敗になる（regulations_2026.md の EV-15・16・18・26）。 (a) と (b) は独立な odometry がないと走りながら確実には見分けられない。補助の信号の案（ジャイロと GLIM の yaw の速さ、cmd_vel と GLIM の速さ、近い点の割合、NDT と GLIM の食い違い）は DEC-374 で評価する。EKF の共分散は使わない（DEC-352）。第121〜125便の停止は実装の誤り・しきい値・初期姿勢が原因で、この方針では直らない種類だった。 車輪のエンコーダ（DEC-292）は (b)・(c) を橋渡しできる唯一の安い手段で、この案と矛盾しない。 提案 kuams_adoption_review_2026-10-23.md §1 の 1、topic1.md §5。決まらない場合に止まる作業：localization_wait の実装。 REV-176（第152便）：人の回答「判断1~3は推奨案を許可。」（DEC-382 に全文）。判断 1〜3 は、第151便の後のチャットで AI が示した自己位置推定の判断の材料の項目：判断 1（推定不能のときの基本方針）の推奨「DEC-365 にまとめて答える。故障の種類で分ける案 c'：NDT だけが悪いときは map→odom を固定して GLIM で進み、距離 D・時間 T の予算を超えたら止まって待つ。GLIM も疑わしいとき・LiDAR が来ないときは自律走行モードのまま止まって待つ。どれも待機モードには入らない」。 D・T の値は実測（DEC-354・374）で決める。暫定値も未定（実装の前に人が決める）。
    status: answered
