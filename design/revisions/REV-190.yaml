- id: ND-10
  set_nested:
    ros_node.responsibilities:
    - 経路計画・追従・後退・再計画・通過／到達判定（RQ-I011・RQ-I018・RQ-I019）
    - NavigateThroughPoses action の提供（IFD-13）と cmd_vel の発行（IFD-15。velocity_smoother を経た後の値）
    - costmap の SpeedFilter による SpeedLimit の発行と controller への適用（IFD-14、DEC-031）。mask・filter info は標準 server で配信（IFD-42）
    - map_server による静的地図の提供（IFD-24）
    - 設定・プラグイン・BT で拡張し本体は改変しない（RQ-I056・RQ-I057）
    - '構成（DEC-122）: controller は Regulated Pure Pursuit、planner は NavFn、BT は上流の navigate_through_poses_w_replanning_and_recovery.xml の写しに PRM-11・PRM-18 を入れたもの、behaviors は spin・backup・wait、velocity_smoother を使う、collision_monitor は使わない（RQ-I072）、cmd_vel は TwistStamped（PRM-12）'
    - REV-190（DEC-400・401・402）：controller の既定は上流の雛形の MPPI（PRM-130〜132。vx_min 0、CostCritic は footprint、visualize false、その他は雛形のまま）。PRM-130 が false なら上の RPP。local costmap は PRM-124・PRM-133。経路の引き直しは ComputePathThroughPoses の後に上流の SmoothPath（雛形の simple_smoother、PRM-134）。nav2_mppi_controller がなければ、MPPI のとき Nav2 を起動しない
    - 障害物は XT-32 の点群（IFD-21）を local の VoxelLayer・global の ObstacleLayer に直接入れ、高さの帯（PRM-70・PRM-71）で地面と頭上を除く。track_unknown_space を true にして観測していない所を空きとみなさない（RQ-I012、DEC-122）
    - 設定は上流の nav2_bringup の nav2_params.yaml を雛形に、plugin の選択、frame・topic（IF の名前）と PRM の値だけを差し込んで起動時に作る。雛形のその他の値は変えない。実車の設定（trial なし）で PRM-11・17・18・66〜73 のどれかが未確定なら Nav2 を起動せず理由を記録する（RQ-I076、intent.md:85）
    - 起動する server（gouda_nav2.launch.py。DEC-183 で名前を補足）：map_server（静的地図、IFD-24）、filter_mask_server（速度マスク用の map_server、IFD-42）、costmap_filter_info_server（IFD-42）、controller_server、smoother_server、planner_server、behavior_server、bt_navigator、velocity_smoother、lifecycle_manager_navigation（autostart false。ND-03 が IFD-36 で起動・停止）
    - velocity_smoother の後退の速度の上限（min_velocity の x）は PRM-78（車椅子の後退の上限、倒し切ったときの後退の速さ）。前進の上限は PRM-66。後退の倒し量と速度の傾きは前進より小さく（DEC-197）、Nav2 が倒し切りより速い後退を指令しないようにする（DEC-198 案 A。回転と組み合わせたときの範囲は倒し量の円で決まり、Nav2 は知らない：reports/reverse_limit_study_2026-10-21.md）
    - BT の recovery の回数は、起動のときに IFD-54（monitor で保存した値）があればその値、なければ PRM-18（DEC-207 (a)・DEC-209）。使った値と出所を <data_root>/run/nav2/recovery.json と起動の記録に残す。値の範囲は 1 以上 PRM-18 以下で、外れていれば PRM-18 を使い理由を残す
    - 案 C（DEC-214・DEC-216・DEC-217・DEC-218）：経路の計画（NavFn）の allow_unknown は上流の既定 true のまま（帯の外は「通れるが高い費用」）。global costmap の obstacle_layer の combination_method は 2（走行中に見えた所でも、帯の外の「不明」を「空き」に上書きしない。上流の既定は 1）。local・global の inflation_layer の inflation_radius は PRM-72、inflate_around_unknown は PRM-98（IFD-54 に値があればその値）
    - 人が描く範囲（DEC-222）：keepout_mask_server（map_server）と keepout_filter_info_server（costmap_filter_info_server、type 0、base 0、multiplier 1）を足し、global と local の costmap の両方に KeepoutFilter（override_lethal_cost true）を置く。global は SpeedFilter と KeepoutFilter の二つの filter
  interpretation_append: 'REV-190（DEC-400・401・402）：MPPI を既定にし、SmoothPath を足した。'
