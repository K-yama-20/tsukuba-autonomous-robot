  - id: IFD-14
    set_nested:
      designed_interface.qos: {reliability: reliable, durability: transient_local, history_depth: 1}
      designed_interface.time_semantics: >-
        (1) 初回区間: goal 送信前に区間 0→1 の上限を1回発行。(2) 区間境界: feedback の number_of_poses_remaining が減ったとき進入区間（複数減ったときは最新の進入区間）の上限を1回発行し、飛ばした区間を記録。
        (3) 再 goal・再開: goal_waypoint_offset で区間番号を復元し、進入中の区間の上限を再発行。Nav2 内部の再計画では goal が変わらないため発行しない。取消では追加発行しない（停止は motion_hold）。
        (4) 最終到達: result SUCCEEDED で発行を終える（最後の値を保持）。失敗 result では発行せず一時停止へ。(5) controller の再起動・購読開始: transient_local keep_last 1 により最新値を受信し、
        さらに controller の transition_event（activate）を見て再発行する。percentage=false、m/s。speed_limit=0.0 は無制限であり停止用途に使わない。境界時点の実速度保証は要求しない（RQ-I062）。
