      resulting_refs: [H-004, U-DRAW-003, C-015, IFD-38, ND-02, ND-12]
      note: >-
        照合結果（2026-10-09、実装 HEAD a091ed39）: PC bridge gouda_vehicle/hardware_bridge.py は protocol v3 の STATUS を受信し /esp32/status（std_msgs/String, JSON）へ公開。
        取得できる項目は owner・reason・flags（connected/fresh/centered/auto_enabled）・スティック生値・manual/PC/applied 正規化値・DAC code・要求 mV・accepted seq・bt_age・pc_age。
        取得できない項目は非常停止状態・電池・実出力電圧・実車運動（gouda_protocol_v3.md「firmware does not read or report an emergency-stop switch」）。
        既存の停止条件（維持、AI は外さない）: firmware kLinkTimeoutMs=250 ms（BT と PC 指令の双方）、bridge は STATUS 鮮度 0.25 s 不足または drive 鮮度不足で DISARM 送信。
