      standard_type: true
      custom_type_reason: null
      purpose: diagnostic
      owner_ref: ND-12
      publisher_refs: [ND-12]
      consumer_refs: [ND-02, ND-04]
      unit: ms（age）、正規化値 [-1000,1000]、DAC code、要求 mV（電圧測定値ではない）
      frame: null
      time_semantics: >-
        STATUS フレーム受信ごと。表示・診断のみに使い、停止条件にしない（DEC-006）。取得できる項目: owner・reason・connected/fresh/centered/auto_enabled・スティック生値・manual/PC/applied 正規化値・DAC code・要求 mV・accepted seq・bt_age・pc_age。
