  - id: H-009
    kind: issue
    name: 車体出力段階の値の不一致（intent 700 ms / 1 s と firmware・bridge の 250 ms）と 700 ms の配分
    intent_lines: [102, 92, 97, 35]
    related_refs: [DEC-029, H-010]
    sensitivity: [safety, operation]
    adoption: unresolved
    design_status: 未設計
    issue:
      category: human
      state: open
      affected_refs: [RQ-I075, PRM-08, PRM-09, PRM-13, PRM-14, ND-11, ND-12, IFD-17]
      resolution_refs: []
      question: >-
        intent.md:102 は「PC指令のtimeout=700ms、ESP32のwatchdog=1s周期」とし、不適切なら適切な値を考えて報告せよとする。
        実装リポジトリの firmware gouda_dualsense_usb は kLinkTimeoutMs=250 ms（PC 指令・BT 報告の双方。docs/gouda_protocol_v3.md「A PC COMMAND age of 250 ms or more clears autonomous enable」）、
        PC bridge（gouda_vehicle/hardware_bridge.py）は STATUS 鮮度 0.25 s 不足で DISARM。旧 firmware gouda_esp32 も kReportTimeoutMs=250 ms。
        また「PC指令のtimeout 700 ms」が cmd_vel→motion_controller の途絶判定（PRM-08）か、joystick→bridge の期限（PRM-09）か、両方の合計かは文面から一意でない。
        AI の評価: (1) ESP32 側の 1 s は既存 firmware の 250 ms より長く、firmware を変更しない限り実効値は 250 ms。既存の停止条件は AI の判断で外さない（DEC-006）。
        (2) bridge は cmd_vel の有無に関係なく一定周期（PRM-14、firmware の 250 ms に対し十分短い値。firmware の status 送信は 50 ms 周期）で最新値または中立を送る必要がある。
        (3) PC 側 700 ms は Nav2 controller の制御周期（上流既定 20 Hz=50 ms、PRM-17）の 14 周期分で、cmd_vel 停止後も最大 0.7 s 最後の速度が続く。
        途絶判定としては 3 周期程度（150 ms）でも成立し、停止までの惰走を短くできる。ただし一時停止の正規の停止経路は Nav2 取消＋motion_hold（IFD-40）であり、timeout は異常時の保険。
      next_action: >-
        人が (a) 700 ms の意味（PRM-08／PRM-09）、(b) ESP32 watchdog を 1 s にするため firmware を変更するか既存 250 ms を維持するか、(c) PC 側 timeout を 700 ms にするか短くするかを決める。
        決定まで PRM-08・PRM-13 は intent の値を source_value として保持し、実車採用値ではないことを明記。
      options:
        - label: intent の値（PC 700 ms、ESP32 1 s）を採用し firmware/bridge を人が変更する
          effect: 既存 firmware の 250 ms を 1 s へ変更する作業と実機確認が必要。PC 側は 700 ms で惰走最大 0.7 s。
        - label: ESP32 は既存 250 ms を維持し、PC 側 timeout を controller 周期の数倍（例 150 ms。周期は PRM-17 の決定後）にする
          effect: firmware 無変更。bridge の送信周期（PRM-14）を 250 ms に対し十分短く設計する必要がある。intent.md:102 の値の更新は人の作業。
        - label: 保留
          effect: PRM-08・PRM-13 は未確定のまま。車体出力段階（RQ-I044 の順序）の実装前に決定が必要。
      recommendation: ESP32 は既存 250 ms を維持し、PC 側 timeout を controller 周期の数倍（例 150 ms。周期は PRM-17 の決定後）にする
      recommendation_basis: >-
        既存実装の停止条件を外さない（DEC-006）こと、PC 側で先に中立化してから ESP32 の watchdog が後詰めになる順序（PC timeout < ESP32 watchdog）を保つこと、
        惰走を短くすること。例示した 150 ms は controller 周期 50 ms（上流既定）に基づく計算値で、実車採用値ではない。

