  question: >-
    【承認】（検査ルール案）上流の既定から外す選択を提案するときは、既定が担っていた機能のうち失うものを判断台帳の項目に必ず書く、という規則を足すか。
  answer_verbatim: ''
  affected_refs:
  - DEC-122
  resulting_refs: []
  note: >-
    人の登録の指示（原文）「登録する」（AI の問い「再発防止の検査ルール案 2 件を承認事項にしますか？」への回答。ルールの内容の承認ではない）。推奨は承認。
    理由：DEC-122 で Jazzy の既定の MPPI を RPP に替えたとき、controller による回避を失うことを書かず、「MPPI は回避が滑らか」とだけ書いた（第171便の追記）。
    機械で確かめられるのは記載の有無までで、書いた内容が正しいか、既定から外れていることの見落としは検出できない（既定との比較を検査器に持たせるかは実装の案を作るときに示す）。
    代替案：検査にせず intent.md への追記案にする（人が編集する）。振る舞いの違い：車体の振る舞いは変わらない。提案と台帳の書き方の制約が増える。
    決まらない場合に止まる作業：この規則の実装だけ。
  disposition: open_human
