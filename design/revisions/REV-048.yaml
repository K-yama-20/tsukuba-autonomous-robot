decisions:
  - id: DEC-103
    kind: confirmation
    status: recorded
    asked_on: '2026-10-14'
    answered_on: '2026-10-14'
    channel: chat
    question: 廊下の水平・寸法・ゴミ箱の位置、屋外の経路、x86 機のログ、地面の推定の修正、二重起動の防止（AI の質問への回答）
    answer_verbatim: |
      廊下は水平である。ゴミ箱は出発地点から出発して左手側にある。中間より手前。屋外は出発点にほとんどぴったり一致しして帰った。実際の使用環境は屋外だから、廊下での性能が悪くても問題ない。
      goudaの二重起動を防ぐ処理の追加を許可する。

      lidarが途切れた原因は、パソコンの蓋が閉じてしまったことと関係はあるか？地図作製中や自律走行中はツエンにスリープしない設定になってたりするのかな？
    affected_refs: [G-DUP-START, G-LIDAR-DROPOUT, G-FLOOR-REFLECTION, ND-01, ND-18]
    resulting_refs: [G-MAP-TILT, DEC-104, DEC-105]
    note: >-
      二重起動の防止を許可（G-DUP-START の next_action を実装）。廊下は水平なので、廊下の地図の傾きは誤差（G-MAP-TILT）。屋外は出発点に戻ったので、屋外の地図の終点のずれ（水平 12.7 m、高さ 6.4 m）は誤差（G-LIDAR-DROPOUT）。
      廊下の性能は問わない（G-FLOOR-REFLECTION の床の反射は優先しない。屋外の 2 層の地面への対策は残る）。ゴミ箱は、両方の廊下の地図で出発点から約 3〜7 m の左側に点が多い所があり、合っている可能性があるが、廊下の中の左側の全長に物の高さの点があるため確定できない。
      地面の推定の修正の進め方（G-FLOOR-REFLECTION の候補 a・b）には回答がない。
      質問（蓋・スリープ）への答え: 現在の Gouda はスリープや蓋の動作を抑えない。屋外のリンク断のときにサスペンドは起きていない（FILE-X86-LIDAR-DROPOUT）。
    disposition: answered
  - id: DEC-104
    kind: approval
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【承認】Gouda が動いている間、PC のスリープと蓋を閉じたときの動作を抑える。案 A（推奨）: gouda.sh start が、systemd の抑止（systemd-inhibit。対象は sleep・handle-lid-switch・idle）を取ったまま launch を動かす。
      gouda.sh stop で外れる。デスクトップの画面の中で起動すれば利用者の権限で取れる。SSH から起動して取れないときは、記録して起動は続ける。
      案 B: PC の設定だけで行う（/etc/systemd/logind.conf の HandleLidSwitch=ignore と自動サスペンドの無効化。setup.sh が確認して表示する）。案 C: 何もしない（運用で蓋を開けておく）。
      A と B は併用できる。蓋を閉じた時にリンクが切れる原因が電源管理であれば、A・B どちらでも防げる見込み（未確認）。
    answer_verbatim: ''
    affected_refs: [ND-01, G-LIDAR-DROPOUT]
    resulting_refs: []
    note: 決まらない場合に止まる作業：Gouda の起動中のスリープの抑止。地図作成・自律走行は今のままでもできるが、蓋を閉じたときやアイドル時の動作は PC の設定次第。
    disposition: open_human
  - id: DEC-105
    kind: measurement
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【実測】IMU と LiDAR の間の傾き（G-MAP-TILT）。水平な床で車体を 30 秒ほど止め、記録タブの Record で rosbag を記録する。
      AI が、IMU の加速度の平均（重力の向き、IMU の座標）と、LiDAR の点群の床の面の向き（LiDAR の座標）から、二つの座標の間の傾き（前後・左右）を求める。
    answer_verbatim: ''
    affected_refs: [ND-06, ND-15, ND-14, G-MAP-TILT]
    resulting_refs: []
    note: >-
      求めた値は報告するだけで、取付位置の設定は人が monitor で行う（RQ-I081）。人に依頼すること: 水平な床での静止の記録（rosbag）。
      決まらない場合に止まる作業: 地図の傾きの原因の切り分け。地図作成と変換は傾いたままでも動く（地面の推定は傾き 10 度まで追従する設計）。
    disposition: open_human

entities:
  - id: G-MAP-TILT
    kind: issue
    source_from_affected: true
    name: 地図全体が前後方向に約 4 度傾く（水平な廊下が坂に写る）
    sensitivity: [operation]
    issue:
      category: technical
      state: open
      affected_refs: [ND-06, ND-05, ND-15, ND-14]
      resolution_refs: []
      question: >-
        水平な廊下（人の回答 DEC-103）の地図で、軌跡が廊下の向きに一様に上る。VM の 2 回目で 4.15 度、x86 機で 4.40 度、往復で同じ直線に乗る（直線からの差 0.02 m）。
        地図全体が一定の角度で傾いている形で、出発時の車体の前後の軸の周りの回転。IMU と LiDAR の間に、/config（両方とも傾き 0）にない前後の傾きがある場合や、
        開始時の重力の向きの推定がずれた場合に、この形になる。GLIM の IMU の予測の回転の誤差は小さい（0.07 度）が、平面上の回転だけでは前後の傾きのずれは見えにくい。
        FILE-VEHICLE-PC-FIELD-MAPPING-2、FILE-X86-MAPPING-MAPS。
