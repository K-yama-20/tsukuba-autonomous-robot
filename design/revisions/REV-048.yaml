# 変更セット REV-048（2026-10-14 第26便: 人の回答（廊下・ゴミ箱・屋外・使用環境・二重起動の防止の許可・蓋とスリープの質問）、二重起動の防止、LiDAR の途切れの原因、地図の傾き）
# 適用: design/tools/apply_revision.py REV-048
id: REV-048
date: '2026-10-14'
summary: >-
  人の回答を原文で記録（DEC-103）。廊下は水平、ゴミ箱は出発地点から左手側で中間より手前、屋外は出発点にほぼ一致して戻った、使用環境は屋外で廊下の性能は問わない、二重起動の防止の追加を許可。
  二重起動の防止を実装した。gouda.sh は把握していない gouda_core の起動があれば拒む。sensor supervisor は別のプロセスが使っている IMU のシリアルポート・LiDAR の UDP ポートではドライバを起動しない。
  VM で試験した（FILE-VEHICLE-PC-DUP-START-GUARD）。
  屋外の LiDAR の途切れ 3 回は、どれも同じ秒に有線 LAN（enp2s0）のリンクが切れていた。サスペンドはしていない（FILE-X86-LIDAR-DROPOUT）。
  蓋の開閉との関係は journal で確かめる。地図作成中のスリープ・蓋の動作を Gouda が抑える案を承認事項 DEC-104 にした。
  廊下が水平なので、廊下の地図の 4.15 度・4.40 度の傾きは誤差（G-MAP-TILT）。IMU と LiDAR の間の傾きを静止の記録から測る案を実測の項目 DEC-105 にした。
