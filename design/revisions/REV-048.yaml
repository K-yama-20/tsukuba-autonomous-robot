modifications:
  - id: ND-01
    set_nested:
      ros_node.responsibilities:
        - 起動経路はこれ一つ（bash gouda.sh start／stop／status）。環境変数などの起動オプションを持たない（DEC-090・DEC-091）
        - 共通nodeの起動と、モードごとの launch／lifecycle 有効化（RQ-I004）。センサードライバは常に gouda_sensor_supervisor（ND-18）の下で起動する（デバイスが無ければ待つ）
        - ワークスペース（gouda.sh の 2 つ上）、データの置き場（PRM-25）、設定（design/generated/params）、ROS 2 Jazzy（/opt/ros/jazzy）は固定または正本から決める。仮値（<node>.trial.yaml）は読まない（試験 script だけが使う）
        - 起動・有効化の失敗を gouda_monitor に表示できる形（/diagnostics・lifecycle状態）で残す。起動中に launch が終了したら失敗として表示する
        - Gouda は同時に一つ。pid ファイルにない gouda_core の起動（試験スタック trial:=true は除く）が同じ利用者で動いていれば起動を拒み、止め方を表示する。status・stop でも表示する（G-DUP-START、DEC-103）
        - 走行開始要求は発行しない（M-001 K2 を維持）
  - id: ND-18
    set_nested:
      ros_node.responsibilities:
        - センサードライバ ND-14（XT-32）・ND-15（IMU）を子プロセスとして起動する。設定は generated/params（PRM-50〜56）から作り、未確定・未導入なら起動せず理由を記録する
        - デバイスを名前で見張る。IMU は by-id の名前（PRM-54）、XT-32 は PC 側アドレス PRM-51 を持つ I/F。同一性（USB の列挙番号・ifindex）が変わったとき（再接続）だけ、そのドライバを止めて起動し直す（DEC-088）
        - 同一性が同じならドライバを再起動しない（ドライバが自分で終了しても再起動しない。IMU は再接続なしの再起動で応答しなくなるため）。デバイスが消えたらドライバを止め、再び現れたら起動する
        - 別のプロセスがデバイスを使っていれば（IMU のシリアルポート、XT-32 の UDP ポート PRM-52）ドライバを起動せず、device_in_use を記録して次のイベントで調べ直す（G-DUP-START、DEC-103）
        - 見張りはイベント駆動（udevadm monitor、ip monitor）で周期の値を持たない。ドライバの停止の各段の待ちは PRM-59（未確定の間は上限なし）
        - 判断（デバイスの出現・消失・再接続・使用中、ドライバの起動・作り直し・停止・終了、前回と同じ IMU の列挙を開き直すこと）を DecisionEvent（IFD-28）で記録する
        - 上流のドライバは改変しない（DEC-075 と同じ方針）
  - id: G-DUP-START
    set_nested:
      issue.next_action: >-
        実装済み（人の許可 DEC-103）。gouda.sh は pid ファイルに頼らずに同じ利用者の gouda_core の起動（試験スタックを除く）を検出して拒む。sensor supervisor は別のプロセスが開いているデバイスにはドライバを起動しない（device_in_use）。
        単体試験（DeviceInUseTests）と VM での試験（gouda.sh の拒否と表示、/proc からの検出。FILE-VEHICLE-PC-DUP-START-GUARD）は合格。
        未実行: センサーを繋いで Gouda を 2 つ起動したときの supervisor の動作（実機の協力が要る）。
  - id: G-LIDAR-DROPOUT
    set_nested:
      issue.question: >-
        x86 機の屋外の地図作成（2026-10-14 06:34〜06:45）で、GLIM が受け取る LiDAR の frame が 06:38:35 に 3.5 s、06:40:29 に 2.7 s、06:44:22 に 3.2 s 途切れた。
        それぞれの後、約 1 分間、点と IMU の時刻の差の警告が続いた（1.0〜3.6 s）。3 回目では約 9 m ずれ、同じ場所を通った所で高さが中央値 1.8 m 違う。
        人によると出発点にほぼ一致して戻ったので、地図の終点のずれ（水平 12.7 m、高さ 6.4 m）は誤差（DEC-103）。FILE-X86-MAPPING-MAPS。
        カーネルのログでは、3 回とも同じ秒に LiDAR を繋いだ有線 LAN（enp2s0、本体内蔵の r8169）が Link is Down になり、2〜3 s 後に Link is Up になった（物理層でのリンク断）。
        サスペンドの記録はなく、GLIM は動き続けた。ACPI の処理の行が 3 回のうち 2 回と同じ頃にある。蓋の開閉は systemd-logind の journal に出るため、まだ確かめていない。
        supervisor は反応していない（IP アドレスが残り、ドライバは作り直されていない）。FILE-X86-LIDAR-DROPOUT。
      issue.next_action: >-
        蓋の開閉の時刻を journal で確かめ、リンク断の時刻と比べる（人に依頼。journalctl の systemd-logind の Lid closed / Lid opened）。
        一致すれば、蓋を閉じたときの電源管理が有線 LAN を切ると見て、スリープ・蓋の動作の抑止（DEC-104）で防ぐ。
        一致しなければ、LAN のケーブル・コネクタ（車体の振動。廊下では途切れなし）を疑う。どちらでも、屋外の地図作成では monitor の SENSORS 表で点群の途切れを見る。
