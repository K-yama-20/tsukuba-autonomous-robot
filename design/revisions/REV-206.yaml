decisions:
- id: DEC-417
  kind: approval
  status: answered
  asked_on: '2026-11-03'
  answered_on: '2026-11-03'
  channel: chat
  question: >-
    AI と人間の役割分担をどう定めるか。AI の提案：人間の草案に、判断の材料を出す責務、結果を実行したものだけ報告する責務、安全を理由に指示を拒否・変更しないこと、人間の指示なしに安全機構を足す・削らないこと、
    人間の指示なしに実車の PC で Gouda を起動・停止したり車体が動きうる指令を出したりしないこと、DEC が未回答の間の動き、人間の見落としを指示がなくても広く調査することを足す。
    調べて指摘するのは AI、危険かどうかを判断するのは人間と明記する。
  answer_verbatim: |
    AIと人間の役割分担を明確にする。以下が草案だが、付け加えるべきことはあるか？

    AIの責務：人間の指示やAIの実装の整合性管理、考慮不足の指摘､実装、テストプログラムの作成等。
    AIの非責務：安全管理

    人間の責務：安全管理（AIが出してきた実装案や方針案、設定値が安全かどうかを判断し､適宜AIに修正を指示する。）､指示出し、重要な部分の判断（DECの判断）

    AIには人間の見落としとかも広く調査してほしいのだ。

    それでいこう。書き込め。
  affected_refs:
  - DEC-106
  resulting_refs: []
  note: >-
    「それでいこう」は AI が示した修正案と追加の案（調査の範囲、タイミング 3 つ、見つけたものの扱い、安全に関わる見落とし）の採用と解釈した。全文は CLAUDE.md 1.12。
    intent.md の 62〜63 行（役割分担）と重なる。intent.md は人が所有するので変えていない。CLAUDE.md の 1.2・1.4・1.5 は「判断でなく材料を出す」と読めば矛盾しないので変えていない。第194便。
  disposition: answered
