decisions:
  - id: DEC-063
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-09'
    channel: intent.md
    question: intent.md 第7版（人の編集。27 行の追記と 95 行の表記変更。チャットでの言及なし、機械比較で検出）
    answer_verbatim: |
      SpeedLimitの発行手段（Speed Filter／Route Server／Gouda側の発行器）は、採用するNav2の版に合わせてAIが提案し、人が承認する。実行時は位置ベースで速度上限を決める。同じ位置を複数の区間が通る場合（再訪・交差・重複）、それらの区間には同じ上限を設定する運用とし、異なる値が設定されていれば waypoint_manager は保存時に警告し、実行時は低い方の上限を適用する。区間の帯の外では上限を適用しない（Nav2 の挙動どおり無制限）。帯の幅は実機調整で決める。
      ・起動直後は手動走行モードに入る。手動走行モードがデフォルトのモード。
    affected_refs: [FILE-INTENT-V6, RQ-I021, RQ-I066, H-013, C-023, MODE-MANUAL]
    resulting_refs: [AR-007, RQ-I079, RQ-I080, C-024, C-025]
    note: >-
      27 行は DEC-059（案 A）の補足で、位置ベース上限・同値運用・保存時警告・低い方の適用（DEC-045）・帯外無制限・帯幅は実機調整（G-TUNING）を上位要求にした。
      95 行は用語の統一（DEC-054 の照合で提案したもの）。残る「手動操縦」は intent.md:1 の目的文のみ。
    disposition: answered

