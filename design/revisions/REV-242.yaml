# 変更セット REV-242（2026-11-07 第217便: MID-360 を XT-32 とは別の costmap の層として入れる最小構成。DEC-454〜457、PRM-142）
# reserved by reserve_ids.py: mid360-impl 2026-11-07T02:04:13
# 適用: design/tools/apply_revision.py REV-242
id: REV-242
date: '2026-11-07'
summary: >-
  第217便：人の回答「実装はopus5.5に実装させよ。君は監督役。」（DEC-454）で、MID-360 を XT-32 とは別の costmap の層（構成案 B1、模擬の S2）として入れる
  最小構成を製品のコードに入れる。上流の livox_ros_driver2（ND-20、PointCloud2、mid360_link）を Nav2 と一緒に起動し、上流の pointcloud_to_laserscan を
  もう 1 つ（ND-21 mid360_scan、XT-32 と同じ帯 PRM-70・71）起動し、local・global の costmap に MID-360 だけで印と消去をする ObstacleLayer
  （mid360_layer）を XT-32 の層の後に足す。XT-32 の層は変えない。PC 側・MID-360 側のアドレスと取り付けの値は車載 PC の
  <data_root>/config/mid360.json（IFD-61、リポジトリに置かない）から読み、そろわなければ MID-360 の経路全体を起動せず理由を記録する（XT-32 だけで今までどおり）。
  有効・無効は PRM-142（/config の Nav2 タブで切り替え）。sensor supervisor・monitor の入力欄と状態の表示・自己位置・PTP は入れない。
