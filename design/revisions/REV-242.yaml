decisions:
- id: DEC-454
  kind: approval
  status: answered
  asked_on: '2026-11-07'
  answered_on: '2026-11-07'
  channel: chat
  question: >-
    （第217便、監督役のセッションの質問）MID-360 を別の層で costmap に入れる最小構成の実装に着手してよいですか？
    提示した内容：ドライバを Nav2 と一緒に起動する／base_link → mid360_link の TF を設定値から出す／点群を base_link の高さの帯で切って scan にする
    （XT-32 と同じ上流の pointcloud_to_laserscan）／local と global の costmap に MID-360 の層を足す。7 時までに入れないもの：sensor supervisor への組み込み、
    monitor の /config の入力欄と状態の表示、自己位置への利用、PTP。
  answer_verbatim: |
    実装はopus5.5に実装させよ。君は監督役。
  affected_refs:
  - ND-10
  - ND-13
  - IFD-20
  - IFD-54
  - DEC-341
  resulting_refs:
  - ND-20
  - ND-21
  - IFD-59
  - IFD-60
  - IFD-61
  - PRM-142
  note: >-
    その前の人の発言（原文）「MID-360は確認走行クリアには必須である。プランを立てよ。一部は別セッションで検討済みである。」。AI の解釈：回答は質問の内容での実装の承認で、
    実装は監督役のセッションが別のセッション（このセッション）に指示した。層の構成は模擬の S2（第203便、接触 18 → 6、drive_sim_layers.py）に合わせた：印は MID-360 の
    帯の scan、消去は MID-360 の点群そのものを mid360_link から（MID-360 の光線が通った所だけを消す）。監督役の指示の「印と消去の両方を MID-360 の scan だけで行う」は、
    「MID-360 の観測だけで」と読み、模擬で確かめた S2 の形（消去は点群）にした（違えば人・監督役が直す）。PRM-142 の既定 true は監督役の指示で、人は値を明示していない。
    アドレスと取り付けの値は車載 PC のローカルのファイル（IFD-61）で、正本・リポジトリには置かない（公開リポジトリ）。取り付けの値がそろうまで経路全体を起動しない（DEC-457）。
    実車・模擬・車載 PC での確認は未実行。安全かどうかの判断は人（CLAUDE.md 1.12）。第217便。
  disposition: answered
- id: DEC-455
  kind: question
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【未決】MID-360 の高さの帯（mid360_scan の min_height・max_height）を XT-32 の帯（PRM-70・PRM-71）と別の値にするか。
  answer_verbatim: ''
  affected_refs:
  - ND-21
  - PRM-70
  - PRM-71
  resulting_refs: []
  note: >-
    今（REV-242）は XT-32 と同じ PRM-70・71 を使う（mid360_scan の設定は xt32_scan の写し）。推奨：まず同じ帯で実車の記録を取り、地面の写り込み（50° 下向きのため
    取り付けの傾きの誤差が帯の下限に効く）と低い物の見え方を見てから決める。代替：MID-360 だけ下限を上げる（地面の誤検出を減らすが低い物を見落とす）。
    影響する ID：ND-21、IFD-60。決まらない場合に止まる作業：なし（同じ帯のまま動く）。
  disposition: open_human
- id: DEC-456
  kind: question
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【未決】MID-360 がつながらない・点群が届かない・ドライバが止まったときの扱い。
  answer_verbatim: ''
  affected_refs:
  - ND-20
  - ND-10
  - DEC-341
  resulting_refs: []
  note: >-
    今（REV-242）の振る舞い：ローカルの値（IFD-61）かドライバがなければ MID-360 の経路を起動せず、理由を launch の記録に出して XT-32 だけで走る。起動した後に点群が
    届かないとき・ドライバが落ちたときは、何も検出しない（mid360_layer は印も消去もしないまま、XT-32 だけで走り続ける。ドライバの再起動もしない。monitor の表示もない）。
    構成案の A-6 の推奨は「動き続ける（XT-32 だけで走り、記録と表示）」。リスク：低い物が見えないまま走る。代替：Nav2 の起動の条件にする、expected_update_rate で
    層を古いとみなす（Nav2 の上流の機能。古いと costmap が current でなくなり controller が止まる）。決まらない場合に止まる作業：sensor supervisor への組み込みと monitor の表示。
  disposition: open_human
- id: DEC-457
  kind: measurement
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【実測】MID-360 の取り付けの位置と姿勢（base_link → mid360_link の x・y・z・roll・pitch・yaw と軸の向き）。車載 PC の <data_root>/config/mid360.json に入れる値。
  answer_verbatim: ''
  affected_refs:
  - DEC-424
  - DEC-425
  - ND-13
  - IFD-61
  resulting_refs: []
  note: >-
    値は tbd（DEC-425 の回答は高さ 800 mm か 500 mm の候補、DEC-424 は 50° 下向き。ステーの設計は高さ 450 mm・傾き 50° と監督役から聞いたが、実測前で確定値ではない）。
    値が入るまで base_link → mid360_link は出さず、MID-360 の経路全体を起動しない（推測の値で埋めない）。計測の手順の案：取り付けの点の位置を巻尺で base_link から測る
    （x 前・y 左・z 上）、傾きは傾斜計か地面の当てはめ（#72・#80）。証拠（日付、計測の条件、写真・記録）を残してから人が値を入れる。決まらない場合に止まる作業：MID-360 の層の実車での使用。
  disposition: open_human
