  - id: ND-15
    set_nested:
      ros_node.responsibilities:
        - IMU の計測を sensor_msgs/Imu として提供（IFD-22）
        - デバイスは by-id の名前だけを使う（PRM-54、DEC-081・DEC-082）。発行周期は PRM-56。frame は imu_link（IFD-22）、topic は imu/data_raw を sensors/imu/data へ remap
        - TF を発行しない（publish_tf=false。ドライバの既定は true で、TF の発行者は ND-13 だけ：RQ-I004）
        - ドライバの停止・再起動で IMU 本体が応答しなくなる既知の現象があるため、モードの切替で停止・再起動しない。作り直すのは IMU の USB が再接続されたとき（新しい列挙）だけ（ND-18、DEC-088）
      ros_node.placement_rationale: 第三者ドライバ（上流は改変しない）。gouda_sensor_supervisor（ND-18）が子プロセスとして起動し、by-id の名前の先の USB 列挙が変わったときだけ作り直す（DEC-088）。
