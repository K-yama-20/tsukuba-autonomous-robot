# 変更セット REV-034（2026-10-13 第22便: センサーの受信表示と地図作成開始時の警告、デバイス再接続時のドライバ作り直し）
# 適用: design/tools/apply_revision.py REV-034
id: REV-034
date: '2026-10-13'
summary: >-
  人の指示 DEC-088 を原文で記録し反映。(1) gouda_monitor（ND-02）が点群（IFD-21）と IMU（IFD-22）の受信状況を表示し、地図作成開始ボタンの時点でデータがなければ警告する
  （ポップアップと DecisionEvent。開始は止めない）。(2) gouda_sensor_supervisor（ND-18、新規）がセンサードライバ ND-14・ND-15 を子プロセスとして起動し、デバイスを名前で見張り、
  再接続（新しい USB 列挙・I/F の再登録）を検知したときだけそのドライバを作り直す。同じデバイスのままでは再起動しない（IMU は再接続なしの再起動で応答しなくなるため）。
  設計は docs/sensor_supervision.md。しきい値・停止待ち PRM-57〜59 は未確定（仮値あり、DEC-089）。試験 TS-31・TS-32。
basis_refs: [DEC-088, DEC-081, DEC-075]
intent_version_copy: design/baselines/intent_history/intent_v8_09732d2f5997.md

decisions:
  - id: DEC-088
    kind: approval
    status: answered
    asked_on: '2026-10-13'
    answered_on: '2026-10-13'
    channel: chat
    question: 考察（VM での LiDAR・IMU の途絶）で示したソフトの改善案のうち、採用するもの
    answer_verbatim: |
      次の二点の改良を入れて。

      * monitor に点群と IMU の受信状況を出し、地図作成の開始時にデータがなければ警告する。
      * デバイス名を見張り、再接続を検知したらそのドライバだけ作り直す。IMU は再起動だけでは固まるので、作り直すのは再接続のときだけにします。


      各種文書に記録することも忘れずに。
    affected_refs: [ND-02, ND-14, ND-15, IFD-21, IFD-22, TR-03]
    resulting_refs: [ND-18, SO-12, PRM-57, PRM-58, PRM-59, TS-31, TS-32]
    note: >-
      AI が示した 3 案のうち 2 案を採用（時計の飛びの検知は採用されていない）。直前の人の問い「usbはtty...ではなく、デバイス名（STMicro...が含まれているもの）でサーチするように指示したよね？
      LiDARが止まってしまう原因がソフト側にあったりするかな？VMだからエラーが起きやすいのでしょうか。考察してください。」への AI の考察: IMU は by-id の名前で開いていたが、探すのは起動時だけで
      再接続後に探し直さなかった。LiDAR の停止は Mac のスリープで VM が止まった時刻と一致し、ソフトが LiDAR を止めた形跡はない（同じドライバが 22:17 に自動で受信を再開）。
      VM 固有の要因（スリープ、USB の受け渡しの切断、時計の飛び、パケット欠落）を観測。構成の選択肢（専用 PC の Ubuntu を推奨）は人の判断に委ねた（回答なし）。
    disposition: answered
  - id: DEC-089
    kind: question
    status: pending
    asked_on: '2026-10-13'
    answered_on: null
    channel: chat
    question: >-
      【承認】センサー受信表示と supervisor のソフトウェア設定値（実車の測定値ではない。DEC-073 の UI の値と同じ扱い）。
      PRM-57 点群の STALE しきい値 1.0 s、PRM-58 IMU の STALE しきい値 1.0 s、PRM-59 ドライバ停止の各段の待ち 5.0 s でよいか。
    answer_verbatim: ''
    affected_refs: [PRM-57, PRM-58, PRM-59, ND-02, ND-18]
    resulting_refs: []
    note: >-
      推奨値の根拠: PRM-57 は XT-32 の 10 周期（Pandar Console の Spin Rate 600 rpm）で、VM の起動直後に観測した最大の間隔 0.70 s より長い。PRM-58 は IMU 100 周期（PRM-56 の仮値 100 Hz）で、
      観測した最大の間隔 0.30 s より長い。PRM-59 は ROS 2 launch がノードの停止で待つ既定と同じ。
      決まらない場合: monitor は未受信だけを警告し、途絶（STALE）は判定しない。supervisor はドライバの停止を上限なしで待つ。他の作業は止まらない。
    disposition: open_human

entities:
  - id: ND-18
    kind: ros_node
    intent_lines: [7, 103]
    name: gouda_sensor_supervisor（センサードライバの起動と、デバイス再接続時の作り直し）
    issue_refs: []
    sensitivity: [operation]
    ros_node:
      node_name: gouda_sensor_supervisor
      responsibilities:
        - センサードライバ ND-14（XT-32）・ND-15（IMU）を子プロセスとして起動する。設定は generated/params（PRM-50〜56）から作り、未確定・未導入なら起動せず理由を記録する
        - デバイスを名前で見張る。IMU は by-id の名前（PRM-54）、XT-32 は PC 側アドレス PRM-51 を持つ I/F。同一性（USB の列挙番号・ifindex）が変わったとき（再接続）だけ、そのドライバを止めて起動し直す（DEC-088）
        - 同一性が同じならドライバを再起動しない（ドライバが自分で終了しても再起動しない。IMU は再接続なしの再起動で応答しなくなるため）。デバイスが消えたらドライバを止め、再び現れたら起動する
        - 見張りはイベント駆動（udevadm monitor、ip monitor）で周期の値を持たない。ドライバの停止の各段の待ちは PRM-59（未確定の間は上限なし）
        - 判断（デバイスの出現・消失・再接続、ドライバの起動・作り直し・停止・終了、前回と同じ IMU の列挙を開き直すこと）を DecisionEvent（IFD-28）で記録する
        - 上流のドライバは改変しない（DEC-075 と同じ方針）
      absorbs_module_refs: []
      active_in_mode_refs: [MODE-MANUAL, MODE-MAP, MODE-AUTO, MODE-PAUSE]
      lifecycle: plain_node
      process_group: sensors
      publishes_refs: [IFD-28]
      subscribes_refs: []
      serves_refs: []
      calls_refs: []
      owned_state_refs: [SO-12]
      placement_rationale: >-
        gouda.sh（GOUDA_SENSORS=1）の起動から終了まで動き、モードの切替ではドライバを止めない。ドライバを launch の Node ではなく子プロセスにしたのは、デバイスごとに 1 つだけを作り直すため（launch は個別の再作成をしない）。
        設計は docs/sensor_supervision.md。
    interpretation: ''
