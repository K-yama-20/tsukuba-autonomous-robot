# 変更セット REV-045（2026-10-14 第26便: 実機の地図作成の試験（廊下、二往復）の AI による判定の記録）
# 適用: design/tools/apply_revision.py REV-045
id: REV-045
date: '2026-10-14'
summary: >-
  人が実機で地図作成の試験をした（長い廊下、途中にゴミ箱など、二往復）。AI の判定は「地図は正しく作成されていない（不合格）」。
  軌跡は開始 5〜15 s で約 21 m 沈み、合計 34 m 下がった（平らな廊下）。連続する frame の間で 4.9 m 跳び、四つの区間の長さ（31〜41 m）と折り返し点（片側で 8 m）がそろわず、
  廊下が高さの違う複数の層に分かれて写っている。GLIM が処理した周期は 3.76 Hz（欠け 0.5 s 超が 115 回）、点と IMU の時刻の差は 1.0〜2.0 s、IMU の時刻の逆行 5 回。
  試験の間、Gouda が 2 つ同時に動いていた（ワークスペースとデータの置き場をごみ箱へ移した後も古い起動が残り、pid ファイルが移ったため gouda.sh が気づかずに 2 つ目を起動）。
  同じ IMU のシリアルポートを 2 つのドライバが、同じ LiDAR を 2 つのドライバが読み、GLIM も 2 つ動いた（一方は例外で終了）。この起動の重複を問題 G-DUP-START として登録。
  /config がなかったため T_lidar_imu は中立だった。rosbag は記録されていない（自動開始は log だけ）ため、この走行は再処理できない。DEC-099・DEC-100 の計測には使えない。
basis_refs: [DEC-099, DEC-100]
intent_version_copy: design/baselines/intent_history/intent_v9_183f8ee16455.md

