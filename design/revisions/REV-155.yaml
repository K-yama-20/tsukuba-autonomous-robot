modifications:
- id: ND-02
  set_nested:
    ros_node.responsibilities:
    - 現在のモードと各nodeの状態の表示（RQ-I033）、ログ・rosbagの記録状態表示と独立した Record／Stop Record 操作（RQ-I005）
    - 地図作成開始／終了、自律走行開始／一時停止／再開／終了の操作（サービス呼出し。進行の正本は持たない）。待ち時間は ROS parameter（PRM-29〜32。一時停止は別枠）で、超過は失敗を表示し自動再試行はしない
    - 判断（log/decision）は時刻付きの「履歴」欄に表示し、「現在の状態」欄（mode/state）とは分ける。保持されたメッセージの受信を契機にしない（DEC-072）。記録の自動開始の失敗（record_auto_start_failed）はポップアップで警告（DEC-071）
    - 初期位置・向きの指定（IFD-39）。開始時と、PC 再起動後の再開前（DEC-009）
    - waypoint_manager GUI の表示（RQ-I044）と waypoint・区間速度上限の編集・保存（RQ-I078）。保存時に Speed Filter 用の速度マスクと filter info を生成して同じ由来 ID・ハッシュで保存（IFD-41、DEC-031。幅は PRM-19、刻みは PRM-20）
    - 保存時に、重複する cell で上限が異なる区間を検出して警告する（対象区間と採用される低い方の値を示す。保存は拒否しない。DEC-059 案 A、TS-22）
    - 地図とwaypointの組の選択とプレビュー（RQ-I011）
    - センサTF・座標方向等の /config の保持。タブ遷移で設定が消えない永続化（RQ-I070）
    - 表示用の状態集約。ESP32 STATUS のうち取得できる項目を表示し、取得できない項目・途絶時は「不明」と表示（DEC-006）。monitor の表示断は停止の契機にせず、再接続後に transient_local の状態を取得する（DEC-014）
    - 自身の設定状況（UI の周期・待ち時間 PRM-27〜32、/config の版）を起動時と /config 保存時に DecisionEvent（event=settings）で記録する（DEC-073、RQ-I015）。中継ノードとして parameter を宣言する（ブラウザ側 UI は宣言しない）
    - 点群と IMU（IFD-22）の受信状況（状態・周期・経過。IMU は header.stamp と受信時刻の差も）を表示する。点群は、ドライバが点群を出すたびに出す小さな通知（IFD-56）の到着で見て、1.66 MB の点群そのもの（IFD-21）は購読しない（DEC-281 b）。中身は展開せず到着だけを数える。表示のみで停止条件にしない（DEC-088）。しきい値は PRM-57・PRM-58
    - 地図作成開始ボタンの時点でどちらかのセンサーが未受信または途絶なら、ポップアップと DecisionEvent（mapping_start_sensor_warning）で警告する。開始は止めない（RQ-I011、DEC-088）
    - 「地図」タブ（RQ-I082）。地図データベースの原図と変換後地図（rev）の一覧、変換設定（PRM-33〜36・38・62〜64）の入力と再変換（IFD-37 に設定を添えて送る。一度に一つ）、rev ごとのプレビュー（2D 地図、3D 点群地図を上から見た高さの図、表示用の傾き・段差の図。DEC-095・DEC-097 A）・設定・結果の表示。既定値は gouda_map_creator の parameter を表示する。再変換の要求と結果を DecisionEvent で記録する
    - DecisionEvent の glim_exited（GLIM の異常終了）と、record/status の failures の増加（記録の失敗。last_failure を示す）をポップアップで示す。接続時に受け取った保持分はきっかけにしない（DEC-072 と同じ規則。G-GLIM-EXIT、G-REC-ROSBAG-RESTART）
    - /config の「Nav2」タブ（DEC-201・DEC-207 (a)・DEC-209）：Nav2 BT の recovery の回数を入力し IFD-54 に保存する（1 以上 PRM-18 以下の整数）。保存した値、次の gouda.sh start で使う値とその出所（monitor の値か PRM-18 か）、今の起動で使っている値（<data_root>/run/nav2/recovery.json）を表示する。保存を DecisionEvent に残す
    - 案 C（DEC-215・DEC-211・DEC-217）：waypoint の保存のときに、各 waypoint が帯の地図（map.yaml）の空きの格子にあるかを確かめ、外にあれば警告を出して保存する（拒否しない）。地図タブに、帯と 3D 点群の重ね図（corridor_overlay.png）と今の分類の地図（ground_band.png）を表示する。「Nav2」タブに inflate_around_unknown（PRM-98 の上書き）を足す
    - 人が描く範囲（DEC-220〜223）：waypoint タブの地図（帯と 3D 点群の重ね図）の上に、多角形で「走行禁止」「走行可」を描き、waypoint セットと一緒に保存する（内容ハッシュに入る）。保存のとき、速度マスクと同じ格子で keepout のマスク（keepout_mask.pgm・.yaml、keepout_filter_info.yaml。禁止 100、走行可 0、指定なし -1。禁止が走行可より強い）を作り、map_server が読む値の内容ハッシュを manifest に記録する。禁止の範囲を広げる幅はない（人が車体のはみ出しの余裕を取って描く：DEC-223）。走行禁止の中の waypoint は警告して保存する
    - 地図作成の終わりの姿勢（DEC-289）：waypoint タブで地図を読み込むかセットをプレビューすると、変換後地図の軌跡（trajectory_imu.txt）の最後の点を、その地図作成の /config の写しの IMU の取り付けで base_link に直した位置・向きを、黄の矢印と「地図作成の終わり」で表示する（/api/map/<origin>/<rev>/end_pose.json）。「地図作成の終わりの姿勢を初期位置にする」ボタンで初期位置（IFD-34 に送る値）の欄に入れる。押すのは人で、車体を地図作成の後に動かしていないときだけ使う（説明を画面に出す）。軌跡か /config の写しがないときは理由を出し、矢印もボタンも出さない（補わない）
  interpretation_append: REV-155（DEC-289 案 a）：waypoint タブに地図作成の終わりの姿勢と、それを初期位置にするボタン。
