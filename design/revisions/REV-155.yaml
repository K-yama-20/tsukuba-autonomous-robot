summary: 第126便：人の指示（原文「DEC-289を推奨案で実装せよ」）で DEC-289 案 a を実装した。monitor の waypoint タブに、地図作成の終わりの車体の姿勢（軌跡の最後の点を、地図作成の /config の写しの IMU の取り付けで base_link に直したもの）を黄の矢印で表示し、「地図作成の終わりの姿勢を初期位置にする」ボタンで初期位置の欄に入れる。
