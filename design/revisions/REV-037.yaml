# 変更セット REV-037（2026-10-14 第23便: 起動経路を一つにする、センサー・monitor・supervisor の値の確定、LiDAR 回転数 600 rpm）
# 適用: design/tools/apply_revision.py REV-037
id: REV-037
date: '2026-10-14'
summary: >-
  人の回答 DEC-091 を原文で記録。AI の変更案（起動は bash gouda.sh start の一つ、センサーの切替をなくし常に supervisor が扱う、機械ごとの値は正本の設定、仮値は試験 script だけ、
  ワークスペース等は gouda.sh の位置から決める）と推奨値を了承。確定値: PTC ポート 9347（PRM-53）、IMU 周期 100 Hz（PRM-56）、点群・IMU の STALE しきい値 1.0 s（PRM-57・58）、
  ドライバ停止の待ち 5.0 s（PRM-59）、monitor のポート 8080（PRM-26）、データの置き場 <workspace>/gouda_data（PRM-25）、LiDAR の回転数 600 rpm＝10 Hz（PRM-60、新規。ドライバが起動時に設定）。
  LiDAR は 1200 rpm にも設定でき、いずれ 1200 rpm にする可能性がある。IMU は約 1000 Hz まで出せる。ESP32 のシリアルデバイス（PRM-61、新規）は未確定（新 firmware の書き込み時に実機の名前で決める）。
  DEC-084・085・089 は本回答で回答済み。
basis_refs: [DEC-091, DEC-090]
intent_version_copy: design/baselines/intent_history/intent_v8_09732d2f5997.md

decisions:
  - id: DEC-091
    kind: approval
    status: answered
    asked_on: '2026-10-13'
    answered_on: '2026-10-14'
    channel: chat
    question: >-
      起動経路を一つにする変更案（bash gouda.sh start の一つ、センサーの切替をなくす、機械ごとの値は正本の設定、仮値は試験 script だけ、ワークスペース等は gouda.sh の位置から）と、
      未回答の値の推奨（PTC ポート 9347、IMU 周期 100 Hz、受信の途絶のしきい値 点群・IMU とも 1.0 s、ドライバ停止の待ち 5.0 s、monitor のポート 8080）でよいか
    answer_verbatim: |
      それで問題ない。imu_ros_driverの周波数は100Hz, lidarの周波数は10hz（600rpm）で設定しろ。これは確定値（lidarは1200rpmにも設定可能で、imuは1000hzくらいまで出せるので、いずれlidarを1200rpmにする可能性もあることを併記）
    affected_refs: [ND-01, ND-18, PRM-25, PRM-26, PRM-53, PRM-56, PRM-57, PRM-58, PRM-59, DEC-084, DEC-085, DEC-089]
    resulting_refs: [PRM-60, PRM-61]
    note: >-
      「それで問題ない」は直前の AI の案と表の推奨値の全体への回答として扱う。LiDAR の周波数 10 Hz（600 rpm）は PRM-60 として宣言し、ドライバの設定 speed で起動時に LiDAR へ設定する
      （上流 SDK の lidar.h 374〜378 行、SetSpinSpeed）。併記の指示（LiDAR は 1200 rpm 可、IMU は約 1000 Hz 可、いずれ 1200 rpm の可能性）は PRM-56・PRM-60 の interpretation に記載。
    disposition: answered

