  - id: DEC-090
    set:
      note: >-
        事実: GOUDA_SENSORS は AI が REV-031（2026-10-13）で、センサーのない環境で試験するために自分の判断で入れた。人の指示ではない。gouda.sh の環境変数は GOUDA_WORKSPACE・GOUDA_DATA_ROOT・GOUDA_PARAMS_DIR・
        GOUDA_TRIAL_PARAMS・GOUDA_MONITOR_PORT・GOUDA_SENSORS・GOUDA_SERIAL_PORT・ROS_SETUP の 8 つだった。判断台帳と intent.md には同じ文の指示は見つからない（チャットで受けていたなら記録していなかった）。
