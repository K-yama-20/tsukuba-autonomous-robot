- id: G-DUP-START
  set_nested:
    issue.next_action: '実装済み（人の許可 DEC-103）。gouda.sh は pid ファイルに頼らずに同じ利用者の gouda_core の起動（試験スタックを除く）を検出して拒む。sensor supervisor は別のプロセスが開いているデバイスにはドライバを起動しない（device_in_use）。 単体試験（DeviceInUseTests）と VM での試験（gouda.sh
      の拒否と表示、/proc からの検出。FILE-VEHICLE-PC-DUP-START-GUARD）は合格。 未実行: センサーを繋いで Gouda を 2 つ起動したときの supervisor の動作（実機の協力が要る）。 2026-10-17 人の報告（DEC-117）: 最新版を実機 x86 に反映し、二重起動の防止は正常に動いている。センサーを繋いで Gouda を 2 つ起動したときの
      supervisor の動作の記録は受け取っていない。'
- id: TR-14
  interpretation_append: 'REV-058: 地図作成中の GLIM の異常終了の検出と表示（DecisionEvent glim_exited と monitor のポップアップ）だけを実装。プロセスの再起動・試行回数（PRM-10）・状態の復元は未実装（G-GLIM-EXIT）。'
decision_updates:
- id: DEC-115
  set:
    note: '根拠: FILE-LOCALIZATION-EVAL、FILE-LOCALIZATION-EVAL-FIG、提案 design/proposals/localization_selection.md §6.1・§7。推奨は承認。 振る舞いの違い: A3 は初期姿勢のずれが大きいとき姿勢を出さないか探索で戻る。A は誤った姿勢を正常として出し続けうる。 決まらない場合に止まる作業：自己位置推定の実装の設計（ND-07・ND-08
      の構成、中継の node、地図の変換の 20 m 格子）。地図作成と記録は止まらない。 2026-10-17、人の指示（DEC-117）により保留。GNSS 受信機（Septentrio mosaic-go G5 P6、ネットワーク RTK）の搭載を踏まえて見直す。'
- id: DEC-104
  set:
    note: '決まらない場合に止まる作業：Gouda の起動中のスリープの抑止。地図作成・自律走行は今のままでもできるが、蓋を閉じたときやアイドル時の動作は PC の設定次第。 計画: design/proposals/sleep_inhibit_plan.md（DEC-106 により、許可まで実装しない）。VM では SSH からは抑止を取れない（Access denied）。 電池では 900
      s の操作なしで自動サスペンドする設定（VM の既定。FILE-GROUND-PLAN-CHECK の (3)）。 2026-10-17、人の指示（DEC-117）で検討し、計画を第2版にした（電池での自動サスペンドの危険、抑止の効く範囲、x86 機での確かめ方を追加。推奨は変えず案 A）。'
