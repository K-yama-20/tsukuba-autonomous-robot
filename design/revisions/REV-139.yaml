    answer_verbatim: '（分岐セッション「引き継ぎ 2026-10-21 その2」からの転記。人の発言の原文、時系列の番号つき）

      1.「DEC-227はAを基本とするが､条件を加える。

      禁止範囲同士が近接していて、膨らんだ部分との間に車体が通れる隙間がない場合は、車体が通れるだけの隙間をcostmapに作る。


      これで意図は伝わるかな？検討せよ」

      2.「では私の改修案は筋が悪いということかな？どうしたらいいかな」

      3.「最低どのくらいの隙間をとおれるようになる見込みでしょうか」

      4.「”確定するまでは、禁止の範囲どうしの隙間を「1.0 m 以上空けるか、完全にふさぐ」と決めておくのが安全"とあるが、これはソフトウェア的にではなく、人間が気をつける話？」

      5.「ではDEC-277は禁止の範囲を壁と同じように膨らませる（禁止範囲周辺のボクセルもコストを高くする）ということか？」（DEC-277 は DEC-227 の書き誤り：分岐先の注）

      6.「DEC-227の回答として記録し、メインのチャットに指示せよ」

      '
    note: 事実（VM（~/gouda_rev128_ws、試験の基盤 stack.sh、ROS_DOMAIN_ID 77、loopback_sim、模擬の ND-07）の 5-6 の結合試験 KEEPOUT=1、2026-10-21、空きの地図（stage56_fixture.py）に走行禁止の四角（x 2.8〜3.4 m、y −0.5〜0.5 m、直線 (1,0)→(4,0) をふさぐ）。記録：VM の /tmp/st56_rev137e.log、/tmp/st56_rev137_run3_stack.log・run5_stack.log。）：global costmap は四角の中が 100、四角の外の 0.1〜0.4 m（y 0.6〜0.9）と手前 0.2〜0.5 m（x 2.3〜2.6）は 0（inflation_radius 1.0 m なのに膨らまない）。経路は四角のそばで |y| が最大 0.50 m（縁そのもの）。車体は横に 0.30 m（PRM-69）出るので、経路の上の車体は禁止の範囲に重なり、local の禁止の格子（DEC-222）で RPP が「collision ahead」を 815〜907 回、Controller patience exceeded、spin・backup も失敗。車体は x 約 2.05 m（四角の 0.76 m 手前）で止まり、禁止の範囲には入らなかったが、PAUSE（最後の waypoint）に着かなかった。同じ試験で範囲を描かないときは最後まで走り、collision ahead は 0 回。Nav2 1.3.13 のソース（keepout_filter.cpp）：KeepoutFilter は layer の後にマスクの値を master に書く（大きいときだけ）。提案 §2 の未確認 1（filter は inflation の後か）は「後」と確認。DEC-223 の前提（base_link が縁まで来て、車体がはみ出してよい）は、local にも禁止の格子がある（DEC-222）ので成り立たない：はみ出す代わりに止まる。案 A（推奨）：global costmap に keepout のマスクを読む層（StaticLayer、/keepout_filter_mask、use_maximum true）を
      inflation の前に足し、禁止の範囲を壁と同じく膨らませる。KeepoutFilter（global・local、override_lethal_cost true）はそのまま。振る舞い：経路が禁止の範囲から壁と同じだけ離れる（base_link が縁まで来ることはなくなる。DEC-223 は「来てもよい」なので反しない）。禁止の範囲と壁の間の狭い所は通れなくなりうる。禁止の範囲の中にいるとき、global の層は 254 のまま残るので外への経路が引けず Nav2 が失敗しうる（override は local だけに効く。結果は TR-07 の一時停止）。StaticLayer が −1 の格子を飛ばすか、マスクの大きさで costmap を作り直さないかは推測で、VM で確かめる。案 B：保存のときに禁止の範囲を広げる（提案 §5。DEC-223 では不採用）。広げた縁に経路が沿うのは同じで、前に 0.55 m 出る車体では 0.30 m では足りない。案 C：今のまま（人が描く場所で避ける）。経路が禁止の範囲のそばを通るときは、いつも止まって recovery をくり返す。案 D：車体の形を考える planner（Smac Hybrid・Lattice）に替える（大きな変更）。影響を受けるもの：Nav2 の設定（gouda_nav2.yaml、nav2_config.py）、TS-47 の期待（迂回して最後まで着くこと）。決まらない場合に止まる作業：禁止の範囲のそばを走る経路（範囲を描かない走行と、描いた範囲の保存・開始の確認は止まらない）。第107便で登録。 REV-139（第108便）：採用（人が 6 で記録を指示した、分岐側の整理）：案 A。global costmap に keepout のマスクを読む層（StaticLayer、use_maximum true）を inflation の前に足し、禁止の範囲を壁と同じに膨らませる（2D の格子。ボクセルではない）。禁止の範囲そのもの（DEC-223）と local costmap（禁止の格子だけ、DEC-222）は変えない。人の条件（1：禁止の範囲どうしが近く、膨らみとの間に車体の通れる隙間がないときは、通れるだけの隙間を costmap に作る）の扱い（分岐側の説明）：NavFn が通れなくするのは
      inscribed（縁から約 0.24 m）までで、その外の 1.0 m（PRM-72）は高いコストでも通れる。経路がふさがるのは隙間が約 0.48 m 未満のときだけで、車幅 0.60 m では元々通れない。そのため、条件つきで膨らみを削る仕組みはすぐには作らない。条件の意図は受入の条件「禁止の範囲どうしの間で、車体が通れる隙間が経路から消えないこと」（TS-47）として残し、VM で困ることが分かったときだけ作る。追加：保存のときに、禁止の範囲どうしの隙間がしきい値未満の所を警告し地図に示す（保存は拒まない。DEC-215 と同じ）。しきい値は実測 DEC-229（仮の値 1.0 m、確定は tbd）。見込み（推測、未測定）：まっすぐ通れる最小の隙間は約 0.8〜0.9 m（車幅 0.60 m＋格子の丸め＋追従の誤差）、曲がるなら約 1.3 m 以上（旋回の直径は約 1.24 m）。分岐側が示した確認点で、人が個別には答えていないもの：狭い所で禁止の格子は削らない、対象は禁止の範囲どうし、作った隙間のコストの扱い（実装の前に人に確かめる）。TS-47 の期待：迂回して最後まで着くこと、狭い隙間の試験の追加。転記の出所は分岐セッション（local_1a9b7863…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（DEC-106）。
