  kind: approval
  status: answered
  asked_on: '2026-11-07'
  answered_on: '2026-11-07'
  channel: chat
  question: >-
    （第241便）ゴールの到達判定で向きを問わない設定（/config で変更可）を製品に入れてよいか。AI の提示：到達判定は位置 0.25 m と向き 0.25 rad の
    両方を求め、waypoint の向きはすべて 0。下限つき（PRM-162）はその場で回れず、模擬で 6 本中 4 本がゴールを通り過ぎて走り続けた。
    向きの許容を 6.3 rad にした模擬（試験専用の上書き）は、曲がり角 1/1・直線 1/1 でゴールで止まった。失うものはゴールでの車体の向きの保証。
    選択肢は「入れて」「先に議論する」。
  answer_verbatim: |
    入れて
  affected_refs:
  - ND-10
  - IFD-54
  - PRM-162
  resulting_refs:
  - PRM-163
  note: >-
    直前の人の発言（原文）：「下限を外したら弊害が出る。一時停止線でも止まれないのか？」「なぜ止まれないのか、私も一緒に考えるから、現状の実装を説明せよ。」。
    6.3 rad は模擬で試した値（向きの差は最大でも π なので、常に満たす）。一時停止線で止まる処理（#81、#52）はこの変更に含まない（製品に未実装）。
    最後の waypoint でその場で回る問題（TRB-008）も、この値では起きなくなる見込み（模擬の本数は少ない）。第241便。
  disposition: answered
