  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【承認】setup.sh が ~/.bashrc の末尾に、印の行で囲んだ数行を一度だけ足す（もう一度 setup.sh を実行しても増えない）。
    中身は、/opt/ros/jazzy/setup.bash を読む、ワークスペースの install/setup.bash があれば読む、端末がホームのフォルダで始まったときだけ tsukuba-autonomous-robot に cd する。
    パスは setup.sh が自分の置き場所から求める（~/gouda_ws の決め打ちにしない）。
  answer_verbatim: ''
  affected_refs:
  - DEC-439
  resulting_refs: []
  note: >-
    確認した事実（x86 の車載 PC、読み取りだけ、2026-11-07）：~/.bashrc の先頭は対話でないシェルで return する（Ubuntu の既定）。ログインのシェルは bash。
    このため足す行は対話の端末（画面の端末、ssh でログインした端末）だけで効き、ssh でコマンドだけを送る場合やスクリプトには効かない。
    ホームで始まったときだけ cd する理由：ファイルの画面から「端末で開く」で別のフォルダを開いた時に、そのフォルダを保つため。
    gouda.sh・setup.sh・試験のスクリプトは自分で setup.bash を読むので、振る舞いは変わらない見込み（読み直しても害はない、未確認）。
    欠点：ワークスペースを読んだ端末で colcon build すると、colcon が自分の install が環境にある旨の警告を出すことがある（動作は変わらない見込み、未確認）。
    代替：ROS の読み込みだけ（cd はしない）、gnome-terminal の設定で最初のフォルダを決める（画面の端末だけに効き、ssh には効かない）。
    先行事例：ROS 2 Jazzy の公式の手順（Configuring environment）が ~/.bashrc に source を足す方法を示す。
    決まらない場合に止まる作業：setup.sh の変更と README の追記。
  disposition: open_human
