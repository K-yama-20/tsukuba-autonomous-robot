# 変更セット REV-046（2026-10-14 第26便: 実機の地図作成の試験 2 回目（同じ廊下、二往復）の AI による判定の記録）
# 適用: design/tools/apply_revision.py REV-046
id: REV-046
date: '2026-10-14'
summary: >-
  2 回目の試験（Gouda は 1 つ、/config に取付位置あり）。AI の判定: 原図（GLIM の 3D 地図）は往復で整合している（四つの区間 30.8〜32.7 m、折り返し点の差 0.8〜1.1 m、軌跡の横の広がり 0.12 m、
  submap ごとの壁の位置の差 0.15 m 以内、出発点から 2.4 m で終了）。ただし軌跡と床が廊下の向きに 4.15 度一様に傾いている（廊下が水平なら地図の傾き。人に確認）。
  床より下に点が 4109 点（全体の 12 %）あり、廊下の幅の中に壁に沿って並ぶ（光沢のある床での反射と推定）。このため地面の推定（下側の包絡）が実際の床より約 1.9 m 低くなり、
  分析用の 2D 変換は不合格（廊下の中が障害物で埋まり、空きのセルが少ない）。地面の推定の欠陥を問題 G-FLOOR-REFLECTION として登録。ゴミ箱の位置は判定できていない（人に位置を確認）。
  GLIM が処理した周期は 4.37 Hz（0.5 s 超の欠け 37 回）。rosbag は記録されていない。
basis_refs: [DEC-099, DEC-100, DEC-093]
intent_version_copy: design/baselines/intent_history/intent_v9_183f8ee16455.md

