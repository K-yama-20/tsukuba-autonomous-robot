  question: >-
    （第187便）/dev タブと車体試験の実装、x86 の更新の人の指示
  answer_verbatim: |
    テスト用プログラムを作成せよ。gouda_monitorに/devタブを作成し、そこから試験を実行できるようにせよ。今後も様々な車体テストを行うと思うが、多くはここで実施しようと思う。新しいチャットを作って、そこで実装を開始せよ。
    x86にはssh接続してあるので、x86のアップデートまでやってね
