  disposition: answered
- id: DEC-412
  kind: approval
  status: pending
  asked_on: '2026-11-03'
  answered_on:
  channel: chat
  question: >-
    【承認】車体試験の指令の経路。手動走行のモードで ND-20 が vehicle/joystick_command（IFD-16）へ直接出し、試験の間だけ vehicle_bridge を活性にしてよいか。手動走行で PC が COMMAND を送るのは、これまでの設計（ND-11 は手動走行で発行しない）に対する例外になる。
  answer_verbatim: ''
  affected_refs:
  - IFD-16
  - ND-11
  - ND-12
  - RQ-I063
  - DEC-171
  resulting_refs: []
  note: >-
    推奨：この経路（実装済み、人の指示の範囲で試験だけで使う）。理由：motion_hold は手動走行で常に true で、自律走行のモードは Nav2 ごと起動する。不感帯の補償は軸ごとで T の測定を歪める。下流の bridge・ファーム・DAC・車体は実走と同じ。代替：自律走行のモードの中で cmd_vel に出す（Nav2 と競合、補償を切る必要あり）。
    振る舞いの違い：motion_hold を通らない。手動の優先は ESP32 のままで、受信途絶の中立も PRM-09・ファームのまま。止まる作業：回答まで実車の試験の実行は人の判断。
  disposition: open_human
