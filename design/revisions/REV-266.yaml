  note: >-
    伝達の経路：人の発言は監督役のセッションで行われ、そのセッションが原文を引用してこの便に渡した。この記録の AI はその発言を直接は見ていない。
    AI の解釈：後半は MID-360 の取り付けの位置・姿勢を /config で設定できるようにする実装への yes（DEC-106。監督役の解釈と同じ）。前半は内蔵 IMU の frame の値を
    公式資料で確かめよという指示で、値は ND-20 の interpretation に出典つきで書いた。TF を出すかは振る舞いの変更なので DEC-486（承認待ち）にした。
    自律判断（承認済みの指示の範囲。後から戻せる）：(1) 取り付けの置き場所は /config に一本化し、mid360.json はアドレスだけを読む。理由：二か所にあると、
    画面の値と使われる値が食い違いうる。アドレスを /config に入れないのは、/config の値が DecisionEvent の settings（log/decision。rosbag の -a に入る）と
    地図ごとの /config の写しに入るため。(2) 両方に値があるときは /config を使い、mid360.json の取り付けの鍵は読まない。ND-13 の記録（static_tf_published の
    details 'mid360'）と launch の log に、鍵が残っていること・/config と同じ変換か違うかを出す。/config がそろっていなければ「/config に入れる」と出す。
    (3) 移行：自動では写さない（人の値を AI が別の場所へ動かさない）。REV-242 の形の mid360.json だけでは、この変更の後は MID-360 の経路が起動しない
    （/config がそろうまで XT-32 だけ。DEC-457 と同じ向き）。車載 PC に mid360.json があるか・中身は、この便では確かめていない（車載 PC に触れない指示）。
    第217便の記録では mid360.json の作成は「未実行（人）」。(4) 既定値は入れない（UNKNOWN）。XT-32・IMU・GNSS の中立の値の規則（DEC-122）は MID-360 に
    広げない。(5) 画面：保存していない入力をタブの遷移で保つ（再読込では消える）。XT-32 などの欄にも同じく効く。(6) DEC-457 の question・note の
    「mid360.json に入れる値」は、この記録から「/config に入れる値」と読む（DEC-457 は書き換えない）。第242便。
