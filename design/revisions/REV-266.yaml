  asked_on: '2026-11-07'
  answered_on: null
  channel: chat
  question: >-
    【承認】ND-13 が MID-360 の内蔵 IMU の frame の静的 TF（mid360_link → livox_frame）を出すか。推奨は「出す。mid360_link を出すときだけ、
    移動は公式の IMU の位置（x 0.011 m・y 0.02329 m・z −0.04412 m）、回転なし」。
  answer_verbatim: ''
  affected_refs:
  - ND-13
  - IFD-20
  - ND-20
  - DEC-457
  - DEC-485
  resulting_refs: []
  note: >-
    事実：IMU の加速度・角速度の軸の向きは点群の座標と同じ。IMU のチップの位置は点群の座標で x 11.0 mm・y 23.29 mm・z −44.12 mm（Livox Mid-360 User Manual
    v1.2（2024.04）PDF 17 ページ（印刷 15）「IMU Data」。リポジトリの外の公式資料 Sensors/MID-360/official/Livox_Mid-360_User_Manual_EN.pdf、sha256 3f202c84…）。
    ドライバ（2144554）は IMU の header.frame_id を文字列 livox_frame に固定し（lddc.cpp 481 行）、点群は parameter frame_id（Gouda は mid360_link。lddc.cpp 263 行）。
    今の ND-13 は livox_frame を出さない。Gouda の node で /livox/imu を購読するものはない（docs/mid360_driver_interfaces.md 3 章。rosbag の -a には入る）。
    推奨：B 出す。ND-13 が mid360_link を出すときだけ、mid360_link → livox_frame を、移動は上の公式の値（m）、回転なし（軸は点群と同じ）で同じ /tf_static に入れる。
    理由：値は機器の中の固定の事実で、実測も推測も要らない。記録（rosbag の -a）に入る IMU を、後から TF で車体に置ける（DEC-457 の取り付けの確かめに記録を使う場合）。
    走行には効かない（livox_frame を使う node がない）。TF の発行元は ND-13 のまま（RQ-I058）。人の指示「IMU の frameは公式資料を探して値を見つけよ」に沿う。
    代替：A 出さない（IMU を使うと決めるまで足さない。REV-260 の DEC-478 の推奨。足す物が少ない）。C 出すが移動 0（軸だけ。加速度の腕の長さの分が違う）。
    D frame_id を付け替える変換の node・fork を使い、その frame を出す（DEC-477・478 の代替。上流は改変しない：DEC-075）。
    振る舞いの違い：B・C は /tf_static の frame が 1 つ増える（mid360_link がないときは増えない）。A・D は今と同じ。どれも costmap・走行は変わらない。
    気づき：DEC-478（REV-260、未適用・承認待ち）は同じ問いで推奨が A。この便の推奨が B なのは、人の指示（DEC-485）が IMU の frame の値を求めたため。どちらかに答えが
    あれば両方を閉じる。加速度は g のまま（m/s² ではない。プロトコルの単位 g、ドライバは単位を変えずに写す：lddc.cpp 493〜495 行、上流 src/comm/pub_handler.cpp）
    なので、TF を出しても /livox/imu をそのまま使うことはできない（DEC-477）。
    決まらない場合に止まる作業：/livox/imu を TF で車体に置く解析・利用。走行と MID-360 の層は止まらない。第242便。
  disposition: open_human
