summary: >-
  第242便：人の指示「IMU の frameは公式資料を探して値を見つけよ。また、本体取り付けの位置はgouda_monitorの/configで設定できるようにせよ。」（DEC-485）で、
  MID-360 の取り付け（base_link → mid360_link の x・y・z・roll・pitch・yaw と軸の向き）を、XT-32 と同じ /config（IFD-26）の「センサ取付・座標方向」の 7 項目
  （mid360_mount_x_m・_y_m・_z_m・_roll_rad・_pitch_rad・_yaw_rad・mid360_axis_mapping）にする。既定値は入れない（UNKNOWN）。XT-32 と違い中立の値で埋めず、
  7 項目がそろうまで ND-13 は mid360_link を出さず、Nav2 の launch は MID-360 の経路を起動しない（DEC-457 のまま）。車載 PC の mid360.json（IFD-61）は
  アドレスだけを読む。REV-242 の形で残った取り付けの鍵は読まず、ND-13 の記録と launch の log に「読まない・/config と同じか違うか」を出す（写しはしない）。
  /config の画面は保存していない入力をタブの遷移で保つ（intent.md:106）。内蔵 IMU の frame の事実（公式資料と上流のソース）を ND-20 に出典つきで書き、
  mid360_link → livox_frame の静的 TF を出すかは DEC-486（承認待ち）にする（実装しない）。
