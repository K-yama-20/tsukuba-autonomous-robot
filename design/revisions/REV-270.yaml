- id: DEC-490
  kind: approval
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【承認】蛇行と遅れて出るコーンへの接触を減らすため、MPPI の速度と旋回の模型を次の値にするか。
    vx_max（PRM-131）0.8 → 0.5 m/s、wz_max（PRM-132）1.0 → 0.5 rad/s、
    velocity_smoother の最大の旋回の速さ（PRM-67）1.0 → 0.5 rad/s、旋回の加速度（PRM-73。MPPI の az_max と velocity_smoother の両方）2.0 → 0.5 rad/s²。
    あわせて、速度の帰還の層は前後だけにする（/config の turn_kp・turn_ki を 0）。
  answer_verbatim: ''
  affected_refs:
  - PRM-131
  - PRM-132
  - PRM-67
  - PRM-73
  - ND-10
  - ND-11
  resulting_refs: []
  note: >-
    推奨：上の値（模擬の「vx0.5 B」）。理由（模擬、各 2 本）：遅れて出るコーンの最小の間隔は、今の旋回の模型 A では 0.05〜0.16 m（vx 0.8 では接触）だった。
    B では 0.51〜0.53 m（vx 0.4・0.5）、接触 0/6。人の場面の間隔は 0.63 m。free の経路は 80 s（vx 0.4 は 98 s）。旋回の PI を止めると直線の蛇行は 0。
    実測（DEC-445）の旋回の立ち上がり（0.19 rad/s まで約 2.4 s）に近い模型にすると、MPPI が早めに大回りして避ける（推測）。
    代替案：(a) vx_max 0.4＋B（間隔は同程度、20〜30% 遅く、人の場面で大回り 1.9 m）、(b) vx 0.6＋B（コーンに 1/2 接触。採らない）、
    (c) az 0.3・wz 0.4（C。間隔の改善は小さく、横ずれ 2.2〜2.4 m で、1.8 m の通路を外れるおそれ）。
    振る舞いの違い：最高速度が下がる。曲がり方がゆっくりになり、角と回避で大回りする。PRM-73 は velocity_smoother と共有なので、手動以外のすべての自律走行の旋回の加速度が変わる。
    条件：DEC-491（区間の速度の制限）を同時に決めないと、vx_max を下げても遅くならない。
    決まらない場合に止まる作業：実車で速度の帰還の層を有効にした走行（模擬では、今の値の組で遅れて出るコーンに接触した）。
    模擬だけで、車体モデルの前進の傾き・前後の時定数・指令の遅れは実測ではない。安全かどうかの判断は人（CLAUDE.md 1.12）。
- id: DEC-491
  kind: approval
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【承認】waypoint の区間の速度の制限が MPPI の vx_max より大きいと、MPPI が vx_max・vx_min・wz を同じ倍率で引き上げる（上流の 1.3.13 の setSpeedLimit、
    Gouda の速度マスクは絶対値の type 2）。これをどう扱うか。
  answer_verbatim: ''
  affected_refs:
  - PRM-131
  - PRM-132
  - PRM-162
  - ND-10
  - DEC-480
  resulting_refs: []
  note: >-
    推奨：(1) まず運用で、走行に使う waypoint セットの区間の制限を vx_max と同じ値（DEC-490 なら 0.5 m/s）以下にする（コードの変更なし、今夜できる）。
    (2) そのあと、区間の制限を vx_max で頭打ちにしてからマスクに塗る変更（speed_mask.py）を別に承認にかける。
    理由：模擬で、区間 1.25 m/s・vx_max 0.4・vx_min 0.27 のとき、MPPI の指令が約 0.845 m/s（0.27×1.25/0.4）に張り付いた。0.63〜0.72 m/s で走り、人の場面で接触した。
    別のセッションの確認走行区間の模擬でも、vx_min が 0.42 m/s（0.27×1.25/0.8）に上がり、コーンの前で止まれなかった（そのセッションの報告）。
    代替案：速度マスクを type 1（vx_max に対する割合）にする（waypoint の区間の値の意味が変わる）。PRM-162 の vx_min の見直しは、DEC-480 の側で人が判断する。
    振る舞いの違い：(1) は区間の制限が実際の上限になる（今は、区間の制限が vx_max より上なら、vx_max が効いていない）。
    決まらない場合に止まる作業：vx_max を下げる変更（DEC-490）の効果。issue は K-yama-20/tsukuba-autonomous-robot#92。
