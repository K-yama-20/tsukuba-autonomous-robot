  question: >-
    【承認】推定が戻ったときの扱い：(1) 回復の判定は、NDT が姿勢を出し NVTL が PRM-90 以上、NDT の姿勢の動きが同じ時間の GLIM の動きと δ 以内で合い、
    推測の姿勢との差が予算 e0＋ε×（推定不能の間に進んだ距離）の中、を連続 N 回満たすこと。予算の外なら疑わしい回復として受け入れない。
    (2) 差が J 以下なら map→odom を速さ v_c・角速度 ω_c を超えないように寄せ、J を超えるなら止まってから一度に直し、残りの waypoint へ goal を出し直す。値は tbd。
  answer_verbatim: ''
  affected_refs:
  - DEC-342
  - DEC-346
  - ND-07
  - ND-03
  - IFD-18
  resulting_refs: []
  note: >-
    推奨は承認。理由：今は NDT が戻ると EKF が取り込み、map→odom がずれの大きさだけ短い時間で動く。Nav2 の controller（Regulated Pure Pursuit）は map の経路を
    odom に直して追うので、map→odom が跳ぶと経路が横にずれて急に曲がる（推測）。止まっている車体に段差を与えても動きには出ない。誤った所への回復を、予算の外として拒める。
    代替案：段差をそのまま受け入れる（今の作り）、いつも止まって直す（滞留が増える）。新しい値 N・δ・J・v_c・ω_c は DEC-354 で実測。提案 §5。
    決まらない場合に止まる作業：回復の判定と戻し方の実装。
  disposition: open_human
