- id: DEC-350
  kind: approval
  status: pending
  asked_on: '2026-10-23'
  answered_on:
  channel: chat
  question: >-
    【承認・方針】推定不能の間の補い方を次にするか：新しいフィルタ（IMU による予測、因子グラフ）は今は足さない。推定不能の原因の区分で扱いを分け、
    入力の途切れ（GLIM も止まる LiDAR のリンク断）は止まって待つ。照合の質の低下（NVTL の低下・NDT の姿勢の欠け・NDT と GLIM の食い違い）と計算の詰まりは、
    map→odom を最後の信頼できる値に固定して GLIM の odometry で進み、距離 D・時間 T（tbd）を超えたら止まって回復を待つ（DEC-342 の案 c の具体化）。
  answer_verbatim: ''
  affected_refs:
  - DEC-342
  - DEC-306
  - DEC-340
  - ND-07
  - ND-03
  - ND-08
  - TR-07
  resulting_refs: []
  note: >-
    推奨は承認。理由：車輪のエンコーダがなく GNSS も今は使えないので、新しいフィルタを足しても使える情報は増えず、ずれは小さくならない。調整の値が増え、共分散の誤りで
    静かにずれる危険が増える（人の懸念と同じ）。今の作りでも NDT が止まると EKF は GLIM の速度で予測しており、ずれは GLIM とほぼ同じ。GLIM の odometry のずれの下限は
    50 m あたり p95 で 0.06〜1.18 %（4 回の地図作成、FILE-GLIM-ODOM-DRIFT-OUTPUT。基準は真値でなく下限）。止まっている間は GLIM はずれない（第125便の記録）。
    LiDAR のリンク断は 2.7〜4.2 s（2026-10-14 の記録、2026-10-17 の検証の rosbag）で、その間は GLIM も止まるので、止まって待っても失うのは数秒。
    固定する理由：NDT は収束しないと姿勢を出さない（autoware_core 1.9.0 ndt_scan_matcher_core.cpp:742）が、収束したと判定した誤った姿勢は EKF に取り込まれる。
    EKF の棄却は 2 乗でない距離と pose_gate_dist 49.5 を比べる（ekf_module.cpp:302-306、mahalanobis.cpp）ので、49.5σ を超えるまで棄却せず、実質ない。固定すれば使っているものが二値で記録に残り、再生で再現できる（intent のデバッグ性）。
    代替案：今のまま EKF の予測に任せる、IMU の予測で進む（robot_localization）、因子グラフ（fuse、apt にある）。NDT の共分散の推定（上流の covariance_estimation_type）は
    段階 2 として、評価（DEC-354）の後に別の承認で出す。新しい値 D・T は DEC-354 で実測。提案 localization_gap_bridging_2026-10-23.md §4・§7。
    決まらない場合に止まる作業：原因の区分ごとの扱いの実装。DEC-305・342 が前提（待機に入らない）。
  disposition: open_human
- id: DEC-351
  kind: approval
