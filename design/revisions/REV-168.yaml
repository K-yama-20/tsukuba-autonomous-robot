  - PRM-91
  - PRM-92
  resulting_refs: []
  note: >-
    推奨は承認。D は「コースの横の余裕 M」と実測のずれの割合 ε から D＝(M−e0)/ε とする案（M は場所で違う。規則の「大きく離れる」は数値が未定義：Q-G8）。
    EKF の共分散（PRM-92）は、GLIM の実際のずれから求めた値ではない（PRM-82・83 は固定値）ので、ずれの大きさの目安に使わない。
    重大な注意：どれも位置が正しいことの証明ではない。NDT が誤った所に収まり GLIM の動きとも合う場合は検出できない。検出できるのは絶対の手がかり（RTK の GNSS、DEC-290）か人だけ。
    代替案：予算だけ（見張りなし）、見張りだけ（予算なし）。提案 §6。決まらない場合に止まる作業：上限と見張りの実装。
  disposition: open_human
