  note: >-
    推奨は承認。理由：人の発言（DEC-340）の「時間がたつと推定できるようになる」に加えて、ずれが大きくなって NDT の初期値の範囲を外れた場合にも戻れる。
    危険：似た形の場所での誤った回復。止まっているときだけ行い、回復の判定を厳しくする。探索の間は計算が重い（VM で初期化の探索中 NDT が 185〜218 %、第123便の top）。
    探索の広さは予算から決める。代替案：再初期化しない（戻るまで待つだけ）、人が初期姿勢を与える（本番では操作が失敗になる：DEC-345）。提案 §7。
