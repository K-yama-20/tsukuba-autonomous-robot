  question: >-
    【承認】ずれたまま走ることへの備え：(1) 推定不能になってから進んだ距離 D・時間 T（止まっている時間を除く）の上限を超えたら必ず止まる、
    (2) 正常の間も、短い時間の NDT の動きと GLIM の動きの差が δ を超えたら NDT を信じない（推定不能と同じ扱い）、
    (3) 食い違いが続きどちらが狂っているか分からないときは止まって確かめる（止まっていれば GLIM は動かない）。値は tbd。
  answer_verbatim: ''
  affected_refs:
  - DEC-342
  - DEC-286
  - ND-07
  - PRM-89
