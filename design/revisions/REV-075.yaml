- id: DEC-144
  kind: approval
  status: pending
  asked_on: '2026-10-19'
  answered_on: null
  channel: chat
  question: '【承認】受信機を 2 本のアンテナで動かす設定。(a) まず読むだけの照会 help, setFrontendMode で firmware 1.1.1 の値の一覧を確かめる（USB2、mrtk relay）。(b) 一覧に DualAnt があれば、Gouda を止めてから sfm, DualAnt → exeCopyConfigFile, Current, Boot → exeResetReceiver, Hard, none を送る（設定の変更・Boot 保存・受信機の再起動）。(c) 屋外で MeasEpoch に副アンテナ（番号 1）の観測があり、AttEuler の mode が 0 でないことを確かめる。'
  answer_verbatim: ''
  affected_refs:
  - ND-19
  - G-GNSS-NO-HEADING
  - DEC-140
  resulting_refs: []
  note: 推奨は (a) の後に (b)（Hardware Manual §4.2.3.2 の手順そのもの）。振る舞いの違い：DualAnt では副アンテナの入力を使い、方位（IFD-49・50）が出うる。Hardware Manual は DualAnt で副アンテナを開放にしないこと、前置増幅の利得の上限と 2 本の差 5 dB 以内を求める（今のアンテナの利得は原本未照合）。人の資料 §6 の Boot 保存の別工程に当たる。ドライバ（configure_rx true）は起動のたびに eccf, Current, Boot を送るので、Current の値はいずれ Boot に入る。代替案：Nominal のまま（方位は出ない。較正 DEC-135 の取付 Yaw・方位の観測が使えない）。決まらない場合に止まる作業：方位の確認、方位を使う較正の検証。
  disposition: open_human
