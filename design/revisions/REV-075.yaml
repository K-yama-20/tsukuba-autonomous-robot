  note: 指示の原文（前のメッセージ）「mainとauxのアンテナを入れ替えたところ、mainのみ受信できた。よって、アンテナやケーヴル自体に問題は無いと考えられる。mosaic-go g5 p6のマニュアルを参照して、mrtklibを使って動作確認をせよ。mrtklibはvmにいれてある」。送ったのは 4 つの照会と最初の CR だけ。生の記録は VM の ~/gnss_records/ にだけ置いた。
