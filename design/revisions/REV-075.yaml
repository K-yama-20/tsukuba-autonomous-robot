summary: 人が main と aux のアンテナを入れ替えても main 側だけ受信（アンテナ・ケーブルは正常）。Septentrio の Reference Guide 1.0.1 と Hardware Manual 1.1.1 を読み（FILE-MOSAIC-DUAL-ANTENNA-NOTE）、人の許可（DEC-143）で MRTKLIB の mrtk relay から USB2 に照会だけを送った（FILE-MOSAIC-MRTK-QUERY）。能力は Main+Aux1、許可は 2 本のアンテナと方位、方位の計算は MultiAntenna, Fixed。frontend mode は Nominal（マニュアル 1.0.1 の値 SingleAnt・DualAnt にない。意味は原本未照合）。2 本で動かすには setFrontendMode DualAnt を Boot に保存して再起動する（Hardware Manual §4.2.3.2）。その変更を承認事項 DEC-144 にした。
