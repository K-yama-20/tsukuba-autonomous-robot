modifications:
- id: ND-08
  set_nested:
    ros_node.lifecycle: plain_node
    ros_node.process_group: gouda_core
    ros_node.responsibilities:
    - 局所的な車体速度・角速度・姿勢の推定と odom→base_link TF の発行（自律走行・一時停止で単独の発行者。TF を出すのは GLIM で、中継の node は TF を出さない）
    - nav_msgs/Odometry の公開（Nav2 controller の odom 入力、記録）
    - '構成（DEC-123）: GLIM（ND-06 と同じ実行ファイル）を odometry だけの設定（enable_local_mapping・enable_global_mapping を false、map_frame_id=odom、odom_frame_id=odom_glim、base_frame_id=base_link、publish_imu2lidar=false）で、TR-05 で ND-03 が起動する'
    - 中継の node（gouda_local_odometry）は通常の node で、gouda_core.launch.py が常に起動する。/tf の odom_glim→base_link を受けるたびに、最新の odom→odom_glim と合成した odom→base_link の姿勢と、直前の 2 つの姿勢の差から求めた車体の速度で IFD-25 を出す（odometry_core）。GLIM が止まっている間（手動走行・事前地図作成）は何も出さない（姿勢を作らない）。DEC-182
    - TF の木は map →（ND-07）odom →（GLIM、単位行列）odom_glim →（GLIM）base_link。base_link の親は一つ。地図作成の GLIM とは同時に動かさない（RQ-I004）
    ros_node.placement_rationale: 3 案（A・A3・B）に共通（提案 localization_selection.md §3、DEC-123）。ND-07 と別に作る。GLIM の起動・停止は ND-03 が行う（地図作成の GLIM と同じ glim_runner）。中継の node は常に起動しているが、自律走行の外では Nav2・ND-11・ND-12 が止まっているので車体の指令は生まれない（DEC-182）。lifecycle 化と作り方の見直し（A3 の EKF と役割が重なるか）は ND-07 の設計のときに必要なら判断する。
  interpretation_append: REV-119（DEC-182、A1 案 1）：lifecycle を plain_node、process_group を gouda_core、作り方を実装（/tf の odom_glim→base_link と、直前の 2 つの姿勢の差による速度）に合わせた。以前の記述の「GLIM の ~/odom と IMU の角速度から作る」は実装されていない。
- id: ND-10
  set_nested:
    ros_node.responsibilities:
    - 経路計画・追従・後退・再計画・通過／到達判定（RQ-I011・RQ-I018・RQ-I019）
    - NavigateThroughPoses action の提供（IFD-13）と cmd_vel の発行（IFD-15。velocity_smoother を経た後の値）
    - costmap の SpeedFilter による SpeedLimit の発行と controller への適用（IFD-14、DEC-031）。mask・filter info は標準 server で配信（IFD-42）
    - map_server による静的地図の提供（IFD-24）
    - 設定・プラグイン・BT で拡張し本体は改変しない（RQ-I056・RQ-I057）
    - '構成（DEC-122）: controller は Regulated Pure Pursuit、planner は NavFn、BT は上流の navigate_through_poses_w_replanning_and_recovery.xml の写しに PRM-11・PRM-18 を入れたもの、behaviors は spin・backup・wait、velocity_smoother を使う、collision_monitor は使わない（RQ-I072）、cmd_vel は TwistStamped（PRM-12）'
    - 障害物は XT-32 の点群（IFD-21）を local の VoxelLayer・global の ObstacleLayer に直接入れ、高さの帯（PRM-70・PRM-71）で地面と頭上を除く。track_unknown_space を true にして観測していない所を空きとみなさない（RQ-I012、DEC-122）
    - 設定は上流の nav2_bringup の nav2_params.yaml を雛形に、plugin の選択、frame・topic（IF の名前）と PRM の値だけを差し込んで起動時に作る。雛形のその他の値は変えない。実車の設定（trial なし）で PRM-11・17・18・66〜73 のどれかが未確定なら Nav2 を起動せず理由を記録する（RQ-I076、intent.md:85）
    - 起動する server（gouda_nav2.launch.py。DEC-183 で名前を補足）：map_server（静的地図、IFD-24）、filter_mask_server（速度マスク用の map_server、IFD-42）、costmap_filter_info_server（IFD-42）、controller_server、smoother_server、planner_server、behavior_server、bt_navigator、velocity_smoother、lifecycle_manager_navigation（autostart false。ND-03 が IFD-36 で起動・停止）
  interpretation_append: REV-119（DEC-183、A2 の (4)）：起動する server の名前（smoother_server・filter_mask_server・costmap_filter_info_server・lifecycle_manager_navigation を含む）を責務に補った。振る舞いは変えていない。
