decisions:
- id: DEC-392
  kind: approval
  status: answered
  asked_on: '2026-10-24'
  answered_on: '2026-10-24'
  channel: chat
  question: >-
    （第161便）gouda_monitor の CPU を減らすか。M1：executor を MultiThreadedExecutor(4) から SingleThreadedExecutor にする（同じ購読の probe で 69 % → 16 %）。
    M2：SSE で画面へ送る回数を抑える（ESP32 の STATUS 20 Hz のたびに約 63 KB の snapshot を送り 24 回/s。PRM-49 は変えず、表示の側で間引く）。
  answer_verbatim: |
    M1,M2の推奨案を採用。また、monitorの更新周期を5Hzくらいに下げてみることも検討
  affected_refs:
  - ND-02
  - PRM-49
  resulting_refs:
  - PRM-104
  - ND-02
  note: >-
    採用したもの：M1（SingleThreadedExecutor。HTTP の thread が待つ future は主の thread の spin で進む）と、M2 のうち「表示の側で間引く」を、人が挙げた 5 Hz で
    実装した（PRM-104＝5 Hz。送る頻度の上限。間の変化はまとめて最新を送るので、変化は落とさない）。PRM-49（ESP32 の STATUS 50 ms、DEC-169）は変えていない。
    M2 の (a) ESP32 の STATUS で表示が変わらないときは送らない、は採らなかった：STATUS には毎回変わる値（経過時間・uptime）があり効果が小さい。(c) 地図・routes の一覧を
    変わったときだけ送る、も採らなかった：snapshot 約 63 KB のうち 46 KB は decision の一覧で、地図・routes は約 9 KB。5 Hz は人が「検討」と言った試しの値で、
    VM での CPU の計測の後に見直す。
  disposition: answered
