id: REV-182
date: '2026-10-24'
summary: >-
  第162便：第161便の調査（gouda_monitor が CPU 83〜91 %、画面の全体を 24 回/s 送る、MultiThreadedExecutor が重い）の案を、人の指示
  「M1,M2の推奨案を採用。また、monitorの更新周期を5Hzくらいに下げてみることも検討」で実装する。M1：monitor の executor を SingleThreadedExecutor にする。
  M2：SSE で画面へ送る snapshot を最大 5 Hz に間引き、その間の変化はまとめて次の snapshot で送る（新しい PRM-104）。第161便の証拠も登録する。
