# 変更セット REV-008（2026-10-09 第4便: AR-004 受理、重複時の上限規則、復帰手順の一本化、マスク状態の記録、車体出力段階の時間値の確定、優先順位）
# 適用: design/tools/apply_revision.py REV-008
id: REV-008
date: '2026-10-09'
summary: >-
  AR-004 を設計上受理。重複時は低い上限（再訪・重複ルートは同じ値を採用）で Speed Filter を設計し H-011 を解消。復帰手順を cleanup→configure→activate の 1 つに定め H-001 を解消、
  TS-06 を 2 経路・controller の実保持上限の一致で判定。マスク外・未読込で何も発行されない状態を区別して記録・表示（SO-01 speed_limit_application_state、TS-15）。
  ESP32 watchdog 1 s（最後の有効指令から）、cmd_vel 途絶 700 ms、Bluetooth 途絶 250 ms（既存動作を維持）を承認値として確定し H-009 を解消。低速帯進入試験 TS-16 を追加。
basis_refs: [DEC-044, DEC-045, DEC-046, DEC-047, DEC-048, DEC-049]

decisions:
  - id: DEC-044
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: AR-004 の完了条件（DEC-041）に対する受理
    answer_verbatim: 'AR-004：設計上の対応としては受理する。AIには、DR-15の各検出項目と試験の対応、正当な設定を誤検出しないことだけを示せば十分。'
    affected_refs: [RQ-I076]
    resulting_refs: []
    note: 検出項目と試験の対応表、正当な設定の非検出試験は rules/README.md と test_check_design.py（test_legitimate_settings_not_flagged）。
  - id: DEC-045
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: H-011 再訪・重複する区間の上限の扱い
    answer_verbatim: |
      再訪・重複するルートがあったとしても、速度設定値は同じものを採用する。
      Speed Filterを、重複時は低い上限を適用する前提で設計する。
      境界の細かな揺らぎは実機調整に回し、独立した人の判断事項としては増やさない方針で進めよ。
    affected_refs: [H-011, IFD-41, IFD-14]
    resulting_refs: [IFD-41, TS-14]
    note: 重複 cell は低い方の上限。再訪・重複ルートの区間には同じ値を設定する運用。帯幅（PRM-19）は tbd のまま、帯外は Nav2 の挙動（無制限）。境界の揺らぎは実機調整（TS-16）とし新しい人の判断事項にしない。
  - id: DEC-046
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: H-001 復帰後の再適用（(a)(b) の最終判断）と TS-06
    answer_verbatim: |
      採用する復帰手順を1つに定め、TS-06で次の2経路を試せ。
      ・同じセルでのdeactivate→activate
      ・cleanup→configure
      合格条件は発行ログだけでなく、「再走行前にcontrollerが実際に保持している上限」が一致していることである。使わない復帰方式まで網羅的に対応する必要はない。
    affected_refs: [H-001, TR-13, TS-06]
    resulting_refs: [TR-13, TS-06]
    note: Speed Filter（DEC-031）を維持し、採用する復帰手順を lifecycle cleanup→configure→activate の 1 つに定めた（案 (a)）。controller は保持上限を公開しないため、「実際に保持している上限」は再走行前の直線 stub 経路で cmd_vel の最大値を観測して確認する（TS-06）。
  - id: DEC-047
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: マスク外・マスク未読込時に何も発行されない状態の記録
    answer_verbatim: |
      マスク外やマスク未読込のときは何も発行されない。このままでは、上限が効いていないことにmonitorでもログでも気づけない設計不良がある。
      「入力→判断→出力をログだけでたどれる」という受入条件に関わるため、この状態を区別して記録できるようにせよ。
    affected_refs: [IFD-14, IFD-42, ND-03, ND-02]
    resulting_refs: [SO-01, IFD-01, TS-15]
    note: ND-03 が mask・filter info の latched 配信、speed_limit の最終受信値と時刻、ロボット位置が mask 範囲内かを観測し、speed_limit_application_state（適用中／帯外無制限／マスク外・直前値保持／未読込・上限なし／不明）を IFD-01 と DecisionEvent に記録、monitor に表示する。観測のみで発行はしない（単一発行元を維持）。
  - id: DEC-048
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: H-009 車体出力段階の時間値
    answer_verbatim: |
      esp32のwatchdogについては。最後の有効指令受信から1 sで期限切れ。
      cmd_vel途絶から700msが期限。
      Bluetooth途絶の250 msは、PC指令のtimeoutとは別の既存動作である。
      firmwareを書き直すことだけを理由に、一括で撤去するな。
    affected_refs: [H-009, PRM-08, PRM-13, PRM-21, ND-11, ND-17]
    resulting_refs: [PRM-08, PRM-13, PRM-21]
    note: PRM-13（ESP32 watchdog）=1.0 s（最後の有効 PC 指令の受信から）、PRM-08（cmd_vel 途絶）=0.7 s、PRM-21（Bluetooth 報告の途絶）=0.25 s（既存動作を新 firmware でも維持）。承認値として記録。PRM-09（joystick_command の期限）と PRM-14（送信周期）は未確定のまま。
  - id: DEC-049
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-09'
    channel: chat
    question: 進め方の優先順位
    answer_verbatim: |
      次の優先順位で進めて。
      手動優先と、指令途絶時の中立化が成立する入力・時間値を整理する。
      Speed Filterを、重複時は低い上限を適用する前提で設計する。
      採用する復帰手順で、上限の保持・再適用を確認する。
      低速帯への進入試験で、上限指令と実速度を記録する。揺れの幅・継続時間・減速距離が許容範囲なら、それ以上の境界対策は行わない。
    affected_refs: []
    resulting_refs: [TS-16]
    note: 1 は docs/vehicle_output_timing.md、2 は docs/speed_filter_design.md、3 は TR-13・TS-06、4 は TS-16（許容範囲 PRM-22〜24 は実測で決める。新しい人の判断事項にしない）。

