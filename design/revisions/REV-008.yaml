  - id: ND-11
    set_nested:
      ros_node.responsibilities:
        - Nav2 の cmd_vel を EMC-270 のジョイスティック特性に合わせた正規化操作値へ変換（M-012）
        - motion_hold=true、motion_hold の期限切れ、または cmd_vel の途絶 700 ms（PRM-08、DEC-048）・非有限値で中立を出す（DEC-004、RQ-I063）
        - 中立を含む操作値を一定周期で発行し続ける（bridge の送信継続の入力）
        - cmd_vel の後段で独自に速度を抑える処理は加えない（RQ-I020）
  - id: ND-17
    set_nested:
      ros_node.responsibilities:
        - PC からの正規化操作値を受け、DAC（MCP4922）で EMC-270 のジョイスティック相当電圧を出す。リレーによる純正ジョイスティック切替は使わず、給電中は常に DAC が電圧を出す（RQ-I077、DEC-037）
        - 最後の有効な PC 指令フレームの受信から 1 s（PRM-13）で期限切れとし DAC を中立にする（RQ-I068、DEC-048）
        - 手動操作の優先（RQ-I023）。Bluetooth ゲームパッドの操作が有効な間は PC 指令より優先する（経路の確認は DEC-042）
        - Bluetooth 報告の途絶 250 ms（PRM-21）で手動入力を無効にし中立にする既存動作を維持する（RQ-I024、DEC-048）
        - STATUS／EVENT を理由コード付きで PC へ送る（IFD-43。表示・診断のみ、DEC-006）
        - 非常停止の検知・通知は行わない（RQ-I072）
  - id: TR-13
    set_nested:
      transition.actions:
        - 必要な場合だけプロセス再起動（RQ-I013 の依存順序の第1段。不要な故障では省く：RQ-I069）
        - 自律走行への復帰に必要な状態だけを復元（mission_context・remaining_waypoints）
        - 当該 mission に属する旧 Nav2 goal の終了または破棄を確認
        - controller_server／costmap の復帰は lifecycle cleanup→configure→activate の 1 手順で行う（DEC-046）。復帰後、速度マスクと filter info の latched 配信と speed_limit_application_state=適用中 を確認してから motion_hold を解除する
        - 自律走行指令の再許可（新 goal の送信）。自律走行へ復帰する場合に限る（RQ-I069）
        - 各段階の成否を記録。人の追加承認は求めない（RQ-I013）
  - id: TS-06
    set:
      name: 復帰後の上限の保持・再適用（採用手順 cleanup→configure と、同じ cell での deactivate→activate）
    set_nested:
      test.procedure: 自律走行中、ロボットを同じ mask cell に留めたまま、(A) controller_server を deactivate→activate、(B) controller_server を cleanup→configure→activate（採用する復帰手順）、を別々に行う。各経路の後、再走行前に直線の stub 経路で cmd_vel を観測する。
      test.observe: speed_limit の再発行の有無、再走行前の cmd_vel の最大 linear.x（controller が実際に保持している上限の観測値）、speed_limit_application_state、lifecycle のログ。
      test.expected: >-
        合格条件（DEC-046）: 再走行前に controller が実際に保持している上限（cmd_vel 最大値で観測）が、現在 cell の上限と一致すること。発行ログだけでは合格にしない。
        予測: (B) は再生成後の最初の process() で再発行され一致。(A) は再発行されず、deactivate→activate 前の上限が controller 内に残るため、前の値と現在 cell の値が同じなら一致、異なれば不一致。(A) は採用しない復帰方式のため不一致でも設計の不合格にはせず、採用手順が (B) に限定されていることを確認する。
  - id: IFD-41
    set_nested:
      designed_interface.time_semantics: waypoint セット保存時に生成し、同じ由来 ID・内容ハッシュで保存。地図版が変われば再生成。区間の帯の幅は PRM-19（tbd）、速度刻みは PRM-20。重複 cell は低い方の上限（DEC-045。再訪・重複ルートには同じ値を設定する運用）
  - id: IFD-14
    set:
      issue_refs: [Q-06]
    set_nested:
      designed_interface.time_semantics: >-
        costmap の SpeedFilter がロボット位置の mask cell 値から上限を計算し、値が変わったときだけ speed_limit を発行（上流 speed_filter.cpp 242-258 行）。percentage=false、m/s。cell=0 は無制限（停止ではない）。
        mask 未受信・マスク外では発行されない。この状態は ND-03 が speed_limit_application_state として記録・表示する（DEC-047）。復帰は cleanup→configure→activate の 1 手順（DEC-046）。Gouda は SpeedLimit を発行しない（単一発行元：RQ-I020）。
  - id: ND-03
    set_nested:
      ros_node.subscribes_refs: [IFD-12, IFD-25, IFD-33, IFD-39, IFD-14, IFD-42]
      ros_node.responsibilities:
        - 4ソフトモード（RQ-I065）の正本と遷移（TR-01〜TR-16）。内部状態・処理段階（変換中・goal送信中・取消待ち・復旧段階）はモードと混同しない
        - 自律走行の開始・一時停止・再開・終了の受付と、Nav2 NavigateThroughPoses への goal 送信／取消（薄い action client。計画・追従・後退・再計画・通過判定は Nav2）
        - 自律走行開始時に、選択した waypoint セットの速度マスク（IFD-41）を Nav2 の filter info server と mask 用 map_server に読み込ませる（IFD-42）。SpeedLimit 自体は Nav2 の SpeedFilter が発行（DEC-031）
        - 速度上限の適用状態の観測と記録（DEC-047）：mask・filter info の latched 配信、speed_limit の最終受信値・時刻、ロボット位置が mask 範囲内かを観測し、speed_limit_application_state（適用中／帯外・無制限／マスク外・直前値保持／未読込・上限なし／不明）を IFD-01 と DecisionEvent に出す。発行はしない
        - 一時停止・終了・故障・非自律モードでは motion_hold=true を motion_controller へ直接入力（IFD-40、DEC-004）。自律走行中だけ hold=false
        - mission 文脈（地図・waypoint の ID／版／ハッシュ、run_id、残 waypoint、停止理由）の保持と、PC再起動に必要な部分の永続化（RQ-I064・RQ-I069）。区間番号は記録用に feedback から求める（RQ-I030）
        - PC 再起動後の再開は人の初期位置要求（IFD-39）の受理後に限る（DEC-009）
        - 異常終了後の自動復帰の手順（RQ-I013 の依存順序、RQ-I069 の必要状態だけの復元）。復旧不能時は自律走行・一時停止からは一時停止へ、手動走行・事前地図作成では直前モードを維持し理由を記録（DEC-008）
        - 記録の自動開始／停止の契機の発行（RQ-I015・RQ-I017）
        - 判断・理由・走行ID・区間ID付きの DecisionEvent の発行（RQ-I030）
  - id: IFD-01
    set_nested:
      designed_interface.custom_type_reason: モード（4値列挙）・processing_state・run_id・残waypoint数・現在区間番号・停止原因区分・speed_limit_application_state（DEC-047）・state_revision を一つの時刻付きメッセージで表す標準型がない。
  - id: SO-01
    set_nested:
      state_owner.state_items:
        - name: software_mode
          description: 現在のソフトモード（4値：RQ-I065）。内部の処理段階とは別の変数で持つ
          persistence: persisted
          restore_scope: PC再起動時に直前モードを読み、RQ-I064 の規則で復帰先を決める
        - name: processing_state
          description: モードとは別の処理状態（地図変換中・goal送信中・取消待ち・復旧段階）。IFD-01 で表示（DEC-010）
          persistence: volatile
          restore_scope: 再起動で初期化
        - name: speed_limit_application_state
          description: 速度上限の適用状態（適用中（値）／帯外・無制限／マスク外・直前値保持／未読込・上限なし／不明）と最終 speed_limit 受信値・時刻（DEC-047）。観測のみ
          persistence: volatile
          restore_scope: 再起動で「不明」から。復帰時は適用中を確認してから motion_hold 解除（TR-13）
        - name: previous_mode_record
          description: 人の一時停止／終了操作の有無を含む直前モードの記録（RQ-I025）
          persistence: persisted
          restore_scope: PC再起動後に人の操作なしで走行を再開しないための判定に使う
        - name: mission_context
          description: 選択した変換後地図の由来ID・版・内容ハッシュ、waypointセット（と速度マスク）のID・版・ハッシュ、run_id
          persistence: persisted
          restore_scope: 自律走行／一時停止へ復帰する場合だけ復元（RQ-I069）
        - name: remaining_waypoints
          description: 未到達の waypoint 列。Nav2 feedback の number_of_poses_remaining で更新（通過判定は Nav2：RQ-I011）
          persistence: persisted
          restore_scope: 再開時の新 goal の構成に使う。最終到達後は最終 waypoint のみ（RQ-I067）
        - name: goal_waypoint_offset
          description: 現在の Nav2 goal の先頭 pose が waypoint セット全体の何番目かを示す offset（記録用）
          persistence: volatile
          restore_scope: goal 送信ごとに更新
        - name: current_section_index
          description: 進入中の区間番号（記録用：RQ-I030）
          persistence: volatile
          restore_scope: goal 送信時に offset から再計算
        - name: active_nav2_goal
          description: 送信中の NavigateThroughPoses goal の handle／UUID
          persistence: volatile
          restore_scope: 復帰時は旧 goal の終了または破棄を確認してから新 goal（RQ-I013・RQ-I069）
        - name: stop_reason
          description: 停止の原因区分（人の操作・計画の失敗・blocked・推定不能・通信途絶・nodeの異常：RQ-I029）
          persistence: persisted
          restore_scope: 記録と表示。復帰判定の入力
        - name: recovery_attempt_count
          description: 自動復帰の試行回数（上限値は PRM-10）
          persistence: volatile
          restore_scope: 上限到達で RQ-I013／DEC-008 の規則に従う
        - name: initial_pose_received_after_restart
          description: PC 再起動後に人の初期位置要求（IFD-39）を受理したか（DEC-009）
          persistence: volatile
          restore_scope: 再起動で false。再開（TR-10）の guard
        - name: last_estimated_pose
          description: 最終推定姿勢（記録用。初期化には使わない：DEC-009）
          persistence: persisted
          restore_scope: 復元に使わない
  - id: TS-14
    set_nested:
      test.expected: 境界を越えた直後に v1 が1回発行される（進入する区間の値：RQ-I010）。重複 cell は低い方の上限（DEC-045）。境界時点の実速度は評価しない（RQ-I062）。
