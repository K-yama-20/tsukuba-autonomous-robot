modifications:
- id: ND-01
  set_nested:
    ros_node.responsibilities:
    - 起動経路はこれ一つ（bash gouda.sh start／stop／status）。環境変数などの起動オプションを持たない（DEC-090・DEC-091）
    - 共通nodeの起動と、モードごとの launch／lifecycle 有効化（RQ-I004）。センサードライバは常に gouda_sensor_supervisor（ND-18）の下で起動する（デバイスが無ければ待つ）
    - ワークスペース（gouda.sh の 2 つ上）、データの置き場（PRM-25）、設定（design/generated/params）、ROS 2 Jazzy（/opt/ros/jazzy）は固定または正本から決める。仮値（<node>.trial.yaml）は読まない（試験 script だけが使う）
    - 起動・有効化の失敗を gouda_monitor に表示できる形（/diagnostics・lifecycle状態）で残す。起動中に launch が終了したら失敗として表示する
    - Gouda は同時に一つ。pid ファイルにない gouda_core の起動（試験スタック trial:=true は除く）が同じ利用者で動いていれば起動を拒み、止め方を表示する。status・stop でも表示する（G-DUP-START、DEC-103）
    - 走行開始要求は発行しない（M-001 K2 を維持）
    - Fast DDS の profile：start のたびに PRM-100 から <data_root>/run/fastdds_profile.xml を書き（gouda_core.dds_profile）、FASTRTPS_DEFAULT_PROFILES_FILE で launch に渡す（子のプロセス・子の launch も同じ設定）。共有メモリの転送は既定の区画のまま、UDPv4 の受信・送信のバッファを PRM-100 にする。値がなければ起動しない（DEC-279）
  interpretation_append: REV-144（DEC-279 案 a）：start で Fast DDS の profile を書いて全プロセスに与える（PRM-100）。起動オプションは増やさない。
- id: ND-07
  set_nested:
    ros_node.responsibilities:
    - 保存地図上の自己位置推定と map→odom TF の発行（自律走行・一時停止で単独の発行者）
    - 人が指定した初期位置・向き（IFD-34）からの初期化と、推定の有効性の公開（IFD-53）
    - 方式は案 A3 を試す（DEC-115）。上流の部品は改変せず子の launch（gouda_localization_a3.launch.py）で起動する：pcl_ros の CropBox 2 つと VoxelGrid（PRM-79〜81）、autoware_pointcloud_map_loader（地図の pointcloud_map/）、autoware_ndt_scan_matcher、autoware_ekf_localizer。設定は上流の param ファイルのまま、地図の場所と IF の名前だけを足す。部品の topic・service は名前空間 localization/a3 の中に閉じる
    - EKF と NDT の /tf は名前空間の中の別の名前に逃がし、/tf の map→odom はこの node だけが出す（D-17、RQ-I004）。map→odom は EKF の map→base_link と、同じ時刻に補間した odom→base_link（IFD-25）から計算し、IFD-25 を受けるたびにその時刻で出す。localization/pose（IFD-33）は EKF の姿勢
    - 速度の中継：IFD-25 の速度を TwistWithCovarianceStamped（分散 PRM-82・83）にして EKF へ
    - 初期化の手順：IFD-34 の姿勢に、地図作成の軌跡（trajectory_imu.txt）から求めた高さと分散（PRM-84〜87）を付ける → NDT が点群を保持するまで待つ（/diagnostics の scan_matching_status に is_activated があること。時間の制限なし。待つ間は初期化中で、IFD-53 の詳細に NDT が最後に点群を捨てた理由を出す。DEC-280）→ ndt_align_srv（Monte Carlo の探索）→ 成功したら EKF の初期姿勢 → EKF・NDT の trigger_node を true。各段を DecisionEvent に残す。失敗したら map→odom を出さず推定不能（init_failed）
    - 推定の状態（IFD-53）：NDT の診断（nearest_voxel_transformation_likelihood、PRM-90）、EKF の診断（pose_no_update_count、PRM-91）、EKF の位置の標準偏差（PRM-92）、入力の古さ（PRM-89）から判定（DEC-200、DEC-206 の (2)）。材料がない・読めないときは正常にしない
    - lifecycle：ND-03 が TR-05 で map_directory を設定して configure（子の launch を起動）・activate（初期化）、TR-11・TR-12 で deactivate・cleanup（子の launch を止める）。設定値が未確定（実車で trial なし）なら configure を失敗にし理由を記録する（RQ-I076）
  interpretation_append: REV-144（DEC-280 案 a）：ndt_align_srv の前に、NDT が点群を保持するまで待つ。
- id: TS-41
  set_nested:
    test.procedure: 単体（test_localization_core.py）：map→odom の計算（EKF の map→base_link と、同じ時刻に補間した odom→base_link から）、補間、状態の判定（未初期化・初期化中・正常・推定不能の理由ごと、材料がない・古いときに正常にしない）、地図作成の軌跡からの初期の高さ、速度の変換と分散、NDT の点群の保持の読み取り（DEC-280）。単体（test_dds_profile.py）：PRM-100 からの Fast DDS の profile。VM：gouda_global_localization の configure（地図の 20 m 格子、子の launch の起動）・activate・cleanup、/tf の map→odom の発行者が 1 つ。gouda.sh start の下で、点群（IFD-21）が BEST_EFFORT の購読者と A3 の CropBox に届く量。rosbag の再生（評価と同じ地図と区間）で評価の結果と比べる（外付けがつながっているとき）
    test.expected: 材料がそろうまで正常にならない。map→odom の発行者は ND-07 だけ。NDT が点群を保持する前に ndt_align_srv を呼ばない（その間は初期化中、推定不能にしない）。初期化に失敗したら map→odom を出さず推定不能（init_failed）。
  interpretation_append: REV-144（DEC-279・280）：点群の保持の待ちと Fast DDS の profile の試験を追加。
