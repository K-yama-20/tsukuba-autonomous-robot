  kind: approval
  status: answered
  asked_on: '2026-10-21'
  answered_on: '2026-10-21'
  channel: chat
  question: 実装の許可（第75便の報告）：vehicle_bridge の書き込みの方式、rosbag の非同期の停止と進捗のポップアップ、gouda.sh stop の上限の撤去と進捗の表示
  answer_verbatim: "・書込み待ちの上限0.2sは、書込みを待たない方式とせよ。\n・rosbagの停止に関しては、君の推奨通りでいこう。まさに私が考えていたことです。ただし、30s経ってからポップアップが出るのは遅すぎるので、30sの制限は撤廃して、保存開始と同時にポップアップを出そう。\n・gouda.sh stopについては、glimの保存状況をrosbagの保存の時と同じような情報を1sおきにterminalに表示しよう。\n"
  affected_refs:
  - ND-12
  - ND-04
  - ND-02
  - ND-01
  - IFD-11
  - IFD-12
  - PRM-77
  resulting_refs:
  - PRM-77
  note: 実施（第76便）：(1) vehicle_bridge の書き込みは pyserial を使わず、O_NONBLOCK の fd へ os.write。入りきらない分は捨て、固定の理由で記録（monitor が ×回数にまとめる）。pyserial 3.5 の write_timeout=0 は EAGAIN で忙しく回り続けるため使わない。(2) record/rosbag/stop は SIGINT を送ってすぐ返す。保存中は record/status の rosbag_saving・rosbag_saving_output・rosbag_saving_started_at、終わると rosbag_last_save。保存中は新しい rosbag を始めない。終了時（shutdown）は保存を上限なしで待つ。monitor は保存の始まりと同時にポップアップ（往復するバー、経過時間、書き出したファイルの大きさ、増え方。全体の量は分からない）。(3) gouda.sh stop は SIGTERM・SIGKILL を送らず、PRM-77（1 s）ごとに GLIM（dump_path）と ros2 bag record（-o）の保存の大きさと増え方を表示する。
  disposition: answered
