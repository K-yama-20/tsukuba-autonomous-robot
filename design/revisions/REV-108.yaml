modifications:
- id: ND-12
  interpretation_append: REV-108（DEC-174）：シリアルの書き込みは待たない（O_NONBLOCK の os.write、入りきらない分は捨てて記録）。write_timeout 0.2 s を廃止。
- id: ND-04
  interpretation_append: REV-108（DEC-174）：rosbag の停止（IFD-11）は停止の要求だけを受けてすぐ返し、保存は上限なしで続く。保存中と保存の結果を record/status（IFD-12）に出す。保存中は新しい rosbag を始めない。終了時は保存を待つ。強制の停止（30 s で SIGTERM）は廃止。
- id: ND-02
  interpretation_append: REV-108（DEC-174）：rosbag の保存の始まりと同時にポップアップで進捗（往復するバー、経過時間、書き出したファイルの大きさと増え方）を示し、終わったら完了・失敗を示す。
- id: ND-01
  interpretation_append: REV-108（DEC-174）：stop は SIGINT の後、時間の上限なしに待つ（SIGTERM・SIGKILL を送らない）。PRM-77 ごとに GLIM と rosbag の保存の大きさと増え方を表示する。終わらないときは人が PC を再起動する。
