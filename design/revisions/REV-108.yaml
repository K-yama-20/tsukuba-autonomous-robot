date: '2026-10-21'
summary: 人の許可（DEC-174、原文）で実装：vehicle_bridge の書き込みを待たない方式に、rosbag の停止を非同期にして保存の進捗をポップアップで表示、gouda.sh stop の上限を撤去して 1 s ごとに保存の進捗を表示（PRM-77）。
