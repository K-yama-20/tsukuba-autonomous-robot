  resulting_refs: []
  note: '保存先は design/docs/deferred_verification.md の VL-02（第88便で追加、人に報告する）。大きさ 1 mV は中立から端までの約 2220 mV の 0.05%。実車での影響は未測定（推測で小さい）。今の試験 gouda_core/test/test_vehicle_core.py の test_voltage_mapping_matches_previous_firmware_table は旧 firmware の値（230／4700）で x==y を確かめていて、承認値での非対称は試験していない。承認値で「x と y の差が 1 mV 以内」を確かめる試験の追加はコードの変更なので、「案Aを採用」がその許可に当たるかを人に確認する（DEC-106）。'
