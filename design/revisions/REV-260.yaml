  note: >-
    事実（docs/mid360_driver_interfaces.md 3 章）：UDP の IMU はジャイロ rad/s・加速度 g（通信プロトコル v1.4.12 の 160〜165 行）。ドライバは 3 か所とも値をそのまま写し単位を変えない
    （pub_handler.cpp 119〜124 行、lidar_imu_data_queue.cpp 35〜41 行、lddc.cpp 490〜495 行）。約束は加速度 m/s²・角速度 rad/s（Imu.msg 3 行、REP-145 67・73 行）で、角速度は一致、
    加速度は違う。orientation と共分散を設定しない（lddc.cpp 480〜496 行）ので、推定がない印（共分散の要素 0 を −1：Imu.msg 10〜13 行、REP-145 110 行）がなく、
    既定値の回転なし（Quaternion.msg の w＝1）が「共分散が不明」の値として出る（推測。記録で未確認）。
    推奨：A 使う側で直す（今は使う側がないので何もしない。解析では 9.80665 を掛ける。GLIM で使うなら acc_scale を 9.80665 に固定する）。理由：上流を改変しない（DEC-075）、
    単位を換える fork と下流の係数の両方を変えると二重に換算される（台帳 R-M-03）、GLIM の自動判定（acc_scale 0）は最初に受けた 1 つの値のノルムで単位を決めるので、
    動きながら始めると誤ることがある（glim_ros.cpp 228〜243 行。7〜12 は m/s²、0.8〜1.2 は g、それ以外は m/s² とみなす）。
    代替：B Gouda に変換の node を 1 つ置き、m/s²・frame・共分散の印をそろえた別の topic を出す（自作。既製の node はこの便では未調査）。C 単位を換える fork に替える
    （tu-darmstadt-ros-pkg/livox_ros_driver2 の jazzy、commit 2a60447：imu_as_gforce が false のとき 9.80665 を掛ける（src/lddc.cpp 566〜588 行）。2026-10-23 更新、Livox の文面のライセンス、
    SDK も同じ組の fork が要る、実機の使用例は未確認。DEC-442・DEC-443 の見直しになる）。
    振る舞いの違い：今は誰も使わないので、どれを選んでも走行は変わらない。使い始めたとき、下流が g を m/s² と取ると重力が約 1/9.8 に見える（自己位置の推定が崩れる）。
    決まらない場合に止まる作業：MID-360 の IMU を使う実装（DEC-476 の C）。第235便の流れ D。
