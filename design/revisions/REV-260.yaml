  resulting_refs: []
  note: >-
    事実（docs/mid360_driver_interfaces.md 5 章）：MID-360 は機器の情報・設定・今の状態を設定した送り先へ周期的に送る（User Manual v1.2 PDF 14 ページ）。項目は
    cur_work_state（0x8006）、core_temp（0x8007、0.01 ℃）、lidar_diag_status（0x800E、モジュールごとの正常・警告・異常・safety_err）、hms_code（0x8011）（通信プロトコル 384・385・391・393 行）。
    Gouda は push_msg_ip に PC のアドレスを入れる（mid360_config.py 43 行）ので PC に届く。SDK2 は通知を SetLivoxLidarInfoCallback の callback にだけ渡す
    （general_command_handler.cpp 589〜597 行）が、ドライバはこれを登録しない（lds_lidar.cpp 182・187・188 行。登録するのは接続の通知と点群・IMU だけ）。ドライバの publisher は
    点群と IMU だけ（lddc.cpp 527〜554 行）で、SDK のコンソールのログも止める（lds_lidar.cpp 131 行）。高温では警告を出し、さらに高いと自動で止まる（User Manual PDF 23 ページの注 7）が、
    その警告は Gouda に届かず、点群が来ないことでしか分からない（DEC-456）。
    推奨：A 今は出さない。温度は P7（T07-1）で外から測り、試験のときの状態は人が Livox Viewer 2 で見る。理由：上流を改変しない（DEC-075）、状態を読むには SDK の callback を
    ドライバと同じプロセスで登録する必要があり、別のプロセスで SDK を初期化すると送り先のポートを取り合う恐れがある（推測、未確認）。
    代替：B fork の診断を使う（TU Darmstadt の fork の publish_diagnostics。中身は時刻同期の種類と packet の途絶だけで、温度・診断コードは出さない：src/livox_ros_driver2.cpp 208〜257 行）。
    C 上流に状態の callback と /diagnostics の発行を足す patch（DEC-075 の見直し）。D Gouda の node で点群の topic の途絶を見て /diagnostics に出す（DEC-456 の代替と同じ。温度・診断コードは分からない）。
    振る舞いの違い：A は今と同じ。B〜D は monitor・記録に状態が出る。状態を走行の判断（止める・続ける）に使うかは別の承認（DEC-456）。
    決まらない場合に止まる作業：monitor の MID-360 の状態の表示、sensor supervisor（ND-18）への組み込み、温度の常時の記録。走行と P4〜P7 の試験は止まらない。
    先行事例：探した場所は上流のソースと SDK2、TU Darmstadt の fork（gh api と raw で読んだ）、台帳の R-M-01（Ericsii の fork など。AI は未照合）。温度・診断コードを ROS に出す
    既製のドライバはこの便では見つけていない（探したのは上の 2 つの系統だけ）。第235便の流れ D。
