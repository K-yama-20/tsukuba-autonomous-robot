    【承認】MID-360 の診断・状態（作動状態・温度・診断コード）を Gouda で出すか。今は ROS にも記録にも出ない。
    推奨は「今は出さない（monitor の MID-360 の表示と DEC-456 と一緒に決める）。温度は P7（T07）で外から測る」。
  answer_verbatim: ''
  affected_refs:
  - ND-20
  - ND-02
  - ND-18
  - IFD-27
