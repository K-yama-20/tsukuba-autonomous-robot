    vehicle_test の手直しなど 11 ファイル。車載 PC の作業ツリーと dev-tab の worktree で一致）があればそれを使った。
    (2) dev-tab の worktree だけにある試験用の変更（drive_sim の 4 ファイル、nav2_config.py の GOUDA_TEST_NAV2、test_nav2_config.py）は入れていない（試験専用で、
    車載 PC にもない）。test_sensor_supervision.py の文書用アドレスへの置き換え（REV-214 の残り）は入れた。
    (3) 証拠・基準線・過去の作業記録のうち、共有の作業ツリーで 0e260f3 から変わっていないものは dev-tab の版にした（VM の表示の置き換え）。
    (4) model.yaml の 22 欄は design/tools にない一回限りのスクリプトで写した（0e260f3 と同じ値の欄だけ。両方で変わった欄 2 つは IFD-16 の番号の付け直しによる差で、
    REV-200 の適用で入っている）。(5) dev-tab の作業記録 21 件は番号を付け直して写し、先頭に元の番号を書いた。status.md は 3-way で、dev-tab の項目をまとめて写した。
    (6) dev-tab の系統から来た troubleshooting ledger の TRB-014 がスキーマに合わなかった（status の値と occurrences の形）。
    status を「監視中」にし、元の語を countermeasures の先頭に残し、occurrences を元の文のまま項目の形にした（自律判断、意味は変えていない）。
    車載 PC への反映、コミット、push はしていない（人の指示待ち）。
