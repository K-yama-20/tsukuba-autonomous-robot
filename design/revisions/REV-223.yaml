  note: >-
    推奨案と理由は提案 §2。代替：user unit と linger（sudo は不要だが、スリープの抑止が取りにくい見込み、未確認）、robot_upstart（gouda.sh の検査と DDS profile を通らない起動経路になるので不採用の案）。
    振る舞いの違い（提案 §3）：電源投入で人の操作なしにセンサーのドライバ・vehicle_bridge・monitor が動き、ESP32 が繋がっていれば vehicle_bridge が接続する。SSH が切れても止まらない。
