  question: >-
    （人の指示「gouda.shをsystemdにしたい。」を受けて）systemd 化で、電源を入れたら自動で起動するようにしますか？
    選択肢は「手動起動のまま」（AI の推奨。理由：自動起動では人がいなくても vehicle_bridge が ESP32 とつながる）と「電源投入で自動起動」
  answer_verbatim: |
    電源投入で自動起動
  affected_refs:
  - ND-01
  - DEC-090
  - DEC-091
  - DEC-174
  resulting_refs: []
  note: >-
    人の最初の発言（原文）：「gouda.shをsystemdにしたい。」。
    AI の解釈：Gouda を systemd の service で動かし、PC の電源投入で自動で起動する。入口は bash gouda.sh start／stop／status のまま（DEC-090 の一つの起動経路を保つ。AI の案）。
    起動直後のモードは今の実装（mode_core.decide_boot）と同じで、記録なし・前回手動なら手動走行、前回が自律走行・地図作成・一時停止なら一時停止で自律走行を再び許可しない（TR-01・TR-02、DEC-009）。
    実装の許可と残りの項目は DEC-435。
  disposition: answered
