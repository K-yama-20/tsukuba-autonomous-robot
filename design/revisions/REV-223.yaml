  asked_on: '2026-11-06'
  answered_on:
  channel: chat
  question: >-
    【承認】gouda.sh を systemd の system unit（gouda.service、setup.sh で enable）で動かし、電源投入で自動起動する案（design/proposals/systemd_autostart_plan_2026-11-06.md）を実装してよいか（Q1）。
    停止は SIGINT・上限なし・SIGKILL なし（DEC-174 と同じ）、異常終了の自動の起こし直しはしない（Restart=no）。
    あわせて Q2 自動起動で解決したいこと、Q3 スリープの抑止（DEC-104）を一緒に入れるか、Q4 自動起動を止める手段（推奨：README に sudo systemctl disable gouda）、Q5 PC の電源を切るときに保存の終わりを待つか上限を置くか。
  answer_verbatim: ''
