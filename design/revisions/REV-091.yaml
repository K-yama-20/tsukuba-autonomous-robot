  question: '【承認】案 B1 の段 3 の設計（提案 ntrip_gga_proposal.md §9）。(1) 中継（str2str）を sensor supervisor の子プロセスにし、PRM-76（USB2 の by-id）で見張る。起動は ntrip が有効・PRM-75/76 がある・str2str がある・GNSS のドライバの設定がそろうとき。str2str の timeout・再接続・表示の間隔は既定のまま。(2) 秘密の扱い：記録用の command（ntrip を伏せ字）と起動に使う command を分け、全ドライバの command を記録の前に伏せ字にする。中継の標準エラーからは状態の文字・バイト数・bps だけを取り出し msg は捨てる。状態の変化だけを記録する。(3) 中継が終わっても同じ同一性では作り直さない（DEC-088 と同じ。案 A）。(4) gnss_config の検証を足す（# は不可、user と mountpoint に : は不可、caster に : / @ は不可）。(5) 段 3 の実装の許可は 1〜4 の後に改めて求める。'
