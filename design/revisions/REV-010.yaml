    question: ゲート3（generated/gate3_package.md）の承認
    answer_verbatim: |
      ゲート3は、範囲を限定して条件付きで承認する。

      承認範囲：gate3_package.mdの下位設計案122件は、以後の設計・実装の暫定ベースラインとして採用。値に依存しない下位設計、および実車出力を伴わないソフト実装とstub試験までを認める。
      承認しないもの：122件の個別最終承認、未確定値の確定、未実施試験の合格、実車投入は含まない。
      承認の記録：承認は判断台帳へ記録し、対象のdesign/model.yamlのGitコミットまたは内容ハッシュと結び付ける。あわせてDEC-019工程5の暫定状態を更新せよ。

      DEC-031・DEC-045・DEC-046・DEC-047のSpeed Filter方針、DEC-042の手動経路（Bluetoothゲームパッド→ESP32→DAC、手動優先）、DEC-037のリレー不使用・DAC常時出力、という設計方針を維持。
      DEC-048の値（cmd_vel途絶700 ms、ESP32の期限切れは最後の有効PC指令受信から1 s、Bluetooth途絶250 msは別枠）を維持。
      H-009の値の割当・意味に関する判断は解消済みとし、根拠IDを付けて閉じよ。
      一方、DEC-050の実機照合やQ-04〜Q-06の未確定値を、承認済み・実測済みとして扱ってはならない。
    affected_refs: [DEC-019, DEC-025, H-009, DEC-050, Q-04, Q-05, Q-06]
    resulting_refs: [FILE-GATE3-MODEL]
    note: >-
