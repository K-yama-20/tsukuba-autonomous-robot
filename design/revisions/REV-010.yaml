      issue_refs: [G-TUNING]
    set_nested:
      parameter.purpose: （参照のみ）TS-16 で記録する揺れの継続時間。合否判定には使わない（DEC-055）
      parameter.measurement: 不要（合否判定に使わない。TS-16 の記録のみ）
