        意味の整理は docs/vehicle_output_timing.md。PRM-09・PRM-14 は未確定のまま（Q-05・G-FIRMWARE）。
  # ---- DEC-011 の残存記述を Speed Filter 方針（DEC-031）に揃える ----
  - id: IFD-14
    set:
      name: speed_limit（区間速度上限。発行元は Nav2 costmap の SpeedFilter、DEC-031）
  - id: TR-05
    set_nested:
      transition.actions:
        - 初期位置を ND-07 へ送る（IFD-34）
        - run_id を発行し、remaining_waypoints を全区間で初期化
        - 選択した waypoint セットの速度マスクと filter info を Nav2 に読み込ませる（IFD-41・IFD-42）。speed_limit は Nav2 の SpeedFilter が位置から発行する（IFD-14、DEC-031）。Gouda は発行しない
        - NavigateThroughPoses goal を送信し active_nav2_goal を記録（IFD-13）。speed_limit_application_state=適用中 を確認してから motion_hold=false を発行（IFD-40）。確認できない間は hold=true のまま（DEC-056）
        - ログ記録が未開始なら自動開始（契機は人の自律走行開始ボタン：RQ-I015）。設定状況を記録
        - 直前モード記録を MODE-AUTO に更新
  - id: TR-10
    set_nested:
      transition.actions:
        - 旧 goal（active_nav2_goal）が終了または破棄済みであることを確認（取消結果の受信、または Nav2 側に goal がないこと）。未確認なら再開を拒否し理由を応答
        - remaining_waypoints（最終到達後は最終 waypoint のみ：RQ-I067）で新しい NavigateThroughPoses goal を送信し、goal_waypoint_offset を記録
        - speed_limit は Nav2 の SpeedFilter が位置から発行する（IFD-14、DEC-031。同じ cell なら再発行なし）。speed_limit_application_state=適用中 を確認してから motion_hold=false を発行（IFD-40）
        - 自動 Record は開始しない。記録が停止中なら人が Record で再開できる（RQ-I015）
        - 直前モード記録を MODE-AUTO（人の再開操作あり）に更新
  - id: TS-01
    set_nested:
      test.expected: >-
        開始直後に区間 0 の上限（percentage=false, m/s、PRM-20 の刻みに量子化）が1回発行される。値 0.0（無制限）は帯内では発行されない。
        帯外（cell=0）から開始した場合は Nav2 の挙動どおり無制限で、speed_limit_application_state に「帯外・無制限」が記録される（DEC-045・DEC-047）。
  # ---- 停止・復帰の成立条件の明示（DEC-056）: 旧 goal の終了／破棄、人の操作の保持、中立化の担当 ----
  - id: TR-06
    set_nested:
      transition.actions:
        - motion_hold=true を発行（IFD-40、DEC-004）。中立化の担当は ND-11（hold=true で即時中立。cmd_vel 途絶 700 ms＝PRM-08 は保険：RQ-I063）、最終段は ESP32 の指令途絶中立（RQ-I068）
        - Nav2 goal を取消（controller_server は取消時に零速度を発行）。取消結果（CANCELED）または result の受信で旧 goal の終了を確認し active_nav2_goal を消す
        - 停止原因区分=人の操作を記録（RQ-I029）。ログ記録は継続（RQ-I015）
        - 直前モード記録を「人の一時停止操作あり」で永続化（RQ-I025。PC 再起動後も人の操作なしに走行を再開しない）
  - id: TR-07
    set_nested:
      transition.actions:
        - motion_hold=true を発行（IFD-40）。中立化の担当は ND-11（RQ-I063）
        - Nav2 の結果（error_code・error_msg）をログに記録（RQ-I012）。result の受信をもって旧 goal の終了を確認し active_nav2_goal を消す
        - 停止原因区分を「計画の失敗／blocked」と「推定不能／通信途絶」で区別して記録（RQ-I012・RQ-I029）
        - 残 waypoint は保持（再開で同じ目標へ：RQ-I014）。直前モード記録は MODE-PAUSE（人の操作なし）
  - id: TR-08
    set_nested:
      transition.actions:
        - motion_hold=true を発行（IFD-40）し一時停止モードへ（RQ-I017）。Nav2 は goal 完了で cmd_vel 発行を止め、ND-11 は hold=true で中立（担当は ND-11）
        - result SUCCEEDED の受信をもって旧 goal の終了を確認し active_nav2_goal を消す
        - remaining_waypoints を「最終 waypoint のみ」にする（再開時も最終 waypoint を目指す：RQ-I067）
        - 自動開始した記録は停止しない（人の終了操作で停止：RQ-I017）
  - id: TR-09
    set_nested:
      transition.actions:
        - motion_hold=true を維持／発行（IFD-40）。中立化の担当は ND-11
        - 理由（失敗した段階と原因区分）を記録（RQ-I013）
        - 旧 Nav2 goal の終了または破棄を確認（確認できない場合は Nav2 の lifecycle 再起動で破棄）してから一時停止へ。自動再走行はしない
        - 直前モード記録は MODE-PAUSE（人の操作なし。再開は人の再開操作 TR-10 のみ：RQ-I025）
  - id: TR-14
    set_nested:
      transition.actions:
        - 必要な場合だけプロセス再起動
        - 事前地図作成に必要な状態だけを復元（記録セッションは自動開始しない：RQ-I015）
        - 旧 Nav2 goal は残っていない（事前地図作成では自律走行系 ND-07〜ND-12 が非活性）。自律走行指令の再許可は行わない（RQ-I069）
        - 中立化の担当は ESP32。PC は指令を送らない（ND-11・ND-12 非活性）。手動操作は ESP32 で優先され、PC 指令の途絶時は ESP32 が中立（RQ-I023・RQ-I068）
        - 直前モード記録は MODE-MAP のまま（人の操作なし）
        - 各段階の成否を記録
        - 復旧不能・試行上限（PRM-10）のときは事前地図作成モードを維持し、理由と失敗段階を記録して monitor に表示（DEC-008）
  - id: TR-15
    set_nested:
      transition.actions:
        - motion_hold=true を維持（IFD-40）。中立化の担当は ND-11（ND-11 自身の再起動時は起動直後 hold 扱い：SO-08）、最終段は ESP32（RQ-I068）
        - 必要な場合だけプロセス再起動
        - 一時停止への復帰に必要な状態だけを復元（mission_context・remaining_waypoints・stop_reason・previous_mode_record）
        - 旧 Nav2 goal が終了または破棄済みであることを再確認（残っていれば取消し、取消結果の受信で終了を確認）
        - 直前モード記録（人の一時停止／終了操作の有無を含む）は保持したまま。自律走行指令の再許可は行わない（一時停止のまま：RQ-I069。再開は人の操作 TR-10 のみ：RQ-I025）
        - 各段階の成否を記録
        - 復旧不能・試行上限のときは一時停止を維持し理由を記録（RQ-I013）
  - id: TR-16
    set_nested:
      transition.actions:
        - 必要な場合だけプロセス再起動
        - 手動走行に必要な状態だけを復元
        - 旧 Nav2 goal は残っていない（手動走行では自律走行系 ND-07〜ND-12 が非活性）。自律走行指令の再許可は行わない（RQ-I069）
        - 中立化の担当は ESP32。PC は指令を送らない（ND-11・ND-12 非活性）。手動操作は ESP32 で優先され、PC 指令の途絶時は ESP32 が中立（RQ-I023・RQ-I068）
        - 直前モード記録は MODE-MANUAL のまま（人の操作なし）
        - 各段階の成否を記録
        - 復旧不能・試行上限のときは手動走行モードを維持し、理由と失敗段階を記録して monitor に表示（DEC-008）
  - id: TR-11
    set_nested:
      transition.actions:
        - motion_hold=true を発行（IFD-40）。中立化の担当は ND-11、最終段は ESP32（RQ-I068）
        - Nav2 goal を取消し、取消結果の受信で旧 goal の終了を確認。停止原因区分=人の操作を記録
        - 自動開始したログ記録を停止。手動開始の記録は継続（RQ-I017）
        - 直前モード記録を MODE-MANUAL（人の終了操作あり）で永続化（RQ-I025）
        - 自律走行系（ND-07〜ND-12）を非活性化（ND-11・ND-12 は非活性化前に中立を送る）
  - id: TR-12
    set_nested:
      transition.actions:
        - motion_hold=true は一時停止中から継続（IFD-40）
        - 残っている Nav2 goal があれば取消し、取消結果の受信で終了を確認
        - 自動開始したログ記録を停止。手動開始の記録は継続（RQ-I017）
        - 直前モード記録を MODE-MANUAL（人の終了操作あり）で永続化（RQ-I025）
        - 自律走行系（ND-07〜ND-12）を非活性化（ND-11・ND-12 は非活性化前に中立を送る）
  - id: TR-13
    set_nested:
      transition.guard: 人の一時停止／終了操作が先行していない（RQ-I025。previous_mode_record で判定）。試行回数が上限未満（PRM-10、値は Q-05）
      transition.actions:
        - motion_hold=true を発行して復帰手順を開始（IFD-40）。中立化の担当は ND-11
        - 必要な場合だけプロセス再起動（RQ-I013 の依存順序の第1段。不要な故障では省く：RQ-I069）
        - 自律走行への復帰に必要な状態だけを復元（mission_context・remaining_waypoints）
        - 当該 mission に属する旧 Nav2 goal の終了または破棄を確認（取消結果の受信、または再起動した Nav2 に goal がないこと）。確認できなければ TR-09 へ
        - controller_server／costmap の復帰は lifecycle cleanup→configure→activate の 1 手順で行う（DEC-046）。復帰後、速度マスクと filter info の latched 配信を確認し、activate 完了より後に受信した speed_limit が現在 cell の上限と一致（speed_limit_application_state=適用中）することを確認してから motion_hold を解除する
        - 適用中を確認できない復帰経路では自動再走行を許可しない（motion_hold=true を維持し TR-09 へ。DEC-056）
        - 自律走行指令の再許可（新 goal の送信）。自律走行へ復帰する場合に限る（RQ-I069）
        - 各段階の成否を記録。人の追加承認は求めない（RQ-I013）
  - id: TS-06
    set_nested:
      test.expected: >-
        合格条件（DEC-046・DEC-056）: 採用手順 (B) cleanup→configure→activate の後、再走行前に controller が実際に保持している上限（直線 stub 経路での cmd_vel 最大 linear.x で観測）が現在 cell の上限と一致すること。
        speed_limit の発行ログだけでは合格にしない。(A) deactivate→activate は採用しない復帰方式として同じ観測を記録し、不一致でも設計の不合格にはしないが、(A) で自動再走行が許可されないこと（motion_hold=true のまま TR-09 へ）を合格条件に含める。
        予測: (B) は再生成後の最初の process() で再発行され一致。(A) は再発行されず、前の値と現在 cell の値が異なれば不一致。
  # ---- C-003・TS-14・TS-16・PRM-22〜24（DEC-055: 境界付近の揺らぎを詳細設計しない） ----
  - id: C-003
    set_nested:
      reconciliation.clarification: >-
        DEC-055: 車体の物理上限による値の丸め（飽和）は RQ-I020「cmd_vel の後段で独自に速度を抑える処理」に当たらない（M-012 の飽和・変換特性は保持）。
        境界付近の揺らぎ（帯幅・境界セル・減速タイミング）は詳細設計しない。RQ-I010 の「区間境界では、進入する区間の値を適用する。」は人が intent.md から削除する（編集待ち。削除後は AR-006 で記録）。
  - id: TS-14
    set:
      name: 速度マスクの重複 cell と帯内の値（境界セルの切替は評価しない）
    set_nested:
      test.procedure: 2 区間（上限 v0 > v1）が重なる部分を含む waypoint セットから mask を生成し、各区間の帯内と重なり cell にロボット姿勢を置く（Nav2 stub または実 costmap）。
      test.observe: 各姿勢での speed_limit の値、重なり cell の値。
      test.expected: 各区間の帯内では当該区間の上限が発行される。重複 cell は低い方の上限（DEC-045）。境界セルの切替時刻・境界時点の実速度は評価しない（DEC-055、RQ-I062）。
  - id: TS-16
    set:
      name: 低速帯への進入（上限指令と実速度の記録のみ）
    set_nested:
      test.observe: 上限指令の切替時刻、cmd_vel と推定速度の時系列。
      test.expected: >-
        記録が取れていること（入力→判断→出力をログでたどれる：RQ-I028）。揺れ幅・継続時間・減速距離に対する許容値の合否判定は行わない（DEC-055。境界付近の揺らぎは詳細設計しない）。
        境界時点の実速度保証は要求しない（RQ-I062）。記録は実機調整の材料にする。
  - id: PRM-22
    set:
      design_status: 未設計
      adoption: reference_only
      interpretation: DEC-055 により設計パラメータから外した（境界付近の揺らぎは詳細設計しない）。TS-16 の記録項目の参照として保持。値は定めない。
      issue_refs: [G-TUNING]
    set_nested:
