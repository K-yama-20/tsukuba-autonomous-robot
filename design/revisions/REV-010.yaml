    channel: chat
    question: 実装前の確認（停止・復帰の成立条件）と実装の進め方
    answer_verbatim: |
      実装前の確認：
      停止・復帰の成立条件をモデル上で確認せよ。具体的には、旧goalの終了または破棄、人の一時停止・終了操作の保持、指令中立化の担当を明示せよ。

      実装の進め方：
      修復後は工程5-1（起動・記録）から機能単位で進め、全Nodeを一括実装してはいけない。
      手動優先、入力途絶時の中立化、一時停止中の中立出力は、「車体出力」工程の完了条件に含める。最後の「安全機能」工程まで先送りしない。
      後段の「安全機能」には対象要求IDを明示せよ。非常停止検知・PC側非常停止を、別名や将来候補として再導入してはいけない。
      TS-06はDEC-046の2経路を扱え。合格条件は「cleanup→configure→activate後、再走行前にcontrollerへ上限が適用されていること」とし、発行ログだけでは合格にしてはいけない。適用を保証できない復帰経路では自動的な再走行を許可しない。
      故障モード表からは、対応する状態遷移・試験への参照を示し、未確認の機能を対策の根拠にしてはならない。
      試験不合格時は、観測事実と根本原因を記録せよ。設計の欠陥ならモデル修正→再生成→検査を経て実装に反映せよ。根拠のないtimeout拡大・retry追加・例外の握りつぶし・期待結果の変更は禁止。
    affected_refs: [TR-02, TR-05, TR-06, TR-07, TR-08, TR-09, TR-10, TR-11, TR-12, TR-13, TR-14, TR-15, TR-16, TS-06, SO-01, IFD-40]
    resulting_refs: [TR-05, TR-06, TR-07, TR-08, TR-09, TR-10, TR-11, TR-12, TR-13, TR-14, TR-15, TR-16, TS-06]
    note: >-
      停止・復帰の成立条件は各遷移の actions に明示し、generated/stop_resume_conditions.md（モデルから生成）で三点（旧 goal の終了／破棄、人の操作の保持、中立化の担当）を遷移ごとに確認する。
      工程と完了条件は docs/implementation_stages.md（正本 Markdown）。車体出力工程の完了条件に手動優先・入力途絶時の中立化・一時停止中の中立出力を含める。安全機能工程の対象要求 ID は同文書 §8。
      故障モード表は generated/review_r3.md §3 と generated/failure_modes.md（遷移・試験への参照付き。未確認要素への依存なし）。
    disposition: answered
