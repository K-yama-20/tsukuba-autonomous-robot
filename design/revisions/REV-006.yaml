    question: H-011 への指示（Speed Filter 採用の根拠提示、区間上限と領域上限の区別、定義方法の整理、速度上限の制約なし）
    answer_verbatim: |
      H-011：H-001でSpeed Filterを採用した決定IDと根拠を示せ。そのうえで、区間ごとの上限と地図上の領域ごとの上限が別物である点を確認せよ

      静的マスクでは、同じ場所を別区間として再訪する場合や、帯が交差・重複する場合に、区間ごとに異なる上限を表現できない。
      「地図全体に最低区間速度を敷き、帯だけ上書き」は、帯外を低速にする運用方針の追加です。帯外の扱いとしては安全側だが、区間上限の要求をそのまま実現する方法ではない。
      帯の幅は、迂回許容範囲を決めるQ-06・Q-07・Q-12が未決。そのため値は tbd のままとし、定義方法だけを設計せよ。整理する対象は次のとおり。
      帯幅
      重複部分
      帯外・マスク外
      マスク未読込時
      マスクのcell値0は「停止」ではなく「速度制限なし」である。マスク外や未読込時に無制限になっていないかも、明示的に確認せよ。ちなみに、速度上限は6km/hを超えても全く問題ない（これは決定事項であるから反論は許さない。）。
    affected_refs: [H-011, H-001, IFD-14, IFD-41, PRM-19, PRM-20]
    resulting_refs: []
    note: 回答は research/speed_filter_reapply_h011.md §1〜§3。前回の推奨（帯外に最低速度）は取り下げた。速度上限に 6 km/h の制約は設けない。
  - id: DEC-039
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-09'
    channel: chat
    question: Speed Filter の復帰後の再適用に関する調査・再比較・TS-06 合格条件の指示
    answer_verbatim: |
      ・Speed Filterは値が変わるまでSpeedLimitを再発行しない。そのため、自動復帰（RQ-I069）後に同じcellに留まっていると、上限が効かないまま走る可能性がある。これは設計不良であるから、採用するNav2版と実行構成で、次の点を調べよ。jazzyの仕様だけで判断してはいけない。
      ・Speed Filterがlocal／globalのどちらのcostmapに載るか。
      ・controller_serverの再起動で、フィルタも再初期化されるか。
      ・lifecycle_managerのbond設定により、controller_server単独の再起動が起こり得るか。
      ・SpeedLimitトピックのQoS（transient_localの有無）。
      その上で、Nav2を改変せず、発行元を単一に保つ方法として、次の2案を比較せよ。
      (a) controller再構成に合わせてフィルタを再初期化し、現在値を再発行させる起動・復旧手順
      (b) Speed FilterをGouda側の単一発行器へ置き換える方式
      既存の発行元に再送器を「追加」する案は、単一発行元（RQ-I020）に反するため、最終的には人間が判断する。比較結果は、H-001の比較表に「復帰後の再適用」の行を加えて提示させせよ。H-011の承認は、その再比較を見てから人間が行う。TS-06には、次の合格条件を追加する。"同じcellに留まったまま再起動しても、現在の上限がcontrollerへ再適用されること"
    affected_refs: [H-001, H-011, IFD-14, TS-06, TR-13]
    resulting_refs: []
    note: 調査結果と比較は research/speed_filter_reapply_h011.md §4〜§5（実車PC 1.3.13＝上流 645abd95 のソースと nav2_bringup の既定、本案の実行構成で評価）。H-001 は人の最終判断待ちに戻した。
