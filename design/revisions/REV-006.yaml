  - id: H-011
    set_nested:
      issue.question: >-
        Speed Filter（DEC-031）は mask の cell 値（位置）で上限を決めるため、区間（進行順序）の属性である RQ-I010 の上限とは別物である。再訪・交差・重複では区間ごとの値を表現できない。
        帯幅（PRM-19）・重複部分の規則・帯外（cell=0 は無制限）・マスク外（発行なし＝直前値が残る）・未読込時（発行なし＝上限なし）の定義方法は research/speed_filter_reapply_h011.md §3。値は Q-06・Q-07・Q-12 が未決のため tbd。
        承認は、復帰後の再適用を含む (a)(b) の再比較（同 §5、H-001）を見てから人が行う。
      issue.options:
        - label: 重複は進行方向で後の区間を優先、帯外は無制限（Nav2 の挙動のまま）
          effect: 要求どおりの区間上限は帯が重ならない範囲でのみ成立。帯外は controller の最大速度。
        - label: 重複は低い方の上限を優先、帯外は無制限
          effect: 安全側だが重複区間では要求値より低い上限になる。
        - label: 重複を禁止し、生成時にエラーとして人が waypoint を直す
          effect: 要求どおりの値を保てるが、往復・交差する経路を作れない。
        - label: Speed Filter をやめ Gouda 側発行器（案 (b)）に戻す
          effect: 区間上限の意味に一致し帯の定義が不要。H-001 の再判断（RQ-I021 の承認）が必要。
      issue.recommendation: 推奨なし。前回の推奨（帯外に最低速度を敷く）は運用方針の追加のため取り下げた。定義方法のみ提示し、値は tbd。
      issue.recommendation_basis: DEC-038（区間上限と領域上限は別物。帯外の低速化は運用方針の追加）。速度上限に 6 km/h の制約は設けない（DEC-038）。
      issue.next_action: 人が research/speed_filter_reapply_h011.md §5 の再比較を見て H-001 の最終判断（(a) か (b)）を行い、その後 H-011 の重複規則・帯外の扱いを決める。帯幅は Q-06・Q-07・Q-12 の後。
  - id: H-001
    set_nested:
      issue.state: partially_superseded
      issue.resolution_refs: [DEC-031, DEC-039]
      issue.question: >-
        DEC-031 で Speed Filter（costmap filter）が発行することになった。DEC-039 の調査で、Speed Filter は値が変わるまで再発行せず、deactivate→activate だけの復帰では同じ cell で上限が再適用されないことを確認した
        （cleanup→configure を伴う復帰、または bond による全体 reset では再適用される）。Nav2 を改変せず単一発行元を保つ (a)(b) の比較表（「復帰後の再適用」の行を含む）は research/speed_filter_reapply_h011.md §5。最終判断は人。
      issue.options:
        - label: (a) Speed Filter のまま、controller／costmap の復帰を lifecycle cleanup→configure→activate で行い現在値を再発行させる
          effect: 発行元は Nav2 の SpeedFilter 1 箇所。復帰手順を Gouda 側で作り込む（TR-13）。区間上限は位置依存（帯の重なり・再訪は表現不可、H-011）。mask 未読込・マスク外では発行されない。
        - label: (b) Speed Filter を Gouda 側の単一発行器に置き換える
          effect: 発行元は gouda_mode_manager 1 箇所。controller の transition_event で再発行し transient_local で遅延購読にも届く。区間上限（進行順序）の意味に一致し帯の定義が不要。Gouda 独自コードが増える。
      issue.recommendation: AI は推奨しない。単一発行元（RQ-I020）の最終判断は人（DEC-039）。
      issue.recommendation_basis: DEC-039「既存の発行元に再送器を『追加』する案は、単一発行元（RQ-I020）に反するため、最終的には人間が判断する」。
      issue.next_action: 人が (a)/(b) を決める。(a) なら TR-13 の復帰手順と TS-06 を確定、(b) なら docs/speed_limit_publisher.md を現行に戻し IFD-14/41/42 を改める。
  - id: IFD-14
    append: {issue_refs: [H-001]}
    set_nested:
      designed_interface.time_semantics: >-
        costmap の SpeedFilter がロボット位置の mask cell 値から上限を計算し、値が変わったときだけ speed_limit を発行（上流 speed_filter.cpp 242-258 行）。percentage=false、m/s。cell=0 は無制限（停止ではない）。
        mask 未受信・マスク外では発行されない（controller は上限なし／直前値）。復帰後の再適用: フィルタを持つ costmap が cleanup→configure される場合のみ再発行（deactivate→activate では不可）。(a)(b) の最終判断は H-001。
        Gouda は SpeedLimit を発行しない（単一発行元：RQ-I020）。
  - id: TR-13
    set_nested:
      transition.actions:
        - 必要な場合だけプロセス再起動（RQ-I013 の依存順序の第1段。不要な故障では省く：RQ-I069）
        - 自律走行への復帰に必要な状態だけを復元（mission_context・remaining_waypoints）
        - 当該 mission に属する旧 Nav2 goal の終了または破棄を確認
        - controller_server／costmap の復帰は lifecycle cleanup→configure→activate で行い、速度マスクと filter info の latched 配信と speed_limit の再発行を確認してから motion_hold を解除する（案 (a)。H-001 の最終判断が (b) ならこの手順は不要）
        - 自律走行指令の再許可（新 goal の送信）。自律走行へ復帰する場合に限る（RQ-I069）
        - 各段階の成否を記録。人の追加承認は求めない（RQ-I013）
  - id: TS-06
    set_nested:
      test.procedure: 自律走行中、ロボットを同じ mask cell に留めたまま、(1) controller_server のみ lifecycle deactivate→activate、(2) controller_server を cleanup→configure→activate、(3) controller_server プロセスを再起動（lifecycle_manager の bond 有効）、の3条件を別々に行う。
      test.observe: 再購読後に speed_limit を受信するか、受信までの時間、SpeedFilter と lifecycle_manager のログ、controller に適用された上限。
      test.expected: >-
        合格条件（DEC-039）: 同じ cell に留まったまま再起動しても、現在の上限が controller へ再適用されること。
        予測: (1) は再発行されず不合格（speed_limit_prev_ が保持される）、(2)(3) はフィルタ再生成後の最初の process() で再発行され合格（現在値が無制限の場合は発行なしが正しい）。(1) が実運用で起こり得る構成なら案 (a) は不合格となり、復帰手順を (2) に限定するか案 (b) を採る。
