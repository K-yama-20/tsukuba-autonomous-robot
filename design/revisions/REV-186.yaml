  channel: chat
  question: >-
    （第168便）A案の実車試験の前に、pointcloud_to_laserscan の range_max を raytrace_max_range より大きい有限の値にする修正を実装するか。
    今の既定値では点のない方位が消去に使われない疑いがある（DEC-322 と不一致）。
  answer_verbatim: |
    修正を実装
  affected_refs:
  - ND-09
  - IFD-57
  - DEC-322
  resulting_refs:
  - ND-09
  - IFD-57
  note: >-
    人は「修正を実装」のボタンで答えた。値は新しい PRM にせず、obstacle_max_range・raytrace_max_range の大きい方の 2 倍とした（自律判断）。理由：点のない方位の点は
    obstacle_max_range より遠いので印にならず、消去は raytrace_max_range までで切られるので、両方より大きければ値で costmap は変わらない（obstacle_layer.cpp の
    world_dist_sq の判定と raytraceFreespace の範囲）。/config で PRM-125・126 を変えても追従する。実機の消去の確認は未実行（第169便の作業記録）。
  disposition: answered
modifications:
- id: ND-09
  set_nested:
    ros_node.responsibilities:
    - XT-32 点群（IFD-21）を上流の pointcloud_to_laserscan（node xt32_scan）で base_link に変換し、高さの帯（PRM-70・PRM-71、base_link 基準）の中の点だけを方位ごとの LaserScan（IFD-57）にする。独自の点群処理は作らない（DEC-336・DEC-395）
    - local・global の costmap は IFD-57 を ObstacleLayer の観測源にし、Nav2 側の高さの帯は実質無効にする（Nav2 は帯を odom・map の z で当て、その原点は GLIM の最初の IMU の姿勢のため。DEC-336）。local は 2 次元（DEC-321、TRB-001）
    - 帯の中に点のない方位は空きとして消去に使う（inf_is_valid、DEC-322、TRB-002）。そのため scan の range_max は観測源の obstacle_max_range・raytrace_max_range より大きい有限の値にする（DEC-396）。これは「観測外を安全とみなさない」（RQ-I012）の人が認めた例外。それ以外の観測外（track_unknown_space）は今のまま
    - pointcloud_to_laserscan が入っていなければ Nav2 を起動しない（障害物の入力なしで走らない）
    - 坂で地面が帯に入り障害物になる場合は、実車の記録で確かめてから既製の地面の除去（patchwork++ など）を提案する
  interpretation_append: 'REV-186（DEC-396）：scan の range_max を観測源の範囲より大きい有限の値にした。'
- id: IFD-57
  set_nested:
    designed_interface.time_semantics: header.stamp は元の点群（IFD-21）の stamp のまま。高さ（base_link の z）が PRM-70 と PRM-71 の間の点だけを使い、方位ごとに一番近い点の距離。範囲の中に点のない方位と range_max より遠い方位は inf（use_inf）。range_max は有限（DEC-396）
  interpretation_append: 'REV-186（DEC-396）：range_max を有限にした。'
