# 適用: design/tools/apply_revision.py REV-039
id: REV-039
date: '2026-10-14'
summary: >-
  人が intent.md の末尾に 1 行を追記（第9版、SHA 183f8ee1…、AR-009、RQ-I082）。チャットの指示と合わせて DEC-092 に原文で記録。
  gouda_monitor に「地図」タブを新設し、地図データベースの表を発進準備タブから移した。地図タブで原図を選び、変換設定（PRM-33〜36・38）を入力して再変換でき、
  変換後地図（rev）ごとにプレビュー・設定・結果を見られる。既定値は gouda_map_creator の parameter（generated params）を表示する。
  実機の原図の点の高さを確認した結果、変換の高さの基準と点の密度に設計上の判断が要るため、推奨の既定値を決める前に人に相談する（DEC-093〜095）。
