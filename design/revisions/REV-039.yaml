decisions:
  - id: DEC-092
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-14'
    channel: chat + intent.md
    question: 地図タブの新設と、地図の変換設定の調整（intent.md 第9版）
    answer_verbatim: |
      地図タブを新設し、地図の表を発進準備タブから移せ。intent.mdの末尾に項目を追加した。質問・相談事項・設計上の判断に迷うところがあれば、遠慮無く質問せよ。

      （intent.md 第9版 106 行）・map_creatorにおける、原図から各種の地図への変換時のパラメータはチューニング項目なので、あとで自由に設定できる方が望ましい。gouda_monitorに「地図」タブを設け、変換設定入力と再変換用ボタンを設け、「地図」タブで様々な設定を試せるようにする。暫定的措置として、既定値は推奨値を入れてほしい。（実機検証後に既定値を私が再指定します。）
    affected_refs: [ND-02, ND-05, IFD-37, PRM-33, PRM-34, PRM-35, PRM-36, PRM-38]
    resulting_refs: [AR-009, RQ-I082, TS-33, DEC-093, DEC-094, DEC-095]
    note: >-
      地図タブは REV-039 で実装（gouda_core/web と monitor_node の /api/map_settings・/api/map_reconvert・/api/map/<origin>/<rev>/manifest.json）。再変換は既存の IFD-37 map/convert に設定を添えて送る。
      変換のたびに新しい rev を作り、原図は変えない（RQ-I008・RQ-I009）。既定値（推奨値）は、実機の原図の点の高さ（GLIM の座標の z が −1.16〜3.74 m、地面は z=0 ではない）と
      点の間隔（GLIM の submap_downsample_resolution 0.3 m）を確認した結果、高さの基準の決め方で値の意味が変わるため、DEC-093〜095 の回答後に設定する。
    disposition: answered
  - id: DEC-093
    kind: question
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【相談】2D 地図への変換で「高さ」を何から測るか。今は GLIM の地図座標の z をそのまま使っており、GLIM の原点は開始時のセンサーの位置なので、地面は z=0 にない
      （10/13 の実機の原図では点の z が −1.16〜3.74 m）。案 A（推奨）: 点群から地面の高さを場所ごとに自動で推定し、「地面からの高さ」で帯を決める（坂道でも同じ設定で使え、地図タブでの調整も直感的）。
      案 B: 地図作成の軌跡（センサーの高さ）から /config の取付高さを引いて地面とする（/config が未設定だと使えない）。案 C: GLIM の z のまま（設定値は取付高さと地図ごとの開始姿勢に依存し、毎回調整が要る）。
    answer_verbatim: ''
    affected_refs: [ND-05, PRM-34, PRM-35, PRM-36, RQ-I082]
    resulting_refs: []
    note: 決まらない場合に止まる作業：地図タブの推奨の既定値（PRM-34〜36）の設定。地図タブの入力・再変換・プレビューは今の基準（案 C 相当）のまま使える。
    disposition: open_human
  - id: DEC-094
    kind: question
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【相談】2D 地図の元にする点の密度。GLIM の原図の点は 0.3 m 間隔に間引かれている（GLIM の submap_downsample_resolution 0.3 m）ため、0.05 m の格子では穴だらけになる
      （10/13 の原図の変換は未知 73084 セル・空き 508・占有 31）。案 A（推奨）: 変換で穴を埋める処理（近傍の補間）を加え、解像度の既定を 0.1 m 程度にする。
      案 B: 地図作成時だけ GLIM の間引きを細かくする（Gouda が作る GLIM の実行設定で変える。GLIM の計算負荷と保存量が増える）。案 C: 地図作成中の生の点群を記録し、GLIM の軌跡で並べ直して作る（記録量が大きい。点群の配送の欠落 G-DDS の影響を受ける）。
    answer_verbatim: ''
    affected_refs: [ND-05, ND-06, PRM-33, PRM-38, RQ-I082]
    resulting_refs: []
    note: 決まらない場合に止まる作業：解像度と占有点数の推奨の既定値（PRM-33・38）の設定。
    disposition: open_human
  - id: DEC-095
    kind: question
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【確認】intent.md 106 行の「原図から各種の地図への変換」の「各種」に、Nav2 用の 2D 占有格子地図（と、waypoint 保存時に作る速度マスク）以外に要るものはあるか。
      例: 自己位置推定用の 3D 点群地図（推定方式 Q-02 の選定次第）、段差・坂の地図。今は 2D 占有格子だけを作る。
    answer_verbatim: ''
    affected_refs: [ND-05, RQ-I082, Q-02]
    resulting_refs: []
    note: 決まらない場合に止まる作業：なし（2D 占有格子の地図タブは使える）。
    disposition: open_human

