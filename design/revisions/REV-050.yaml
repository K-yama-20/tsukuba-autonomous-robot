decisions:
  - id: DEC-108
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-14'
    channel: chat（貼り付け）
    question: 地面の推定の方針と必須の設計要件、出力してほしいもの
    answer_verbatim: |
      ## 私の方針（これを前提に改善してほしい）
      1. 部分地図ごとに、その地図を作った走行の軌跡と対応付けて判定する
      2. 軌跡の真下（センサーZ − H）を起点に地面を決める
      3. 外側へ広げる。予測より大きく下の点は使わない（上下非対称の範囲）
      4. 局所平面で傾きを補正する
      5. 軌跡がない地図は従来方式にフォールバックし、記録を残す

      ## 必須の設計要件
      A. 対応付け
      - 判定単位は「取得走行 × 部分地図」とする。複数走行の点が混在する場合の検出方法と扱いを示す。
      - 時刻同期の確認方法と、ループ閉じ込み後の補正が点群と軌跡に同一に適用されているかの検証方法を示す。
      - 軌跡の欠損・停止中の姿勢重複・補間密度への対処を示す。

      B. H（センサーから地面までの高さ）
      - 設計値（取付外部パラメータ＋base_link高さ。二重加算しないこと）を中心に、±いくらか （±0.15m程度？） の制約付き補正のみ許す。
      - 接地点の予測は、姿勢（roll/pitch）込みの座標変換で求める。単純な「Z − H」は使わない。
      - 推定には地図全体の高さ分布を使わない。センサー周辺の輪状範囲（真下の死角と自車点は除外）の局所平面と、センサー姿勢の相対関係から推定する。
      - 坂・横断勾配で生じるバイアスへの対処を明記する。
      - 支持点不足・候補の競合・補正上限への張り付きは失敗とし、フォールバックする。

      C. 起点と拡張
      - 起点は「予測位置」とし、近傍実測点へのロバスト平面推定（RANSAC等）で確定させる。法線角・残差・点の広がり・支持点数を確認する。
      - 拡張は経路に近い順（優先度付きキュー）に行う。
      - 格子ごとに複数の高さ候補を保持し、最低点に一本化しない。
      - 候補の採用条件:
        - 予測高さとの差が、上下別々に設定した許容幅の内側
        - |Δz| ≤ d·tan(θmax) + ε
        - 段差の上限以内
        - 十分な支持点数
      - 層の漸進的な乗り移りを防ぐため、経路側の地面との整合確認、距離に応じた信頼度低下、打ち切り（不確かさ基準と最大距離R_maxの併用）を行う。
      - 空白領域は飛び越えない。局所平面は信頼度の高い地面点のみで更新する。
      - 傾きは重力方向を基準にする。

      D. 下方の点と特殊な地形
      - 予測より大きく下の点は地面推定から外すが、削除しない。「反射候補 / 負の障害物（溝・段差下）」として別ラベルにする。
      - 縁石の下や側溝など、拡張が届かなかった領域は通行可能として扱わない。
      - 部分地図内の多層（陸橋・スロープ）、草地、動的物体の扱いを示す。

      E. 出力
      - 格子ごとに次を持つ:
        - 状態（地面 / 非地面 / 未確定 / 負の障害物候補）
        - 推定地面高さ
        - 信頼度
        - 走行ID
        - 使用方式（新方式 / 従来方式）
      - 障害物は、局所地面からの相対高さ [0.05 m 〜 ロボット高さ＋余裕] で判定する。
      - 「地面かどうか」と「走行可能かどうか」は別々に判定する。
      - 複数の部分地図を統合するルール（食い違い時の優先順位、確率的な統合）を示す。
      - この方式は分類の改善であり、2層の位置合わせ自体は解決しない。3D地図として使う場合に必要な、別途の位置合わせ案も示す。

      F. 検証
      - ロボットが通過した空間（通過時点）に障害物判定が出ていないかを、自動チェックとして組み込む。
      - シナリオ: 平坦路、坂、横断勾配、縁石（上り・下り）、側溝、走行間の高さずれ、陸橋、草地、濡れた路面・ガラスの反射、地面の欠測。
      - 指標:
        - 「障害物を地面と誤判定する率」を最優先で評価する
        - 未確定率、フォールバック率、Hの補正量の分布、経路上の地面高さと起点高さの誤差

      ## 出力してほしいもの
      1. 私の方針への評価（妥当な点 / 修正が必要な点。根拠付き）
      2. 処理フロー（モジュール単位で、各モジュールの入出力を明記）
      3. 疑似コード（関数単位に分割し、パラメータは引数化する）
      4. パラメータ表（初期値・根拠・調整方法）
      5. 失敗モードとフォールバック条件の一覧
      6. 検証計画（正解データの作り方を含む）
    affected_refs: [ND-05, G-FLOOR-REFLECTION, DEC-107]
    resulting_refs: []
    note: >-
      設計は design/proposals/ground_estimation_design.md。方針の修正点（根拠つき）: 軌跡は dump の traj_lidar.txt（補正後）から取り data.txt の frame 姿勢は使わない、
      H の設計値の構成を一つに決める（PRM-05 未確定の間は窓を広げる）、submap 内の再通過を分割する、候補の上下の整合、R_max は submap の軌跡から測る、押す人の後方の除外。
      実装は人の個別の許可（DEC-106・DEC-107）まで行わない。
    disposition: answered

