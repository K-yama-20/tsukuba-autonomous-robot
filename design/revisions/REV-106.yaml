  asked_on: '2026-10-21'
  answered_on: '2026-10-21'
  channel: chat
  question: 大会の最高速度の規則（SR-06 最高 6 km/h、SR-07 誤動作しても超えない。保証する層は Q-G5）をどの層で守るか
  answer_verbatim: "（分岐セッション local_d45b61f7… からの転送。原文の転記）「最高速度の規則は気にしなくてよい。これは車椅子自体に速度上限設定があるためである。これは反論を許さない。低速での動き出しについては、最低倒し量を決めれば良いのでは。」\n"
  affected_refs:
  - ND-11
  - ND-17
  - PRM-39
  resulting_refs: []
  note: 人の確定事項（反論を許さない）。SR-06・07（docs/regulations_2026.md）と Q-G5 は、ソフトではなく車椅子（EMC-270）自体の速度上限の設定で守る。安全の根拠になる前提として、重大な前提の一覧に載せる（CLAUDE.md 1.4）：EMC-270 の速度上限の設定が 6 km/h 以下であること（設定値は原本未照合・未確認）。後半（最低倒し量）は DEC-171。
  disposition: answered
- id: DEC-171
  kind: approval
  status: answered
  asked_on: '2026-10-21'
  answered_on: '2026-10-21'
  channel: chat
  question: 低速での動き出しのための不感帯の補償（案 A：motion_controller で、倒し量 r＞0 のとき 出力＝最低倒し量＋(1−最低倒し量)×r、小さなしきい値より下は中立のまま。自律走行の指令だけにかかり手動には影響しない。最低倒し量は前進・後退・旋回で実測。案 B：Nav2 の設定で代用、は不採用）
  answer_verbatim: "（分岐セッション local_d45b61f7… からの転送。原文の転記）「案Aで良いと思う。後退時は車椅子側の制御の関係で1.7km/hに制限される。前進は仕様上は4.5km/hだったが、実際は分からない。後で検証すれば良いのだが、まずnav2で自律走行させてみよう。そうすれば未設定でのnav2の性能も分かるし、操作ログからいくらか情報が取れるんじゃないかな」\n"
  affected_refs:
  - ND-11
  - RQ-I020
  - PRM-39
  - PRM-40
  resulting_refs:
  - DEC-172
  note: 案 A を方針として承認（設計の方向）。実装（motion_core の変更）と新しい設定（最低倒し量・しきい値、値は実測）の追加は、人の許可を改めて求める（DEC-106）。人の申告（事実）：後退は車椅子側の制御で 1.7 km/h（0.47 m/s）に制限、前進は仕様上 4.5 km/h（1.25 m/s）で実際は未確認。「まずnav2で自律走行させてみよう」は、今の構成では開始できない（ND-07 がなく TR-05 で拒否、Nav2 の実車の値 PRM-11・17・18・66〜73 が未確定で Nav2 が起動しない）と分岐セッションで人に説明済み、人の判断待ち。
  disposition: answered
