  note: 推奨：後退用の正規化の値（例：PRM-39 と別の PRM、値は実測）を持つ。Nav2 の後退の上限（min_vel_x などの PRM-66〜73 の該当項目）もこれに合わせる。代替：今のまま（後退は遅くなるだけで、cmd_vel より遅い向きのずれ。RQ-I020 の例外の扱いになる）。前進の PRM-39（人の指定 4 km/h）と仕様 4.5 km/h の差は実測（Q-06）で確かめる。決まらない場合に止まる作業：後退を含む自律走行の速度の検証。
