  question: >-
    （第138便 B1 の続き）推定不能で自動で待機モードに入ることについての人の発言
  answer_verbatim: |
    B1: 推定不能で即、待機モードに入ってしまうのは良くない。時間経過で環境が変化（人がいなくなって地図を作れるようになったり、衛星の位置が変わって即位が高精度にできるようになったり）して、推定ができるようになる可能性がある。よって、自動で待機モードにする機能は削除しても良い気がするが、状態遷移を再設計する必要があると思う。
  affected_refs:
  - DEC-305
  - DEC-306
  - DEC-307
  - DEC-309
  - DEC-332
  - MODE-PAUSE
  - TR-07
  - ND-03
  - ND-07
  resulting_refs: []
  note: >-
    人の発言（方針の向き）：推定不能で即、待機モードに入るのは良くない。時間がたつと環境が変わり（人がいなくなる、衛星の配置が変わる）、推定できるようになる可能性がある。
    自動で待機に入る機能は削除してよい気がするが、状態遷移の再設計が要る。DEC-305・306 への明示の回答ではないので、それらは pending のまま。状態遷移の再設計の提案
    （自動の待機をなくす、推定の回復を待つ、横断歩道の一時停止 DEC-332 を含む）を作る。
  disposition: answered
