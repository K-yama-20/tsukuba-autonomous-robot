  channel: chat
  question: >-
    （第138便 A7 の続き）規則についての人の訂正：3 分の滞留の範囲、緑のコーン、歩行者、制限時間とスタートの条件
  answer_verbatim: |
    A7: ルールを確認したところ、確認走行区間では、3分以上の滞留は失敗と看做されるが、その他の部分では記載が無かった。私が少し間違った解釈をしていたため訂正する。確認走行中に置かれる緑のコーンに接触したら走行失敗と判定される。コーンは多数置かれてあるし、目の前に急に置かれる場合もある。間隔が狭い場合はわざわざそこを通らずに迂回すれば良いではないか。歩行者が歩いてくることも考えられ、歩行者にぶつかった場合も走行失敗になる。
    100 分の制限時間と、スタートの条件（1 分以内にスタートラインを、2 分以内に 20 m地点を越える）がある。
  affected_refs:
  - DEC-304
  - DEC-327
  - DEC-321
  - DEC-322
  - DEC-313
  - RQ-I095
  - ND-09
  - ND-10
  resulting_refs:
  - DEC-341
  note: >-
    人が規則を確かめた結果（事実として記録。AI は規則の原文を読んでいない）：(1) 3 分以上の滞留が失敗とされるのは確認走行区間。それ以外の区間には記載がない。DEC-304 の発言の
    「同じ場所で3分以上滞留…走行失敗」を、確認走行区間に限るものとして訂正する。(2) 確認走行中に置かれる緑のコーンに接触すると走行失敗。コーンは多数あり、目の前に急に置かれる
    こともある。(3) 間隔が狭い所は、通らずに迂回すればよい（人の方針）。(4) 歩行者が歩いてくることがあり、歩行者にぶつかると走行失敗。(5) 制限時間 100 分。スタートの条件は、
    1 分以内にスタートライン、2 分以内に 20 m 地点を越える。
    影響：intent.md 第16版 1 行の「衝突そのものは失敗と判断されない」は、コーン（確認走行区間）と歩行者については当てはまらない。intent.md は人が直す。
    障害物の検出と回避は、削る対象の安全機構ではなく、完走に必要な機能になる。一旦採用した DEC-321・DEC-322 の見直しは DEC-341。
  disposition: answered
- id: DEC-340
