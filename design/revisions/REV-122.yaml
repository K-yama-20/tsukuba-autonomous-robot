  note: PRM-39＝1.25 m/s（4.5 km/h）。DEC-166 は書き換えず、この決定で PRM-39 の値だけを置き換える（CLAUDE.md 1.5）。影響：motion_controller の前進の正規化（倒し量＝linear.x／1.25）、不感帯の補償（DEC-171、倒し量に掛かる）、承認値を読む試験（値を固定した試験はない：第90便で確認）。SR-06（6 km/h 以下）の範囲内。前進の最高速の実測（Q-06）は残る。
  disposition: answered
- id: DEC-194
  kind: approval
  status: answered
  asked_on: '2026-10-21'
  answered_on: '2026-10-21'
  channel: chat
  question: PRM-18＝9999999 で振る舞いが変わること：Nav2 の BT がほぼ失敗を返さなくなり、計画の失敗による一時停止（TR-07、intent.md:15 の「Nav2のBTが後退も再計画もできず失敗を返した場合、Goudaは一時停止モードに入り」）がほぼ起きない。recovery（回転・後退・待機）を続ける。PRM-10 の 50 回ごとの記録はモードの層の復帰（TR-13〜16）の数え方で、BT の recovery は数えていない。案：9999999 で設定し、BT の recovery の回数と理由も 50 回ごとに記録する仕組みを、後で設計に足す（G-RECOVERY-COUNT と一緒に、工程 5-7 で）
  answer_verbatim: "（分岐セッションからの転記。人の発言の原文）「足置きは邪魔なので取り外した。最高速度は4.5km/hであるから、DEC-166を少し変える必要がある。\"9999999 で設定し、BT の recovery の回数と理由も 50 回ごとに記録する仕組みを、後で設計に足します（G-RECOVERY-COUNT と一緒に、工程 5-7 で）。\"も採用する。recoveryの後退は自由に使って良い。\nD11: 全て推奨値で良い。（prm-36の上限とはどういう意味か説明せよ）」\n"
  affected_refs:
  - PRM-18
  - ND-10
  - ND-03
  - TR-07
  - G-RECOVERY-COUNT
  resulting_refs:
  - PRM-18
  - G-RECOVERY-COUNT
  note: intent.md:15 の文（BT が失敗を返した場合は一時停止）とは食い違わない：失敗を返したときの振る舞いは変わらず、失敗を返すまでの回数が非常に多くなるだけ。ただし実際には「失敗を返して一時停止」がほぼ起きなくなり、経路の閉塞の間は recovery を続ける。人の原文「recoveryの後退は自由に使って良い。」（intent.md:15「blocked時を含め、後退しても良い」と同じ向き）。BT の number_of_retries は int で、9999999 は 32 bit の範囲内。
  disposition: answered
