  question: D10：Nav2 の実車の値（PRM-11・17・18・66〜73）。未確定の間、実車では Nav2 を起動しない（intent.md:85）
  answer_verbatim: "（分岐セッションからの転記。人の発言の原文）「D10: 全体的に安全思想に偏りすぎ。また、電動車椅子に人は絶対に乗らないし乗るスペースもない。以下の値を設定せよ。\n69:後輪車軸から前端まで55cm, 後端まで24cm。横幅は60cm, 車輪間の距離は530mm。\n66: 前進の最高速は4.5km/hとする。\n67: 最大の角速度は1.0rad/sとする。\n68: 加速度上限は1.2m/s^2とするが、実際に車椅子が出せる最大前進加速度はこれよりも低い可能性がある。\n73: 2.0rad/sとする。\n17: 20hzでよい。\n70: -0.065mでよい。\n71: 障害物の高さ上限は地面から135cmでよい。\n72: 0.5mでよい。\n11: 0.7mとする。\n18: recoveryの回数は9999999回とする。」\n"
  affected_refs:
