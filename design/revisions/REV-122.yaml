id: REV-122
date: '2026-10-21'
summary: 分岐セッションで人が答えた D10・D11（転記、DEC-192〜194、DEC-098）を記録する。Nav2 の実車の値 PRM-11・17・18・66〜73 を承認値にする（footprint は足置きを外した車体、障害物の上限は地面から 1.35 m）。PRM-39 を 1.25 m/s（4.5 km/h）にする（DEC-166 の値を置き換え）。PRM-18＝9999999 の振る舞いの変化を承認し、G-RECOVERY-COUNT に BT の recovery の記録を足す。地図の変換の値 PRM-33〜36・38・62〜64 を承認値にする（PRM-36 は 1.35 m）。intent.md:100 の車体の寸法と「人は乗らない」の追記案は DEC-195（pending）。
