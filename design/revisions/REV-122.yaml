  note: 換算：PRM-69 は base_link（後輪軸の中央）基準で、前端 0.55 m、後端 0.24 m、横幅 0.60 m の長方形 [[0.55, 0.30], [0.55, -0.30], [-0.24, -0.30], [-0.24, 0.30]]。PRM-66＝4.5 km/h＝1.25 m/s。PRM-71＝地面から 1.35 m − PRM-05（base_link の高さ 0.165 m、記載値）＝1.185 m（base_link 基準）。PRM-70＝−0.065 m（base_link 基準。地面から 0.10 m）。人の申告（事実として記録）：車輪の間隔 530 mm、足置きは取り外した、人は乗らない。注：PRM-67 の 1.0 rad/s は、倒し切ったときの旋回 PRM-40（0.97 rad/s）を少し超えるので、motion_controller で頭打ちになる（人に伝え済み、分岐セッション）。PRM-68 について人の申告「実際に車椅子が出せる最大前進加速度はこれよりも低い可能性がある」。転記の出所は分岐セッション（人が 2026-10-21 にこのメインのチャットへ貼った）。
  disposition: answered
