  answer_verbatim: "（分岐セッションからの転記。人の発言の原文）「足置きは邪魔なので取り外した。最高速度は4.5km/hであるから、DEC-166を少し変える必要がある。\"9999999 で設定し、BT の recovery の回数と理由も 50 回ごとに記録する仕組みを、後で設計に足します（G-RECOVERY-COUNT と一緒に、工程 5-7 で）。\"も採用する。recoveryの後退は自由に使って良い。\nD11: 全て推奨値で良い。（prm-36の上限とはどういう意味か説明せよ）」\n"
