entities:
  - id: H-011
    kind: issue
    name: 速度マスクの帯の幅と帯外の扱い（Speed Filter 採用に伴う幾何条件）
    intent_lines: [13, 26, 91]
    related_refs: [DEC-031, Q-06]
    sensitivity: [safety, operation]
    adoption: unresolved
    design_status: 未設計
    issue:
      category: human
      state: open
      affected_refs: [IFD-14, IFD-41, IFD-42, PRM-19, PRM-20, ND-02, ND-10]
      resolution_refs: []
      question: >-
        Speed Filter は mask の cell 値で上限を決めるため、区間 i→i+1 の線分の周囲をどの幅（PRM-19）で塗るかと、帯の外（cell=0、無制限）に車体が出たときの扱いを決める必要がある。
        また cell 値は 1..100 の整数で、速度刻み（PRM-20、base/multiplier）に量子化される。
      next_action: 回答まで mask 生成（ND-02）の幅と帯外の扱いは未確定。生成手順（線分→帯、重なりは進行方向で後の区間を優先）は設計済み。
      options:
        - label: 帯の外は無制限（cell=0）のまま。幅は Q-06 の実車値で決める
          effect: Nav2 標準の挙動。経路から外れた場合に上限がなくなる。
        - label: 地図全体に既定上限（最も低い区間値）を敷き、区間の帯だけ区間値で上書きする
          effect: 帯外でも上限が残る。既定上限の値を人が決める必要がある。
        - label: 保留
          effect: mask 生成の実装は進めず、生成器の単体試験は仮の幅で行う。
      recommendation: 地図全体に既定上限（最も低い区間値）を敷き、区間の帯だけ区間値で上書きする
      recommendation_basis: RQ-I010（区間の速度上限）の意図を帯外でも損なわない。値は人が決める（一般値で補わない）。

  - id: H-012
    kind: issue
    name: 新 firmware の手動操作経路（Bluetooth ゲームパッド優先か、純正ジョイスティックへのリレー切替か）
    intent_lines: [34, 35, 97]
    related_refs: [DEC-030, Q-09, G-FIRMWARE]
    sensitivity: [safety, intent]
    adoption: unresolved
    design_status: 未設計
    issue:
      category: human
      state: open
      affected_refs: [ND-17, IFD-17, IFD-43, SO-11, M-025, M-026, M-027, Q-09]
      resolution_refs: []
      question: >-
        基本契約は「bluetooth接続の手動操作がESP32で優先される」「bluetooth gamepadからの指令が途絶えたらESP32が中立を出す」（RQ-I023・RQ-I024）。
        参照 Joystick270-Firmware は Bluetooth を持たず、手動操作は純正ジョイスティックへリレーで戻す方式（DISARM・指令途絶・電源断で純正側）。新 firmware をどの手動経路で設計するか。
      next_action: 回答まで ND-17 の手動経路は未確定。DAC・ADC・ピン・プロトコル・watchdog・ARM 手順（参照抽出 §8）は経路に依存しない範囲で設計を進める。
      options:
        - label: Bluetooth ゲームパッド優先を維持（基本契約どおり）。リレー・純正ジョイスティックは使わない
          effect: 現 firmware の方式を新 firmware で再実装。ESP32 に Bluetooth（Bluepad32 等）が必要。参照 firmware のリレー・ADC 監視・中央探索は採用しない部分が出る。
        - label: 参照設計のリレー＋純正ジョイスティックに切り替える（基本契約の文言変更）
          effect: intent.md:34-35 の変更が必要（人の編集）。手動操作は純正ジョイスティック。ESP32 故障・電源断で自動的に純正側へ戻る。
        - label: 両立（Bluetooth 優先＋リレーで純正へも戻れる）
          effect: 回路（Joystick270 基板のリレー）と Bluetooth の両方を新 firmware が扱う。優先順位の定義が必要。
      recommendation: 保留せず人が決める。AI は推奨を出さない（基本契約の変更可否は人の判断）。
      recommendation_basis: RQ-I027（基本契約は AI が独断で変えない）。

