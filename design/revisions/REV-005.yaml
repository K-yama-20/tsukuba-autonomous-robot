  - id: TS-01
    set_nested:
      test.procedure: 速度マスク（IFD-41）と filter info を Nav2 の mask 用 map_server・costmap_filter_info_server に読み込ませてから自律走行開始（IFD-02）を1回行う。開始地点は区間 0 の帯内。
      test.observe: speed_limit topic の受信内容と受信時刻、SpeedFilter のログ。
      test.expected: 開始直後に区間 0 の上限（percentage=false, m/s、PRM-20 の刻みに量子化）が1回発行される。値 0.0（無制限）は帯内では発行されない。帯外から開始した場合の挙動は H-011 の回答に従う。
  - id: TS-02
    set:
      name: 残り pose 数が一度に複数減っても上限は位置で決まる
    set_nested:
      test.procedure: Nav2 stub の feedback で number_of_poses_remaining を N→N-2 に1回で減らしつつ、ロボット位置を区間 i+2 の帯内に置く。
      test.observe: speed_limit の発行回数・値、DecisionEvent の区間番号。
      test.expected: 上限は位置（mask）で決まり、区間 i+2 の値が発行される。記録には区間 i+1 を飛ばしたことが残る。Gouda は SpeedLimit を発行しない。
  - id: TS-03
    set:
      name: 再開・再 goal 後の上限と区間番号
    set_nested:
      test.procedure: 区間 3 で一時停止し、再開する。再開後の goal は残 waypoint 列から作る。
      test.observe: speed_limit の発行、SO-01 の goal_waypoint_offset と current_section_index（記録用）。
      test.expected: mask は不変なので再開時に新しい speed_limit は発行されない（位置が同じ cell なら値も同じ）。区間番号は offset により元の区間 3 に対応付けられ記録に残る。
  - id: TS-04
    set_nested:
      test.expected: speed_limit は追加発行されない（mask の値は位置が変わるまで同じ。速度 0 を SpeedLimit で送らない）。motion_hold=true が発行され、joystick_command は中立になる。
  - id: TS-06
    set:
      name: controller 再起動・購読開始後の上限再適用（Nav2 の挙動の記録）
    set_nested:
      test.procedure: 自律走行中に controller_server のみを lifecycle で deactivate→activate する。別途、costmap を含む node を再起動する場合も行う。
      test.observe: 再購読後に speed_limit を受信するか、受信するまでの時間と条件。
      test.expected: SpeedFilter は値が変わるまで再発行しない（上流 speed_filter.cpp 242-258 行）ため、controller のみ再起動した場合は mask 値が変わる cell に入るまで上限なし。costmap 再起動では speed_limit_prev_ が初期化され最初の計算で発行される。結果を人に報告し、受入基準は人が決める（Nav2 は改変しない）。
