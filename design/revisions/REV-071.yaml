id: REV-071
date: '2026-10-19'
summary: 'DEC-140 の回答の指示に沿って、最初の起動の前後で受信機の gso と getDataInOut を記録する道具 gouda_core/gouda_core/septentrio_query.py（照会だけ、by-id の名前だけ、他のプロセスが開いていれば送らない、raw・エコー無効を読み直してから送る）と単体試験を作った（受信機には触っていない）。DEC-139 と GGA の出し方を提案した（design/proposals/ntrip_gga_proposal.md）: USB だけの接続では受信機の中の NTRIP は使えないので、ドライバが USB2 を補正の入力と GGA の出力にし、PC の RTKLIB str2str が NTRIP と USB2 を中継する案 B1 を推奨。'
