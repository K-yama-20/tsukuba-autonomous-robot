# 変更セット REV-263（2026-11-07 第239便: 一時停止線の仕組み。DEC-482）
# 適用: design/tools/apply_revision.py REV-263
id: REV-263
date: '2026-11-07'
summary: >-
  第239便：人の指示（DEC-482）で一時停止線の仕組みを入れる。kind stop の waypoint を停止点とし、どの goal（開始・再開・出し直し・
  推定の回復・飛ばし）も次の停止点で終える。停止点に着いたら（Nav2 の goal の成功、または PRM-11 の半径に入ったとき）自律走行モードのまま
  motion_hold=true にし、goal を取り消し、processing_state rule_stop_hold・stop_reason rule_stop で人の操作を待つ。人が今の「再開」ボタン
  （mode/resume）を押すと、停止点の次の waypoint から goal を出す。最後の waypoint が停止点なら今までどおり TR-08。monitor の waypoint タブで
  点に停止線の印を付けられる。新しいパラメータはない。
