  resulting_refs: []
  note: >-
    推奨は c。理由：人に囲まれた数秒の推定不能では止まらず、長く続くときはずれが大きくなる前に止まる。人の発言（DEC-340）の「時間がたつと推定できるようになる」に合う。
    回復の判定に連続 N 回（tbd）を置く。D と N は DEC-346 で実測。どの案でも待機には入らない。DEC-306（pending、推奨は a）の具体化。決まらない場合に止まる作業：localization_wait の実装。
    提案 §3。
