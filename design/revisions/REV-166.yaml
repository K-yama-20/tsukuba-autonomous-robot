  question: >-
    【承認】推定不能（ND-07 の状態が正常でない）のとき、待機に入らず自律走行モードの段階 localization_wait で扱う。中身を次から選ぶ：a. 最後の map→odom を保って GLIM の odometry で走り続ける、
    b. その場で止まって推定の回復を待ち、回復したら自動で走り出す、c. 推定不能になってから距離 D（tbd）までは a、超えたら b。
