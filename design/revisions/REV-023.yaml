  Ubuntu 上の試験記録を証拠ファイルとして登録: REV-020（記録の自動開始 IF・stop_auto・transient_local の履歴・UI parameter）と工程5-3（地図作成の開始・終了、GLIM の起動と保存、原図の登録、変換の失敗時の後始末）。
  TS-26・TS-27 の手順に実行記録の場所を追記。試験の合否は正本の execution_status ではなく作業記録と証拠ファイルで管理する。
