  resulting_refs: []
  note: 意味：EMC-270 は後退の側の倒し量と速度の傾きが前進より小さく、後退に倒し切ったときの速度が後退の上限（1.7 km/h＝0.472 m/s、PRM-78）になる。motion_controller の正規化（後退は PRM-78 で割る、DEC-172・REV-118）はこの関係と同じ。旋回の成分が後退のときにどう変わるか（EMC-270 の内部の混合）は、この説明の範囲の外で未確認。
