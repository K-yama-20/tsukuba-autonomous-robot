  question: intent.md 第14版（人の編集。100 行の置換：車体の寸法、108 行の追記：人は乗らない）
  answer_verbatim: "intent.mdは更新した\n（選択式の質問「intent.md:100 の「全高 120 mm」は、どの値のつもりですか？」への回答）1200mmの誤りであった。intent.mdは修正した\n（選択式の質問「「電動車椅子に人は乗らない」の追記の案（DEC-195 の (2)）はどうしますか？」への回答）intent.mdに、人が乗らない旨を書き足した。\n\n（intent.md 第14版 100 行）・車体は全長 800 mm × 全幅 600 mm × 全高 1200 mmの直方体の中にあるとする。EMC-270の車体座標系は、左右後輪の駆動軸中央の地面投影点を原点とする。LiDARないしはdriverが出す点群の座標系は、-y方向を車体前方、+x方向を車体右方、+z方向を上方とするものであうが、これをNav2用に変換する。`base_footprint` は原点 `(0, 0, 0)`、`base_link` は後輪軸中心高さに置く。後輪径は330 mmなので、`base_link` の高さは約 `z = 0.165 m` とする。ホイールベースは415 mmであり、前キャスタ基準位置は後輪軸から約 `y = -0.415 m` 前方にある。LiDARやIMUなど各センサの取付位置は、この車体座標系に対する静的TFとして後から実測値を設定する。\n（intent.md 第14版 108 行）・電動車椅子に人は乗らない。\n"
