  channel: chat
  question: >-
    【承認】（人の案）指令が 0 でないのに実際の動きが軸ごとに出ない状態が続くときだけ、倒し量を少しずつ足し、動きが出たら戻すお助けを、不感帯の補償（DEC-171）の発展として motion_controller に入れるか。
    指令が 0 になったらすぐ終了する。旋回はジャイロ、前進は短時間の加速度と GLIM で動きを判定する。
  answer_verbatim: ''
  affected_refs:
  - DEC-171
  - DEC-409
  - ND-11
  resulting_refs: []
  note: >-
    人の発言（原文）：「現状の実装にフィードバック制御を入れようと考えるから、長い時間一貫して速度が必要だということになってしまっている。でも、問題なのは「動かしたい」のに「制御指令値が小さすぎる」から「車両が動かない」ということです。つまり、動かしたいのに動かないときだけ、フィードバック制御をスポット的に入れれば良いのではないかと思う。つまり、お助けサービスを別で作っておくということです。」
    「今のお助けプログラムの案を台帳に保存せよ。」。AI の推奨は採用。理由：常時のループより測定の要求が小さく、地面の抵抗の変化に固定値より強い。代替：常時の PI、固定値の補償のまま、MPPI 側で小さな指令を避ける案。
    振る舞いの違い：動かないときだけ倒し量が増える。考慮点：動き出しの飛び出し、発動の繰り返し、走行中の小さな旋回は軸ごとの判定が要る、0 にされる前の指令を見る、物に当たったときの上限と時間切れ（値は人の判断）、intent.md の cmd_vel の後段の文との関係は人の判断。先行事例は未調査（スティクション補償など）。
    決まらない場合に止まる作業：お助けの実装。シミュレータへの不感帯と抵抗の変化の追加は別途。
  disposition: open_human
