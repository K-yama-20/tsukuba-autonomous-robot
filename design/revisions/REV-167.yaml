  channel: chat
  question: >-
    （第140便の説明への人の指示）経路の引き直しの間隔（Nav2 の BT の RateController、上流の雛形 0.333 Hz＝3 秒おき）を変えるか
  answer_verbatim: |
    costmapの更新頻度は暫定的に1Hzとしたい。また、この値は/configで変更できるようにせよ。
  affected_refs:
  - ND-10
  - IFD-54
  - PRM-18
  resulting_refs:
  - PRM-103
  note: >-
    AI の解釈：第140便で「costmap の更新は local 5 Hz・global 1 Hz、3 秒おきなのは経路の引き直し（BT の RateController 0.333 Hz）」と説明した後の指示なので、「costmapの更新頻度」は
    経路の引き直しの頻度と読んだ（global costmap はすでに 1 Hz）。違っていれば人が訂正する。PRM-103＝1 Hz（暫定）。monitor の /config「Nav2」タブ（IFD-54）に値があれば、次の gouda.sh start から
    その値で BT を作る（PRM-98 と同じ仕組み）。この指示を、この項目の実装の許可（DEC-106）として扱う。
  disposition: answered
- id: DEC-348
  kind: confirmation
  status: recorded
  asked_on: '2026-10-23'
  answered_on: '2026-10-23'
  channel: chat
  question: >-
    （第140便）障害物を costmap に付ける距離（今は上流の既定 obstacle_max_range 2.5 m・raytrace_max_range 3.0 m）を広げるか。AI の推奨は、global の印の距離を 6〜8 m 程度、消す距離をそれより 1〜2 m 長くし、
    rosbag で誤検出と残像を確かめてから決める。
  answer_verbatim: |
    障害物自体は遠くから認識しつつ、近づくにつれて更新していく（更新にはカルマンフィルタなどの数理手法を用いる）のはどうか？それ以外は君の推奨案でいいような気がする。
  affected_refs:
  - ND-09
  - ND-10
  - DEC-337
  - DEC-339
  resulting_refs: []
  note: >-
    人の案：障害物は遠くから認識し、近づくにつれて更新する（カルマンフィルタなどの数理手法で）。距離は AI の推奨でよい気がする（値は rosbag で確かめてから決める）。
    AI の説明（第141便）：Nav2 の costmap は格子ごとに「ある・ない」を付けるだけで、物ごとの追跡やカルマンフィルタはない。止まっている物（コーン）は、遠くで付けた印を近づいても消さない
    （3 次元で印を保つ）ことで目的を果たせる。動く物（歩行者・ほかのロボット）は、点群を物にまとめてカルマンフィルタで位置と速度を追い、先の位置を costmap に入れる仕組みが要り、Nav2 1.3.13 には
    ない（別の部品と自作が要る）。costmap の提案 第3版で、止まっている物と動く物を分けて扱う。距離の推奨（global 6〜8 m、消す距離 ＋1〜2 m）は DEC-337 とあわせて第3版で値を示す。
  disposition: answered
- id: DEC-349
  kind: measurement
  status: pending
  asked_on: '2026-10-23'
  answered_on:
  channel: chat
  question: >-
    【実測】横断歩道の面と歩道の面の段差を降りる・乗り上げるとき（車体の傾きが急に変わる）、GLIM の odometry と NDT・EKF の推定がずれる・推定不能になる・落ちることがないかを確かめる。
  answer_verbatim: ''
  affected_refs:
  - ND-07
  - ND-08
  - ND-09
  - ND-14
  - DEC-342
  - DEC-346
  resulting_refs: []
  note: >-
    人の発言（原文）「横断歩道のある面と歩道の面の間には、当然段差がある。日本の歩道は車道より少し高く作られているためだ。横断歩道の面に降りたときと、歩道に乗り上げたとき、機体の角度が大きく変わるが、その瞬間にGLIMやndtが飛んだりクラッシュしたりしないかが心配だ。」
    この懸念を実測の項目にした。手順（案）：手動走行で段差の降り・乗り上げを数回ずつ（速さを変えて）行い、rosbag（点群・IMU・tf・ND-07 の状態・/diagnostics）を記録する。見るもの：GLIM の
    odometry の跳び（位置・姿勢の不連続）、IMU の加速度の頭打ち、NDT のスコア（NVTL）と推定不能の判定、EKF の共分散、プロセスの終了、帯の段での地面の誤検出（車体が傾いた瞬間）。
    推測：段差の高さで傾きの大きさが決まる（後輪軸と前のキャスタの間 0.415 m に対して、2 cm で約 2.8°、5 cm で約 6.9°）。今の作りでは、推定不能の判定が出ると即待機に入る（TR-07）ので、
    状態遷移の再設計（DEC-342 の localization_wait）が入るまでは、一瞬の推定不能でも失敗につながる。トラブルシューティング台帳 TRB-004 に登録した。計算機は VM（DEC-333）。
  disposition: open_human
