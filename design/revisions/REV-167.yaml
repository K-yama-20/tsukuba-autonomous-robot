summary: >-
  第141便：DEC-345 に人の回答を記録した（異常のときにチームメンバーがボタンを押すと走行失敗、再開ボタンは停止線で止まった後か信号が青になった後だけ、停止線での再開に PC のボタンは使ってよい）。
  人の指示で、Nav2 の経路の引き直しの頻度（BT の RateController）を PRM-103＝1 Hz（暫定）とし、monitor の /config「Nav2」タブ（IFD-54）で変えられるようにする（DEC-347）。
  障害物を遠くから認識して近づくにつれて更新する案と距離の推奨（DEC-348）、横断歩道の段差での GLIM・NDT の確認（DEC-349）を記録した。
