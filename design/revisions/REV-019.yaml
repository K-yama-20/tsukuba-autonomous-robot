modifications:
  - id: IFD-02
    set_nested:
      designed_interface.message_type: gouda_interfaces/srv/StartAutonomy（定義済み。REV-019。request_id・地図 ID／版／ハッシュ・waypoint セット ID／版／ハッシュ・initial_pose）
  - id: ND-02
    set_nested:
      ros_node.placement_rationale: >-
        HMI は停止・再起動しても mission を初期化しない（M-002 T3 の方針を維持）。waypoint 編集は GUI と同プロセスに置き、保存形式（IFD-30）だけを契約にする。
        実装（工程5-2）: gouda_core/gouda_core/monitor_core.py（表示規則・/config、rclpy 非依存）、monitor_server.py（127.0.0.1 の HTTP/SSE、標準ライブラリのみ）、monitor_node.py（購読・サービス呼出し）、web/（16:9 の運行画面。
        デザインルール design/docs/gouda_gui_design_rules.md を参考。外部表示領域は確保のみ）。ポートは PRM-26（既定は OS 選択、URL は <data_root>/run/monitor.url）。waypoint_manager GUI・初期位置指定・発進準備は 5-4／5-6 で追加。
  - id: ND-03
    set_nested:
      ros_node.placement_rationale: >-
        旧 gouda_section_executor／progress_tracker（C-012）を独立主体として置かず、Nav2 の action と feedback をそのまま使う薄い client にまとめる。モードの正本は一箇所。
        工程5-1 の実装は gouda_core/gouda_core/mode_core.py（起動遷移 TR-01／TR-02、永続記録）と mode_manager_node.py（mode/state・DecisionEvent の発行）。
        工程5-2 でサービス IFD-02〜07 を受け付ける（mode_core.request_transition）。現在のモードと遷移表・guard で判定し、動作が未実装の遷移は実装する工程名を付けて拒否、全要求を DecisionEvent に記録。
        各遷移の動作（GLIM 起動、Nav2 goal、motion_hold）は 5-3／5-6／5-7 で実装し、IMPLEMENTED_TRANSITIONS に加える。
  - id: SO-03
    set_nested:
      state_owner.state_items:
        - name: sensor_config
          description: センサ類の取付位置・姿勢と、LiDAR・IMU の座標方向の指定（DEC-007）。値は未決（RQ-I070）。タブ遷移で消えない。実装は <data_root>/config/sensor_config.json（各項目は UNKNOWN から始まり、保存ごとに config_revision を増やす）
          persistence: persisted
          restore_scope: 起動時に読み込み ND-13 へ渡す（IFD-26。渡す実装は工程5-6）
        - name: selection_inputs
          description: 地図とwaypointの組の選択、初期位置・向きの入力値（開始要求 IFD-02 の引数になる）
          persistence: volatile
          restore_scope: mission の正本ではない（正本は SO-01）
        - name: waypoint_edit_buffer
          description: waypoint・区間速度上限の編集中データと未保存フラグ
          persistence: volatile
          restore_scope: 保存ボタンで IFD-30 へ書き出す
        - name: display_aggregate
          description: 表示用の集約（最終受信の mode/state・record/status、DecisionEvent の件数と最終時刻、node 一覧、操作結果）。受信していない値は NOT_RECEIVED
          persistence: volatile
          restore_scope: 再起動・再接続で transient_local の mode/state・record/status から取り直す（DEC-014）。volatile の DecisionEvent は取り直せない
