    answer_verbatim: |
      また、ゲート3を条件付きで承認する。
      承認範囲

      * C-001〜C-013：置換範囲の確認（承認）
      * 下位設計案122件：実装を進めるための暫定ベースライン。確定設計でも実車投入の承認でもない。

      未解消の条件（承認記録に残せ。該当する実装段階の前に解消すること）

      1. DEC-011 と DEC-031 の整合。IFD-14、SO-01、TS-01〜TS-05 に Gouda 側発行器の前提が残っていれば列挙し、Speed Filter 前提に更新すること。
