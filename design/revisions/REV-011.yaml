      resolution_refs: []
      question: >-
        RQ-I078（区間 i→i+1 の属性としての上限）を、Speed Filter の位置ベース上限（DEC-031）と重複時は低い方（DEC-045）でどう実現するか。
        再訪・交差・重複する区間に異なる上限を設定した場合、実行時の上限は位置で決まり、区間順序には従わない。
      next_action: ゲート3の未解消条件 2（DEC-058）。工程 5-4（waypoint・速度マスク生成器）の実装前に人が選択（DEC-059）。
      options:
        - label: 案 A（推奨）位置ベースを採用し、再訪・重複する区間には同じ上限を設定する運用。waypoint_manager は重複 cell で値が異なる区間を保存時に警告し、mask は低い方を採用する
          effect: 現在の設計（DEC-031・DEC-045・IFD-41・TS-14）を維持。RQ-I078 の「区間の属性」は編集時の属性として成立し、実行時は位置に写像される。intent.md に「実行時は位置で適用し、重複区間は同じ値」を人が補足する。影響は ND-02（警告）、IFD-41 の生成規則のみ
        - label: 案 B 区間順序に従う発行器を Gouda 側に置く（DEC-011 の方式に戻す）
          effect: 区間ごとの値を厳密に実現できるが DEC-031 を覆す。Nav2 feedback に基づく区間判定・再開・復帰後の再適用の設計（H-001 で比較済み）を再度負う。影響は IFD-14 の発行元、ND-03、TS-01〜TS-06、TR-10・TR-13
        - label: 案 C 再訪・重複する経路を waypoint 編集で禁止する（保存時に拒否）
          effect: 食い違いは生じないが、同じ道を往復する経路（RQ-I001 の開始地点へ戻るルート）が作れない可能性がある。影響は ND-02・IFD-30 の検証規則
      recommendation: 案 A（推奨）位置ベースを採用し、再訪・重複する区間には同じ上限を設定する運用。waypoint_manager は重複 cell で値が異なる区間を保存時に警告し、mask は低い方を採用する
      recommendation_basis: DEC-045 の回答（再訪・重複ルートがあっても速度設定値は同じものを採用する）と DEC-031 を維持でき、変更が最小。安全側（低い方）に倒れる。
