      affected_refs: [RQ-I078, IFD-14, IFD-41, IFD-42, TS-02, TS-03, TS-14]
      adopted_requirement_refs: [RQ-I078, RQ-I020]
      scope: >-
        RQ-I078 は速度上限を「区間（waypoint i → i+1）の属性」＝進行順序に属する値と定める。Speed Filter（DEC-031）は costmap の mask cell（位置）で上限を決め、
        同じ位置を複数の区間が通る（再訪・交差・重複）場合は区間を区別できず、重複 cell は低い方の上限を採用する（DEC-045）。
        したがって、再訪・重複する区間に異なる上限を設定しても実行時には反映されない。食い違いは「区間ごとの値」を「位置ごとの値」に写像する点にある。
      retained_scope: 単一発行元（RQ-I020）、境界時点の実速度保証なし（RQ-I062）、重複時は低い方（DEC-045）は争点ではない。
      rationale: ゲート3の未解消条件 2（DEC-058）。解消方法は人の判断（H-013、DEC-059）。intent.md の補足は人が編集する。
      issue_refs: [H-013]
