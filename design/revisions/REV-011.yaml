  - id: C-023
    kind: reconciliation
    name: 区間属性の上限（RQ-I078）と Speed Filter の位置ベース上限・重複時は低い方（DEC-045）の食い違い
    intent_lines: [13, 26]
    related_refs: [DEC-031, DEC-045, DEC-058, DEC-059, H-013, C-002, C-022]
    sensitivity: [safety, operation]
    adoption: reference_only
