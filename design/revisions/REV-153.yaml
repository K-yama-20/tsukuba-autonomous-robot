  note: 事実（VM、2026-10-22、記録 design/research/vehicle_pc/2026-10-22_nav2_restart/）：第123便で lifecycle_manager の STARTUP が 1792608998 に始まり、1792609005.2 に ND-07 の ekf_covariance_large で TR-07、1792609005.54 に「Managed nodes are active」。1792609102.8 の end_autonomy（TR-12）では RESET の記録がない。人の試行（1792609384 開始）では、1792609413.72 の STARTUP で「Failed to change state for node map_server」（動いたままだった）、続いて TR-07（stop_reason node_failure）。コード（autonomy_client.py）：_call は STARTUP の応答を受けた後、開始が捨てられていれば（token が変わっていれば）Abandoned を出し、self.nav2_active = True に届かない。stop() は nav2_active のときだけ RESET を送る。原因の分類：実装（競合）。案 a（推奨）：STARTUP を送る直前に「Nav2 は動いているかもしれない」と記録し（nav2_active = True）、終了・一時停止からの終了のときは必ず RESET を送る。RESET の失敗は今と同じく記録する。案 b：終了のとき、Nav2 の状態（lifecycle_manager の is_active など）を問い合わせて、動いていれば RESET する。案 c：開始の最初に、念のため RESET を送ってから STARTUP する（残った Nav2 を毎回片付ける）。案 a と c は一緒にできる。今の VM の状態：人の試行は一時停止（mode 4、run-c1f3ac83）のままで、Nav2 は動いたまま。人の試行の終了でも RESET は送られない見込み（同じ理由）。直すまで、次の開始は Gouda を起動し直さないと通らない。決まらない場合に止まる作業：実車での自律走行開始。別の観察（安全に関わる、人の確認が要る）：人が設定した初期姿勢 (−1.316, −1.429, −90°) に対し、初期化の結果は (−0.39, −0.24)、一時停止中の推定は (−0.36, −0.20)、向き約 −97°、照合の良さ 3.23。位置が約 1.5 m 違う。NDT が違う場所に合ったのか、設定した位置がずれているのかは分からない。第124便で登録。
