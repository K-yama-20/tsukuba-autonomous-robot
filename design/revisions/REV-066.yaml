  set:
    note: '推奨は承認（intent 体験 9 の「取得されて表示され、人が収束と正しさを確認する」に近い）。ND-07 の実装（DEC-115）が前提。判定の値（サンプル数・静止の判定など）は tbd。決まらない場合に止まる作業：GNSS による初期位置の実装。 2026-10-18「条件付きで承認」。条件の記載がないため DEC-137 で確認する。条件が分かるまで、この項目に基づく実装はしない。 2026-10-18 条件（DEC-137 の回答、原文「1a2a3b4ok5実機検証してから6実機検証してから7a8a9b」。番号は AI が示した条件の表の項目）: (1) 自動の初期化は、自律走行の準備の画面で人が「GNSS で初期化」を押したときに始める。(2) 収束の確認に失敗したら止めて理由を表示し、人がやり直す（自動でやり直さない）。(3) 収束していないときも開始ボタンは拒否せず、警告だけを出して人の判断で開始できる（TR-05 に条件を足さない）。(4) GNSS が使えないときの人の指定（今の初期位置の入力）は残す。(5) 静止の判定に何を使うかと (6) 判定の値は、実機での検証の後に決める（それまで tbd）。(7) 対象は GNSS との対応（DEC-135）がある地図だけ。(8) PC 再起動後も同じ流れを使う（再開は人の操作の後。DEC-009 は書き換えない）。(9) 自己位置推定の方式によらない形にする（初期姿勢を送って収束の結果を受け取ることだけを ND-07 との契約にする）。実装の前提（ND-07 の方式 DEC-115、対応 DEC-135）は変わらない。'
