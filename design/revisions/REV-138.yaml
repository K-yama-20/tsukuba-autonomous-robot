- id: DEC-222
  set:
    note: 未確認（分岐先）：filter が inflation の後にかかるか、一つの costmap に速度と keepout の二つの filter を置けるか。決まらない場合に止まる作業：範囲を描く機能全体。 REV-136（第106便）：採用：KeepoutFilter を global と local の両方の costmap に置き、override_lethal_cost は両方 true（禁止の範囲の中にいるとき、外へ出る経路を許す）。分岐先は「true は失敗が外から見えにくくなり、DEC-200 の理由と向きが違う」と伝えたうえで、人が「反論は認めない」と決めた。転記の出所は分岐セッション（local_560e07c3…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（第106便）。 REV-137（第107便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。人が描く範囲（DEC-220〜224）の実装に着手して。」）。 REV-138（第107便）：VM で確認（VM（~/gouda_rev128_ws、試験の基盤 stack.sh、ROS_DOMAIN_ID 77、loopback_sim、模擬の ND-07）の 5-6 の結合試験 KEEPOUT=1、2026-10-21、空きの地図（stage56_fixture.py）に走行禁止の四角（x 2.8〜3.4 m、y −0.5〜0.5 m、直線 (1,0)→(4,0) をふさぐ）。記録：VM の /tmp/st56_rev137e.log、/tmp/st56_rev137_run3_stack.log・run5_stack.log。）：一つの global costmap に SpeedFilter と KeepoutFilter の二つを置けた（速度の上限が届き、禁止の格子は 100）。filter は inflation の後にかかる（禁止の範囲のまわりは膨らまない）。経路が縁に沿うと RPP が止まる件は DEC-227。local の KeepoutFilter で「failed to get costmap
      frame (odom) transformation to mask frame (map)」が 1 回の走行で 4 回出た。ソースでは、これは override_lethal_cost の判定（車体が禁止の範囲の中か）だけが失敗するもので、禁止の格子は TimePointZero の変換で書かれる。
