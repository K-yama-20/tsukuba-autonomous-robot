  question: 【確認・安全】地図作成の間（2026-10-22 03:14:30〜03:15:35）、ESP32 は 11 回「手動の優先（manual_override）」を出し、その間だけ GLIM は車体が動いた（合計 7.54 m、514 度）と推定した。人は「ずっと同じ位置にいた」と言っている。その間にゲームパッドを操作したか（誰かが車体を動かしたか）
  answer_verbatim: ''
  affected_refs:
  - ND-11
  - ND-12
  - IFD-12
  resulting_refs: []
  note: 根拠は design/research/vehicle_pc/2026-10-22_mapping_motion/notes.txt。ゲームパッドを操作していたなら、車体は実際に動いており、自己位置推定は正しかった（地図作成の終わりの姿勢と推定が約 0.15 m・1 度で合う）。操作していないのに manual_override が出て車体が動いたのなら、意図しない動き（ゲームパッドのスティックの戻り、接続の誤り、ESP32 の判定の誤りなど、推測）で、安全に関わる。その場合は、自律走行より先に ESP32 とゲームパッドを調べる（Claude は記録の解析と手順を用意する。実機の操作は人）。ESP32 の手動の優先そのもの（PC の指令より優先）は安全の前提（CLAUDE.md 1.4）。第117便の試行の間にも 14 回、第121便の間にも 2 回出ていた。決まらない場合に止まる作業：実車での自律走行（車体が人の思う位置にいるとは限らない）。第125便で登録。
  disposition: open_human
