# 変更セット REV-154（2026-10-22 第125便: 「止まったまま作った地図」での自己位置推定の失敗の根本の調べと DEC-288・289 の登録）
# 適用: design/tools/apply_revision.py REV-154
id: REV-154
date: '2026-10-22'
summary: 第125便：人の指摘（原文「ずっと同じ位置にいたまま地図作成ボタンを押し、その後、軌跡（円）の中央に初期値を置いてwaypointをいくつか置いて自律走行開始ボタンを押したが、自己位置推定に失敗した。何か根本的なミスがあるのではないか？お手先の修正をしたって意味が無い。」）を受けて、読むだけで調べた。地図作成の間、GLIM は ESP32 が手動の優先（manual_override）を出していた間だけ動き（7.54 m・514 度）、それ以外は止まっていた。車体は地図作成の間に実際に動いた（ゲームパッドの操作による）と推論する。地図作成の終わりの姿勢（IMU (−0.25, −0.19)、2.4 度、車体の向き約 −97.6 度）は、人の開始の推定 (−0.36, −0.20)、−97 度と合い、自己位置推定は正しかった。人が置いた初期姿勢（円の中央、(−1.316, −1.429, −90°)）が本当の位置から約 1.4 m 違った。開始が止まったのは、Nav2 が動いたまま残った件（DEC-287）と、EKF の標準偏差のしきい値（DEC-286）による。確認事項 DEC-288 と提案 DEC-289 を登録する。コードと設定は変えていない。
