  note: 事実：monitor の waypoint タブは、帯の地図（青）と点群を表示するが、軌跡の始めと終わりの姿勢は表示しない。人は「軌跡（円）の中央」を地図作成の位置と考えて初期姿勢を置いたが、本当の位置（地図作成の終わり）は 1.4 m 離れていた。案 a（推奨）：地図作成の終わりの車体の姿勢（trajectory_imu の最後の点から、/config の取り付けで base_link に直した位置・向き）を矢印で表示し、「この姿勢を初期姿勢にする」ボタンを置く。地図を作った直後に、そのまま自律走行するときに使える。車体を動かした後は使わない（人が置く）。案 b：表示だけする（ボタンは置かない）。案 c：今のまま。いずれも、初期化の後の推定の位置（localization/pose）をタブに表示する案と一緒にできる（走る前に、人が本当の位置と見比べられる）。決まらない場合に止まる作業：なし（今のままでも動くが、初期姿勢の誤りは減らない）。第125便で登録。
