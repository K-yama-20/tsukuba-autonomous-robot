  kind: issue
  source_from_affected: true
  name: Nav2 の有効化の直後の goal が、BT の計画の受理の待ち（上流の雛形の default_server_timeout 20 ms）を超えて失敗することがある（VM、1 回、再現しない）
  sensitivity:
  - operation
  issue:
    category: technical
    state: open
    affected_refs:
    - ND-10
    - ND-03
    - TR-05
    - TR-07
    resolution_refs: []
    question: 2026-10-17 の VM の試験の 1 回目（FILE-STAGE56-VM-TEST の 1）で、lifecycle の STARTUP の完了の約 50 ms 後に送った NavigateThroughPoses の goal が、bt_navigator の「Timed out while waiting for action server to acknowledge goal request for compute_path_through_poses」で失敗（status 6）し、TR-07 で一時停止した。2 回目・3 回目は起きなかった。待ちの値は上流の nav2_params.yaml の default_server_timeout（20 ms）のまま。分類は未確定（VM の遅さ、または開始の直後に goal を送る設計）。
    next_action: '待ちの値は変えていない（試験を通すための延長はしない: CLAUDE.md 1.5）。今の振る舞いは安全側（一時停止に入り、人の再開 TR-10 で残りの waypoint から続けられる）。x86 機で起きるかを確かめる。起きる場合の対策の候補は承認事項にする：(a) default_server_timeout を変える（値）、(b) STARTUP の後に計画の server の準備を確かめてから goal を送る（実装）。'
