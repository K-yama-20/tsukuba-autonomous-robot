  note: >-
    実車の 2 件で再計算した（motion_start_20261103_074043、motion_start_20261103_082639）。T ロックは、止まる段が左 0.26〜0.30、右 0.15〜0.18 で第227便の読みと一致した。
    t_lock は、中立 1 s 以下が判定不可になり、1.5 s 以上は方向ごとに 1〜2 回で ○ と × が混ざる。t_lock は未確定のまま。
    判定の窓は基準の窓（baseline_tail_s）で、旋回はヨーの平均、前後は加速度のばらつきを noise_k × 静止時の σ と比べる。前後の判定は実車で確かめていない。パルスの locked は変えていない。
    試験の期待値の変更：窓より短い中立は locked が False から None になる（窓に走行が入り、遅れを読めないため）。第228便。
  disposition: answered
