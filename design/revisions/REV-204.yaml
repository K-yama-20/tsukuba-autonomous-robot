modifications:
- id: ND-12
  set_nested:
    ros_node.responsibilities:
    - 正規化操作値を新 firmware（ND-17）の通信形式へ変換して送信（機器固有仕様をこの境界に閉じる。RQ-I036。形式は G-FIRMWARE）
    - cmd_vel の有無に関係なく一定周期（PRM-14）で最新値または中立を送り、入力途絶時は中立を送信する。古い指令を再送しない
    - ESP32 の STATUS／EVENT（IFD-43）を受信して /esp32/status に公開（IFD-38。表示・診断のみ、DEC-006）
    - 現 bridge の停止条件（STATUS 鮮度 0.25 s・drive 鮮度 0.15 s での DISARM）は firmware 書き直し（DEC-030）に伴い再設計対象。時間値は PRM-13=1.0 s・PRM-21=0.25 s（DEC-048、H-009 は閉じた）。PRM-09・PRM-14 は未確定
    - 手動優先（RQ-I023）と ESP32 側の中立化（RQ-I068）は ESP32 の責務で、本 node が代替しない
    - lifecycle node。シリアルポートは運用値（launch 引数 serial_port）。接続時に HELLO で boot_token を得て generated/params/firmware_config.yaml の設定を SET_CONFIG で登録する（apply_timing=runtime_set）。登録失敗は記録し、走行系の停止条件にはしない
    - 活性の間だけ PRM-14 の周期で COMMAND（flags bit0=1）を送る。値は IFD-16 が PRM-09 以内に受信されていればその値、そうでなければ中立。非活性では COMMAND を送らず、STATUS の受信と IFD-38 の発行は続ける
    - COMMAND の seq は STATUS の last_pc_seq より新しくする。bridge の新しい session で 0 に戻っても、起動したままの firmware に棄却されないように、STATUS の値まで進める（DEC-415、TRB-014）
    - IFD-38 は diagnostic_msgs/DiagnosticArray。プロトコルは docs/esp32_protocol_v4.md（REV-027）
  interpretation_append: 'REV-204（DEC-415）：COMMAND の seq を STATUS の last_pc_seq に合わせて進める。'
