id: REV-207
date: '2026-11-03'
summary: >-
  第195便：人の指示で、動き出しの試験の遅れの区間を、同じ方向を繰り返してから次の方向へ移る順序にする。結果の表に各方向の 1 回目と 2 回目以降の値を加える。電圧、倒し量、待ち時間は変えない。
basis_refs:
- DEC-418
intent_version_copy: design/baselines/intent_history/intent_v16_23170969d338.md
decisions:
- id: DEC-418
  kind: approval
  status: answered
  asked_on: '2026-11-03'
  answered_on: '2026-11-03'
  channel: chat
  question: >-
    （第195便）前輪の向きの影響を切り分けるため、遅れの試験を同じ方向を続けて測る順序に変えるか
  answer_verbatim: |
    指導の前に揺れているのは私が車椅子を動かしたからです。順序を変えて試験管を作成せよ。今x86では遅れの測定中です。毎回5秒も待つ必要あるかな？ベースを取っているのかな
  affected_refs:
  - ND-20
  resulting_refs:
  - ND-20
  note: >-
    人の発言（原文、直前の発言）「回転した後だと、前輪が横や後ろを向いているため、動き始めの加速度が少し変になるのは仕方が無い。例えば最初が少し右に動いたり。」。
    「試験管」は「試験」の誤変換と解釈した（AI の解釈）。遅れの区間だけを変えた。T 解除、パルス、t_lock、T ロックの順序は変えていない。表に changed_s（その方向の 1 回目）と same_mean_s（2 回目以降の平均）を加えた。
    2 回目以降で前輪がそろうことは確かめていない（推測）。同じ方向に続けて進むので、移動距離は交互のときより伸びる。第192便で無効とした指令前の揺れは人が車椅子を動かしたもの（人の発言）。第195便。
  disposition: answered
