  question: allow_unknown＝true のとき、走行中に LiDAR で見えた帯の外を、帯と同じ「空き」として扱うか（global costmap の obstacle_layer の combination_method）
  answer_verbatim: |
    （分岐セッション「Side chat」からの転記。人の発言の原文、時系列の番号つき）
    3.「（選択式の質問への回答）「DEC-213 の「1.0 m」はどちらの値ですか？」→「A を 1.0 m、B は 5 m (Recommended)」／「帯の外の waypoint は、保存のときに警告を出しますか？」→「警告だけ出して保存 (Recommended)」／「allow_unknown＝true のとき、走行中に LiDAR で見えた帯の外を、帯と同じ「空き」として扱いますか？」→「帯の外は通れるが高い費用 (Recommended)」／「DEC-211 と DEC-212 はどうしますか？」→「後で答える」」
  affected_refs:
  - ND-10
  resulting_refs: []
  note: 採用：「帯の外は通れるが高い費用」。global costmap の obstacle_layer の combination_method を 2（MaxWithoutUnknownOverwrite：層の空きが不明を上書きしない）にする。上流の既定は 1（updateWithMax：空きが不明を上書きする）。根拠は分岐先が読んだ上流のソース（costmap_layer.cpp）、試験はしていない。 転記の出所は分岐セッション（local_11a193cd…「Side chat」、2026-10-21）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。設定値の変更・実装・rosbag からの作り直しは、メインのチャットで人に確かめてから行う（第103便）。
  disposition: answered
