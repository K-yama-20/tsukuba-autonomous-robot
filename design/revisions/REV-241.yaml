- id: DEC-451
  kind: approval
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【承認】速度の帰還の層（REV-241）の、AI が決めた振る舞いを確定してよいか。(1) 既定は無効（/config の speed_feedback_enabled が true
    になるまで今の動き）。(2) ゲイン・積分の上限・GLIM の速度の有効時間は、初めは未設定（未設定の PI はフィードフォワードだけ）。AI が模擬で決めた値を
    提示し、人が /config で入れる。(3) 層が有効の間は第86便の不感帯の補償（最低倒し量・しきい値）を使わない（フィードフォワードに不感帯が入っているので二重にしない）。
    (4) 最低速度より遅い目標は、フィードフォワードでは「止まる倒し量」と「動き出す倒し量」の間を直線でつないだ値になり（不感帯の中）、動き出すかは PI の積分しだい。
    (5) PI は倒し量の向きを目標の向きから反対にしない（減らすのは中立まで）。(6) 目標の符号が変わったとき、その軸の積分を 0 にする。
  answer_verbatim: ''
  affected_refs:
  - ND-11
  - IFD-52
  - DEC-171
  - DEC-181
  resulting_refs: []
  note: >-
    推奨：(1)〜(6) のまま。理由：(1)(2) は指示の推奨。(3) は指示の「二重にかからないこと」。(4) は指示の「実測のない区間は直線でつなぐ」の読み。
    (5) は後退の指令で前進を止めると、車椅子が後ろに動き出すおそれがあるため（推測）。代替案：(4) を「最低速度より遅い目標は最低速度で動く（動き出す倒し量を出す）」に
    する（#66 の案に近い。計画より速く動く）、または 0（動かない）にする。振る舞いの違い：(4) は最低速度より遅い目標で動く・止まるを繰り返すおそれがある（既知の懸念）。
    影響する ID：ND-11、IFD-52。決まらない場合に止まる作業：なし（層は既定で無効）。
