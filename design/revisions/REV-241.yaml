- id: IFD-70
  kind: designed_interface
  name: log/motion_feedback（速度の帰還の層の記録。gouda_motion_controller → rosbag）
  source_refs:
  - SRC-I026
  - SRC-I091
  design_status: 案
  adoption: designed_proposal
  field_bindings: {}
  related_refs:
  - IFD-16
  - IFD-25
  - IFD-52
  issue_refs: []
  interpretation: REV-241（DEC-450）で追加。番号は他の作業との重なりを避けて 70 にした。
  sensitivity:
  - operation
  requirement_refs:
  - RQ-I029
  - RQ-I020
  revision_ref: REV-241
  designed_interface:
    transport: topic
    name: log/motion_feedback
    message_type: >-
      gouda_interfaces/msg/MotionFeedback（header, uint32 config_revision, string mode（off・ff_pi・ff_only・neutral・no_feedforward）, string reason,
      float64 target_linear_x, target_angular_z, measured_linear_x, measured_angular_z, odometry_age_s, forward_ff, forward_p, forward_i, forward_out,
      turn_ff, turn_p, turn_i, turn_out。値がないときは NaN）
    standard_type: false
    custom_type_reason: 目標・GLIM の速度・フィードフォワード分・P 分・I 分・最終の倒し量を軸ごとに、層の状態と一緒に一つにまとめる標準型がない。
    purpose: diagnostic
    owner_ref: ND-11
    publisher_refs:
    - ND-11
    consumer_refs: []
    unit: m/s、rad/s、s、倒し量（−1〜1）
    frame: base_link
    time_semantics: >-
      ND-11 が活性の間、IFD-16 を出すたびに同じ時刻で出す（層が無効でも mode off で出す）。rosbag（ros2 bag record -a）で記録される。
      層の状態が変わったときは IFD-28 にも DecisionEvent（speed_feedback_mode）を出す。
    qos:
      reliability: reliable
      durability: volatile
      history_depth: 10
    version_dependency:
      status: none
      evidence: []
      note: ''
    legacy_refs: []
modifications:
- id: ND-11
  interpretation_append: >-
    REV-241（DEC-450、#65）：速度の帰還の層を足した。IFD-52 の speed_feedback_enabled が true のとき、各軸を実測の「倒し量→速度」（PRM-150〜160、
    倒し量 1 の点は PRM-39・PRM-78・PRM-40 で実測ではない）のフィードフォワードと、IFD-25 の twist（前後 linear.x、旋回 angular.z、受信時刻で古さを判定）との差の PI で出す。
    層が有効の間は DEC-171 案 A の補償を使わない。積分は出力が誤差の向きに飽和している間は止め、上限で切り、目標 0・符号の反転・中立の条件・手動の優先（IFD-38 の source が manual）・
    非活性で 0 にする。GLIM の速度が古い・届かない・PI の値が未設定のときはフィードフォワードだけで走り続け、IFD-70 と IFD-28 に出す。PI は倒し量の向きを目標の反対にしない。
    既定は無効（DEC-451）。
  set_nested:
    ros_node.publishes_refs:
    - IFD-16
    - IFD-28
    - IFD-70
    ros_node.subscribes_refs:
    - IFD-15
    - IFD-25
    - IFD-40
    - IFD-52
    - IFD-38
- id: IFD-52
  interpretation_append: >-
    REV-241（DEC-450）：速度の帰還の層の項目（speed_feedback_enabled、forward_kp・forward_ki・forward_i_limit、turn_kp・turn_ki・turn_i_limit、
    odometry_timeout_s）を同じタブ・同じファイル・同じ message に足した。speed_feedback_enabled が未設定なら false。ゲインは 0 以上、積分の上限は倒し量で
    0 以上 1 未満、有効時間は 0 より大きい秒。受け取ったらすぐ次の出力から使う（今の補償と同じ）。
- id: IFD-38
  interpretation_append: >-
    REV-241（DEC-450、DEC-453 で承認待ち）：ND-11 が source を読み、速度の帰還の層が有効のときだけ、manual の間は中立を出して積分を 0 にする（手動の優先の間、ESP32 は
    PC の指令を使わないので車体の動きは変わらない）。停止の条件にはしない（DEC-006 のまま）。
  set_nested:
    designed_interface.consumer_refs:
    - ND-02
    - ND-04
    - ND-11
- id: IFD-25
  interpretation_append: >-
    REV-241（DEC-450）：ND-11 は twist.linear.x・twist.angular.z を速度の帰還の層の実速度に使う（受信時刻で古さを判定）。twist は直前の 2 つの姿勢の差（ND-08）で、
    GLIM の ~/odom の twist（v_world_imu、線速度だけ）ではない。
decision_updates: []
