  question: >-
    （人からの指示）ND-11 に「GLIM の速度を使ったフィードフォワード＋PI 制御」の層を足す。人は「この指示文を、実装の承認とする（DEC-106）。
    人の原文として判断台帳に記録すること」と書いた。
  answer_verbatim: |
    # 指示：ND-11 に「GLIM の速度を使ったフィードフォワード＋PI 制御」の層を足す

    ## 目的
    Nav2 の速度の指令どおりに車体が動くようにする。今は指令を倒し量に換算して出すだけで、実際の速度を見て直す段がない（#65）。
    このため不感帯と応答の遅れを吸収できず、MPPI が発進できない（#61）。
    期限は 2026-11-07 の朝 7:00。実車で試せる状態を最優先にし、作り込みは後に回す。

    ## この指示の位置づけ
    - この指示文を、実装の承認とする（DEC-106）。人の原文として判断台帳に記録すること。
    - 対象は ND-11（gouda_motion_controller）と、その設定・試験・monitor の /config だけ。Nav2 の設定、ESP32 のファーム、vehicle_bridge は変えない。
    - 別のチャットが MPPI の open_loop（REV-240、PRM-141、DEC-449）を実装中。nav2_config.py には触れない。同じ作業ツリーを使うので、番号は reserve_ids.py で予約する。

    ## 最初に読むもの
    - CLAUDE.md、design/reports/status.md の第210・212便、第86便（不感帯の補償と /config「自律走行の出力」）
    - issue #65、#61、#66、#57
    - 実測：design/research/vehicle_pc/2026-11-07_min_speed/README.md（DEC-445）、2026-11-03 の車体試験（第192便）
    - ND-11 の今の実装と、GLIM の odometry の IF（正本で名前・周期・座標系を確かめる。推測で書かない）

    ## 作るもの
    1. フィードフォワード
       - 目標の速度（前進・後退・旋回）から倒し量を出す。実測の「倒し量→速度」を使う。
       - 実測のない区間は直線でつなぎ、どの点が実測でどの点が補間かを記録に書く。
    2. PI
       - GLIM の odometry から車体の前後の速度と旋回の速度を取り、目標との差に PI をかけて倒し量に足す。
       - 速度の取り方（odometry の twist か、位置の差分か）は、遅れと雑音を rosbag（records/20261107_005310）で比べて決める。第210便は位置の差分を使った。
       - 積分の飽和を防ぐ（出力の上限に当たったら積分を止める）。
       - 目標が 0、motion_hold、モードの切り替え、手動の優先のときは、積分を 0 に戻して中立を出す。
    3. GLIM の速度が古い・届かないとき
       - フィードフォワードだけで走り続ける。止めない。切り替わったことを診断に出す。
    4. 切り替えと値
       - /config「自律走行の出力」で、有効・無効と、ゲイン（前後の P・I、旋回の P・I）、積分の上限を変えられるようにする。
       - 既定は【無効（推奨：最初の実車は人が画面で有効にする）／有効】。
       - ゲインの初期値は【AI が模擬で決めて提示し、人が /config で変える（推奨）／人が指定する】。
       - 既存の不感帯の補償（第86便）との関係を決めて書く。二重にかからないこと。
    5. 記録
       - 目標、GLIM の速度、フィードフォワード分、PI 分、最終の倒し量を、rosbag で後から読める形で出す。

    ## 変えないこと
    - DAC の上限（PRM-45）、速度の上限、手動操作の優先、watchdog。
    - 安全機構を足さない、削らない（CLAUDE.md 1.12）。懸念は根拠つきで 1 回だけ書く。

    ## 確かめること
    - 単体試験：発進、目標 0 での中立、積分の飽和、GLIM の途絶での切り替え、hold での積分の初期化。
    - 模擬（x86 の ~/gouda_ws_sim か、ワークステーション。~/gouda_ws は使わない）：
      - 車体モデルに実測の不感帯、最低速度、旋回の立ち上がり約 2.4 s、動き出しの遅れが入っているかを先に確かめる。入っていなければ足す（試験専用）。
      - 層なし／層あり × MPPI（open_loop あり・なし）／RPP で、発進までの時間、目標との速度の差、横ずれ、振動の有無を比べる。
      - GLIM の速度の遅れを 0.1 s、0.3 s にした場合も見る。
    - 実車：AI は Gouda を起動・停止しない。車載 PC への反映は人の指示を待つ。反映の前に /mode/state が manual であることを確かめる。

    ## 先行事例（1.11）
    - 探す場所：ros2_control の diff_drive_controller、control_toolbox の PID、Autoware の縦方向の制御器、他チームの公開コード。
    - 候補ごとに採否と理由を書く。探せなかった所は「未調査」と書く。時間がなければ、自作の前に control_toolbox だけは確かめる。

    ## 既知の懸念（調べて報告する。判断は人）
    - GLIM の速度は LiDAR の周期で遅れる。遅れが大きいと PI が振動する。
    - 最低速度（約 0.09 m/s）より遅い目標は出せない。そこを狙うと動く・止まるを繰り返す。
    - 推定不能の間は GLIM の速度も信用できない（第196・198便との関係）。
    - 実測は各条件 1 回で、床の傾きの影響を分けていない。

    ## 報告
    - 03:30 までに、模擬の比較の表と、実車で最初に試す値の案を出す。そこで実装が終わっていなければ、できた範囲と残りを書く。
    - 規則どおり、変更セット、作業記録、status.md を更新する。実行していない試験は「未実行」と書く。コミットと push はしない。
