- id: DEC-453
  kind: approval
  status: pending
  asked_on: '2026-11-07'
  answered_on:
  channel: chat
  question: >-
    【承認】IFD-38（/esp32/status）は「表示・診断のみに使い、停止条件にしない（DEC-006）」としている。REV-241 では、指示の「手動の優先のときは、
    積分を 0 に戻して中立を出す」のために、ND-11 が IFD-38 の source を読み、source が manual の間は（層が有効のときだけ）中立を出して積分を 0 にする。
    この使い方を認めるか。
  answer_verbatim: ''
  affected_refs:
  - IFD-38
  - ND-11
  - DEC-006
  - DEC-450
  resulting_refs: []
  note: >-
    推奨：認める。理由：手動の優先の間は ESP32 が PC の指令を使わないので、PC 側の中立は車体の動きを変えない。停止の条件ではない。手動の優先を ND-11 が知る手段は
    ほかにない。代替案：IFD-38 を使わず、手動の優先の間も積分を続ける（手動を離した直後に、たまった積分で倒し量が跳ぶおそれ）。振る舞いの違い：層が有効のときだけ。
    IFD-38 が届かない間は、最後に受け取った source のまま（届かないことで止めはしない）。影響する ID：IFD-38、ND-11。決まらない場合に止まる作業：なし（実装は指示に従って入れた。
    回答が「認めない」なら外す）。DEC-006 は書き換えない。
