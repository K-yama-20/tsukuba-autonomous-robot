  - id: DEC-111
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-17'
    channel: chat
    question: 自己位置推定の方式の選定の提案（REV-051・REV-052）への人の追加の指示
    answer_verbatim: |
