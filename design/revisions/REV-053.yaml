# 変更セット REV-053（2026-10-17 第28便の続き: 人の指示「LeGO-LOAM と Autoware の ndt_matching も検討」を原文で記録。選定の提案に案 A3 を追加。実装はしていない）
# 適用: design/tools/apply_revision.py REV-053
id: REV-053
date: '2026-10-17'
summary: >-
  人が LeGO-LOAM と Autoware の ndt_matching も検討するよう指示した（DEC-111、原文）。上流の事実を確かめた。LeGO-LOAM は ROS 1 だけ（最後の更新 2020 年、ROS 2 への移植は Dashing で IMU なし）で、
  保存地図での自己位置推定はない。Autoware.AI の ndt_matching は ROS 1 だけで、Autoware.AI は終了（2023-03 に archive）。後継の Autoware Core の autoware_ndt_scan_matcher と
  autoware_ekf_localizer を案 A3 として design/proposals/localization_selection.md に加えた（品質の出力が最も豊富。EKF が map→base_link を出すため map→odom への中継と速度の中継が要り、
  依存が重い）。AI の推奨は、案 A3 をオフラインの評価に加えること。LeGO-LOAM と ndt_matching は外す。実装・設定の変更は人の個別の許可（DEC-106）まで行わない。
basis_refs: [DEC-111, DEC-109, DEC-021]
intent_version_copy: design/baselines/intent_history/intent_v9_183f8ee16455.md

