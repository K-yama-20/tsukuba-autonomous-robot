      autowareのndt_matching,
      も検討をしてほしい
    affected_refs: [DEC-021, Q-02, ND-07, ND-08, ND-09]
    resulting_refs: []
    note: >-
      design/proposals/localization_selection.md §3 の表に LeGO-LOAM、Autoware.AI の ndt_matching、Autoware Core の autoware_ndt_scan_matcher ＋ autoware_ekf_localizer を加え、
      §4 に案 A3（GLIM の odometry ＋ Autoware Core の NDT と EKF）と、LeGO-LOAM・ndt_matching を外す理由を書いた。評価に A3 を加えるかは提案 §8 の 7 で人に確認する。
    disposition: answered

decision_updates:
  - id: DEC-021
    set:
      note: >-
        Q-02（自己位置推定の方式）は AI の技術選定（候補比較を提示）。ゲート3では「方式未定のまま IF（TF・Odometry・pose）を固定する」案として提示。
        2026-10-17 に人が選定に進むよう指示した（DEC-109）。提案 design/proposals/localization_selection.md（推奨は 3D 照合。odometry は GLIM を odometry だけで、
        map→odom は lidar_localization_ros2 の NDT_OMP。比較に Nav2 AMCL）。人の指示（DEC-110）で Cartographer を案 C として加えた（第一候補にはしない）。
        人の指示（DEC-111）で LeGO-LOAM と Autoware の ndt_matching を検討し、ROS 1 だけのため外した。後継の Autoware Core の NDT を案 A3 として評価に加えることを推奨。
        外から見た振る舞いに関わるため、方式の採用は人の承認を得てから行う。
