    question: XT-32 の IP アドレス・宛先 IP・宛先ポートと、IMU のデバイス名（センサの IP 調査の結果）
    answer_verbatim: |
      @"/Users/AYARyoya/Downloads/Pandar Console.pdf"
      hesai xt-32のipアドレスは、192.168.1.201、宛先ipは192.168.1.100。Lidar destination portは2368．
      imuの名前は/dev/serial/by-id/usb-STMicroelectronics_STM32-Virtual_ComPort_007127944B34-if00。ttyACM0等の名前は使わない
    affected_refs: [ND-14, ND-15, IFD-21, IFD-22]
    resulting_refs: [PRM-50, PRM-51, PRM-52, PRM-54, FILE-PANDAR-CONSOLE-XT32]
    note: >-
      添付 PDF（Pandar Console、XT-32 の Web 画面の保存）は design/research/vehicle_pc/2026-10-13_pandar_console_xt32.pdf に複製（SHA-256 先頭 2184ef7edd1eb44c、原本と一致）。
      PDF の記載: IPv4 Address 192.168.1.201、Mask 255.255.255.0、Gateway 192.168.1.1、Destination IP 192.168.1.100、LiDAR Destination Port 2368、Spin Rate 600 rpm、
      Return Mode Strongest Return、Trigger Method Angle Based、Clock Source PTP、Profile 1588v2、PTP Network Transport UDP/IP、PTP Domain 0、Standby Mode In Operation。回答の値と一致。
      PTC ポートは PDF・回答とも記載なし（PRM-53、DEC-083）。Clock Source が PTP のため点群の時刻の扱いを DEC-083 で問う。
      IMU のデバイス名は旧実装 gouda_bringup/config/imu.yaml（commit 4dce4f0）の usb-STMicroelectronics_STM32_Virtual_ComPort_007137944B34-if00 と 2 か所（STM32 の後の「-」と「_」、シリアル番号の 3 桁目「2」と「3」）異なる。回答の値を採用し、一致の事実確認を DEC-082 で行う。
    disposition: answered
  - id: DEC-082
    kind: question
    status: pending
    asked_on: '2026-10-13'
    answered_on: null
    channel: chat
    question: >-
      【事実確認】IMU のデバイス名。回答は usb-STMicroelectronics_STM32-Virtual_ComPort_007127944B34-if00、旧実装の imu.yaml は usb-STMicroelectronics_STM32_Virtual_ComPort_007137944B34-if00。
      実車PC で ls -l /dev/serial/by-id/ の出力（原文）を確認したい。
    answer_verbatim: ''
    affected_refs: [PRM-54, ND-15]
    resulting_refs: []
    note: >-
      推奨: ls の出力を貼ってもらい、出力の文字列をそのまま PRM-54 に使う（違えば新しい REV で差し替え、本項目に原文を記録）。
      決まらない場合に止まる作業: IMU ドライバの起動（パスが違えばドライバが開けず、地図作成試験の IMU 入力がない）。他の作業は止まらない。
    disposition: fact_check_pending
  - id: DEC-083
    kind: question
    status: pending
    asked_on: '2026-10-13'
    answered_on: null
    channel: chat
    question: >-
      【承認】地図作成の実機試験での XT-32 の点群の時刻の扱いと PTC ポート。XT-32 は Clock Source=PTP（1588v2、UDP/IP、domain 0）。PC が PTP を配信しない場合、LiDAR の時刻は PC・IMU の時刻と一致しない。
      案 1（推奨）: ドライバの時刻を PC 受信時刻（use_timestamp_type=1）にする。案 2: PC を PTP 配信元にして LiDAR 時刻（use_timestamp_type=0）を使う（docs/time_synchronization.md の手順、scripts/time_sync_host.py）。
      PTC ポートは Hesai の工場既定で過去の観測（docs/gouda_runbook.md）とも同じ 9347 を使ってよいか。
    answer_verbatim: ''
    affected_refs: [PRM-53, PRM-55, ND-14, IFD-21, ND-06]
    resulting_refs: []
    note: >-
      推奨は案 1: IMU（USB）は PC 受信時刻で stamp されるため、同じ時計にそろえる最短の方法。受信遅延（ネットワーク・ドライバ処理）が点群全体に一律に乗り、GLIM の LiDAR–IMU 時刻合わせに誤差として残る（大きさは未計測）。
      案 2 は時刻精度が上がるが、PTP の起動・ロック確認の手順が試験に加わる（人の操作）。振る舞いの違い: GLIM へ渡る点群の header.stamp の基準。
      PTC ポートは補正ファイル（角度補正）を本体から取得するために使う。決まらない場合に止まる作業: XT-32 ドライバの設定生成と地図作成の実機試験。
    disposition: open_human

