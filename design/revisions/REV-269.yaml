  note: >-
    事実：TK-25 は docs/regulations_2026.md 62 行（本文は原本照合済と同文書に記載）。どの程度の減速で足りるか（速度、距離）の数値は規則の本文にない。
    人の発言（#81、2026-11-07）は「waypoint（付近）に到達したら急停止で問題ないです。ゆっくり止めるとかはしなくて良い。」で、DEC-482 の実装はこれに沿っている。
    規則の条文とこの発言の関係は人が決める（AI は条文があることを 1 回だけ伝える）。
    推奨：A 停止点の手前の区間（waypoint i → i+1 の属性、intent.md 17 行）の速度上限を人が下げる。コードは変えない。理由：既にある仕組みで、Nav2 の SpeedLimit の経路だけを使う（intent.md 31 行）。
    下げた上限で実際に減速が見えるかは模擬・実車で未確認。速度上限が MPPI の前進の下限（PRM-162、0.27 m/s）より低いときの動きも未確認。
    代替：B 何もしない（今のまま。#81 の発言どおり）。C 停止点に近づいたら Gouda が速度上限を下げる処理を足す（新しい処理と新しい値。速度上限の発行元を 1 つに保つ必要がある）。
    D 半径で止めるのをやめ Nav2 の goal の到達で止まる（DEC-488 の C と同じ）。
    振る舞いの違い：A は停止点の手前で遅くなる（所要時間が延びる。延びる量は未計算）。B は今と同じ。C・D はコードが変わる。
    決まらない場合に止まる作業：停止点の手前の区間の速度上限の値の確定。実装と模擬は止まらない。
    先行事例：この便では新しく探していない（未調査）。安全かどうかの判断は人（CLAUDE.md 1.12）。第243便。
