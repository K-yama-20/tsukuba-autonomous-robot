  channel: chat
  question: >-
    【承認】停止点（kind stop の waypoint）を、停止線・道路端に対してどこに置くか。今の実装（DEC-482）は、車体の原点（後輪軸の中央）が
    停止点から PRM-11（0.7 m）の内に入ったときに中立を出し、そこから停止距離 d だけ進んで止まる。推奨は「停止線は線の手前（0.1 m＋d）、
    道路端は端の手前（0.6 m＋d）に置く。d は実測（DEC-346 (1)・DEC-377 (1)）で決め、決まるまで値は tbd」。
  answer_verbatim: ''
  affected_refs:
  - DEC-482
  - DEC-343
  - DEC-346
  - DEC-377
  - PRM-11
  - PRM-69
  - ND-03
  resulting_refs: []
  note: >-
    事実：規則 TK-23（停止線。車体の一部が手前 1 m〜奥 0.5 m に入り、どの部位も奥 0.5 m を越えない）、TK-24（道路端。車体の一部が手前 1.5 m 以内に入り、
    どの部位も道路端を越えない）（docs/regulations_2026.md 58〜61 行、本文は原本照合済と同文書に記載）。車体の外形は PRM-69（原点から前 0.55 m・後ろ 0.24 m、承認済み）。
    計算（AI、DEC-377 (1) と同じ値）：原点が止まってよい範囲は、停止線の手前 0.05〜1.55 m（中央は手前 0.80 m）、道路端の手前 0.55〜2.05 m（中央は手前 1.30 m）。
    今の実装で原点が止まる位置は「停止点の手前 0.7 m − d」（停止点にまっすぐ近づく場合。Nav2 の feedback の位置で判定する）。
    したがって停止点を置いてよい範囲は、停止線に対して「手前 0.85 m＋d 〜 奥 0.65 m − d」、道路端に対して「手前 1.35 m＋d 〜 奥 0.15 m − d」。
    範囲の中央は、停止線の手前 0.10 m＋d、道路端の手前 0.60 m＋d。
    d は実測していない。模擬 1 本（第239便、合成の車体の値で実測ではない）では d＝約 0.33 m で、このとき中央は停止線の手前 約 0.43 m、道路端の手前 約 0.93 m。
    停止点を線の上に置くと、d と自己位置のずれの和が 0.65 m を超えたときに前端が奥 0.5 m を越える。道路端の上に置くと 0.15 m で越える。
    含めていないもの：自己位置の推定のずれ、feedback の遅れ、斜めに近づく場合、斜面、速度による d の違い。
    推奨：A 上の式で置く（d は実測の後に確定。値は tbd）。理由：規則の帯の中央に止まり、手前と奥の両方に同じ余裕が残る。
    代替：B 停止点を線・道路端の上に置き、止める半径を PRM-11 と別の新しい値にする（新しいパラメータ。止める半径を停止線用・道路端用に分けられる）。
    C 半径で止めるのをやめ、Nav2 の goal の到達だけで止まる（Nav2 が減速して止まるが、MPPI の前進の下限 PRM-162 があるとゴールで止まれない例がある：第236便の訂正）。
    振る舞いの違い：A はコードを変えず、人が waypoint タブで置く位置だけが変わる。B・C はコードと設定が変わる。
    影響：DEC-482 の止まる位置、DEC-343、DEC-346 (1)、DEC-377 (1)、PRM-11、PRM-69。
    決まらない場合に止まる作業：本番のコースの停止点の位置の確定、止まる位置の受入の試験。実装と模擬は止まらない。
    先行事例：この便では新しく探していない（#52 の調査を使う。止める位置を「付近で止める」か「goal で止める」かは #52・#81 でも未調査）。
    安全かどうかの判断は人（CLAUDE.md 1.12）。第243便。
