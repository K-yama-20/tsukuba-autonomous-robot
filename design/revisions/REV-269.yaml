id: REV-269
date: '2026-11-07'
summary: >-
  第243便：人の指示（チャット「一時停止線での停止が出来るように、実装せよ。まずは計画を提示せよ。」「こちらで引き継ぐ」「向こうの完了を待つ」）。
  同じ指示の実装は別のセッションの第239便（REV-263、DEC-482）が先に済ませていたので、コードは変えず、終わった実装を規則の本文と照らし合わせた。
  訂正：REV-263 と第239便の作業記録は規則を「原本未照合」と書いたが、停止線・道路端の条文（TK-22〜TK-29）は docs/regulations_2026.md に
  本文が原本照合済で入っている（判定図 2 点も画像を読んだと同文書に記載。この便で AI が公式ページを読み直してはいない）。REV-263 は書き換えず、ここに記録する。
  見つけた不足（承認待ち）：(1) 停止点を線・道路端のどこに置くかの決まり（DEC-488）。今の実装は停止点の PRM-11 手前で中立を出すので、
  置く位置は停止距離（未実測）で変わる。第239便の作業記録の「線の上か少し奥に置く必要がある見込み」は、PRM-69 の外形で計算すると逆で、
  線の上に置くと奥側の余裕が小さい。(2) TK-25「一時停止の前に早めに減速を開始すること」に今の実装は何もしていない（DEC-489）。
  値・コード・設定・launch は変えていない。
