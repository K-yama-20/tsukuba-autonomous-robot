  question: >-
    【承認】規則 TK-25「周囲から一時停止することが分かるように、一時停止の前に早めに減速を開始すること」をどう満たすか。
    今の実装（DEC-482）は停止点の PRM-11 の内に入るまで減速せず、入ったら中立を出す。推奨は「停止点の手前の区間の速度上限を、人が waypoint タブで下げる運用」。
  answer_verbatim: ''
  affected_refs:
  - DEC-482
  - DEC-343
