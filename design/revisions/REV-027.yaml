modifications:
  - id: IFD-40
    set_nested:
      designed_interface.message_type: gouda_interfaces/msg/MotionHold（header, bool hold, string reason, uint8 mode。mode は SoftwareMode と同じ値）
      designed_interface.time_semantics: >-
        モード遷移時に即時発行し、mode/state と同じ契機で再発行（周期は PRM-16）。hold=true は自律走行以外のすべてのモードで発行。
        ND-11 は hold=true、hold の期限切れ（最後の受信から PRM-42）、または cmd_vel の途絶（PRM-08）のいずれかで中立を出す。
        transient_local により ND-11 の再起動後も最新の hold を受け取る。起動直後に未受信なら hold 扱い（中立）。
    interpretation_append: 型は REV-027 で確定（工程5-5）。mode を string ではなく uint8 にしたのは SoftwareMode.mode と同じ値で記録・照合するため（意味の変更なし）。
  - id: IFD-17
    set_nested:
      designed_interface.name: ESP32 serial link（プロトコル v4。docs/esp32_protocol_v4.md）
      designed_interface.message_type: v4 フレーム（A5 5A、版 4、種別、長さ、seq、送信側 ms、payload、CRC-16/CCITT-FALSE）。PC→ESP32 は HELLO 0x01／COMMAND 0x02（boot_token, x_q10000, y_q10000, flags bit0=pc_enable_request）／SET_CONFIG 0x03／GET_STATUS 0x08／GET_CONFIG 0x09
      designed_interface.unit: 正規化値 q10000（x=右 +、y=前 +）。設定は mV・ms（docs/esp32_protocol_v4.md §5）。DAC 端点 mV は人が登録（Q-03、DEC-077）
      designed_interface.time_semantics: >-
        送信周期 PRM-14（未確定。仮値 0.1 s）。ESP32 は最後の有効 PC 指令フレーム（CRC・版・boot_token・seq が正しいもの）の受信から PRM-13=1.0 s（DEC-048）で PC 指令源を無効にし中立（RQ-I068）。
        不正フレームは期限を延長しない。PC 指令源の有効化は flags bit0 かつ中立の COMMAND で行い、期限切れ後の再有効化も同じ（人の承認操作ではなく bridge が活性化時に自動で行う）。
    interpretation_append: プロトコル v4 は REV-027 で設計（G-FIRMWARE）。版の照合は実機への書き込みと DEC-050 の実機照合で行う。
  - id: IFD-43
    set_nested:
      designed_interface.name: ESP32 serial link（プロトコル v4。docs/esp32_protocol_v4.md）
      designed_interface.message_type: v4 フレーム。ESP32→PC は HELLO_REPLY 0x80（boot_token, config_valid, config_generation）／STATUS 0x81（source, reason, flags, 手動・PC・適用の正規化値, 要求 mV, DAC コード, pc_age_ms, bt_age_ms, last_pc_seq, uptime_ms）／EVENT 0x82（code, arg, esp_ms）／CONFIG 0x84／ACK 0x85
      designed_interface.unit: 正規化値 q10000、mV（要求値。電圧測定値ではない）、DAC コード 0〜4095、ms
      designed_interface.time_semantics: STATUS は PRM-49 の周期（未確定。仮値 50 ms）で送信し、GET_STATUS でも 1 回送る。EVENT は状態変化時のみ。PC 側は表示・診断のみに使い停止条件にしない（DEC-006）。取得できない項目（非常停止状態・電池・実車運動・実電圧）は「不明」
  - id: IFD-38
    set_nested:
      designed_interface.message_type: diagnostic_msgs/msg/DiagnosticArray（status 1 件、name=esp32、values に v4 STATUS の各項目を key/value で載せる。取得できない項目は載せず monitor が「不明」と表示）
      designed_interface.time_semantics: IFD-43 の STATUS 受信ごとに発行。表示・診断のみに使い、停止条件にしない（DEC-006）。monitor は PRM-15 を超えて受信がなければ全項目を「不明」にし、モードや motion_hold は変えない（TS-12）
  - id: ND-11
    set_nested:
      ros_node.responsibilities:
        - >-
          Nav2 の cmd_vel を EMC-270 のジョイスティック特性に合わせた正規化操作値へ変換（M-012）
        - >-
          motion_hold=true、motion_hold の期限切れ、または cmd_vel の途絶 700 ms（PRM-08、DEC-048）・非有限値で中立を出す（DEC-004、RQ-I063）
        - >-
          中立を含む操作値を一定周期で発行し続ける（bridge の送信継続の入力）
        - >-
          cmd_vel の後段で独自に速度を抑える処理は加えない（RQ-I020）
        - >-
          lifecycle node。活性（active）の間だけ IFD-16 を PRM-41 の周期で発行し、非活性では発行しない（手動走行・事前地図作成では非中立を送らない）
        - >-
          cmd_vel の正規化は linear.x／PRM-39、angular.z／PRM-40 を [-1, 1] に飽和したもの。cmd_vel の後段で速度を抑えない（RQ-I020）。motion_hold の期限切れは最後の受信から PRM-42
        - >-
          設定はすべて generated/params/gouda_motion_controller.yaml（未確定値は trial ファイル）から読み、数値をハードコードしない（RQ-I076、DR-15）
  - id: ND-12
    set_nested:
      ros_node.responsibilities:
        - >-
          正規化操作値を新 firmware（ND-17）の通信形式へ変換して送信（機器固有仕様をこの境界に閉じる。RQ-I036。形式は G-FIRMWARE）
        - >-
          cmd_vel の有無に関係なく一定周期（PRM-14）で最新値または中立を送り、入力途絶時は中立を送信する。古い指令を再送しない
        - >-
          ESP32 の STATUS／EVENT（IFD-43）を受信して /esp32/status に公開（IFD-38。表示・診断のみ、DEC-006）
        - >-
          現 bridge の停止条件（STATUS 鮮度 0.25 s・drive 鮮度 0.15 s での DISARM）は firmware 書き直し（DEC-030）に伴い再設計対象。時間値は PRM-13=1.0 s・PRM-21=0.25 s（DEC-048、H-009 は閉じた）。PRM-09・PRM-14 は未確定
        - >-
          手動優先（RQ-I023）と ESP32 側の中立化（RQ-I068）は ESP32 の責務で、本 node が代替しない
        - >-
          lifecycle node。シリアルポートは運用値（launch 引数 serial_port）。接続時に HELLO で boot_token を得て generated/params/firmware_config.yaml の設定を SET_CONFIG で登録する（apply_timing=runtime_set）。登録失敗は記録し、走行系の停止条件にはしない
        - >-
          活性の間だけ PRM-14 の周期で COMMAND（flags bit0=1）を送る。値は IFD-16 が PRM-09 以内に受信されていればその値、そうでなければ中立。非活性では COMMAND を送らず、STATUS の受信と IFD-38 の発行は続ける
        - >-
          IFD-38 は diagnostic_msgs/DiagnosticArray。プロトコルは docs/esp32_protocol_v4.md（REV-027）
  - id: ND-17
    set_nested:
      ros_node.responsibilities:
        - >-
          PC からの正規化操作値を受け、DAC（MCP4922）で EMC-270 のジョイスティック相当電圧を出す。リレーによる純正ジョイスティック切替は使わず、給電中は常に DAC が電圧を出す（RQ-I077、DEC-037）
        - >-
          最後の有効な PC 指令フレームの受信から 1 s（PRM-13）で期限切れとし DAC を中立にする（RQ-I068、DEC-048）
        - >-
          手動操作の優先（RQ-I023）。Bluetooth ゲームパッドの操作が有効な間は PC 指令より優先する（経路の確認は DEC-042）
        - >-
          Bluetooth 報告の途絶 250 ms（PRM-21）で手動入力を無効にし中立にする既存動作を維持する（RQ-I024、DEC-048）
        - >-
          STATUS／EVENT を理由コード付きで PC へ送る（IFD-43。表示・診断のみ、DEC-006）
        - >-
          非常停止の検知・通知は行わない（RQ-I072）
        - >-
          プロトコル v4（docs/esp32_protocol_v4.md）。PC 指令源の有効化は COMMAND flags bit0 かつ中立の COMMAND。手動操作が中立に戻って PRM-48 安定した後に PC 指令へ戻る。手動入力の有効判定は deadzone PRM-47
        - >-
          設定（PRM-13・21・43〜49）は SET_CONFIG で登録して NVS に世代番号付きで保存し、無ければビルド時設定（generated/params/firmware_config.yaml から生成）を使う。DAC 値（PRM-43〜46）が未登録のときは config_valid=0 とし DAC へ書き込まない（DEC-077 の回答待ち）
        - >-
          採用しないもの（DEC-037・基板構成）：リレー制御、ADS1015 の出力監視、エンコーダ UART による中央探索、較正ログ
  - id: SO-11
    set_nested:
      state_owner.state_items:
        - name: axis_config
          description: DAC 電圧（PRM-43〜46）、PC 指令 watchdog（PRM-13）、BT 途絶（PRM-21）、手動仲裁（PRM-47・48）、STATUS 周期（PRM-49）の設定。PC から SET_CONFIG で登録し NVS に世代番号＋CRC で保存。無ければビルド時設定（生成ファイル由来）
          persistence: persisted
          restore_scope: 起動時に NVS の有効な最新世代を読む。DAC 値が無ければ config_valid=0 で DAC へ書き込まない（DEC-077）
        - name: ownership_state
          description: 現在の指令源（none／manual／pc）、PC 指令源の有効状態、最後の有効 PC 指令の受信時刻と seq、BT の接続・最終報告時刻・centered ラッチ、手動中立の安定開始時刻
          persistence: volatile
          restore_scope: 起動直後は中立・PC 指令源無効・centered 未観測
  - id: PRM-09
    set_nested:
      parameter.software_trial_value: 0.35
      parameter.software_trial_basis: PRM-08=0.7 s の 1/2 で、PRM-14 の仮値 0.1 s より長い（モデルの関係条件「PRM-08 より短く PRM-14 より長い」を満たす stub 試験用の仮値）。実車採用値ではない
  - id: PRM-14
    set_nested:
      parameter.software_trial_value: 0.1
      parameter.software_trial_basis: PRM-13=1.0 s の 1/10（モデルの条件「PRM-13 の 1/5 以下」を満たす）。旧 bridge の送信 timer 0.05 s（gouda_vehicle/gouda_vehicle/bridge.py）の 2 倍。stub 試験用の仮値で実車採用値ではない
  - id: PRM-16
    set_nested:
      parameter.software_trial_value: 0.2
      parameter.software_trial_basis: PRM-08=0.7 s より短い（モデルの条件）。PRM-42 の仮値 0.5 s の 2/5。stub 試験用の仮値で実車採用値ではない
  - id: G-FIRMWARE
    set_nested:
      issue.next_action: プロトコル v4 と firmware の振る舞いを docs/esp32_protocol_v4.md に設計（REV-027）。実装は firmware/gouda_esp32_v4（PlatformIO、Bluepad32）。残り：DAC 電圧の初期値（DEC-077）、手動仲裁値（DEC-079）、卓上試験 TS-17〜19、実機照合 DEC-050。firmware の版は本文書の版（v4）と build id で管理
    interpretation_append: 設計は REV-027（2026-10-10）。H-012 は DEC-037・DEC-042 で確定済み、H-009 は DEC-048 で閉じた。
