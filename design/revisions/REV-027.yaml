# ND-11・ND-12・ND-17 の設定項目 PRM-39〜49、未確定値の仮値（stub 試験専用）、人の判断事項 DEC-077〜079、試験 TS-29・TS-30）
# 適用: design/tools/apply_revision.py REV-027
id: REV-027
date: '2026-10-10'
summary: >-
  DEC-076 により工程5-5 に着手。設計前提を整理し、(1) IFD-40 の独自型 gouda_interfaces/msg/MotionHold（header, hold, reason, mode）を確定、
  (2) PC–ESP32 シリアルプロトコル v4 を docs/esp32_protocol_v4.md に設計（参照 firmware の可変長フレームと CRC、旧 v3 の boot token・seq・手動優先の仲裁・centered ラッチを統合。
  リレー・ADC 監視・エンコーダ較正は採用しない）、(3) 実装に必要な設定を宣言（ND-11 の最大速度 PRM-39・40、発行周期 PRM-41、motion_hold 期限 PRM-42。ND-17 の DAC 電圧 PRM-43〜46、
  手動仲裁 PRM-47・48、STATUS 周期 PRM-49。すべて未確定で、仮値は stub 試験専用）、(4) PRM-09・14・16 に stub 試験用の仮値を根拠付きで追加、
  (5) 人の判断事項を登録（DEC-077 DAC 電圧の初期値、DEC-078 基本契約 5 件の stub 試験を 5-5 の完了条件に含める案、DEC-079 手動仲裁の既存値の維持）、
  (6) 試験 TS-29（コーデック共通試験）・TS-30（motion_hold の発行）を追加。firmware のビルド環境は Mac の PlatformIO（espressif32 6.12.0、Bluepad32 4.1.0 パッケージ）で成立を確認（旧 firmware のビルド exit 0）。
basis_refs: [DEC-076, DEC-030, DEC-037, DEC-042, DEC-048, DEC-004, DEC-056]
