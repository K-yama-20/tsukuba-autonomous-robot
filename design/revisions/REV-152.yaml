summary: 第123便：人の指示（原文「周りは確認した。一時停止を終了してから、実車で自律走行開始を送って挙動を記録して。Gouda は前回と同じ位置・向きに置いている。」）で、一時停止（run-2f9eb1c5）を終了してから自律走行開始を送った（REV-151 を VM に写した状態）。初期化は 17 秒、18 秒で正常になり、開始の手順は Nav2 の設定と keepout のマスクの確認まで進んだ。25 秒に EKF の x・y の標準偏差が 0.51 m（PRM-92 の 0.5 m を超える）になって推定不能（ekf_covariance_large）になり、TR-07 で一時停止して開始の残りの手順は行われなかった。Nav2 の goal は送られず、速度の指令は 0 通、motion_hold は解かれていない。推定の位置は (−1.5, 0.08)、向き約 −67° で、人が置いた位置（Claude が使った初期姿勢 0.425, −0.835, −114°）から約 2.1 m・47° 離れている。Claude は再開せず、終了した。承認事項 DEC-286 を登録する。コードと設定は変えていない。
