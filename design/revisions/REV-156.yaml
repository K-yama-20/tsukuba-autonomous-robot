- id: DEC-293
  kind: measurement
  status: pending
  asked_on: '2026-10-22'
  answered_on: null
  channel: chat
  question: 【実測】人混みの中の自己位置推定を評価するため、XT-32・IMU・GNSS（RTK）を同時に記録するか。いつ・どこで記録するか（本番のコースの区間で人の多い時と少ない時、チームの人が車体の周りを歩く試験）
  answer_verbatim: ''
  affected_refs:
  - ND-07
  - ND-08
  - ND-19
  resulting_refs: []
  note: 推奨は取る。AI はオフラインで、NDT（今の前処理）と NDT（高さの帯 h をいくつか）を同じ rosbag に通し、RTK fix の GNSS との差、0.5 m を超える跳ねの回数、NDT のスコア・点の数、コースに沿った RTK fix の割合と切れる場所・長さ、人が同じ向きに歩く場面の GLIM の速度の誤りを比べる。これで決める値：高さ h、近くの点を捨てる距離（PRM-79）、NDT の品質のしきい値、GNSS の採否の規則、食い違いの判定（DEC-134 の T4）の値。証拠（rosbag、条件、解析のスクリプト、日付）がない値は確定にしない。代わりの案：試走会の記録だけ。決まらない場合に止まる作業：上の値の決定、DEC-290 の a に進むかの判断。第127便で登録。
  disposition: open_human
