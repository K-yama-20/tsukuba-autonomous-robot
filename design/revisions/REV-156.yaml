decisions:
- id: DEC-290
  kind: approval
  status: pending
  asked_on: '2026-10-22'
  answered_on: null
  channel: chat
  question: 【承認・方針】観客・他のロボットが多い本番で、自己位置推定を LiDAR だけに頼らないための方針を、提案 crowd_robust_localization_2026-10-22.md §5 の a（品質で重みを変える GNSS・NDT・GLIM の融合）、b（GNSS＋IMU が主、LiDAR は補助）、c（NDT が主のまま、LiDAR の対策と食い違いの見張りだけ）、d（区間ごとの切り替え）のどれにするか
  answer_verbatim: ''
  affected_refs:
  - ND-07
  - ND-08
  - ND-19
  resulting_refs: []
  note: 推奨は c をすぐ、評価（DEC-293）の後に a。理由：車輪のエンコーダがなく（M-008）、GNSS が切れたときに IMU だけでは位置を数秒しか保てない（加速度の偏り 0.01 m/s² で 10 秒 0.5 m、30 秒 4.5 m。AI の計算）。b は GNSS の切れ目で結局 NDT に頼り、切り替えの瞬間に跳ぶ。a は GNSS が fix の開けた場所では人の例示の案と同じ動きになる。a に進むには DEC-139・DEC-144 の (c)（RTK fix と方位の屋外の確認）と DEC-131・135（enu→map）が前提。a を採ると DEC-130 の仕様 T5（EKF での融合）を対象に入れることになり、ND-07 の契約が変わる。決まらない場合に止まる作業：GNSS を走行中に使う設計。LiDAR の側の対策（DEC-291）と評価（DEC-293）は止まらない。第127便で登録。
  disposition: open_human
- id: DEC-291
  kind: approval
  status: pending
  asked_on: '2026-10-22'
  answered_on: null
  channel: chat
  question: 【承認】NDT に入れる点を、地面からの高さ h 以上（人の頭より上）に絞る設定を gouda_a3_points に足すか。h の値は tbd（DEC-293 で決める）
  answer_verbatim: ''
  affected_refs:
  - ND-07
  - PRM-79
  resulting_refs: []
  note: 推奨は足す（帯なしも選べる形で、評価で比べられるように）。事前地図の側は今のまま全部の点。地面の高さは車体の高さから一定で近似する（坂では誤差）。目安：LiDAR の高さ 1.18 m から +15° の光線は約 3.1 m 先で 2.0 m を越える（+15° は XT-32 の仕様の記憶で原本未照合、AI の計算）。弱点は頭より上の構造が少ない開けた場所で点が足りなくなること。障害物（costmap）には全点を使い続ける（自己位置推定の入力だけの変更）。代わりの案：足さない、地図の側も同じ帯にする。決まらない場合に止まる作業：評価（DEC-293）のうち帯の比較のオフラインの部分は、試験用のスクリプトでできるため止まらない。止まるのは実装。第127便で登録。
  disposition: open_human
