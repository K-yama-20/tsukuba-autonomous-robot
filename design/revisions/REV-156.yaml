  - ND-19
  resulting_refs: []
  note: 推奨は、評価（DEC-293）で「GNSS も NDT も弱い時間」が何秒続くかを見てから決める。ただしハードの準備に時間がかかるので評価は早めに。足すと ESP32 の通信（esp32_protocol_v4）と local_odometry（M-008）の変更になる。代わりの案：すぐ始める、足さない（GNSS の速度を、GNSS が使える間の速度の観測として使う）。決まらない場合に止まる作業：なし。第127便で登録。
