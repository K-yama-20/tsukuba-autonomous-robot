# 変更セット REV-156（2026-10-22 第127便: 人混み・他のロボットの中での自己位置推定の対策の提案と DEC-290〜293 の登録）
# 適用: design/tools/apply_revision.py REV-156
id: REV-156
date: '2026-10-22'
summary: 第127便：人の指示（原文「現状だと、slamベースのナビゲーションとなっているが、当日は観客や他のロボットが周囲にたくさんいる為、lidarによるslamは性能が悪くなる恐れがある。これに対する対処を考えよ。例えば、事前地図とimuとgpsによるナビゲーションをメインとし、lidarは何らかの方法で補助的に活用する、など。」）を受けて、対策を検討し提案 design/proposals/crowd_robust_localization_2026-10-22.md を作った。自律走行中は事前地図の上での自己位置推定（GLIM の odometry と NDT・EKF）で、GNSS は初期位置にだけ使う設計。車輪のエンコーダがないため、GNSS が切れると位置を保てるのは LiDAR だけで、GNSS＋IMU を主にして LiDAR を補助に下げる案は危ないと判断した。推奨は、NDT の入力を人の頭より高い点に絞る LiDAR の対策を先に行い、人混みの記録で評価した後、GNSS（RTK fix）と NDT を品質で重み付けして融合する。承認事項 DEC-290〜292 と実測の項目 DEC-293 を登録する。コードと設定は変えていない。
basis_refs:
- ND-07
- ND-08
- ND-19
- DEC-130
- DEC-134
