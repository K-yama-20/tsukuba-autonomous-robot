# 変更セット REV-069（2026-10-19 第37便: 人の指示 DEC-141 の記録、PRM-65 の承認、configure_rx を PRM-74（未確定）に）
# 適用: design/tools/apply_revision.py REV-069
id: REV-069
date: '2026-10-19'
summary: '人の指示（DEC-141、原文）: PRM-65 を承認（serial:/dev/serial/by-id/usb-Septentrio_Septentrio_USB_Device_0100012541-if00、受信機の USB1）。センサー（IMU も GNSS も）はいつも by-id の名前で探す。GNSS の設定は /dev/serial/by-id/ の名前だけを受け付ける検査を加える（実装の許可）。DEC-140 はまだ決めず、決まるまで手でも Gouda でも septentrio のドライバを起動しない。そのため configure_rx を未確定の設定 PRM-74（決定先 DEC-140）として宣言し、値がない間 supervisor はドライバを起動しない。'
