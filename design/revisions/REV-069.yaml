decisions:
- id: DEC-141
  kind: approval
  status: answered
  asked_on: null
  answered_on: '2026-10-19'
  channel: chat
  question: PRM-65 の承認、センサーを by-id の名前で探すこと（GNSS の検査の実装の許可）、DEC-140 が決まるまでドライバを起動しないこと、DEC-140 の判断の材料の作成（人の指示）
  answer_verbatim: "次の 3 点を指示する。人の回答として判断台帳に原文で記録すること。\n\n1. PRM-65（GNSS ドライバの接続先）を承認する。値は by-id の名前を使い、\n   serial:/dev/serial/by-id/usb-Septentrio_Septentrio_USB_Device_0100012541-if00（受信機の USB1）とする。\n   ttyACM の番号では指定しない。\n\n2. Gouda が起動するときは、センサー（IMU も GNSS も）をいつも by-id の名前で探すこと。\n   IMU も mosaic-go も ttyACM になり、差す順や再接続で番号が入れ替わるため。\n   GNSS の設定（gnss_config）は、今は serial: の後ろにどんなパスでも受け付けるので、\n   IMU と同じく /dev/serial/by-id/ の名前だけを受け付け、それ以外ならドライバを起動せず理由を記録する検査を加えること（実装を許可する）。\n   単体試験を足し、IMU と GNSS を同時につないだ場合でも取り違えないこと（名前の指す実体で見張る・使用中を判定する）を確かめること。\n\n3. DEC-140（configure_rx を使うか）はまだ決めない。決まるまで、手でも Gouda でも septentrio のドライバを起動しないこと。\n   判断の材料として、configure_rx を false にした場合に受信機に先に設定しておく必要がある SBF の出力\n   （ブロック名、出力先 USB1、間隔、使うストリームの番号）と、その設定を人が行う手順の案を、\n   私の注意事項（reports/mosaic-G5_P6_取扱上の注意事項.md の §4〜§6: gso で確認してから、Res1〜4 は使わない、Boot 保存は別の工程）に沿って出すこと。\n   受信機のポートには触らないこと（読むだけでも、raw・エコー無効の確認と私の許可の後）。\n\n終わったら、変更、試験の結果、DEC-140 の判断の材料を報告すること。commit はしないこと。\n"
  affected_refs:
  - PRM-65
  - ND-18
  - ND-19
  - ND-15
  - DEC-140
