  note: PRM-65 を承認値にした（REV-069）。「決まるまで…Gouda でも起動しない」を守るため、configure_rx を未確定の設定 PRM-74 にし、supervisor は値がない間ドライバを起動しない（AI の判断。PRM-65 だけが決まると Gouda の起動でドライバが configure_rx true のまま起動するため）。IMU の設定にも by-id の名前だけを受け付ける検査を加えた（指示の 2 の「センサー（IMU も GNSS も）をいつも by-id の名前で探すこと」。それまでは PRM-54 の値が by-id であるだけで、検査はなかった）。
