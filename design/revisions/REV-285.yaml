summary: >-
  第260便：第258便の提案（design/proposals/speed_chain_and_mask_gradient_2026-11-07.md、issue #105）の A・B・C を、人の回答「A・B・C 全部」と
  「A,B,C全部を採用した状況でのシミュレーションを回せ。」で実装する。A（DEC-505）：PRM-131 を自律走行の上限 V_auto に改め、velocity_smoother の
