    保存した値があればそれが使われる。そのときは人が消す）。V_move は軸ごとに実測の最低速度（PRM-152・155・158、DEC-445）で、動き出す
    倒し量は表の V_move での値（PRM-151・154・157）。ヒステリシス h は V_move/2 のしきい値を中立のとき +h/2、動いているとき −h/2 にずらす。
    旋回の h は h ×（旋回の V_move ÷ 前進の V_move）rad/s（番号を足さないための AI の読み）。速度の帰還の層が無効（既定）のときも床と表で
    倒し量を作る（今までは PRM-39 での正規化）。人が /config で不感帯の補償（DEC-171）を入れた向きは補償のまま。帰還の層が有効のときは
    PI の目標に床を掛ける。その場の旋回の倒し量（左 0.30・右 0.18、第192便）は正本にない実測の候補（DEC-409 未決）なので使っていない：
    その場の旋回は表（前進中の旋回の実測、PRM-156〜160）のまま（未判定）。ヒステリシスの値は DEC-508。第260便。安全かどうかの判断は人（1.12）。
