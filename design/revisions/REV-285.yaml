    （REV-241 のフィードフォワード）。行き来を防ぐヒステリシス。旋回も同じ扱い。open_loop（PRM-141）と goal の出し直し（PRM-161）は変えない。
    AI の質問は「A・B・C のどこまで実装に進めますか？」。
  answer_verbatim: |
