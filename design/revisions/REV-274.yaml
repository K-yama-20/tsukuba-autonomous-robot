    note: |
      事実（docs/mid360_driver_interfaces.md 3 章。原本で確認、実機では未確認）：MID-360 は電源を入れると IMU を 200 Hz で送り始める（User Manual v1.2 PDF 17 ページ）。 ドライバは接続の通知のたびに IMU の送信を有効にし（上流 livox_lidar_callback.cpp 111 行）、止める ROS parameter はない。Gouda は雛形の imu_data_ip に PC のアドレスを入れる （mid360_config.py 43 行）ので PC に届き、ドライバは購読者の有無に関係なく livox/imu に出す（lddc.cpp 683〜688 行。remap なしで /livox/imu）。Gouda の node は購読しない。 rosbag は ros2 bag record -a（recorder_node.py 102 行）なので記録に入る。REV-242 の ND-20 の「使わない」は「購読しない」の意味で、送信は止めていない。 推奨：A（出したまま、走行中は使わない。記録をオフラインの解析で取り付けの傾きの確かめにだけ使う）。理由：振る舞いが今と同じ、静止時の重力の向きが記録に残り DEC-457 の実測と突き合わせられる、 設計案 mid360_architecture_2026-11-06.md の A-5 と同じ。 代替：B 送信を止める（上流を改変せずに止める手段は、雛形の imu_data_ip を空にする（止まるかは未確認）か、機器の設定 imu_data_en（通信プロトコル 373 行）を 0 にする （ドライバが接続のたびに有効に戻すので効かない見込み：ソースからの推測））。C 走行中に使う（GLIM ND-06 の IMU を ADIS16607-2（IFD-22）から替える、点群の歪みの補正など。 DEC-477・DEC-478 が先に要る。IMU の校正 #80 は approved がなく実装しない）。 振る舞いの違い：A は今と同じ。B は rosbag から IMU が消える（帯域・容量の差は未測定）。C は自己位置・障害物の入力が変わる（C を選ぶなら別の設計と承認）。 決まらない場合に止まる作業：/livox/imu の IF の正本への登録（IFD の番号の予約の仕組みもない）、IMU を使う実装・解析の決まり。P4 の試験（T04-1・T04-2・T04-6）は止まらない。 先行事例：探した場所は上流のソース、GLIM の設定、design/research/vehicle_pc/2026-11-06_mid360_connection/ledger.yaml の R-L-01〜06・R-M-01〜03（収集の担当の調査。AI は一部未照合）。 GLIM には Livox の g の出力を前提にした acc_scale がある（glim_v1.2.2/config_ros_v1.2.2.json 13・55 行）。C の採否は C を選ぶときに調べ直す。第235便の流れ D。 REV-274（第247便）：人の回答で推奨の A を採る（出したまま、走行中は使わない。記録は取り付けの確かめにだけオフラインで使う）。「水書」は「推奨」の変換の誤りと AI が読んだ（推測）。コード・設定は変わらない。
