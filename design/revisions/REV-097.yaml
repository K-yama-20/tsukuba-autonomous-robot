modifications:
- id: ND-17
  interpretation_append: 'REV-097（FILE-ESP32-DAC-WIRING-20261020）：DAC（MCP4922）の基準は ESP32 の 5V ピン（PC の USB 5V）を 1 kΩ・1 kΩ で半分にしたもの、倍率は 2 倍（GA=0）。出力は 5V の実電圧 × code/4096。リレー K1 は故障のため迂回し、R1・R2 の後から空中配線で EMC の入力へ（Y は J2-3、X の先は未確認）。EMC-270 との接続は DAC の電圧線 2 本と GND 1 本。R7 を除去（2026-10-20）。図面との違い（リレー迂回、空中配線、R7 除去、Q6 の netlist と kicad_pcb の不一致）の図面への反映は人の判断。'
- id: PRM-46
  interpretation_append: 'REV-097：フルスケールは 5V の実電圧に等しい（倍率 2 倍、基準は 5V の半分）。無負荷の実測 4.72 V（FILE-ESP32-DAC-WIRING-20261020）。実測値への置き換えは DEC-161。人の補足（転記）「電圧合計は√x^2+y^2<=4700mvであるべきだ。」は DEC-160 に記録。'
decision_updates:
- id: DEC-160
  set:
    note: '推奨：基板の MCP4922 の VREF（とゲイン）の実際の値にする。VREF が 4800 mV 以上なら、その値を PRM-46 にする。VREF が 4800 mV 未満なら、DAC は 4800 mV を出せないので、最大を下げる（DEC-159 の見直し）。代替：測るまで 4800 mV 以上の仮の値にする（mV→コードの換算がずれ、全電圧が比例してずれるので推奨しない）。決まらない場合に止まる作業：実車向け firmware の書き込み（設定が不正のため DAC に書かない）。 REV-097 追記：分岐セッションで人が「（x,y軸の合計値）」を補足（転記）「電圧合計は√x^2+y^2<=4700mvであるべきだ。」「…正方形状の電圧は物理的に出せない。円形にしか動かせないからね。」。円の制限は firmware の mapVoltage で行う（中心＝(最小＋最大)/2、半径＝(最大−最小)/2）。DEC-159 の値では中心 2500 mV（中立と一致）・半径 2300 mV。この補足の 4700 mV が円の何（半径・直径・最大）を指すかは未確認。実測（FILE-ESP32-DAC-WIRING-20261020）：フルスケールは 5V の実電圧で無負荷 4.72 V、DAC の電源 4.78 V。MCP4922 の出力は電源電圧を超えられないので、今の給電では 4800 mV は出せない（DEC-161）。'
- id: DEC-050
  set:
    note: '事実確認であり承認ではない。新 firmware の実装・書き込み後に実機で確認する（人の協力）。 REV-097 追記（FILE-ESP32-DAC-WIRING-20261020）：照合する項目を加える。X の空中配線の先、R5・R6 の実装、リレー K1 が付いたままか、JP2・JP3 の状態、J1-3・J1-6 の元のジョイスティックの線、ESP32 の電源断時の車体の振る舞い。設計前提の「リレー不使用」は、リレーの故障による迂回で実物でも成り立っている（人の申告）。ADS1015 での監視（提案の候補）は、Y は R7 除去のため使えず、X は R5・R6 次第。'
