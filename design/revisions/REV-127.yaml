    note: '推奨は承認（置き場所は新しいタブ、範囲は 1〜9999999）。根拠：DEC-201。DEC-181 の扱い（monitor の値は PRM にしない）と合わない点：PRM-18 は承認済みの PRM で、monitor の値はその上書きになる。振る舞いの違い：回数を小さくすると、BT が早く失敗を返して一時停止しやすくなる（実験で Nav2 の失敗を見やすくする人の理由に合う）。決まらない場合に止まる作業：monitor での変更だけ（PRM-18 の 9999999 のまま走れる）。 REV-127（第98便）：人の回答「DEC-204: "Nav2 の設定と BT を gouda.sh start のときに一度だけ作る”実装で問題ない。」（転記）。読み（分岐先と同じ。確定ではない）：goal の behavior_tree で走行ごとに渡す案は採らず、今の実装（gouda.sh start で一度だけ作る）のままでよい。この読みでは monitor で変えた回数の反映は「次の gouda.sh start」になり、DEC-201 の「次の走行」と意味が変わる。monitor のタブ（段 5）を作るか、作るなら値を起動時に PRM-18 の代わりに読むかは原文から決まらないので DEC-207（pending）で確かめる。転記の出所は分岐セッション（local_a97307d5…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装の許可（DEC-106）としては、メインのチャットで人に確かめてから使う（第98便）。'
