    note: '推奨は承認。根拠：DEC-200・DEC-115（人の回答の転記）、design/proposals/nd07_a3_trial_design_2026-10-21.md。代わり：EstimatorStatus を NDT の診断だけで作る（EKF の診断を使わない、DEC-115 の問い 2 の (a)）。振る舞いの違い：承認すると、自律走行の中で推定不能を検出したら一時停止する（今は推定不能を見ない）。決まらない場合に止まる作業：ND-07 の実装と自律走行の開始（TR-05 は ND-07 がないと拒否のまま）。安全の注意：一時停止は PC 出力の中立化で車体の停止の保証ではない。推定不能の判定は誤った姿勢を正常とみなすことを防げない（評価の 0.546 m の例）。 REV-127（第98便）：人の回答「DEC-203: 許可する」（転記）。ND-07 の構成（design/proposals/nd07_a3_trial_design_2026-10-21.md §2）と推定不能の判定・一時停止の経路（§3）を正本に入れ、段 2〜4 を実装することへの許可。転記の出所は分岐セッション（local_a97307d5…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装の許可（DEC-106）としては、メインのチャットで人に確かめてから使う（第98便）。'
