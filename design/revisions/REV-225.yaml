  note: >
    意味：Nav2 の goal が失敗（SUCCEEDED・CANCELED 以外）で終わっても、TR-07 で待機モードに入らない。intent.md 第17版 19 行（RQ-I104）の「待機モードに入らずとも良い」のうち、入らない側を人が選んだ。確定済みの DEC-200（Nav2 の失敗で一時停止）は書き換えず、Nav2 の部分をこの項目で置き換える。推定不能の扱いは DEC-342・350・365 のまま。入らない代わりに何をするか（回復の構成）は未決で、DEC-438 に登録した。DEC-307・DEC-366 はその候補として pending のまま。実装：していない。今の実装（mode_manager_node.py の _on_nav_result）は、localization_wait の間を除き、Nav2 の失敗で TR-07 の待機に入る。待機に入らない変更だけを先に入れると、goal が終わったまま次の goal が出ず、自律走行モードのまま止まり続ける（3 分の滞留で失格の恐れ）。実装の時期は DEC-106 により人の指示を待つ。1 行目の質問（PC 再起動の後に事前地図作成に戻らない理由）への AI の説明は第206便の作業記録に書いた。戻り先は intent.md 第17版 100 行（RQ-I118）の人の記載「直前が事前地図作成/待機モードなら待機モードへ復帰」による。DEC-316 は (1)(3)(4) の回答がまだないので pending のまま。
