      ・Navigationに関しては、なるべくNav2に機能を持たせ、Nav2に含まれる機能を独自プログラムで実装しない。OSSとして公開されており使用実績の豊富なものについては、Nav2に追加しても良い。
    affected_refs: [FILE-INTENT-V9, RQ-I057, DEC-021, Q-02, ND-07]
    resulting_refs: [AR-010, RQ-I083, C-026]
    note: >-
      自己位置推定の方式の選定の提案（design/proposals/localization_selection.md §9 の 2）で尋ねていた「Nav2 に機能を持たせ」の読みに関わる。
      AI の読み: 公開された OSS で使用実績の豊富なものは、Nav2 に追加して使ってよい。案 A（lidar_localization_ros2）・案 A3（Autoware Core の NDT と EKF）の外部の推定器は、
      この条件に当てはまるかで判断される。「使用実績の豊富」の判断は人が行う（AI は判断の材料を示す）。
    disposition: answered

