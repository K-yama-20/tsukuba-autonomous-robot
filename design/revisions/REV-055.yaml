        人の回答（DEC-112）で検討の範囲は案 A（GLIM の odometry ＋ lidar_localization_ros2）、案 A3（GLIM の odometry ＋ Autoware Core の NDT と EKF）、案 B（GLIM の odometry ＋ Nav2 AMCL）。
        intent.md 第10版（DEC-113）で、公開された OSS で使用実績の豊富なものは Nav2 に追加してよいと明記された。提案は design/proposals/localization_selection.md。
        rosbag は VM に移さない。外から見た振る舞いに関わるため、方式の採用は人の承認を得てから行う。

