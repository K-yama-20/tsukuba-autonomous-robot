  - ND-11
  note: DEC-169 の実装（第72便の案）：mode_manager が TR-03 の後に vehicle_bridge を configure する（非同期、activate はしないので COMMAND は送らない）。失敗は DecisionEvent に残し、地図作成は止めない。TR-04 の後も configure のまま（自律走行の終了 TR-11・12 の後と同じ、inactive）。目的は人の発言（原文、DEC-169 の前）「事前地図作製中に、btコントローラからの司令をrosbagに記録する」で、/esp32/status（IFD-38）が rosbag（-a）に入る。DEC-172 の実装：linear.x が負のときは PRM-78 で割る。
  disposition: answered
- id: DEC-181
  kind: approval
  status: answered
  asked_on: '2026-10-21'
  answered_on: '2026-10-21'
  channel: chat
  question: 不感帯の補償（DEC-171 案 A）の最低倒し量としきい値の設定の場所（人の要望）と、その作りの 3 点（選択式）：設定の項目、未設定のときの動き、保存したときの反映の時期
  answer_verbatim: "DEC-171について追加の要望がある。最低倒し量としきい値はmonitorで設定できるようにしてほしい。/configの中に新しいタブを作って、そこで設定できるようにせよ。\n（選択式の質問への回答）「不感帯の補償で、/config の新しいタブに置く値はどれにしますか？」→「最低倒し量3つ＋しきい値3つ」。「値がまだ入っていない（UNKNOWN の）ときは、どう動かしますか？」→「補償しない（今の動き） (Recommended)」。「/config で値を保存したら、いつ反映しますか？」→「保存したらすぐ」\n"
  affected_refs:
  - ND-11
  - ND-02
  - IFD-26
  - RQ-I020
  resulting_refs:
  - IFD-52
  - TS-40
  note: 選択肢の説明（AI が示したもの）：「最低倒し量3つ＋しきい値3つ」＝しきい値も前進・後退・旋回で別々に持つ（設定は 6 つ）。「補償しない（今の動き）」＝倒し量をそのまま出し、未設定だったことを記録に残す。「保存したらすぐ」＝走行中でも、保存した直後の指令から新しい値を使う。値は人が monitor で入れる運用値で、generated/params の PRM にはしない（センサの取付値の /config と同じ扱い。人の要望）。値の範囲は 0 以上 1 未満（倒し量の正規化の範囲 [-1, 1] の内側）。ある向きの最低倒し量としきい値のどちらかが未設定なら、その向きは補償しない。
  disposition: answered
