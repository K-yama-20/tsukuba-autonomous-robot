  designed_interface:
    transport: topic
    name: config/motion_compensation
    message_type: gouda_interfaces/msg/MotionCompensation（header, uint32 config_revision, float64 forward_min, forward_threshold, reverse_min, reverse_threshold, turn_min, turn_threshold。未設定は NaN）
    standard_type: false
    custom_type_reason: 前進・後退・旋回の最低倒し量としきい値と設定版を、未設定を区別して一つにまとめる標準型がない。
    purpose: configuration
    owner_ref: ND-02
    publisher_refs:
    - ND-02
    consumer_refs:
    - ND-11
    - ND-04
    unit: 倒し量（正規化操作値の大きさ、0 以上 1 未満）
    frame:
    time_semantics: monitor の起動時と /config の保存のたびに発行（周期の値は持たない）。transient_local により ND-11 の再起動後も最新の値を受け取る。ND-11 は受け取ったらすぐ次の出力から使う（走行中も。DEC-181）。受け取っていない間・未設定の向きは補償しない。補償の式（DEC-171 案 A）：その向きの倒し量の大きさ r がしきい値未満なら 0、しきい値以上なら 最低倒し量＋(1−最低倒し量)×r（符号は元のまま）。前進・後退は前後の軸の符号で、旋回は左右とも同じ値。
    qos:
      reliability: reliable
      durability: transient_local
      history_depth: 1
    version_dependency:
      status: none
      evidence: []
      note: ''
    legacy_refs: []
