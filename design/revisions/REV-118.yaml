modifications:
- id: ND-11
  set_nested:
    ros_node.responsibilities:
    - Nav2 の cmd_vel を EMC-270 のジョイスティック特性に合わせた正規化操作値へ変換（M-012）
    - motion_hold=true、motion_hold の期限切れ、または cmd_vel の途絶 700 ms（PRM-08、DEC-048）・非有限値で中立を出す（DEC-004、RQ-I063）
    - 中立を含む操作値を一定周期で発行し続ける（bridge の送信継続の入力）
    - cmd_vel の後段で独自に速度を抑える処理は加えない（RQ-I020）。例外は不感帯の補償のしきい値未満を中立にすること（DEC-171 案 A、人の承認）
    - lifecycle node。活性（active）の間だけ IFD-16 を PRM-41 の周期で発行し、非活性では発行しない（手動走行・事前地図作成では非中立を送らない）
    - cmd_vel の正規化は linear.x が 0 以上なら PRM-39、負なら PRM-78 で割り（DEC-172）、angular.z は PRM-40 で割って、[-1, 1] に飽和したもの。motion_hold の期限切れは最後の受信から PRM-42
    - 不感帯の補償（DEC-171 案 A、DEC-181）：IFD-52 の前進・後退・旋回の最低倒し量としきい値で、正規化した倒し量を補償する。受け取ったらすぐ使い、受け取るたびに DecisionEvent に残す。未設定の向きは補償しない。中立の条件は補償より先に効く
    - 設定はすべて generated/params/gouda_motion_controller.yaml（未確定値は trial ファイル）から読み、数値をハードコードしない（RQ-I076、DR-15）。補償の値は人が monitor の /config で入れる（IFD-52）
    ros_node.subscribes_refs:
    - IFD-15
    - IFD-25
    - IFD-40
    - IFD-52
  interpretation_append: REV-118（DEC-180・181）：後退の正規化（PRM-78）と不感帯の補償（IFD-52）を実装。補償の値は monitor の /config の「自律走行の出力」タブで人が入れ、保存したらすぐ使う。未設定の向きは補償しない。
- id: ND-02
  set_nested:
    ros_node.publishes_refs:
    - IFD-26
    - IFD-39
    - IFD-41
    - IFD-28
    - IFD-52
  interpretation_append: REV-118（DEC-181）：/config の中をタブに分け、センサの取付の設定に加えて「自律走行の出力」タブで不感帯の補償の最低倒し量としきい値（前進・後退・旋回）を入力・保存する。保存先は <data_root>/config/motion_compensation.json（UNKNOWN は推測で埋めない）。起動時と保存のたびに IFD-52 を発行し、DecisionEvent（event=settings）に残す。
- id: ND-12
  set_nested:
    ros_node.placement_rationale: 手動走行・事前地図作成では非活性（非中立を送らない）。事前地図作成の開始（TR-03）で mode_manager が configure する（DEC-169・DEC-180。接続・設定の登録・STATUS の受信と発行まで、COMMAND は送らない）。事前地図作成の終了後と自律走行の終了後は inactive のまま接続を保つ。
  interpretation_append: REV-118（DEC-169・DEC-180）：事前地図作成の開始で configure される。目的は、事前地図作成中のゲームパッドの指令（/esp32/status の manual_x・manual_y など）を rosbag に記録すること（人の発言）。あわせて事前地図作成のセッションの USB の切断回数（IFD-51）を数えられる。
- id: ND-03
  interpretation_append: REV-118（DEC-169・DEC-180）：TR-03 の後に、IFD-36 で vehicle_bridge（ND-12）を configure する（非同期、activate はしない）。失敗は DecisionEvent（vehicle_bridge_configure_failed）に残し、地図作成は止めない。TR-04 では何もしない（接続したまま）。
- id: TR-03
  set_nested:
    transition.actions:
    - GLIM（ND-06）を起動・有効化（glim_runner。実行設定は配布テンプレートから生成、dump 先は作業領域 mapping/{origin_id}/glim_dump）。失敗は DecisionEvent（mapping_start_failed）で monitor に表示し、遷移を拒否
    - GLIM の T_lidar_imu を /config（IFD-26）の取付値から生成して実行設定に書き込み、値・未設定で中立要素にした項目・設定版を DecisionEvent（glim_extrinsic）に残す。未設定は遷移を拒否する理由にしない（RQ-I081）
    - 記録の自動開始を要求（IFD-45 record/log/start_pre_mapping。契機は人の地図作成開始ボタン：RQ-I015）。非同期で呼び、失敗・無応答でも地図作成の開始を止めない。失敗は DecisionEvent と monitor のポップアップ
    - 設定状況を記録（地図作成前：RQ-I015。GLIM の topic／frame・設定ディレクトリを DecisionEvent に残す）
    - vehicle_bridge（ND-12）を configure する（IFD-36、DEC-169・DEC-180）。遷移の後に非同期で行い、activate はしない（COMMAND を送らない）。既に configure 済みなら何もしない。失敗は DecisionEvent（vehicle_bridge_configure_failed）に残し、地図作成の開始を止めない
- id: PRM-78
  set:
    interpretation: 'REV-116: DEC-172 で人が 1.7 km/h を指定（1700/3600＝0.472 m/s）。REV-118（DEC-180）：motion_controller が linear.x の負の値をこの値で割る。'
