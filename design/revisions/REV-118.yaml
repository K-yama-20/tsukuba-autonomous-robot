  question: 実装の許可（handover_2026-10-21.md §5 の 1：vehicle_bridge を事前地図作成でも configure する（DEC-169）、§5 の 3：後退の正規化で PRM-78 を motion_controller で使う（DEC-172））。あわせて、事前地図作成の終了後の vehicle_bridge の扱い（選択肢：接続したまま（推奨）／切断する）
  answer_verbatim: "DEC-169, DEC-172を許可する。\n（選択式の質問「DEC-169 の vehicle_bridge は、地図作成の開始で接続します（PC の指令は送らず、接続に失敗しても地図作成は止めない）。地図作成の終了後はどうしますか？」への回答）「接続したまま (Recommended)」\n"
  affected_refs:
