# 変更セット REV-118（2026-10-21 第86便: DEC-180・181、後退の正規化、不感帯の補償と /config のタブ、事前地図作成での vehicle_bridge の configure）
# 適用: design/tools/apply_revision.py REV-118
id: REV-118
date: '2026-10-21'
summary: 人の許可（DEC-180、原文）で、後退の正規化（DEC-172、PRM-78 を ND-11 で使う）と、事前地図作成の開始での vehicle_bridge の configure（DEC-169。PC 指令は送らない、失敗しても地図作成は止めない、終了後も接続したまま）を実装する。人の要望（DEC-181、原文）で、不感帯の補償（DEC-171 案 A）の最低倒し量としきい値を前進・後退・旋回ごとに monitor の /config の新しいタブで設定し、保存したらすぐ ND-11 に反映する（IFD-52 を追加）。未設定の向きは補償しない。
