# 変更セット REV-047（2026-10-14 第26便: x86 機の地図作成 2 件（廊下・屋外）の AI による判定の記録）
# 適用: design/tools/apply_revision.py REV-047
id: REV-047
date: '2026-10-14'
summary: >-
  x86 機で人が地図作成をした 2 件（1〜2 回目と同じ廊下、屋外）の原図とログを解析した。
  廊下: GLIM が全 frame を処理（10.00 Hz、欠けなし）、出発点から 0.27 m で終了、frame の間の最大の移動 0.13 m、submap ごとの壁の位置が一致。原図は整合。
  VM と同じく廊下の向きに 4.40 度の一様な傾きがあり（廊下の水平は人に確認中）、床より下の点（11.4 %）で 2D 変換は不合格（G-FLOOR-REFLECTION）。
  屋外（10.5 分、580 m）: LiDAR の frame が 3 回、2.7〜3.5 s 途切れ、そのたびに約 1 分間、点と IMU の時刻の差が 1〜3.6 s になり、3 回目で約 9 m ずれた。
  同じ場所を通った所で高さが中央値 1.8 m 違い、地面が 2 層に写る。原図は不合格（G-LIDAR-DROPOUT として登録）。2D 変換も不合格（地面の推定が下の層と外れた点に引かれる）。
  x86 機では GLIM が 10 Hz 近くを処理できるため、VM での処理周期の低さは VM に固有と見られる（G-DDS）。
basis_refs: [DEC-099, DEC-100]
intent_version_copy: design/baselines/intent_history/intent_v9_183f8ee16455.md

