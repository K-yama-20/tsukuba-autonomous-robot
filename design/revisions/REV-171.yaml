  resulting_refs: []
  note: >-
    AI の解釈：B の説明で「B だけでは足りず、A と組み合わせて使う前提」と示した後の回答なので、A＋B の実装の許可（DEC-106）として扱った。違っていれば人が訂正する。
    原因の分類は実装（画面の CSS と配置の誤り）。デモの monitor（gouda_core/test/demo_monitor_server.py、1600×900）で、試験用の行を区間表 40・保存済み 25・範囲 20 入れ、
    セットの選択欄がパネルの上に見えること、右パネルを一番下までスクロールでき最後の行に届くことを確かめた。実車の monitor の画面ではまだ見ていない。
