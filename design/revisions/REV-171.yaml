  question: >-
    （第146便）monitor の waypoint タブで、右パネルが画面の下で切れて waypoint セットの選択欄に届かない。直し方を次から選ぶ：
    A. 右パネル（と左パネル）をパネルの中でスクロールできるようにする（CSS のみ、並び順はそのまま）、
    B. A に加えて「AUTO 自律走行の準備」を右パネルの一番上に移す（セットの選択が常に見える。発進準備シーケンスの案内の文言も直す）、
    C. 画面全体を縦にスクロールできるようにする（主タブを縦スクロールなしにする方針を変える）。
  answer_verbatim: |
    Bで
  affected_refs:
