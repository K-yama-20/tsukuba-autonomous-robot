summary: >-
  第146便：人の指摘「waypoint タブが下にスクロールできず、waypoint ファイルを選択できない」の原因を調べた。画面全体（.screen）と各パネル（.panel）が overflow hidden で、
  右パネルの区間の速度上限表と保存済みセットの一覧が長くなると、その下の「AUTO 自律走行の準備」（セットの選択・初期位置）がパネルの外に押し出されて操作できなかった。
  人の回答「Bで」（DEC-363）で、AUTO の欄を右パネルの一番上に移し、waypoint タブの両パネルを中でスクロールできるようにした（gouda_core/web の index.html・style.css）。
  画面の配置だけの変更で、モード・開始の条件・送る要求は変えていない。
