    set_nested:
      transition.actions:
        - GLIM に保存を要求し、原図を map_database へ保管（RQ-I008）。GLIM の TF 発行を停止
        - 自動変換を Action（IFD-37）で起動し、processing_state=変換中 を IFD-01 で表示（DEC-010）。失敗しても原図は保持（RQ-I009）。変換専用モードは作らない
        - 自動開始したログ記録を停止（IFD-46 record/log/stop_auto）。手動開始の記録は停止しない（RQ-I017）
        - 設定状況を記録（地図作成後：RQ-I015）
  - id: TR-05
    set_nested:
      transition.actions:
        - 初期位置を ND-07 へ送る（IFD-34）
        - run_id を発行し、remaining_waypoints を全区間で初期化
        - 選択した waypoint セットの速度マスクと filter info を Nav2 に読み込ませる（IFD-41・IFD-42）。speed_limit は Nav2 の SpeedFilter が位置から発行する（IFD-14、DEC-031）。Gouda は発行しない
        - NavigateThroughPoses goal を送信し active_nav2_goal を記録（IFD-13）。speed_limit_application_state=適用中 を確認してから motion_hold=false を発行（IFD-40）。確認できない間は hold=true のまま（DEC-056）
        - 記録の自動開始を要求（IFD-44 record/log/start_autodrive。契機は人の自律走行開始ボタン：RQ-I015）。非同期で呼び、失敗・無応答でも走行開始を止めない。失敗は DecisionEvent と monitor のポップアップ。設定状況を記録
        - 直前モード記録を MODE-AUTO に更新
  - id: TR-11
    set_nested:
      transition.actions:
        - motion_hold=true を発行（IFD-40）。中立化の担当は ND-11、最終段は ESP32（RQ-I068）
        - Nav2 goal を取消し、取消結果の受信で旧 goal の終了を確認。停止原因区分=人の操作を記録
        - 自動開始したログ記録を停止（IFD-46 record/log/stop_auto）。手動開始の記録は継続（RQ-I017）
        - 直前モード記録を MODE-MANUAL（人の終了操作あり）で永続化（RQ-I025）
        - 自律走行系（ND-07〜ND-12）を非活性化（ND-11・ND-12 は非活性化前に中立を送る）
  - id: TR-12
    set_nested:
      transition.actions:
        - motion_hold=true は一時停止中から継続（IFD-40）
        - 残っている Nav2 goal があれば取消し、取消結果の受信で終了を確認
        - 自動開始したログ記録を停止（IFD-46 record/log/stop_auto）。手動開始の記録は継続（RQ-I017）
        - 直前モード記録を MODE-MANUAL（人の終了操作あり）で永続化（RQ-I025）
        - 自律走行系（ND-07〜ND-12）を非活性化（ND-11・ND-12 は非活性化前に中立を送る）
  - id: PRM-16
    set_nested:
      parameter.purpose: mode/state・motion_hold の周期発行間隔（ND-03）。motion_hold の期限切れ判定（ND-11）と monitor 表示の鮮度に関わる。UI 側の周期・待ち時間は別の parameter（PRM-27〜32）で、本値と混同しない
  - id: TS-23
    set_nested:
      test.expected: >-
        起動時に何も記録しない。自動開始は地図作成開始（IFD-45）・自律走行開始（IFD-44）の入口からのみで、契機（auto:map_start／auto:autonomy_start）を保持する。rosbag は人のみ。
        記録中の開始要求は何もせず「記録中」。手動開始の記録は自動開始へ書き換えず、stop_auto で止まらない。停止中・障害中の期間が欠落範囲として残る。失敗は報告され例外にならず記録状態を変えない。
