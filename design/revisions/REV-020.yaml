# 変更セット REV-020（2026-10-09 第14便: 記録の自動開始 IF（record/log/start_autodrive・start_pre_mapping）と自動停止 IF、IFD-28 の transient_local（条件付き承認）、UI の周期・待ち時間の ROS parameter 化、検査規則 DR-16・DR-17）
# 適用: design/tools/apply_revision.py REV-020
id: REV-020
date: '2026-10-09'
summary: >-
  人の指示（DEC-071〜074）を反映。記録の自動開始は record/log/start_autodrive（IFD-44）と record/log/start_pre_mapping（IFD-45）の 2 入口・共通処理（service）。発行条件（人の開始操作の受理時のみ。
  復帰・再開・再接続では呼ばない）を検査規則 DR-16 にし、重複時は「記録中」応答、開始元と契機を保持、失敗・無応答でも走行開始を止めず待ち合わせない、失敗はポップアップ表示。
  自動開始分だけを止める停止 IF は存在しなかったため record/log/stop_auto（IFD-46）を追加。IFD-28 log/decision を transient_local（保持 50 件）にし、全 publisher（ND-02 を追加）を揃え、
  monitor は履歴欄と現在状態欄を分け、保持メッセージを契機にせず、履歴の正本は保存ログとする。QoS 互換性の検査規則 DR-17 を追加。UI の周期・待ち時間を gouda_monitor の ROS parameter PRM-27〜32
  として宣言（ソフトウェア既定値 2 s／1 s／5 s、一時停止は別枠、実測対象にしない、車体の timeout に流用しない）。
basis_refs: [DEC-071, DEC-072, DEC-073, DEC-074]
intent_version_copy: design/baselines/intent_history/intent_v7_f69dd98b9529.md

decisions:
  - id: DEC-071
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: 記録の自動開始の契機を載せる記録 IF（第13便 判断事項 1）
    answer_verbatim: |
      記録用IFの名前(topic/service名)は次にせよ。
      record/log/start_autodrive
      record/log/start_pre_mapping

      入口は二つでも、記録開始の処理と状態管理は共通にせよ。種別はservice（短い要求応答）が適切だと思うが、判断はAIに任せる。呼び出し元は、開始ボタンを受け取るmode管理側である。設計には次の条件を明記すること。

      発行条件：人の開始操作が受理されたときだけ呼ぶ。プロセス復帰・一時停止からの再開・画面再接続では呼ばない。これを検査規則にする。
      重複時：すでに記録中なら何もせず「記録中」と応答する。手動開始の記録を自動開始へ書き換えない。
      開始元の保持：loggerは開始元（手動／自動）と開始契機を保持し、ログへ残す。自動開始分だけを停止するために必要。
      走行への影響：呼び出しが失敗・無応答でも、走行の開始を止めず、応答を待ち合わせない。
      呼び出し失敗時：ポップアップウィンドウで警告表示。
      停止側の確認：自動開始分だけを止める停止IFが既にあるかを示し、なければ追加案を出す。
      対象範囲：ログのみ。rosbagの独立操作と、自動開始しない契約は変えない。
    affected_refs: [ND-03, ND-04, ND-02, IFD-08, IFD-09, TR-03, TR-04, TR-05, TR-11, TR-12, TR-13, TR-10, TR-02]
    resulting_refs: [IFD-44, IFD-45, IFD-46, TS-26]
    note: >-
      種別は service（std_srvs/Trigger）。共通処理は recorder_core.start_log(trigger) で、契機は入口（service 名）から決まる。停止側: 既存の IFD-09 record/log/stop は呼び元を区別しないため
      「自動開始分だけを止める」IF は存在しなかった。追加案として record/log/stop_auto（IFD-46。手動開始の記録には何もせず「手動開始のため停止しない」と応答）を設計に加えた。
      発行条件は DR-16（IFD-44／45／46 を参照できるのは人の開始／終了操作の遷移 TR-03・TR-04・TR-05・TR-11・TR-12 のみ。fault_recovery・resume・pc_restart・boot の遷移と ND-02 からの参照は違反）。
  - id: DEC-072
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: IFD-28 log/decision を transient_local にするか（第13便 判断事項 2）
    answer_verbatim: |
      IFD-28: 条件付きで承認する。以下の条件を満たせ。
      全publisherを揃える：同じtopicのpublisherはすべてtransient_localにする。volatileのpublisherが一つでもあると、transient_localで購読するmonitorはそこから受信できない。
      表示を分ける：monitorは判断を時刻付きの「履歴」欄に出し、「現在の状態」欄とは分ける。現在の状態は、別の状態取得IFまたはstate topicで扱う（Q-10の決定と整合）。
      契機にしない：保持されたメッセージの受信を、新しい判断や記録開始の契機にしない。
      永続履歴ではない：transient_localは、発行者の再起動を越えて履歴を残す仕組みではない。過去の判断の正本は保存済みログとする。
      細部はAIに任せる：保持件数はAIがモデルに宣言する。QoS互換性の検査規則が検査器にあるかを確認し、なければ追加案を出せ。
    affected_refs: [IFD-28, ND-02, ND-03, ND-04, ND-11, ND-12]
    resulting_refs: [IFD-28]
    note: >-
      保持件数は 50（IFD-28 の qos.history_depth に宣言。publisher ごとに最新 50 件）。publisher は ND-03・ND-11・ND-12 に ND-02（設定状況の記録用）を加え、すべて transient_local。
      QoS 互換性の検査規則は検査器になかったため DR-17 を追加（モデル: transient_local の topic は保持件数を宣言。実装: 走査対象のコードで同じ topic の全 publisher が transient_local の QoS を使う）。
  - id: DEC-073
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: UI の更新周期・待ち時間の扱い（第13便 判断事項 3）
    answer_verbatim: |
      . UIの更新周期・待ち時間：ROS parameterとして宣言せよ。
      設計規約（宣言的設定・AR-004）に沿い、設定状況もログに残せ。
      既定値の扱い：現在の値（2 s／1 s／5 s）を、用途と単位を明記したソフトウェア既定値とする。実車測定値ではないため、Q-05の実測対象にしない。
      待ちの種類を分ける：サービス待ちは、「利用可能になるまでの待ち」と「要求後の応答待ち」を区別して宣言する。一時停止ボタンの待ち時間は、他のボタンと別枠にする。
      timeout時の振る舞い：失敗を表示する。自動の再試行の有無は設計で定義し、試験する。
      転用しない：これらの値を、車体の指令timeoutや走行停止条件へ流用しない。
      宣言先：UIがブラウザ側（SSE）にある場合は、parameterを宣言するのは中継ノードであることを明示させる。
    affected_refs: [ND-02, PRM-16]
    resulting_refs: [PRM-27, PRM-28, PRM-29, PRM-30, PRM-31, PRM-32]
    note: >-
      宣言先は中継ノード gouda_monitor（ブラウザ側ではない）。PRM-27 node 一覧の取得周期 2 s、PRM-28 SSE keep-alive 2 s、PRM-29 サービスが利用可能になるまでの待ち 1 s、PRM-30 要求後の応答待ち 5 s、
      PRM-31 一時停止ボタンの利用可能待ち 1 s、PRM-32 一時停止ボタンの応答待ち 5 s。値はソフトウェア既定値（承認: 本決定）。実測対象にせず、車体の timeout（PRM-08・13 等）に流用しない。
      timeout 時は失敗を表示し、自動の再試行はしない（人がもう一度押す）。設定状況は gouda_monitor が起動時と /config 保存時に DecisionEvent（event=settings）で記録する。
  - id: DEC-074
    kind: approval
    status: answered
    asked_on: '2026-10-09'
    answered_on: '2026-10-09'
    channel: chat
    question: 上記の方針に基づく更新と工程5-3 への進行の許可
    answer_verbatim: 設計変更と人間の承認は別物である。上記の通り、方針は君に指示したので、名前の細部・保持件数・周期などを逐一の承認事項に戻す必要は無い。新IFと既存契約との差分を示した上で、AIがモデル・生成物・関連試験を更新し、工程5-3へ進むことを許可する。
    affected_refs: [DEC-019]
    resulting_refs: []
    note: 新 IF と既存契約との差分は reports/worklog/2026-10-09_rev020_record_ifs.md §2 に示す。工程5-3 の着手を許可。
    disposition: answered

