  - id: TS-26
    kind: test
    name: ログの自動開始・自動停止 IF（重複、開始元の保持、非同期、失敗のポップアップ、発行条件）
    intent_lines: [19, 21]
    issue_refs: []
    related_refs: [IFD-44, IFD-45, IFD-46, ND-03, ND-04, ND-02, TR-03, TR-04, TR-05, TR-11, TR-12]
    sensitivity: [operation]
    test:
      execution_status: 未実行
      stage: 地図作成と変換
      procedure: >-
        単体（gouda_core/test/test_recorder_core.py）: 入口別の契機、記録中の再要求は「記録中」で何もしない、手動開始を自動開始へ書き換えない、stop_auto は自動開始分だけ止め手動開始には何もしない。
        ROS 上（Ubuntu）: record/log/start_pre_mapping → record/status の log_started_by=auto:map_start → start_autodrive 再要求「記録中」→ stop_auto で停止 → 手動開始後の stop_auto は停止しない。
        ND-03 の呼出しが非同期で失敗時に DecisionEvent（record_auto_start_failed）が出ること（recorder 停止状態で TR-03 相当の要求）。monitor は同イベントをポップアップで表示（ブラウザ確認。API では events に現れること）。
        発行条件は DR-16 で機械確認（復帰・再開・再起動の遷移が IFD-44／45 を参照しない）。
      observe: サービス応答、record/status、events.jsonl の trigger、DecisionEvent、DR-16 の結果。
      expected: 自動開始は人の開始操作の受理時だけ。重複時は何もせず「記録中」。開始元・契機がログに残る。失敗・無応答でも走行開始は止まらず、ポップアップで警告される。stop_auto は手動開始の記録を止めない。

modifications:
  - id: IFD-28
    set_nested:
      designed_interface.publisher_refs: [ND-03, ND-11, ND-12, ND-02]
      designed_interface.qos: {reliability: reliable, durability: transient_local, history_depth: 50}
      designed_interface.time_semantics: >-
        header.stamp は判断時刻。参照した入力の受信時刻を別フィールドに持つ。受信していない値は記録しない（RQ-I015）。
        QoS は transient_local・保持 50 件（publisher ごとの最新 50 件）。同じ topic の publisher（ND-03・ND-11・ND-12・ND-02）はすべて transient_local にする（volatile が 1 つでもあると transient_local の購読者はそこから受信できない。DR-17）。
        monitor は受信した判断を時刻付きの「履歴」欄に出し、「現在の状態」欄（mode/state）とは分ける。保持されたメッセージの受信を新しい判断や記録開始の契機にしない。
        transient_local は発行者の再起動を越えて履歴を残す仕組みではなく、過去の判断の正本は保存済みログ（ND-04）とする（DEC-072）。ND-02 は event=settings で自身の設定状況を記録する（DEC-073）。
  - id: IFD-08
    set_nested:
      designed_interface.time_semantics: 人の Record ボタン（ND-02）といつでも開始可（開始元 human）。自動開始は本 IF ではなく IFD-44（自律走行開始）・IFD-45（地図作成開始）を ND-03 が呼ぶ。処理と状態管理は共通（DEC-071）
      designed_interface.consumer_refs: [ND-02]
  - id: IFD-09
    set_nested:
      designed_interface.time_semantics: 人の Stop Record ボタン（ND-02）専用。開始元を問わず停止する。自動開始した記録だけを止める停止は IFD-46 record/log/stop_auto（ND-03 が地図作成終了・自律走行終了で呼ぶ）。手動開始の記録は自動停止しない（RQ-I017）
      designed_interface.consumer_refs: [ND-02]
  - id: ND-04
    set_nested:
      ros_node.serves_refs: [IFD-08, IFD-09, IFD-10, IFD-11, IFD-44, IFD-45, IFD-46]
      ros_node.responsibilities:
        - ログ（PCが受信した入力、判断と理由・状態遷移・各段の指令・通信結果・設定状況）の記録と欠落範囲の記録（RQ-I015）
        - ログの開始入口は 3 つ（人の Record IFD-08、自律走行開始 IFD-44、地図作成開始 IFD-45）で、開始処理と状態管理は共通。開始元（手動／自動）と契機（auto:autonomy_start／auto:map_start）を保持し、record_start としてログと record/status に残す（DEC-071）
        - すでに記録中の開始要求には何もせず「記録中」と応答し、手動開始の記録を自動開始へ書き換えない。停止は人の Stop Record（IFD-09。開始元を問わない）と自動開始分だけの stop_auto（IFD-46）
        - rosbag record の開始・停止（ログとは別ボタン、自動開始しない：RQ-I016）
        - ログと rosbag を同じディレクトリの別フォルダに保存（RQ-I016）
        - 記録失敗を表示するが走行を止めない（RQ-I015）
  - id: ND-03
    set_nested:
      ros_node.calls_refs: [IFD-08, IFD-09, IFD-13, IFD-36, IFD-42, IFD-44, IFD-45, IFD-46]
      ros_node.responsibilities:
        - 4ソフトモード（RQ-I065）の正本と遷移（TR-01〜TR-16）。内部状態・処理段階（変換中・goal送信中・取消待ち・復旧段階）はモードと混同しない
        - 自律走行の開始・一時停止・再開・終了の受付と、Nav2 NavigateThroughPoses への goal 送信／取消（薄い action client。計画・追従・後退・再計画・通過判定は Nav2）
        - 自律走行開始時に、選択した waypoint セットの速度マスク（IFD-41）を Nav2 の filter info server と mask 用 map_server に読み込ませる（IFD-42）。SpeedLimit 自体は Nav2 の SpeedFilter が発行（DEC-031）
        - 速度上限の適用状態の観測と記録（DEC-047）：mask・filter info の latched 配信、speed_limit の最終受信値・時刻、ロボット位置が mask 範囲内かを観測し、speed_limit_application_state（適用中／帯外・無制限／マスク外・直前値保持／未読込・上限なし／不明）を IFD-01 と DecisionEvent に出す。発行はしない
        - 一時停止・終了・故障・非自律モードでは motion_hold=true を motion_controller へ直接入力（IFD-40、DEC-004）。自律走行中だけ hold=false
        - mission 文脈（地図・waypoint の ID／版／ハッシュ、run_id、残 waypoint、停止理由）の保持と、PC再起動に必要な部分の永続化（RQ-I064・RQ-I069）。区間番号は記録用に feedback から求める（RQ-I030）
        - PC 再起動後の再開は人の初期位置要求（IFD-39）の受理後に限る（DEC-009）
        - 異常終了後の自動復帰の手順（RQ-I013 の依存順序、RQ-I069 の必要状態だけの復元）。復旧不能時は自律走行・一時停止からは一時停止へ、手動走行・事前地図作成では直前モードを維持し理由を記録（DEC-008）
        - 記録の自動開始・停止の呼出し。人の地図作成開始（TR-03）の受理で IFD-45、人の自律走行開始（TR-05）の受理で IFD-44 を非同期で呼び、応答を待ち合わせず走行開始を止めない。失敗・無応答は DecisionEvent（record_auto_start_failed）に記録し monitor がポップアップ表示。地図作成終了（TR-04）・自律走行終了（TR-11・TR-12）で IFD-46 を呼ぶ。復帰・再開・PC 再起動では呼ばない（DEC-071、DR-16）
        - 判断・理由・走行ID・区間ID付きの DecisionEvent の発行（RQ-I030。transient_local 保持 50 件、DEC-072）
  - id: ND-02
    set_nested:
      ros_node.publishes_refs: [IFD-26, IFD-39, IFD-41, IFD-28]
      ros_node.responsibilities:
        - 現在のモードと各nodeの状態の表示（RQ-I033）、ログ・rosbagの記録状態表示と独立した Record／Stop Record 操作（RQ-I005）
        - 地図作成開始／終了、自律走行開始／一時停止／再開／終了の操作（サービス呼出し。進行の正本は持たない）。待ち時間は ROS parameter（PRM-29〜32。一時停止は別枠）で、超過は失敗を表示し自動再試行はしない
        - 判断（log/decision）は時刻付きの「履歴」欄に表示し、「現在の状態」欄（mode/state）とは分ける。保持されたメッセージの受信を契機にしない（DEC-072）。記録の自動開始の失敗（record_auto_start_failed）はポップアップで警告（DEC-071）
        - 初期位置・向きの指定（IFD-39）。開始時と、PC 再起動後の再開前（DEC-009）
        - waypoint_manager GUI の表示（RQ-I044）と waypoint・区間速度上限の編集・保存（RQ-I078）。保存時に Speed Filter 用の速度マスクと filter info を生成して同じ由来 ID・ハッシュで保存（IFD-41、DEC-031。幅は PRM-19、刻みは PRM-20）
        - 保存時に、重複する cell で上限が異なる区間を検出して警告する（対象区間と採用される低い方の値を示す。保存は拒否しない。DEC-059 案 A、TS-22）
        - 地図とwaypointの組の選択とプレビュー（RQ-I011）
        - センサTF・座標方向等の /config の保持。タブ遷移で設定が消えない永続化（RQ-I070）
        - 表示用の状態集約。ESP32 STATUS のうち取得できる項目を表示し、取得できない項目・途絶時は「不明」と表示（DEC-006）。monitor の表示断は停止の契機にせず、再接続後に transient_local の状態を取得する（DEC-014）
        - 自身の設定状況（UI の周期・待ち時間 PRM-27〜32、/config の版）を起動時と /config 保存時に DecisionEvent（event=settings）で記録する（DEC-073、RQ-I015）。中継ノードとして parameter を宣言する（ブラウザ側 UI は宣言しない）
  - id: TR-03
    set_nested:
      transition.actions:
        - GLIM（ND-06）を起動・有効化。失敗は monitor に表示
        - 記録の自動開始を要求（IFD-45 record/log/start_pre_mapping。契機は人の地図作成開始ボタン：RQ-I015）。非同期で呼び、失敗・無応答でも地図作成の開始を止めない。失敗は DecisionEvent と monitor のポップアップ
        - 設定状況を記録（地図作成前：RQ-I015）
