  question: 本番の失格の条件と、自動の一時停止・安全機構の扱い（人の発言）、および方針の登録の指示
  answer_verbatim: |
    （人の発言の原文、時系列の番号つき）
    1.「つくばチャレンジでは、一時停止モードに入ったり、同じ場所で3分以上滞留（1mくらいの前進が出来ない場合）してしまうと、走行失敗と判定されてしまう。衝突そのものは失敗と判断されない。ロボットには随行員が1名とチームメンバー2人が常時近くを歩いて監視している。よって、自動的に一時停止モードに入ったり、回避動作が満足に出来ない設定になっていることは極めて致命的である。逆に、ロボット自体の安全機構は極限まで削減すべきだと言える。
    つくばチャレンジでの必達事項は、「必須課題」2.2kmの完走である。

    現在の状況および、君の方針をまとめよ。」
    2.「方針の項目を承認事項として判断台帳に登録し、intent.md の修正案も作って。実装はまだしない。」
