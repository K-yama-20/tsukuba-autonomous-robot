  set_nested:
    issue.next_action: '2026-10-19 屋外（FILE-GNSS-OUTDOOR-CHECK）: 単独測位は出るが方位は出ない。MeasEpoch の観測は主アンテナだけ。人がアンテナを入れ替えても main 側だけ受信（アンテナ・ケーブルは正常）。MRTKLIB での照会（FILE-MOSAIC-MRTK-QUERY）: 能力 Main+Aux1、許可は 2 本・方位、方位の計算は MultiAntenna, Fixed、frontend mode は Nominal だった。DEC-145 で sfm, DualAnt（REV-077）、DEC-146 で Boot 保存と reset（REV-078）。reset の後の gfm は DualAnt。2026-10-20 屋内の検査（FILE-GNSS-DRIVER-INDOOR-CHECK-DUALANT、REV-083）: ドライバは起動して設定を終え、方位のオフセット 90 度（/config revision 18）。屋内のため観測 0。次: 屋外で MeasEpoch に副アンテナ（番号 1）の観測があり AttEuler の mode が 0 でないこと、AGC（main・Aux1）、AuxAntPositions の基線 0.34 m（DEC-149）を確かめる。 2026-10-22（REV-157）: 屋外の確認はまだ。2026-10-22 の実の地図作成 3 回の GNSS 記録はすべて mode 0・方位 error 1（屋内か空が見えない所と推測）。提案 gnss_improvements_2026-10-22.md §2.1 で、方位と RTK（中継）を 1 回の屋外の確認でまとめて確かめる案。 2026-10-22（REV-158、FILE-GNSS-NO-TRACKING-INVESTIGATION）：屋外（第114便）でも衛星を 1 つも追尾しない（MeasEpoch n 0、時刻不明）。2026-10-19 朝は屋内で衛星 13〜17 を捕まえており、捕まえなくなったのは DualAnt と reset の後から。REV-083（2026-10-20）の「屋内のため観測 0（期待どおり）」は AI の誤り（確かめていない仮定）。Gouda のコード（ドライバの設定・中継）が追尾を止めている証拠はない。最も疑わしいのは DualAnt（AI が利得などの条件を確かめずに勧めた）。次：DEC-299（T1 読むだけ）、DEC-300（T2 Nominal に戻す）。'
