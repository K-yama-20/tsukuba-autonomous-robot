  note: 事実（VM、2026-10-22 01:59〜02:02、main c2b8d65、gouda.sh の Fast DDS の profile（PRM-100）あり、記録 design/research/vehicle_pc/2026-10-22_autonomy_run/）：自律走行の約 120 秒で、points_downsampled（NDT の入力）は 48 通（0.4 Hz）、GLIM の odometry（IFD-25）は 332 通（2.8 Hz）、NDT の姿勢は 75 秒で 16 通。同じ時に一時的な購読で 10 秒数えると、生の点群 17 通、points_cropped_far 6 通、points_cropped 1 通、points_downsampled 1 通。手動のとき（第116便の前、同じ profile の購読）は 10 秒で 75 通だった。CPU は 45 % が空き（6 コア）。1 コアを使い切っていたのは gouda_global_localization（100 %、一時停止の後も主スレッド 70 %）と gouda_monitor（91 %）。gouda_monitor は生の点群（IFD-21）を Python で購読している。最初の 2 段の CropBox は、1.66 MB の点群をプロセスの間で受け渡す（遠い側の切り取りは 100 m なので、ほとんど小さくならない）。案 a（推奨）：DEC-138（Fast DDS の共有メモリの区画を大きくする、評価で 196〜200/200 通）を gouda.sh の profile に入れる。案 b（推奨、a と一緒に）：monitor は生の点群を購読しない（受信の有無はドライバの状態か、間引いた点群で見る）。案 c：A3 の前処理を一つのプロセスにまとめ（composable node、intra-process）、VoxelGrid を先にする（上流の部品の組み方の変更）。案 d：何もしない（VM では自律走行できない）。影響を受けるもの：gouda.sh の profile（PRM-100 と同じ所）、monitor の points の表示、ND-07 の子の launch。決まらない場合に止まる作業：VM での自律走行（x86 機でも同じかは未確認）。第117便で登録。
