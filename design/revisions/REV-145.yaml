summary: 第117便：人の指示で、Claude が monitor の API から自律走行開始を送り、挙動を記録した（main c2b8d65、REV-144 の実装の後）。ND-07 は点群を待ち、約 50 秒の探索の後に初期化したが、その直後に推定不能（input_stale）になり、開始は TR-07 で一時停止した。Nav2 は起動せず、速度の指令は出ていない。原因は二つ。(1) 初期化の直後は EKF の姿勢・診断がまだ届いていないので、ND-07 は必ず一度推定不能を出し、開始の手順はそれで失敗する。(2) 点群が A3 の前処理をほとんど通らない（NDT の入力 0.4 Hz、GLIM の odometry 2.8 Hz、NDT の姿勢 0.2 Hz）。承認事項 DEC-281（点群の受け渡しの負荷）と DEC-282（初期化の直後の状態）を登録し、DEC-138 に今回の材料を足す。コードと設定は変えていない。
