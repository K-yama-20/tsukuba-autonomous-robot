  note: 事実：第117便の試行（2026-10-22 02:00）、人の 01:5x の試行 2 回、第116便の VM の模擬の試験のどれでも、initialized の同じ瞬間に「推定不能 (input_stale：ekf_pose, ndt_diagnostics, ekf_diagnostics)」が出た。localization_core.evaluate は、phase が running になると入力がまだない（None）ものを古いとみなす。autonomy_client.start_localization は、activate の後に推定不能を一度でも受けると EstimatorUnavailable で開始を失敗にする（TR-07、stop_reason estimator_unavailable）。模擬の試験では、この後に正常になった。案 a（推奨）：ND-07 は、初期化の後、四つの入力（EKF の姿勢、NDT の診断、EKF の診断、odometry）がそれぞれ一度届くまでは「初期化中」（理由は待っている入力の名前）にする。届いた後は今の判定のまま。時間の値は増やさない。案 b：mode manager が初期化の後しばらく推定不能を無視する（新しい時間の値が要る。推定不能を見逃す時間ができる）。案 c：今のまま（自律走行開始はいつも失敗する）。振る舞いの違い：案 a では、入力が来ないままなら初期化中のまま止まり（人は一時停止・終了できる）、推定不能にはならない。DEC-281 が直らないと、入力がそろっても推定不能をくり返す見込み（推測）。決まらない場合に止まる作業：実車での自律走行開始。第117便で登録。
