    note: 推奨は提案に。決まらない場合に止まる作業：範囲を描く機能全体（帯の地図だけで走ることはできる）。 REV-136（第106便）：採用：提案 design/proposals/drawn_areas_2026-10-21.md の設計で実装を始める（monitor の描画と保存、マスクの生成、Nav2 の設定、TR-05 の読み込み、VM の試験まで）。転記の出所は分岐セッション（local_560e07c3…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（第106便）。 REV-137（第107便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。人が描く範囲（DEC-220〜224）の実装に着手して。」）。
- id: DEC-221
  set:
    note: 決まらない場合に止まる作業：範囲を描く機能全体。 REV-136（第106便）：採用：範囲は waypoint セットと一緒に保存する（提案 §3.1。速度マスクと同じ流れで、内容ハッシュに範囲も入る）。転記の出所は分岐セッション（local_560e07c3…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（第106便）。 REV-137（第107便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。人が描く範囲（DEC-220〜224）の実装に着手して。」）。
- id: DEC-222
  set:
    note: 未確認（分岐先）：filter が inflation の後にかかるか、一つの costmap に速度と keepout の二つの filter を置けるか。決まらない場合に止まる作業：範囲を描く機能全体。 REV-136（第106便）：採用：KeepoutFilter を global と local の両方の costmap に置き、override_lethal_cost は両方 true（禁止の範囲の中にいるとき、外へ出る経路を許す）。分岐先は「true は失敗が外から見えにくくなり、DEC-200 の理由と向きが違う」と伝えたうえで、人が「反論は認めない」と決めた。転記の出所は分岐セッション（local_560e07c3…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（第106便）。 REV-137（第107便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。人が描く範囲（DEC-220〜224）の実装に着手して。」）。
- id: DEC-223
  set:
    note: 値は推測で埋めない（tbd）。決まらない場合に止まる作業：縁の扱いだけ。 REV-136（第106便）：採用：禁止の範囲を広げる幅の設定値は作らない。base_link は禁止の範囲の縁まで来てよく、人が車体のはみ出し（PRM-69：横 0.30 m・前 0.55 m）の分の余裕を取って描く。転記の出所は分岐セッション（local_560e07c3…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（第106便）。 REV-137（第107便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。人が描く範囲（DEC-220〜224）の実装に着手して。」）。
- id: DEC-224
  set:
    note: 決まらない場合に止まる作業：開始の確認だけ。 REV-136（第106便）：採用：開始のときは (a)（keepout のマスクと filter info の受信、マスクのハッシュの一致）だけを確かめ、確かめられない間は motion_hold を解かない。(b)（global costmap の topic で、禁止の格子が通れない値になっていること）を確かめるかは未決事項（DEC-226）。転記の出所は分岐セッション（local_560e07c3…「引き継ぎ 2026-10-21 その2」）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。実装は、メインのチャットで人に確かめてから行う（第106便）。 REV-137（第107便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。人が描く範囲（DEC-220〜224）の実装に着手して。」）。
