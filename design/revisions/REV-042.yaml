decisions:
  - id: DEC-098
    kind: approval
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【承認】地図の変換の暫定の既定値（intent.md 106 行「既定値は推奨値」。実機検証の後に人が再指定する）。高さはすべて推定した地面から。
      推奨: 2D 地図の解像度 PRM-33 = 0.1 m（GLIM の原図の点は submap ごとに 0.3 m の格子で間引かれるため、Nav2 でよく使う 0.05 m では未知のセルが増える）。
      地面の帯の上限 PRM-34 = 0.1 m（坂で格子の中の高さが変わる分 0.5 m の半分 × tan 10 度 ≈ 0.044 m と点の誤差を含む）。
      障害物の下限 PRM-35 = 0.15 m（地面の帯との間に 0.05 m の隙間。これより低い縁石や段差は 2D 地図の障害物にならず、段差の図で見る）。
      障害物の上限 PRM-36 = 1.2 m（車体の全高 PRM-03 の 0.95 m に 0.25 m の余裕。これより上の枝などは障害物にしない）。
      占有とみなす点数 PRM-38 = 1 点（点が疎なため。細い柱を落とさない。地図作成中の歩行者も障害物として残る）。
      地面を推定する格子 PRM-62 = 0.5 m（点の間隔 0.3 m より大きくし、点のない格子を減らす）。
      地面とみなす傾きの上限 PRM-63 = 10 度（車いす用の斜路の上限 1/12 ≈ 4.8 度や一般の坂を含む。大きくすると縁石の上面が地面に吸収されやすい）。
      地面を補う距離 PRM-64 = 1.0 m（車の下など 1 m 程度の見えない所を地面で補う。それより遠い所は地面が不明）。
      代替: PRM-35 を 0.1〜0.12 m にして低い縁石も障害物にする（地面の誤差で偽の障害物が増える）、PRM-38 を 2 点にする（偽の障害物は減るが細い物を落とす）。
    answer_verbatim: ''
    affected_refs: [PRM-33, PRM-34, PRM-35, PRM-36, PRM-38, PRM-62, PRM-63, PRM-64, ND-05, ND-02]
    resulting_refs: []
    note: >-
      決まらない場合に止まる作業：実車の設定（gouda.sh）での地図作成終了時の自動変換（設定が未確定のため失敗し、原図は残る）と、地図タブの既定値の表示（空欄）。
      地図タブで値を手で入れれば再変換はできる。PRM-34・35・36・38・62〜64 は安全の印（静的な地図の障害物の判定）を持つため、値は承認を経て入れる。
    disposition: open_human
  - id: DEC-099
    kind: measurement
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【実測】XT-32 で地面が映るか（DEC-093）。経路の近くの地面に点がある割合と低い点がある割合（経路からの距離ごと）、地面が不明として分類されなかった点の数、
      地面の格子のうち点のあるもの・地面とみなしたもの・補ったもの。XT-32 の最も下向きのビームの角度と取付の高さで、センサーの周りには地面の映らない範囲がある（移動すると前方から見える）。
    answer_verbatim: ''
    affected_refs: [ND-05, PRM-62, PRM-63, PRM-64, TS-34]
    resulting_refs: []
    note: >-
      手順と解析: docs/map_conversion.md §5、gouda_core/gouda_core/map_inspect.py。AI は手順・解析スクリプト・設定への反映を担当。
      人に依頼すること: 移動しての地図作成（経路と途中の物の記録）。これまでの原図は静止して作られていたため未計測（FILE-VEHICLE-PC-SOURCE-MAPS）。
    disposition: open_human
  - id: DEC-100
    kind: measurement
    status: pending
    asked_on: '2026-10-14'
    answered_on: null
    channel: chat
    question: >-
      【実測】移動して作った原図の点の密度と GLIM が処理した周期（DEC-096 C）。経路からの距離ごとの点の密度（点/m²）、submap の数と点の数、
      GLIM が処理した frame の周期と最長の欠け（traj_lidar.txt。XT-32 は 10 Hz）、GLIM の CPU 負荷と保存時間（mapping_stopped の save_duration_s、PRM-37）。
      この結果で GLIM の間引きを変えるか（DEC-094 B）と、PRM-33・38 の値を見直す。
    answer_verbatim: ''
    affected_refs: [ND-06, ND-05, PRM-33, PRM-38, PRM-37, G-DDS, TS-34]
    resulting_refs: []
    note: >-
      これまでの静止した原図 3 件で GLIM が処理した周期は 8.09・7.97・4.41 Hz、最長の欠け 0.40・0.70・0.60 s（FILE-VEHICLE-PC-SOURCE-MAPS）。
      monitor（Python）の受信 約 2 Hz より多いが 10 Hz に届かない。手順と解析: docs/map_conversion.md §5、map_inspect。
    disposition: open_human

