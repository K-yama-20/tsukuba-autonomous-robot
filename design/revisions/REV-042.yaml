# 変更セット REV-042（2026-10-14 第24便: DEC-093・096・097 の回答の記録、地面を基準にした変換、3D 点群地図と表示用の地図、暫定の推奨値の承認事項、実測の項目、地図作成の実機試験）
# 適用: design/tools/apply_revision.py REV-042
id: REV-042
date: '2026-10-14'
summary: >-
  人の回答を原文で記録。DEC-093 は「高さの基準は地面。XT-32 で地面が映るかは実機試験しないと分からない」、DEC-096 は C 案（今は GLIM を変えず、移動して作った原図で密度を測ってから決める）、
  DEC-097 は A 案で条件付き承認（条件の内容は確認中）。
  変換（ND-05）を、点群から推定した地面からの高さで帯を決める方式に変更し（傾きを制限した下側の包絡。設定 PRM-62〜64 を新設）、
  同じ設定から 2D 占有格子（Nav2）・3D 点群地図（PCD。DEC-095）・表示用の傾き／段差／高さの図（DEC-097 A。走行には使わない）を 1 つの rev として作る。
  地図タブで図を切り替えて見られる。暫定の推奨値（intent.md 106 行）は安全に関わる値を含むため承認事項 DEC-098 として提示する。
  地面の見え方（DEC-099）と点の密度・GLIM の処理周期（DEC-100）を実測の項目にし、移動しての地図作成の実機試験 TS-34 と解析スクリプト（map_inspect）を用意した。
  これまでの原図の調査（すべて静止、GLIM の処理周期 8.09・7.97・4.41 Hz）を証拠として登録。
basis_refs: [DEC-093, DEC-095, DEC-096, DEC-097]
