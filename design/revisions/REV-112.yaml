# 変更セット REV-112（2026-10-21 第80便: DEC-177、ESP32 の USB の切断回数の表示と記録）
# 適用: design/tools/apply_revision.py REV-112
id: REV-112
date: '2026-10-21'
summary: 人の承認（DEC-177、原文）で、ESP32 の USB の切断回数を monitor に常に表示し記録する（IFD-51 を追加）。数えるのは事前地図作成と自律走行のセッションの中だけ、一時停止と再開では続ける。
basis_refs:
- DEC-177
- DEC-176
intent_version_copy: design/baselines/intent_history/intent_v11_a7a03a313c6d.md
files: []
decisions:
- id: DEC-177
  kind: approval
  status: answered
  asked_on: '2026-10-21'
  answered_on: '2026-10-21'
  channel: chat
  question: ESP32 の USB の切断回数の表示と記録の形（第80便の前の報告の案 1〜4：1 vehicle_bridge が数えて新しい topic に出す、2 monitor に常時表示しポップアップは使わない、3 切断・再接続の記録に回数を添え理由の文を固定、4 数える範囲）
  answer_verbatim: "1~3は承認する。4については、自律走行セッション中と事前地図作成のセッション中のみ記録。一時停止して再開した場合は、カウントを継続する。\n"
  affected_refs:
  - ND-12
  - ND-02
  - ND-04
  - IFD-01
  - IFD-28
  resulting_refs:
  - IFD-51
  note: 人の要望（原文、同じ日）：「切断回数をmonitorに表示し、ログに残すようなことをしてほしい。…切断したときにポップアップが出ると、他の情報が隠れて見えなくなる。gouda_monitorはgouda上に搭載されたpcの画面に表示されるので、ポップアップを消すのが難しいです」。実施（第80便）：セッションは mode/state で決める（手動走行から事前地図作成・自律走行に入ると始まり、一時停止と再開では続き、手動走行に戻ると終わる。PC 再起動で一時停止から始まるときは自律走行のセッション）。セッションの外では接続の状態だけを出し、数えない。事前地図作成のセッションで数えられるのは、vehicle_bridge が事前地図作成でポートを開いている場合だけ（DEC-169 の事前地図作成での configure は実装の許可待ち。今は事前地図作成では開いていない）。
  disposition: answered
