entities:
  - id: TS-22
    kind: test
    name: waypoint 保存時の警告（重複 cell で上限が異なる区間）
    intent_lines: [13]
    issue_refs: []
    related_refs: [ND-02, IFD-30, IFD-41, H-013, DEC-059]
    sensitivity: [operation]
    test:
      execution_status: 未実行
      stage: waypoint
      procedure: 同じ場所を 2 回通る（再訪・交差・重複）waypoint セットで、重複する区間に異なる上限を設定して保存する。次に同じ上限にして保存する。
      observe: waypoint_manager の警告の有無と内容（対象区間・cell・採用される値）、保存結果、生成された mask の重複 cell の値。
      expected: 上限が異なる場合は警告が表示され、対象区間と「重複 cell は低い方の上限が適用される」ことが示される。保存は拒否しない（運用は同じ上限を設定すること：DEC-059 案 A）。mask の重複 cell は低い方（DEC-045）。同じ上限なら警告なし。

modifications:
  - id: H-013
    set_nested:
      issue.state: resolved
      issue.resolution_refs: [DEC-059]
      issue.next_action: 回答済み（DEC-059、案 A）。位置ベースを維持し、再訪・重複する区間には同じ上限を設定する運用。保存時に waypoint_manager が警告（ND-02、TS-22）。RQ-I078 への補足は人の編集（任意）。
  - id: C-023
    set_nested:
      reconciliation.state: resolved_by_decision
      reconciliation.decision_ref: DEC-059
      reconciliation.clarification: >-
        DEC-059（案 A）で解消。区間の属性（RQ-I078）は編集時の属性として成立し、実行時は Speed Filter が位置で適用する。再訪・重複する区間には同じ上限を設定する運用とし、
        waypoint_manager は保存時に重複 cell で値が異なる区間を警告する（保存は拒否しない）。重複 cell は低い方の上限（DEC-045）。
  - id: IFD-41
    set_nested:
      designed_interface.time_semantics: >-
        waypoint セット保存時に生成し、同じ由来 ID・内容ハッシュで保存。地図版が変われば再生成。区間の帯の幅は PRM-19（実機調整）、速度刻みは PRM-20。
        重複 cell は低い方の上限（DEC-045）。再訪・重複する区間には同じ上限を設定する運用で、値が異なれば ND-02 が保存時に警告する（DEC-059 案 A、TS-22）。
  - id: ND-02
    set_nested:
      ros_node.responsibilities:
        - 現在のモードと各nodeの状態の表示（RQ-I033）、ログ・rosbagの記録状態表示と独立した Record／Stop Record 操作（RQ-I005）
        - 地図作成開始／終了、自律走行開始／一時停止／再開／終了の操作（サービス呼出し。進行の正本は持たない）
        - 初期位置・向きの指定（IFD-39）。開始時と、PC 再起動後の再開前（DEC-009）
        - waypoint_manager GUI の表示（RQ-I044）と waypoint・区間速度上限の編集・保存（RQ-I078）。保存時に Speed Filter 用の速度マスクと filter info を生成して同じ由来 ID・ハッシュで保存（IFD-41、DEC-031。幅は PRM-19、刻みは PRM-20）
        - 保存時に、重複する cell で上限が異なる区間を検出して警告する（対象区間と採用される低い方の値を示す。保存は拒否しない。DEC-059 案 A、TS-22）
        - 地図とwaypointの組の選択とプレビュー（RQ-I011）
        - センサTF・座標方向等の /config の保持。タブ遷移で設定が消えない永続化（RQ-I070）
        - 表示用の状態集約。ESP32 STATUS のうち取得できる項目を表示し、取得できない項目・途絶時は「不明」と表示（DEC-006）。monitor の表示断は停止の契機にせず、再接続後に transient_local の状態を取得する（DEC-014）
  - id: IFD-35
    set_nested:
      designed_interface.message_type: GLIM 1.2.2 の成果物（形式は 1.2.2 で確認する）＋ manifest
      designed_interface.version_dependency:
        status: confirmed_installed_version
        evidence: [research/vehicle_pc/2026-10-09_glim_version.txt]
        note: 実車PC は ros-jazzy-glim／ros-jazzy-glim-ros 1.2.2-0noble（DEC-062）。AI の選定（DEC-033）と一致。LTS 版の使用も可とされたが、版を変える場合は導入の証拠を取り直す。出力形式は 1.2.2 で確認する（工程 5-3）。
  - id: ND-06
    set_nested:
      ros_node.placement_rationale: 第三者ソフト。交換は部品と launch の変更で済ませる（RQ-I036）。版は実車PC の 1.2.2-0noble で固定（DEC-062、IFD-35）。LTS 版へ変える場合は証拠を取り直す。
