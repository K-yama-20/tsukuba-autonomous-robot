decision_updates:
  - id: DEC-059
    set:
      status: answered
      answered_on: '2026-10-09'
      disposition: answered
      answer_verbatim: 'H-013: 案Aを採用。位置ベースを維持し、再訪・重複する区間には同じ上限を設定する運用。保存時に waypoint_manager が警告。'
      resulting_refs: [H-013, C-023, IFD-41, ND-02, TS-22]
      note: >-
        案 A を採用。設計への反映: C-023 を resolved_by_decision、H-013 を resolved、ND-02 に「保存時に重複 cell で値が異なる区間を警告（保存は拒否しない）」を追加、IFD-41 に運用を明記、TS-22（保存時警告）を追加。
        RQ-I078 への「実行時は位置で適用し、重複区間は同じ値」の補足は人の編集（proposals/intent_edit_requests.md §3。任意）。
  - id: DEC-058
    set:
      note: |
        DEC-053 を補う第2回の承認。承認は「確認が完了した」意味ではない。未解消の 4 条件の状態:
        条件 1（DEC-011 と DEC-031 の整合。解消期限は工程 5-6 自律走行の為の最小構成の前）: 残存は 4 か所（IFD-14 の名称「発行元は H-001 承認待ち」、TR-05 の「先頭区間の速度上限を発行（IFD-14）」、TR-10 の「進入区間の速度上限を発行（IFD-14）」、TS-01 の「帯外は H-011 の回答に従う」）。REV-010 で Speed Filter 前提に更新済み。SO-01（区間番号は記録用）、TS-02〜TS-05 に残存なし。
        条件 2（RQ-I010 と位置ベース上限・DEC-045 の食い違い。解消期限は工程 5-4 waypoint の前）: 衝突 C-023 と人の判断 H-013 に登録し、選択肢 3 件と影響範囲を示した。人が案 A を選択（DEC-059）。REV-012 で反映。
        条件 3（基本契約の試験が入る工程。解消期限は工程 5-5 車体出力の前）: TS-17（手動優先）・TS-18（gamepad 途絶で中立）・TS-19（PC 指令途絶で中立）は 5-5 車体出力、TS-20（一時停止）は 5-5 の hold 中立（TS-07）と 5-7 の遷移、TS-21（自律走行の開始は人の操作のみ）は 5-6。車体出力段階の完了条件に 5 契約すべての stub 試験を含める案は docs/implementation_stages.md §1 の 5-5 行と §5。
        条件 4（IFD-31、DEC-015・032・044 の反映先、C-003、C-012。解消期限は工程 5-4〜5-6 の前）: IFD-31 は REV-002 で割り当てなかった欠番（削除ではない）。DEC-015 は Q-07 を後工程に回す指示で設計要素を生まない。DEC-032 の反映先は各 parameter の measurement 欄と生成物。DEC-044 の反映先は検査器と試験（モデル外）。C-003 は clarification（飽和は RQ-I020 に当たらない、境界付近の揺らぎは詳細設計しない）。C-012 は clarification（薄い adapter は ND-03 の action client、IFD-13 の標準 action。独立モジュールは置かない）。
        人の確認（2026-10-09、DEC-061 原文）「DEC-058 の未解消 4 条件の確認をした。」。4 条件の AI の対応は人が確認済み。条件 3 の「車体出力の完了条件に 5 契約を含める案」の採否は明示の回答がないため案のまま。
  - id: DEC-033
    set:
      note: >-
        AI の選定: apt パッケージ ros-jazzy-glim-ros（CPU 版。実装リポジトリ docs/gouda_recording_glim.md が導入手順として使用）。
        実車PC の dpkg 出力（DEC-062、FILE-VEHICLE-PC-GLIM）で ros-jazzy-glim／ros-jazzy-glim-ros 1.2.2-0noble に固定。人は「これでなくとも、LTS版を使用するのでもよい」としたため、別版へ変える場合は実車PC での導入の証拠を取り直し IFD-35 を更新する。GLIM 本体の改変はしない。

