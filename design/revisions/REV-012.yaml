summary: >-
  H-013（区間属性の上限と Speed Filter の位置ベース上限の食い違い）に人が案 A を選択（DEC-059。位置ベースを維持、再訪・重複する区間には同じ上限を設定する運用、保存時に waypoint_manager が警告）。
  C-023 を決定で解消し、ND-02 の保存時警告と TS-22 を追加。DEC-058 の未解消 4 条件を人が確認（DEC-061）。実車PC の GLIM 版（ros-jazzy-glim／glim-ros 1.2.2-0noble）を証拠ファイルで固定し IFD-35 を実車版照合済みに（DEC-062。LTS 版の使用も可）。
