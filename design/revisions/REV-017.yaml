summary: >-
  人の指示を台帳に記録: (1) Mac から SSH（BatchMode）で Parallels 上の Ubuntu 24.04 に接続でき、開発対象は ~/gouda_ws、Ubuntu 上のコマンドは SSH 経由、ROS 2 Jazzy は setup.bash を先に読む、
