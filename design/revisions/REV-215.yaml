  channel: chat
  question: >-
    （人の指示）XT-32 の見える範囲を記録から抜き出し、台帳に記載すること。
  answer_verbatim: |
    xt-32の見える範囲を記録より抜き出し、台帳（imuのデータとかを載せてるやつ）に記載せよ。
    Crucialのドライブに残ってるrosbagとかから求められると思う。
  affected_refs:
  - Q-04
  - DEC-099
  - ND-14
  resulting_refs: []
  note: >-
    「台帳（imuのデータとかを載せてるやつ）」は DEC-418 の design/docs/imu_adis16607_spec.md と解釈し、同じ形の design/docs/lidar_xt32_spec.md を並べて作った（IMU の文書の名前を変えるのはファイルの改名で承認事項になるため）。
    実測（rosbag 1172 通）：ビーム ring 0 +15.05°〜ring 31 −15.98°、間隔 1.00°、水平 360°（0.18°）、車体・取付具による固定の死角なし（2026-10-14 の取付）、地面からの高さ 1.182 m、地面が見え始める距離 4.0〜4.2 m。
    TRB-001 と costmap の案 K-6 は高さ 1.015 m（base_link からの取付の高さ）で計算しており、見えない範囲を狭く見積もっている（約 3.5 m、1.5 m 先で 0.585 m に対し、約 4.1 m、0.75 m）。TRB-001 は直していない。
    Q-04・DEC-099 は解決にしない（取付の傾きの実測、その後の取付の変更、データシートの原本は未確認）。第199便。
  disposition: answered
