  answered_on: '2026-11-07'
  channel: chat
  question: >-
    （第236便）MPPI の速度の下限（0.27 m/s、/config で変更可）を製品に入れてよいか。AI の提示：模擬（DEC-445 の車体モデル、等速、
    障害物なしと遅れて出るコーン、各 2 回）で、下限 0.27 m/s＋open_loop はゴール 4/4・平均 0.44〜0.45 m/s・接触 0、open_loop のみは 4/4・
    0.37〜0.40 m/s、下限のみ（open_loop なし）は 0/4 で曲がらず直進しコーンに接触。下限を置くと MPPI は止まる指令を出せず、
    前が塞がれたとき最低速度で進み続ける（懸念として 1 回述べた）。選択肢は「入れて」「実車を先に試す」。
  answer_verbatim: |
    入れて
  affected_refs:
  - ND-10
  - IFD-54
  - PRM-141
  resulting_refs:
  - PRM-162
  note: >-
    もとの人の提案（原文）：「mappiに出力下限値以下の速度を絶対に出させないようにロジックを変えたらいいのでは？」。停止については
    人の発言（原文）：「これも停止用のロジックを新たに組めばいいだけの話ではないか？」。停止用のロジック（上流の collision_monitor など、DEC-372）は
    この変更に含まない（未指示）。0.27 m/s は 0.21×1.25 m/s＝0.2625 m/s を切り上げた AI の提示の値。実車では未検証。
    /config の値は正の数だけを受けるので、下限を実質なくすには小さい正の値を入れる。安全かどうかの判断は人（CLAUDE.md 1.12）。第236便。
  disposition: answered
