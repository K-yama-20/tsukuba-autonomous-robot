summary: >-
  第236便：人の回答「入れて」（DEC-480）で、MPPI の vx_min（上流 nav2_mppi_controller の設定）を PRM-162（0.27 m/s）にし、
  monitor の /config「Nav2」タブ（IFD-54）で変えられるようにする。これまでは 0 固定（REV-190）。発進する倒し量（DEC-445、0.21）×PRM-39 の
  速度より小さい前進の指令を MPPI に出させない。open_loop（PRM-141）と組で使う。旋回の不感帯は扱わない。停止用のロジックは足していない。
