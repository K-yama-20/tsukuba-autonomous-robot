# 変更セット REV-183（2026-10-24 第165便: 第164便の A-1・E-4 の採用、/config で変えられる Nav2 の値（PRM-105〜129）、DEC-393）
# 適用: design/tools/apply_revision.py REV-183
id: REV-183
date: '2026-10-24'
summary: >-
  第165便：第164便（ロバストな自律走行を妨げる設定・構成の列挙）への人の回答で、A-1（BT の外側の回復を、error_code のない失敗でも試す）と
  E-4（一時停止の理由を Nav2 の error_code で分ける）を実装し、A-2・A-4・A-5・B-3・B-4・C-2・C-3・C-4・C-6・D-4 の値を monitor の /config「Nav2」タブで
  変えられるようにする（PRM-105〜129。値は未確定で、値がない間は Nav2 1.3.13 の値がそのまま効くので、今の振る舞いは変えない。D-4 の膨らませの半径は PRM-72 を上書き）。D-1 は
  PRM-103 で既に変えられる。推奨値は案として各 PRM の interpretation に書き、承認を待つ。E-1〜3 は検討（提案）。
