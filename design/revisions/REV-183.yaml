  note: "解釈：「採用」は実装の承認。「検討」は提案を作る（実装しない）。「/configで設定できるようにする」は monitor の /config「Nav2」タブの項目にすること。PRM の値は未確定にし（値がない間は Nav2 1.3.13 の値がそのまま効く）、推奨値は案として示して承認を待つ（値を黙って変えない）。記載値（source_value）にしなかったのは、上流の既定値を出典として登録する手段が正本にないため（DR-11）。B-3（RPP は障害物を避けない）は、RPP の衝突の検査の 2 つの値（PRM-114・115）を変えられるようにすることと解釈した（controller の種類の変更は含めない）。D-1（再計画の頻度）は PRM-103 で既に変えられるので変更なし。D-4 は cost_scaling_factor（PRM-129）と、膨らませの半径（PRM-72 の上書き）。B-1・B-2（controller の失敗の許容・進みの監視）は回答に含まれていないので変えていない。A-1：外側の RecoveryNode の回復の前の Fallback（WouldAControllerRecoveryHelp・WouldAPlannerRecoveryHelp）を除いた。回復できない失敗でも回復を繰り返す（PRM-18 の回数まで）。E-4：一時停止の理由を nav2_msgs の error 定数で分ける（plan_failure・blocked・controller_failure・nav2_tf_error・nav2_no_error_code・nav2_unclassified）。第165便。"
  disposition: answered
