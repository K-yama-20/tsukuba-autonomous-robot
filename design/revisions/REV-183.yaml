  channel: chat
  question: >-
    （第164便）ロバストな自律走行を妨げる設定・構成 32 項目（A〜H）のうち、どれを直すか。
  answer_verbatim: |
    A1, E4: 採用
    E1,2,3; 検討

    A2,4,5,B3,4,C2,3,4,6D1,4: /configで設定できるようにする。推奨値も考えて
  affected_refs:
