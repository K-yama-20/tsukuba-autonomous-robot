modifications:
- id: TR-07
  set_nested:
    transition.actions:
    - motion_hold=true を発行（IFD-40）。中立化の担当は ND-11（RQ-I063）
    - Nav2 の失敗では結果（error_code・error_msg）をログに記録（RQ-I012）。result の受信をもって旧 goal の終了を確認し active_nav2_goal を消す。推定不能では goal がまだ動いているので取り消し、取消の結果を記録する
    - 停止原因区分を、Nav2 の失敗は error_code で「計画の失敗」（plan_failure、ComputePath の error）、「塞がれた」（blocked、FollowPath の PATIENCE_EXCEEDED・FAILED_TO_MAKE_PROGRESS・NO_VALID_CONTROL）、「追従の失敗」（controller_failure、FollowPath のその他）、「TF の誤り」（nav2_tf_error）、「error_code なし」（nav2_no_error_code）、「分類外」（nav2_unclassified）に分け、「推定不能」（estimator_unavailable）、「node の異常」（node_failure）と区別して記録（RQ-I012・RQ-I029、REV-183・DEC-393）。推定不能は IFD-53 の理由の区分と数値も残す
    - 残 waypoint は保持（再開で同じ目標へ：RQ-I014）。直前モード記録は MODE-PAUSE（人の操作なし）
  interpretation_append: 'REV-183（DEC-393）：停止原因を Nav2 の error_code で分けた（E-4）。BT の外側の回復は error_code のない失敗でも試す（A-1）。'
- id: IFD-54
  interpretation_append: 'REV-183（DEC-393）：PRM-105〜129 の値と inflation_radius_m（PRM-72 の上書き）を足した。'
  set_nested:
    designed_interface.message_type: 'JSON {values: {recovery_number_of_retries: 整数 or ''UNKNOWN'', inflate_around_unknown: true／false or ''UNKNOWN'', replan_rate_hz: 正の数 or ''UNKNOWN'', PRM-105〜129 と inflation_radius_m の各キー: 型（正の数・1 以上の整数・0 以上の整数・true／false）に合う値 or ''UNKNOWN''}, config_revision, updated_at}（SensorConfig と同じ形）'
