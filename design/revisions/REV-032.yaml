id: REV-032
date: '2026-10-13'
summary: >-
  人が intent.md の末尾に 1 行を追記（第8版、SHA 09732d2f…、AR-008、RQ-I081）。チャットの指示 2 件と合わせて DEC-087 に原文で記録し、取付変換の実測の問い DEC-086 を取り下げた。
  設計への反映: GLIM の T_lidar_imu は /config（IFD-26）の取付値から TR-03 で生成し、UNKNOWN の項目は中立要素（並進 0・回転なし・base_link の軸）で置き換えて記録・表示する（質問も停止もしない）。
  /config の軸の向き（axis_mapping）の書式を定義。VM での検証で見つかった実装の不具合（gouda.sh の空の serial_port 引数、mode_manager が拒否時のログで落ちる、PRM-37 未確定で地図作成を終了できない）を直し、
  TR-04 を即時応答・保存は後続処理（processing_state=map_saving）に変更（DEC-010 の範囲）。PRM-37 未確定の間は上限なしで保存完了を待ち、保存時間を記録する。
  IMU のデバイス名を実機の一覧（FILE-VEHICLE-PC-IMU-BYID）に合わせて修正（STM32 の後は「_」）。
