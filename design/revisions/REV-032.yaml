decisions:
  - id: DEC-087
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-13'
    channel: chat + intent.md
    question: センサー取付位置（GLIM 用）の扱い、VM での GLIM 開始の検証、gouda.sh の問題、intent.md 第8版
    answer_verbatim: |
      GLIMのためのセンサーの取り付け位置はgouda_monitorで自分で設定する。取り付け位置が不明だからといって、私に未決事項・確認事項として質問してはならないし、これが原因で設計や実装を止めてはならない。

      vmを立ち上げたので、glimの開始が出来るか検証しろ、gouda.shにも問題があるようだ。また、instent.mdの末尾に要求を追記した。

      （intent.md 第8版 105 行）・GLIMのためのセンサーの取り付け位置はgouda_monitorで人間が設定する。取り付け位置が不明だからといって、人間に未決事項・確認事項として質問してはならないし、これが原因で設計や実装を止めてはならない。
    affected_refs: [DEC-086, ND-06, IFD-26, TR-03, TR-04, PRM-37, ND-01]
    resulting_refs: [AR-008, RQ-I081, PRM-54]
    note: >-
      1 件目のチャットは作業の途中で受け、2 件目と intent.md の追記で上位要求になった。DEC-086（取付変換の実測の問い）は取り下げ（台帳上は本回答で answered）。
      今後、取付位置・軸の向きの不明を理由に人へ質問しない。GLIM の T_lidar_imu は /config の値から作り、未設定の項目は中立要素で置き換えて DecisionEvent（glim_extrinsic）と monitor に示す。
      gouda.sh の問題は VM の launch ログで特定（空の serial_port で launch 引数が不正。工程5-5 で AI が入れた不具合）。
    disposition: answered

