modifications:
  - id: ND-06
    append_intent_lines: [105]
    set_nested:
      ros_node.responsibilities:
        - 事前地図作成モードでの連続的な自己運動推定と3D地図作成（RQ-I006・RQ-I007）
        - 地図作成中の odom→base_link TF の発行（このモードでのみ。RQ-I004：競合する推定器・TF発行者は同時に有効化しない）
        - 原図（3D地図）の保存出力（IFD-35）
        - LiDAR–IMU の取付変換（config_sensors.json の T_lidar_imu）は、人が gouda_monitor の /config で設定した値から TR-03 で生成して渡す（RQ-I081）。配布テンプレートの値は別機種のもので使わない。未設定の項目は中立要素（並進 0・回転なし・base_link の軸）で置き換え、その一覧を記録・表示する。質問も停止もしない
  - id: IFD-26
    append_intent_lines: [105]
    append:
      requirement_refs: [RQ-I081]
    set_nested:
      designed_interface.consumer_refs: [ND-13, ND-03]
      designed_interface.unit: >-
        m, rad。軸の向き（lidar_axis_mapping・imu_axis_mapping）はセンサ自身の x・y・z 軸が base_link のどちらを向くかの文（例「+x forward, +y left, +z up」。
        向きは forward／back／left／right／up／down または 前／後／左／右／上／下）。姿勢は R = R_rpy × A（A の列がセンサ軸、roll・pitch・yaw は base_link で軸の向きの後に適用）。
        左手系の指定は回転として使えないため保存時に警告し、使用時は base_link の軸で置き換えて記録する
      designed_interface.time_semantics: >-
        設定版を記録。実行中の黙った変更はしない。変更は記録（RQ-I015：設定変更後に記録）。座標方向の指定を変えた場合は静的TFを再発行し設定版を更新。
        GLIM へは地図作成開始（TR-03）の時点の値と設定版を渡して記録し、地図作成中の変更はその地図作成には反映しない。
        取付値は人が gouda_monitor で設定し、未設定（UNKNOWN）を理由に質問・停止しない（RQ-I081）。実測値はコードにハードコードしない（RQ-I076）
  - id: TR-03
    append_intent_lines: [105]
    set_nested:
      transition.actions:
        - GLIM（ND-06）を起動・有効化（glim_runner。実行設定は配布テンプレートから生成、dump 先は作業領域 mapping/{origin_id}/glim_dump）。失敗は DecisionEvent（mapping_start_failed）で monitor に表示し、遷移を拒否
        - GLIM の T_lidar_imu を /config（IFD-26）の取付値から生成して実行設定に書き込み、値・未設定で中立要素にした項目・設定版を DecisionEvent（glim_extrinsic）に残す。未設定は遷移を拒否する理由にしない（RQ-I081）
        - 記録の自動開始を要求（IFD-45 record/log/start_pre_mapping。契機は人の地図作成開始ボタン：RQ-I015）。非同期で呼び、失敗・無応答でも地図作成の開始を止めない。失敗は DecisionEvent と monitor のポップアップ
        - 設定状況を記録（地図作成前：RQ-I015。GLIM の topic／frame・設定ディレクトリを DecisionEvent に残す）
      transition.guard: 自律走行系の推定器（ND-07・ND-08）が非活性で、GLIM と競合する TF 発行者がいない（RQ-I004）。GLIM が既に動いていない（前回の地図の保存中を含む）
  - id: TR-04
    set_nested:
      transition.actions:
        - 人の終了操作を受けた時点で手動走行へ遷移して応答する（GLIM の保存を待たない）。以降の処理は processing_state で表示する（DEC-010）
        - GLIM に保存を要求（SIGINT）し dump の完了を待つ（processing_state=map_saving。待つ上限は PRM-37、未確定の間は上限なし。保存時間を記録）。完了した dump だけを原図として map_database へ登録（由来 ID・内容ハッシュ・版・設定：RQ-I008・IFD-29）。不完全なら登録せず作業領域に残す。GLIM の TF 発行は停止する
        - 自動変換を Action（IFD-37）で非同期に起動し、processing_state=map_converting を IFD-01 で表示（DEC-010）。結果（成功・失敗）を DecisionEvent に記録。失敗しても原図は保持（RQ-I009）。変換専用モードは作らない
        - 自動開始したログ記録を停止（IFD-46 record/log/stop_auto）。保存・登録の結果を記録した後に行う。手動開始の記録は停止しない（RQ-I017）
        - 設定状況を記録（地図作成後：RQ-I015）
  - id: PRM-37
    set_nested:
      parameter.purpose: >-
        地図作成終了（TR-04）で GLIM に SIGINT を送ってから、dump（graph.txt・values.bin・submap）の書き出し完了を待つ上限。超過時は SIGTERM し dump は不完全として扱う（原図を公開しない）。
        未確定の間は上限を設けずに完了まで待ち（値を補わない）、保存時間を DecisionEvent（mapping_stopped の save_duration_s）に記録する。待つ間も手動走行で、終了操作の応答は待たせない
      parameter.measurement: 実車の地図サイズでの GLIM の保存時間の実測（mapping_stopped の save_duration_s を使う）
  - id: PRM-54
    set_nested:
      parameter.value: /dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_007137944B34-if00
      parameter.measurement: >-
        不要。実車PC の ls -l /dev/serial/by-id/ の出力（FILE-VEHICLE-PC-IMU-BYID、2026-10-13）に合わせた。DEC-082 の回答はシリアル番号を確定し、STM32 の後の記号は「-」だったが、実機の名前は「_」
    interpretation_append: >-
      REV-032: 値を実機の一覧に合わせて修正。DEC-082 で人が確認したのは「シリアル番号 007137944B34 の by-id の名前を使う」ことで、記号 1 文字の違いは実機の出力を正とした（ドライバは存在しない名前を開けない）。
