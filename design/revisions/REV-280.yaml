  channel: chat
  question: >-
    【承認】停止点（kind stop）に着いた後、その場で回って向きを揃えてから止まる動き（issue 99・100 の案）。
    AI の案：回転は Nav2 の Spin で行い、回る向きは近い方の一方向だけ、目標の角度まで回ったら終わり（残ったずれは記録だけでやり直さない）。
    ぶつかる判定は「これから回る範囲で車体の外形（footprint）が障害物のセルに重なるか」だけで、膨張は見ない。重なる間は回転を止めて待ち、
    重ならなくなったら残りを回る。全体の時間の上限を過ぎたら回転をやめて rule_stop_hold に入り、人の再開を待つ。
    AI が聞いたこと：(1) 人の発言の読み 2 か所が合っているか、(2) 回転の時間の上限の値。
  answer_verbatim: |
    二段階右折の様な感じで、一回止まる→人の操作で進む→右に回転して次の進行方向に機体の向きを揃える→止まる→ヒトの操作で自律走行を再開する。という場面がある。
    向きが合わなかった場合にずっとくねくね試行し続けては困る。また、回転中も人やロボットは周囲にいる為、過剰反応しては困る。回転した時にぶつかる場合のみ、回避をしてほしいし、障害物が去った後は回避をやってほしい。しかし、タイムアウトを設けたほうが良いと思う。（ずっと停止線付近で動いているのは危ないから。）
    「障害物が去った後は回避をやってほしい」は、「去った後は回転を続けてほしい」と言う意味です。
    2. 回転の時間の上限は20秒。ここに制限が入っているということをトラブルシューティング台帳に記載して
  affected_refs:
  - DEC-482
  - DEC-484
  - DEC-480
  - DEC-490
  - DEC-445
  - ND-03
  - ND-10
  - IFD-30
  resulting_refs: []
  note: >-
    回答は 3 回の発言に分かれている（原文の 1 行目は場面の説明、2 行目は動きの要求、3 行目は AI の読みへの訂正、4 行目は値と台帳の指示）。
    決まったこと：回転は一方向でやり直さない。回転でぶつかるときだけ待ち、障害物が去ったら回転を続ける。回転の時間の上限は 20 秒。
    20 秒をどこから数えるか（回転の段階に入ってから、待っている時間も含む）は AI の読みで、人には尋ねていない。
    台帳：TRB-015 に「20 秒で回転をやめるので、向きが揃わないまま止まることがある」を登録した（実装はまだなので、状態は監視中、実装前と書いた）。
    未決のまま：揃える向きの既定（次の waypoint への方位。issue 99 の 2）、回さない最小の角度の値、回れなかったときに止まって人の再開を待つこと（案のまま。人は反対していないが、明示の回答はない）。
    調べた事実（Nav2 1.3.13 の nav2_behaviors/plugins/spin.cpp と nav2_costmap_2d/src/costmap_topic_collision_checker.cpp を読んだ）：
    Spin は回った量が目標以上で終わり、逆には戻さない。衝突の検査は footprint の cost が LETHAL 以上のときだけ。
    ただし先の検査は既に回った量までしか先を見ないので、回り始めは先を見ない（ソースの読み。動かしては確かめていない）。
    このため、ぶつかる判定は mode manager の側で持つ案にした（autonomy_core.footprint_max_cost を使う。local costmap の購読が要る）。
    関係する他の決定：ゴールの向きの許容 6.3 rad（DEC-484）、MPPI の前進の下限（DEC-480。その場で回れない）、旋回の上限 0.5 rad/s（DEC-490）、旋回の遅れと不感帯（DEC-445）。
    見落としの指摘（判断は人）：回転で前端（原点から 0.55 m、PRM-69）が道路端に近づく。DEC-488 の置く位置の式はまっすぐ近づく前提。
    実装は未着手。実装には人の承認が要る（DEC-106）。新しいパラメータ（回転の時間の上限 20 秒ほか）は実装の変更セットで作る。
    先行事例は issue 99・100 に書いた（他チームの停止点での回転は未調査）。安全かどうかの判断は人（CLAUDE.md 1.12）。第254便。
  disposition: answered
- id: DEC-498
  kind: approval
  status: answered
  asked_on: '2026-11-07'
  answered_on: '2026-11-07'
  channel: chat
  question: >-
    【承認】停止用 waypoint を精密に置く方法。AI の案：waypoint タブの地図に「停止点の目印」を出し、人がその目印に合わせて停止用 waypoint を置く（自動では停止点にしない）。
    目印の出どころは 2 通り。(a) 事前地図作成のときに車体を止めたい位置に置いてボタンを押し、その時刻の位置を軌跡から出す。(b) network RTK の座標を地図の座標に直す。
    推奨は、先に (a) を作り、RTK が効くと確かめられたら (b) を足す順。
  answer_verbatim: |
    また、停止用のwaypointを精密に配置できる自信がないな。どうしましょうか。network RTKが使えるなら、座標ベースで地図上に停止waypointを置くべき場所を明示出来ても良いかもね。（自律走行前に、その場所に手動でてなの置きます）
    「手動でてなの置きます」は、「手動で停止用waypointをその場所に置く」という意味です
    1. RTKはこの後試験をする。推奨案通り、先に車体→RTKの順で良い。
