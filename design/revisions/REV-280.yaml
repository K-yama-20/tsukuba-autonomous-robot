  note: >-
    回答は 3 回の発言に分かれている（1 行目は人の提案、2 行目は AI の読みへの訂正、3 行目は順序の承認）。
    AI は最初「手動で車体をその場所に置く」と読み違え、人が訂正した。
    決まったこと：地図に目印を出し、停止用 waypoint は人が置く。目印の出どころは先に車体の位置、後で RTK。RTK の試験は人がこの後行う。
    必要な精度（計算、DEC-488・PRM-69）：原点が止まってよい範囲は停止線・道路端とも幅 1.5 m。停止距離のばらつきと自己位置のずれは未実測。
    (a) の土台：地図作成の終わりの姿勢（DEC-289、map_convert.mapping_end_pose_of）。途中の時刻の姿勢を出す処理とボタンは未実装。
    (b) に要るもの：RTK が効くこと（最後に読めた記録は 2026-10-23 で未確認）、地図の座標と緯度経度の対応づけ（未設計）、停止線の緯度経度（大会が公表しているかは未確認）。
    実装は未着手。実装には人の承認が要る（DEC-106）。第254便。
