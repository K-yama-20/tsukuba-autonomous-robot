summary: 第121便：人の指示（原文「周りは確認した。実車で自律走行開始を送って挙動を記録して。Gouda は前回と同じ位置・向きに置いている。」）で自律走行開始を送った（REV-148 の gouda_a3_points を VM に写した状態）。点群・NDT・GLIM の odometry・EKF はすべて届き（10 Hz・10 Hz・10 Hz・50 Hz）、初期化は約 19 秒で終わった。しかし ND-07 が map→odom を計算できず「推定不能（no_map_odom）」になり、開始は TR-07 で一時停止した。Nav2 は起動せず、速度の指令は 0 通。原因：MapOdomEstimator は最新の EKF の姿勢一つだけを保留し、odometry がその時刻に届くのを待つが、EKF の姿勢（約 50 Hz、時刻は受け取りとほぼ同じ）はいつも odometry（10 Hz、時刻は受け取りの 0.13〜0.17 秒前）より 0.13〜0.25 秒新しく、保留が次々に置き換わって計算されない。承認事項 DEC-285 を登録する。初期化の結果が試行ごとに大きく違う（同じ置き方で (−0.96, −2.57)、(−1.02, −2.56)、(0.56, 0.62)）ことも記録する。コードと設定は変えていない。
