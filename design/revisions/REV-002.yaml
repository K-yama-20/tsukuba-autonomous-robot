      affected_refs: [RQ-I071, IFD-15, IFD-18, IFD-19, IFD-20, IFD-21, IFD-23, ND-10, ND-13, PRM-01, PRM-02, PRM-03, PRM-04, PRM-05, PRM-06, PRM-07]
      resolution_refs: []
      question: >-
        RQ-I071（intent.md:99）は EMC-270 の車体座標系を「-y方向を車体前方、+x方向を車体右方、+z方向を上方」とし、base_footprint/base_link をこの系に置く。
        REP-103（RQ-I055 で優先）は x前方・y左方・z上方。Nav2 の controller は cmd_vel の linear.x を base_link 前方として扇生成し、costmap の footprint も base_link 基準で評価する。
        RQ-I056（Nav2本体は改変しない）と RQ-I071 の軸定義は同時に満たせない。base_link の軸をどちらに従わせるか。
      next_action: 回答まで TF（IFD-18〜20）と車体寸法パラメータ（PRM-01〜07）の frame 定義を未確定として扱う。Nav2 設定・footprint・静的TFの作成はこの決定後。
      options:
        - label: base_linkはREP-103、LiDAR系はセンサframeの回転で表す
          effect: base_link/base_footprint を x前方・y左方で定義し、RQ-I071 の「LiDARに合わせた -y 前方」は xt32_link への静的TF（z軸回り回転）で表現。Nav2 無改変。RQ-I071 の文言は「センサ系の取り方」として読み替える必要があり人の確認が要る。
        - label: RQ-I071どおり -y 前方の base_link を採用
          effect: Nav2 controller・costmap がそのまま動作しない。Nav2 改変（RQ-I056 違反）または cmd_vel/TF の Gouda 側変換（RQ-I020・RQ-I057 と衝突）が必要。
        - label: 保留
          effect: TF・Nav2 設定・footprint の設計が止まる。
      recommendation: base_linkはREP-103、LiDAR系はセンサframeの回転で表す
      recommendation_basis: RQ-I055（標準規約優先）・RQ-I056（Nav2無改変）と両立し、RQ-I071 の寸法・原点・base_link 高さの値はそのまま使える。ROS 2 規約と人の要求の衝突は RQ-I053 により一覧報告の対象。

  - id: H-006
    kind: issue
    name: 復旧不能・試行上限時の遷移先（直前モードが手動走行・事前地図作成のとき）
    intent_lines: [16, 92, 37, 97]
    related_refs: [C-019, C-006, DEC-008]
    sensitivity: [safety, operation]
    adoption: unresolved
    design_status: 未設計
    issue:
      category: human
      state: open
      affected_refs: [RQ-I013, RQ-I064, TR-09, TR-13, TR-14, TR-15, TR-16]
      resolution_refs: []
      question: >-
        RQ-I013 は復旧不能・試行上限時に「一時停止モードに入り理由を記録する」とする。RQ-I064 は復帰先を直前の状態（4モードのいずれか）とする。
        直前が手動走行または事前地図作成で、PC側の node 異常の復旧に失敗した場合も一時停止モード（RQ-I026では自律走行の一時停止）に入るか、直前モードを維持して理由を記録するか。
      next_action: 回答まで TR-09／TR-13〜16 の「復旧不能時の遷移先」は自律走行・一時停止からの場合だけ確定（一時停止へ）、他は未決。
      options:
        - label: 直前が自律走行・一時停止のときだけ一時停止へ。手動走行・事前地図作成では直前モードを維持し理由を記録
          effect: 一時停止モードを自律走行の一時停止（RQ-I026）に限定する読み。手動走行中の PC 故障は monitor 表示と記録のみ。
        - label: 常に一時停止モードへ（RQ-I013 の文言どおり）
          effect: 手動走行中でも PC 側の表示上は一時停止になる。再開ボタンの意味（自律走行再開）と手動走行の関係を別途定義する必要がある。
      recommendation: 直前が自律走行・一時停止のときだけ一時停止へ。手動走行・事前地図作成では直前モードを維持し理由を記録
      recommendation_basis: RQ-I026 の一時停止の定義と RQ-I064 の直前状態復帰に整合する読み。推測を仕様にせず人の確認を求める。

  - id: H-007
    kind: issue
    name: PC再起動後の一時停止モードから再開するときの自己位置初期化
    intent_lines: [92, 17, 97, 14]
    related_refs: [DEC-009]
    sensitivity: [safety, operation]
    adoption: unresolved
    design_status: 未設計
    issue:
      category: human
      state: open
      affected_refs: [RQ-I064, RQ-I014, TR-02, TR-10, SO-01, ND-07]
      resolution_refs: []
      question: >-
        RQ-I064 により PC 再起動後は一時停止モードへ復帰する。RQ-I014 は再開時に「再開する地点の再設定は必須ではない」とするが、PC 再起動後は自己位置推定器の状態が失われている。
        再開時の初期化を、(a) 永続化した最終推定姿勢（SO-01）で自動初期化、(b) 人が初期位置を再指定してから再開、のどちらにするか。
        (a) は PC 停止中に車体が動かされた場合に誤った初期位置で走行開始する可能性がある。
      next_action: 回答まで TR-02 の「必要な状態の復元」に最終推定姿勢の復元を含めるかは未決。
      options:
        - label: 人が初期位置を再指定してから再開（RQ-I014 を同一プロセス内の一時停止に限る読み）
          effect: PC 再起動後の再開に人の操作が1回増える。誤初期化のリスクを下げる。
        - label: 永続化した最終推定姿勢で自動初期化
          effect: 操作は増えないが、停止中の車体移動を検出できない。推定成立の確認を再開の guard にする必要がある。
      recommendation: 人が初期位置を再指定してから再開（RQ-I014 を同一プロセス内の一時停止に限る読み）
      recommendation_basis: 誤った初期位置での自動走行を避ける。ただし RQ-I014 の読み替えを含むため人の確認が必要。

  - id: H-008
    kind: issue
    name: 地図作成終了ボタン押下後に入るモード
    intent_lines: [11, 94, 93]
