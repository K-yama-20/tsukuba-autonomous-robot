  # H-001: 採用版（上流 jazzy）での3案比較の結果を反映（承認は人）
  - id: H-001
    append: {issue_refs: [], related_refs: [V-001, DEC-011]}
    set_nested:
      issue.options:
        - label: Gouda側発行器（gouda_mode_manager が単一発行）
          effect: >-
            NavigateThroughPoses の feedback number_of_poses_remaining の変化（Nav2 の RemovePassedGoals による通過判定）で区間 i→i+1 への進入を検出し、
            進入区間の上限を SpeedLimit(percentage=false, m/s) で speed_limit topic へ1回発行。発行元は一つ。Nav2 本体の改変なし。区間境界の「進入する区間の値を適用」（RQ-I010）に直接対応。
            境界時点の実速度保証は要求しない（RQ-I062）。独自の通過判定は作らない（Nav2 の feedback を使う）。
        - label: Route Server（nav2_route の AdjustSpeedLimit route operation）
          effect: >-
            上流 jazzy に nav2_route 1.3.13 が存在。経路グラフの edge metadata（speed_tag）から SpeedLimit を発行するが percentage=true（最大速度に対する%）で m/s 指定ではない。
            waypoint 列を route graph に変換し BT を route 系へ変える大きな構成変更。区間=edge の対応は良い。採用版・実車PCでの提供状況は未照合（V-001）。
        - label: Speed Filter（costmap filter）
          effect: >-
            OccupancyGrid の mask と CostmapFilterInfo（type 1=%, 2=m/s）で領域ごとの上限を与える。区間 i→i+1 を平面領域（corridor）として塗る必要があり、
            折れ線区間の境界をどの cell に割り当てるかの幾何定義がなく（Q-06/Q-12）、waypoint セットごとに mask の再生成が要る。境界の意味づけが「進入する区間の値」と一致しにくい。
      issue.recommendation: >-
        Gouda側発行器（gouda_mode_manager が単一発行）。上流 jazzy で NavigateThroughPoses の feedback と controller_server の speed_limit 購読を確認済み。
        代替は Route Server（route graph への移行を受け入れる場合）。Speed Filter は区間境界の幾何定義が未決のため推奨しない。承認は人（DEC-011）。実車PCの版照合（V-001）が前提。
      issue.recommendation_basis: >-
        RQ-I020（Nav2標準のSpeedLimit経路を単一発行元から）・RQ-I010（区間境界では進入する区間の値を適用）・RQ-I011（通過判定はNav2）・RQ-I056（Nav2無改変）を同時に満たす案を優先。
        根拠ファイル: research/upstream_jazzy/nav2_controller/src/controller_server.cpp, nav2_route/src/plugins/route_operations/adjust_speed_limit.cpp, nav2_costmap_2d/plugins/costmap_filters/speed_filter.cpp, nav2_msgs/msg/CostmapFilterInfo.msg。
      issue.next_action: 人が DEC-011 で承認する。承認後、発行タイミング（feedback 周期）と初回区間の発行を IFD-14 の契約として固定し、V-001 で実車PCの版を照合する。
