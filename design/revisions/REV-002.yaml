  # ---- 人の判断事項（新規） ----
  - id: H-002
    kind: issue
    name: Safety_gateの採用可否と一時停止・終了・故障時の遮断経路
    intent_lines: [37, 38, 26, 91, 96, 34]
    source_from_affected: true
    related_refs: [C-015, DEC-004]
    sensitivity: [safety, operation]
    adoption: unresolved
    design_status: 未設計
    issue:
      category: human
      state: open
      affected_refs: [M-014, M-013, IF-024, IF-025, IF-026, IF-027, IF-045, DG@x5bDQh8FaZrcMh8EckeY-28, TR-06, TR-11, TR-12, ND-11, ND-12]
      resolution_refs: []
      question: >-
        旧資料の Safety_gate（M-014: 「PC側のmission走行要求とsystem健全性、有効な制御指令を照合し、最終PC指令を一つに限定する」、入力 IF-024 control/joystick_command・IF-025 task/motion_enable・IF-026 safety/permission、出力 IF-027）は、
        一時停止・終了・故障時のPC指令遮断をPC側で一本化する要素である。現在の案では遮断を「Nav2 goal の取消（controller_server は取消時に零速度を発行）→ cmd_vel 途絶で gouda_motion_controller が中立（RQ-I063）→ 指令源途絶で ESP32 が中立（RQ-I068）」で構成している。
        Safety_gate を採用するか。採用する場合、motion_enable/permission は新しい保護の追加（RQ-I027：AIは独断で増やさない）に当たるため人の判断が必要。
        C-015 との関係: 図の heartbeat_and_status と collision_stop_request は Safety_gate／supervisor の入力候補として描かれており、H-003・H-004 の回答と連動する。
      next_action: 回答まで Safety_gate・supervisor を「未確認」とし、利用可能な機能として設計に使わない。回答後に IF 契約（型・QoS・時刻）を設計する。
      options:
        - label: 採用しない（暫定案）
          effect: Nav2取消＋cmd_vel途絶中立（RQ-I063）＋ESP32中立化（RQ-I068）の既存契約だけで遮断。PC側の遮断は単経路。
        - label: Safety_gateを採用する
          effect: task/motion_enable・safety/permission の契約（epoch・有効期限・所有者）を設計。新しい保護の追加として基本契約の変更に相当。
        - label: 保留
          effect: 未確認のまま。車体出力（RQ-I044の順序）の実装前に決定が必要。
      recommendation: 採用しない（暫定案）。追加の保護はRQ-I027により提案に留め、必要性・根拠・開発への影響を添えて別途提示する。
      recommendation_basis: 上位要求（RQ-I063・RQ-I068）で途絶時の中立化が既に契約されており、AIが保護を独断で増やさない（RQ-I027）。

