      next_action: 回答まで TR-04 の遷移先は手動走行（既定モード RQ-I066 からの推奨）を案として置く。
      options:
        - label: 手動走行モード（既定モード）
          effect: RQ-I066 の既定モードへ戻る。変換（RQ-I009）は手動走行中にバックグラウンドで完了する。
        - label: 一時停止モード
