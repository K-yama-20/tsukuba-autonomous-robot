  # ---- 下位設計案: 4ソフトモードの遷移（kind=transition, payload あり） ----
  - id: TR-01
    kind: transition
    name: 起動 → 手動走行（既定）
    intent_lines: [94, 93, 7]
    issue_refs: []
    sensitivity: [operation]
    transition:
      from_mode_ref: null
      to_mode_ref: MODE-MANUAL
      event_class: boot
      trigger: gouda.sh による起動完了。直前モードの永続記録がない、または手動走行
      trigger_kind: system
      owner_ref: ND-03
      guard: 直前モード記録が存在しないか MODE-MANUAL（それ以外は TR-02）
      actions:
        - 共通 node を起動し、手動走行モードを IFD-01 で公開
        - 自律走行系（ND-07〜ND-12）は非活性のまま
        - 記録は開始しない（自動開始の契機ではない：RQ-I015）

  - id: TR-02
    kind: transition
    name: PC再起動 → 一時停止（直前が自律走行・事前地図作成・一時停止）
    intent_lines: [92, 36, 97, 16, 19]
    issue_refs: [H-007]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: null
      to_mode_ref: MODE-PAUSE
      event_class: pc_restart
      trigger: 起動時に直前モードの永続記録が MODE-AUTO／MODE-MAP／MODE-PAUSE
      trigger_kind: system
      owner_ref: ND-03
      guard: 人の一時停止／終了操作の後なら走行を再開しない（RQ-I025）。再開は人の操作（TR-10）のみ
      actions:
        - 一時停止モードへ復帰する場合に必要な状態（mission_context・remaining_waypoints・stop_reason）だけを復元（RQ-I069）
        - 旧 Nav2 goal が残っていないことを確認（Nav2 は再起動で goal を持たない）
        - 自律走行指令の再許可はしない（一時停止への復帰のため：RQ-I069）
        - 自動 Record は開始しない（契機ではない：RQ-I015）。再開時の自己位置初期化は H-007

  - id: TR-03
    kind: transition
    name: 手動走行 → 事前地図作成（地図作成開始ボタン）
    intent_lines: [9, 7, 19]
    issue_refs: []
    sensitivity: [operation]
    transition:
      from_mode_ref: MODE-MANUAL
      to_mode_ref: MODE-MAP
      event_class: map_start
      trigger: 人が gouda_monitor の地図作成開始ボタンを押す（IFD-06）
      trigger_kind: human
      owner_ref: ND-03
      guard: 自律走行系の推定器（ND-07・ND-08）が非活性で、GLIM と競合する TF 発行者がいない（RQ-I004）
      actions:
        - GLIM（ND-06）を起動・有効化。失敗は monitor に表示
        - ログ記録が未開始なら自動開始（IFD-08。契機は人の地図作成開始ボタン：RQ-I015）
        - 設定状況を記録（地図作成前：RQ-I015）

  - id: TR-04
    kind: transition
    name: 事前地図作成 → 手動走行（地図作成終了ボタン。遷移先は H-008 の案）
    intent_lines: [11, 12, 21]
    issue_refs: [H-008]
    sensitivity: [operation]
    transition:
      from_mode_ref: MODE-MAP
      to_mode_ref: MODE-MANUAL
      event_class: map_end
      trigger: 人が地図作成終了ボタンを押す（IFD-07）
      trigger_kind: human
      owner_ref: ND-03
      guard: なし（人の操作は常に受け付ける）
      actions:
        - GLIM に保存を要求し、原図を map_database へ保管（RQ-I008）。GLIM の TF 発行を停止
        - 自動変換を Action（IFD-37）で起動。失敗しても原図は保持（RQ-I009）
        - 自動開始したログ記録を停止。手動開始の記録は停止しない（RQ-I017）
        - 設定状況を記録（地図作成後：RQ-I015）

  - id: TR-05
    kind: transition
    name: 手動走行 → 自律走行（自律走行開始ボタン）
    intent_lines: [14, 36, 19, 7, 13]
    issue_refs: [H-001, H-005]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-MANUAL
      to_mode_ref: MODE-AUTO
      event_class: start
      trigger: 人が地図とwaypointの組を選択し初期位置・向きを指定して自律走行開始ボタンを1回押す（IFD-02）
      trigger_kind: human
      owner_ref: ND-03
      guard: ND-07・ND-08・ND-10 が活性、ND-06 が非活性（RQ-I004）。選択した地図・waypoint の ID と内容ハッシュが一致。追加の承認は挟まない（RQ-I011）
      actions:
        - 初期位置を ND-07 へ送る（IFD-34）
        - run_id を発行し、remaining_waypoints を全区間で初期化
        - 先頭区間の速度上限を発行（IFD-14。発行元は H-001）し、NavigateThroughPoses goal を送信（IFD-13）
        - ログ記録が未開始なら自動開始（契機は人の自律走行開始ボタン：RQ-I015）。設定状況を記録
        - 直前モード記録を MODE-AUTO に更新

  - id: TR-06
    kind: transition
    name: 自律走行 → 一時停止（一時停止ボタン）
    intent_lines: [37, 36, 19, 41, 91]
    issue_refs: [H-002]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-AUTO
      to_mode_ref: MODE-PAUSE
      event_class: pause
      trigger: 人が gouda_monitor の一時停止ボタンを押す（IFD-03）
      trigger_kind: human
      owner_ref: ND-03
      guard: なし（人の操作は常に受け付ける）
      actions:
        - Nav2 goal を取消（controller_server は取消時に零速度を発行）
        - cmd_vel 途絶で ND-11 が中立（RQ-I063）。遮断経路の冗長化は H-002
        - 停止原因区分=人の操作を記録（RQ-I029）。ログ記録は継続（RQ-I015）
        - 直前モード記録を「人の一時停止操作あり」で更新（RQ-I025）

  - id: TR-07
    kind: transition
    name: 自律走行 → 一時停止（Nav2 BT の失敗）
    intent_lines: [15, 24, 41]
    issue_refs: []
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-AUTO
      to_mode_ref: MODE-PAUSE
      event_class: nav_failure
      trigger: NavigateThroughPoses の result が失敗（error_code != NONE）。後退・再計画は Nav2 BT の責務で尽くした結果
      trigger_kind: automatic
      owner_ref: ND-03
      guard: 自律走行中で、人の操作による取消ではない
      actions:
        - Nav2 の結果（error_code・error_msg）をログに記録（RQ-I012）
        - 停止原因区分を「計画の失敗／blocked」と「推定不能／通信途絶」で区別して記録（RQ-I012・RQ-I029）
        - 残 waypoint は保持（再開で同じ目標へ：RQ-I014）

  - id: TR-08
    kind: transition
    name: 自律走行 → 一時停止（最終 waypoint 到達）
    intent_lines: [21, 95, 11]
    issue_refs: []
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-AUTO
      to_mode_ref: MODE-PAUSE
      event_class: goal_reached
      trigger: NavigateThroughPoses の result が成功（最終 waypoint 到達。到達判定は Nav2：RQ-I011）
      trigger_kind: automatic
      owner_ref: ND-03
      guard: なし
      actions:
        - 車体を停止（Nav2 は goal 完了で cmd_vel 発行を止める→ND-11 中立）し一時停止モードへ（RQ-I017）
        - remaining_waypoints を「最終 waypoint のみ」にする（再開時も最終 waypoint を目指す：RQ-I067）
        - 自動開始した記録は停止しない（人の終了操作で停止：RQ-I017）

  - id: TR-09
    kind: transition
    name: 自律走行 → 一時停止（自動復帰不能・試行上限）
    intent_lines: [16, 92]
    issue_refs: [Q-05, H-006]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-AUTO
      to_mode_ref: MODE-PAUSE
      event_class: recovery_failed
      trigger: TR-13 の自動復帰が不能、または試行回数が上限（値は Q-05）に達した
      trigger_kind: automatic
      owner_ref: ND-03
      guard: 直前モードが自律走行（他のモードからの場合は H-006）
      actions:
        - 理由（失敗した段階と原因区分）を記録（RQ-I013）
        - 旧 Nav2 goal の終了または破棄を確認してから一時停止へ

  - id: TR-10
    kind: transition
    name: 一時停止 → 自律走行（再開ボタン）
    intent_lines: [17, 95, 19, 36]
    issue_refs: [H-007, H-001]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-PAUSE
      to_mode_ref: MODE-AUTO
      event_class: resume
      trigger: 人が再開ボタンを押す（IFD-04）
      trigger_kind: human
      owner_ref: ND-03
      guard: ND-07・ND-08・ND-10 が活性で推定が有効。旧 goal が終了済み。再開地点の再設定は要求しない（RQ-I014。PC再起動後は H-007）
      actions:
        - remaining_waypoints（最終到達後は最終 waypoint のみ：RQ-I067）で新しい NavigateThroughPoses goal を送信
        - 進入区間の速度上限を発行（IFD-14）
        - 自動 Record は開始しない。記録が停止中なら人が Record で再開できる（RQ-I015）
        - 直前モード記録を MODE-AUTO に更新

  - id: TR-11
    kind: transition
    name: 自律走行 → 手動走行（自律走行終了ボタン）
    intent_lines: [19, 21, 36]
    issue_refs: [H-002]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-AUTO
      to_mode_ref: MODE-MANUAL
      event_class: end
      trigger: 人が自律走行終了ボタンを押す（IFD-05）
      trigger_kind: human
      owner_ref: ND-03
      guard: なし（人の操作は常に受け付ける）
      actions:
        - Nav2 goal を取消し、停止原因区分=人の操作を記録
        - 自動開始したログ記録を停止。手動開始の記録は継続（RQ-I017）
        - 直前モード記録を MODE-MANUAL（人の終了操作あり）に更新（RQ-I025）
        - 自律走行系（ND-07〜ND-12）を非活性化

  - id: TR-12
    kind: transition
    name: 一時停止 → 手動走行（自律走行終了ボタン）
    intent_lines: [19, 21, 36]
    issue_refs: [H-002]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-PAUSE
      to_mode_ref: MODE-MANUAL
      event_class: end
      trigger: 人が自律走行終了ボタンを押す（IFD-05）
      trigger_kind: human
      owner_ref: ND-03
      guard: なし
      actions:
        - 残っている Nav2 goal があれば取消
        - 自動開始したログ記録を停止。手動開始の記録は継続（RQ-I017）
        - 直前モード記録を MODE-MANUAL（人の終了操作あり）に更新（RQ-I025）
        - 自律走行系（ND-07〜ND-12）を非活性化

  - id: TR-13
    kind: transition
    name: 自律走行中の個別異常からの自動復帰（同モードへ復帰）
    intent_lines: [16, 92, 97, 36]
    issue_refs: [Q-05, H-006, G-RECOVERY]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-AUTO
      to_mode_ref: MODE-AUTO
      event_class: fault_recovery
      trigger: node 異常・推定不能・通信途絶の検出（lifecycle 状態・/diagnostics・IF の途絶）
      trigger_kind: automatic
      owner_ref: ND-03
      guard: 人の一時停止／終了操作が先行していない（RQ-I025）。試行回数が上限未満（Q-05）
      actions:
        - 必要な場合だけプロセス再起動（RQ-I013 の依存順序の第1段。不要な故障では省く：RQ-I069）
        - 自律走行への復帰に必要な状態だけを復元（mission_context・remaining_waypoints）
        - 当該 mission に属する旧 Nav2 goal の終了または破棄を確認
        - 自律走行指令の再許可（新 goal の送信）。自律走行へ復帰する場合に限る（RQ-I069）
        - 各段階の成否を記録。人の追加承認は求めない（RQ-I013）

  - id: TR-14
    kind: transition
    name: 事前地図作成中の個別異常からの自動復帰（同モードへ復帰）
    intent_lines: [16, 92, 97]
    issue_refs: [Q-05, H-006, G-RECOVERY]
    sensitivity: [operation]
    transition:
      from_mode_ref: MODE-MAP
      to_mode_ref: MODE-MAP
      event_class: fault_recovery
      trigger: node 異常・通信途絶の検出（GLIM・ドライバ・記録）
      trigger_kind: automatic
      owner_ref: ND-03
      guard: 試行回数が上限未満（Q-05）
      actions:
        - 必要な場合だけプロセス再起動
        - 事前地図作成に必要な状態だけを復元（記録セッションは自動開始しない：RQ-I015）
        - 自律走行指令の再許可は行わない（RQ-I069）
        - 各段階の成否を記録

  - id: TR-15
    kind: transition
    name: 一時停止中の個別異常からの自動復帰（同モードへ復帰）
    intent_lines: [16, 92, 97]
    issue_refs: [Q-05, H-006, G-RECOVERY]
    sensitivity: [safety, operation]
    transition:
      from_mode_ref: MODE-PAUSE
      to_mode_ref: MODE-PAUSE
      event_class: fault_recovery
      trigger: node 異常・推定不能・通信途絶の検出
      trigger_kind: automatic
      owner_ref: ND-03
      guard: 試行回数が上限未満（Q-05）
      actions:
        - 必要な場合だけプロセス再起動
        - 一時停止への復帰に必要な状態だけを復元
        - 自律走行指令の再許可は行わない（一時停止のまま：RQ-I069）
        - 各段階の成否を記録

  - id: TR-16
    kind: transition
    name: 手動走行中の個別異常からの自動復帰（同モードへ復帰）
    intent_lines: [16, 92, 97]
    issue_refs: [Q-05, H-006, G-RECOVERY]
    sensitivity: [operation]
    transition:
      from_mode_ref: MODE-MANUAL
      to_mode_ref: MODE-MANUAL
      event_class: fault_recovery
      trigger: node 異常・通信途絶の検出（手動走行では PC の自律系は非活性のため対象は monitor・recorder 等）
      trigger_kind: automatic
      owner_ref: ND-03
      guard: 試行回数が上限未満（Q-05）
      actions:
        - 必要な場合だけプロセス再起動
        - 手動走行に必要な状態だけを復元
        - 自律走行指令の再許可は行わない（RQ-I069）
        - 各段階の成否を記録

