id: REV-060
date: '2026-10-17'
summary: >-
  人が DEC-116 を許可した（原文）。試験スタック（gouda_core/test/stack.sh）だけに Fast DDS の共有メモリの区画を大きくする設定（gouda_core/test/fastdds_test_stack.xml）を入れた。
  gouda.sh と x86 機の設定は変えていない。VM で、前回の試験（FILE-RECORDER-GLIM-FIX-VM-TEST の手順）が同じ結果になること、約 2 MB の点群の配送が設定なし 70・86/200 から設定あり 178・182/200 に増えることを確かめた（FILE-DEC116-FASTDDS）。
  人の指示（DEC-119、原文）により、工程 5-6 の Global_localization と Navigation の実装を検討した（提案 design/proposals/stage56_navigation_localization_plan.md。実装なし: DEC-106）。
  推奨: Navigation（Nav2 の構成と mode_manager の client）を先に作り VM の模擬で試験する。GNSS の取込みを次の実機試験の前に作る。ND-07 は DEC-115 と GNSS の初期位置の設計の後。ND-08 は方式に依存しないので先に作れる。
  承認事項 DEC-120〜DEC-124 を登録した。setup.sh が Nav2 を入れないこと（x86 機の Nav2 の有無は未確認）を確かめた。
