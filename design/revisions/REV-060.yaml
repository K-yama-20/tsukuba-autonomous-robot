      behaviors は spin・backup・wait、velocity_smoother を使う、collision_monitor は使わない（RQ-I072）、cmd_vel は TwistStamped（PRM-12 を true に）。
      障害物は独自の node（ND-09）を作らず XT-32 の点群を Nav2 の VoxelLayer・ObstacleLayer に高さの帯で入れ、観測していない所を空きとみなさない（track_unknown_space）。
      静的 TF（ND-13）は /config が UNKNOWN の項目を中立の値で出して記録する（今の正本は「未入力なら TF を出さない」）。Nav2 は自律走行・一時停止以外では inactive にする。
    answer_verbatim: ''
    affected_refs: [ND-10, ND-09, ND-13, ND-11, IFD-15, PRM-11, PRM-12, PRM-17, PRM-18, Q-04, Q-06]
    resulting_refs: []
    note: >-
      推奨は承認。振る舞いの違い: RPP は経路をなぞるだけで軽く挙動を説明しやすい。MPPI は回避が滑らかだが CPU を使う。collision_monitor を使わないので、近づいたら止める PC 側の機構はない（障害物は costmap と計画で扱う）。
      velocity_smoother を使うと cmd_vel の発行元が velocity_smoother になる（IFD-15 の記述を直す）。障害物の高さの帯は坂の上りで地面を障害物にしうる（推測。実車の地図で確かめ、問題なら ND-09 を作る）。
