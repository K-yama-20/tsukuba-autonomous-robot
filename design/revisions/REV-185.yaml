modifications:
- id: ND-09
  set:
    name: 障害物の扱い（上流の pointcloud_to_laserscan で base_link の高さの帯を切り、Nav2 costmap の ObstacleLayer に渡す。DEC-336・DEC-395）
  set_nested:
    ros_node.node_name: xt32_scan
    ros_node.responsibilities:
    - XT-32 点群（IFD-21）を上流の pointcloud_to_laserscan（node xt32_scan）で base_link に変換し、高さの帯（PRM-70・PRM-71、base_link 基準）の中の点だけを方位ごとの LaserScan（IFD-57）にする。独自の点群処理は作らない（DEC-336・DEC-395）
    - local・global の costmap は IFD-57 を ObstacleLayer の観測源にし、Nav2 側の高さの帯は実質無効にする（Nav2 は帯を odom・map の z で当て、その原点は GLIM の最初の IMU の姿勢のため。DEC-336）。local は 2 次元（DEC-321、TRB-001）
    - 帯の中に点のない方位は空きとして消去に使う（inf_is_valid、DEC-322、TRB-002）。これは「観測外を安全とみなさない」（RQ-I012）の人が認めた例外。それ以外の観測外（track_unknown_space）は今のまま
    - pointcloud_to_laserscan が入っていなければ Nav2 を起動しない（障害物の入力なしで走らない）
    - 坂で地面が帯に入り障害物になる場合は、実車の記録で確かめてから既製の地面の除去（patchwork++ など）を提案する
    ros_node.lifecycle: external
    ros_node.publishes_refs:
    - IFD-57
  interpretation_append: 'REV-185（DEC-336・DEC-395）：帯を base_link で切る既製の pointcloud_to_laserscan を ND-09 とした（node xt32_scan、Nav2 と一緒に起動）。'
