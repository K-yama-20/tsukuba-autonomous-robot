modifications:
- id: ND-12
  interpretation_append: REV-111（DEC-176）：USB の差し直しで、読み出しの失敗を切断として記録（serial_disconnected）し、ポートを閉じる。udevadm monitor の tty のイベント（周期なし）で同じ by-id の名前の再出現を確かめて開き直し（serial_reconnected）、HELLO からセッションを始める（設定の登録は HELLO_REPLY が新しい boot_token か設定が無効のとき）。lifecycle の状態は変えない。切断中の書き込みは記録なしで捨てる。自律走行は切断で一時停止にしない（人の決定）。
