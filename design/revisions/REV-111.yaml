  channel: chat
  question: USB を差し直したときの vehicle_bridge の再接続（第77便の作業記録 §3 の案 1〜5）の実装と、案 6（自律走行中の切断で一時停止に入れるか）
  answer_verbatim: "USB を差し直したときの改善案を実装せよ。\n1~5は承認する。（btコントローラからの指令はusb接続断の際も常に受入可能にしておくこと。現在外部給電は考えていないが、将来的に外部給電する可能性もあるので、念のために指示しておく）\n6については、自律走行中に切断したとしても一時停止には入れず、続行させる設定とする。\n"
  affected_refs:
  - ND-12
  - ND-17
  - ND-03
  resulting_refs: []
  note: 実施は第79便（gouda_core/gouda_core/vehicle_bridge_node.py の SerialTransport、試験 gouda_core/test/test_serial_reconnect.py）。BT コントローラの指令の受け入れは firmware の手動の判定が PC・USB の状態を見ないことで成り立つ（control.hpp の applied()、ホスト試験 DEC-167 A10）。firmware は変えていない。案 6：mode_manager は vehicle_bridge の切断を見ず、自律走行は続く。切断中は COMMAND が届かず、firmware が PRM-13（1.0 s）で PC 指令を中立にするため、車体は止まり、再接続後に HELLO の返事の boot_token で COMMAND が再開する（Nav2 の goal は続く）。USB 給電では差し直しで ESP32 が再起動し、PC の有効化に中立の COMMAND が要る。
  disposition: answered
