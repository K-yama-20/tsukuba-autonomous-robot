decisions:
  - id: DEC-090
    kind: confirmation
    status: recorded
    asked_on: null
    answered_on: '2026-10-13'
    channel: chat
    question: 起動経路と起動オプション（人の指摘）
    answer_verbatim: |
      センサーを使う起動モードと、センサーを使わない起動モードがあるのは何故だ？そんなこと指示したっけ？起動経路はなるべく一つにして、起動オプションでなるべく迷いが生じないようにって指示したと思うのだが。。
    affected_refs: [ND-01, ND-18]
    resulting_refs: []
    note: >-
      事実: GOUDA_SENSORS は AI が REV-031（2026-10-13）で、センサーのない環境で試験するために自分の判断で入れた。人の指示ではない。gouda.sh の環境変数は GOUDA_WORKSPACE・GOUDA_DATA_ROOT・GOUDA_PARAMS_DIR・
      GOUDA_TRIAL_PARAMS・GOUDA_MONITOR_PORT・GOUDA_SENSORS・GOUDA_SERIAL_PORT・ROS_SETUP の 8 つ（ROS_SETUP を含む）。実車でも未確定値（DEC-084・085）のため GOUDA_TRIAL_PARAMS=1 が要る状態だった。
      判断台帳（answer_verbatim）と intent.md には「起動経路を一つに」「起動オプションで迷わない」と同じ文の指示は見つからない。チャットで受けていたなら記録していなかった（CLAUDE.md 1.1 に反する）。
      以後この方針で設計する。変更案（起動は bash gouda.sh start の一つ、センサーは常に supervisor が扱う、機械ごとの値は正本の設定、仮値は試験 script だけ）は人の了承待ち。
    disposition: answered
