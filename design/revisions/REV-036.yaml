id: REV-036
date: '2026-10-13'
summary: >-
  人の指摘（DEC-090）を原文で記録。センサーを使う／使わない起動の切替（GOUDA_SENSORS）は人の指示ではなく AI が REV-031 で入れたもの。
  gouda.sh は環境変数の選択肢を 7 つ持っている。台帳と intent.md に同じ文の指示は見つからなかったが、intent.md の体験 1・2（gouda.sh を実行し、共通の node を起動し、モードごとに必要な node を起動または有効化）と同じ方向。
  起動経路を一つにする変更案は人の了承待ち（モデル要素は変えない）。
