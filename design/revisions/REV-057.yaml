# 変更セット REV-057（2026-10-17 第28便の続き: 自己位置推定の方式の検証（案 A と案 A3）の記録、承認事項 2 件、G-DDS の原因の裏付け。実装はしていない）
# 適用: design/tools/apply_revision.py REV-057
id: REV-057
date: '2026-10-17'
summary: >-
  人の指示（DEC-114）により、案 A（lidar_localization_ros2）と案 A3（Autoware Core の NDT＋EKF）を VM で検証した（評価用のワークスペース、rosbag は外付けをその場で読み VM に写していない）。
  同じ走行の地図での位置の誤差の 95 % 点は A 0.124 m、A3 0.209 m で、どちらも基準内。初期姿勢が大きくずれたとき、A は誤った姿勢を正常として出し続け（5 m・90 度で 60 秒、524 回中 510 回）、
  A3 は棄却するか、Monte Carlo の初期姿勢の探索で戻った。第一候補を A3 に変える案を承認事項 DEC-115 とした。VM の中で約 2 MB の点群が DDS で落ちていたこと（Fast DDS の共有メモリの区画を
  大きくすると等倍でも 200/200 届く）を確かめ、G-DDS に記録し、VM の試験の環境への設定の追加を承認事項 DEC-116 とした。別の走行の地図での評価は、今のデータに重なる走行がなくできなかった。
basis_refs: [DEC-114, DEC-021]
