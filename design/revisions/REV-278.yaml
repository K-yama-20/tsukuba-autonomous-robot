decision_updates:
- id: DEC-494
  set:
    status: answered
    answered_on: '2026-11-07'
    disposition: answered
    answer_verbatim: |
      （質問「DEC-494 は推奨の A（ドライバの写しに patch）で進めますか？」への回答）A で進める
    note: "事実（AI が原本で確かめた）：MID-360 は機器の状態（cur_work_state、core_temp〈0.01 ℃〉、lidar_diag_status、hms_code）を周期的に送る（docs/mid360_driver_interfaces.md 5 章）。\nSDK2 c0796f0 は通知を SetLivoxLidarInfoCallback の callback に JSON の文字列で渡す（include/livox_lidar_api.h 98〜103 行、見本 samples/livox_lidar_quick_start/main.cpp 251〜257・280 行は画面に出すだけ）。\nドライバ 2144554 はこの callback を登録しない（lds_lidar.cpp 182・187・188 行）。SDK は接続のたびに機器の点群と IMU の送り先を自分の設定に書き換える\n（sdk_core/command_handler/build_request.cpp の BuildUpdateLidarCfgRequest、kKeyLidarPointDataHostIpCfg・kKeyLidarImuHostIpCfg）ので、別のプロセスで SDK を動かすと\nドライバの点群と IMU を奪う恐れがある（推測。試していない）。gouda_recorder が log に書くのは mode/state と log/decision だけ（recorder_node.py 9・57・58 行）。\nrosbag は ros2 bag record -a なので topic にすれば入るが、rosbag は人がボタンで始めるもので自動では始まらない（intent 24 行）。log は事前地図作成と自律走行の開始で自動で始まる。\n推奨：A ドライバの写しへの patch。A1 の作り方（固定の commit を stage に写してビルド、checkout は変えない）なら、リポジトリに置いた patch を stage にだけ当てられる。\ncallback で受けた JSON から必要な項目（作動状態・温度・診断の段階・hms_code）だけを /diagnostics（diagnostic_msgs/DiagnosticArray、name は mid360）に出し、\ngouda_recorder が /diagnostics の mid360 の項目を log に書く（周期は通知の周期か、それより間引く。値は実装のときに決める）。理由：温度と診断コードを取れるのはこの方法だけ、\n標準の型（intent 87 行）、変更が小さい（推測：callback の登録と publisher で数十行）、上流 issue #80（温度を topic で出してほしい、2023 年から open、実装なし）に PR として返せる。\n代替：B 受動的な受信（raw socket・pcap で状態の通知の UDP を読み、Gouda の node で通信プロトコルを解く）：上流は変えないが、CAP_NET_RAW（sudo の setcap）と自作の解析が要る。\nC 別のプロセスの SDK：上の理由で採らない。D TU Darmstadt の fork の診断：時刻同期と途絶だけで温度は出ない（REV-260 の DEC-479）。E 上流 #80 の実装を待つ：見込みがない。\nF 点群の途絶だけを記録（DEC-456 の代替と同じ）：温度・診断コードは分からないので回答を満たさない。\n注意（考慮漏れになりやすい点）：通知の JSON には機器の IP アドレスとシリアル番号が入る見込み（推測。PROTO の 0x0102 の項目で確かめる）。log・rosbag はリポジトリに置かないが、\n必要な項目だけを出し、アドレスとシリアル番号は出さない。patch は DEC-075（OSS はなるべく改変しない）からの例外になる。固定の commit を変えるたびに patch が当たるかを確かめる。\n振る舞いの違い：A・B は /diagnostics と log に MID-360 の状態が出る。走行の判断（止める・続ける）には使わない（DEC-456 で別に決める）。\n決まらない場合に止まる作業：DEC-479 の記録の実装。P4〜P7 の試験は止まらない（温度は T07-1 で外から測る）。第247便。 REV-278（第252便）：人の回答「A で進める」で A を採り、実装した。ドライバの写しへの patch（third_party/patches/livox_ros_driver2/0001-publish-lidar-state-push-on-diagnostics.patch、setup.sh が当てる。当たらなければ止まる）、gouda_recorder の /diagnostics の購読（recorder_node.py・recorder_core.py の diagnostic_payloads、名前は mid360_config.py の DIAGNOSTIC_NAME）。通知の周期とセンサーをつないだ確認は未実行。"
