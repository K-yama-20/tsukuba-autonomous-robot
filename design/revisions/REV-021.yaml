  - id: TS-27
    kind: test
    name: 地図作成の開始・終了、原図の登録、変換（stub・単体）
    intent_lines: [9, 11, 12]
    issue_refs: [Q-06]
    related_refs: [ND-03, ND-05, ND-06, IFD-29, IFD-35, IFD-37, IFD-45, IFD-46, TR-03, TR-04, TS-11, TS-26]
    sensitivity: [operation]
    test:
      execution_status: 未実行
      stage: 地図作成と変換
      procedure: >-
        単体（gouda_core/test/test_mapping_core.py）: GLIM 実行設定の生成（CPU モジュール・Gouda の topic／frame・viewer なし）、dump の検査、偽プロセスでの停止、地図データベースの登録（不完全な dump は登録しない）・変換の公開と破棄・内容ハッシュ、
        合成 submap からの occupancy grid 生成（map.yaml・map.pgm）、submap なし・設定なし・未検証の点形式の拒否。
        ROS 上（Ubuntu、センサーなし、trial parameter）: 地図作成開始ボタン → GLIM 起動・IFD-45 で記録が自動開始（contrib auto:map_start）→ 地図作成終了ボタン → GLIM が dump を書き手動走行へ戻る → 原図が maps/<origin>/source に登録される →
        変換 action は「submap なし（センサーデータなし）」で失敗し原図は保持、processing_state は map_converting→idle → 自動開始分の記録が停止（IFD-46）。全段の DecisionEvent と record/status を確認。
      observe: DecisionEvent（mapping_started／record_auto_start／mapping_stopped／source_map_registered／map_convert_failed／record_auto_stop）、mode/state の mode と processing_state、maps/index.json、record/status。
      expected: >-
        TR-03 で mode=2（事前地図作成）、GLIM が起動し記録が自動開始。TR-04 で mode=1、GLIM が dump を書き終えてから原図が内容ハッシュ付きで登録される。変換は非同期で、失敗しても原図は保持され不完全な成果物は残らない（RQ-I009）。
        変換中は processing_state=map_converting で専用モードは現れない（DEC-010）。自動開始した記録だけが止まる（RQ-I017）。実データでの変換（submap の点形式の確認）は実車で行う。

modifications:
  - id: IFD-37
    set_nested:
      designed_interface.message_type: gouda_interfaces/action/ConvertMap（定義済み。REV-021。goal＝origin_id・settings_json、result＝ok・message・revision・content_hash・source_content_hash・map_yaml_path、feedback＝stage・progress）
  - id: IFD-35
    set_nested:
      designed_interface.message_type: GLIM 1.2.2 の dump（graph.txt・graph.bin・values.bin・traj_imu.txt・traj_lidar.txt・odom_*.txt・config/、データがあれば %06d/ に data.txt と点群）＋ source_manifest.json（由来 ID・内容ハッシュ・版・設定）
      designed_interface.name: <data_root>/maps/{origin_id}/source/
      designed_interface.time_semantics: 地図作成終了（TR-04）で GLIM に SIGINT を送り dump の書き出しを待つ（PRM-37）。graph.txt・values.bin が揃った dump だけを登録・公開し、不完全な dump は作業領域に残す。submap の点形式（points_compact.bin）は実データで確認するまで未検証（FILE-VEHICLE-PC-GLIM-RUN）
  - id: IFD-29
    set_nested:
      designed_interface.name: <data_root>/maps/{origin_id}/{source|converted/{revision}}/ ＋ manifest、index.json
      designed_interface.message_type: source_manifest.json／manifest.json（JSON。由来 ID・内容ハッシュ・変換設定・変換器版・座標対応）、変換後地図は Nav2 map_server 形式（map.yaml＋map.pgm）
  - id: ND-05
    set_nested:
      ros_node.lifecycle: plain_node
      ros_node.placement_rationale: >-
        map_database は library（gouda_core/gouda_core/map_database.py）で常時稼働の DB node は置かない（M-006）。変換は gouda_map_creator（map_creator_node.py、map/convert action）が一時領域に書き検証後に公開（IFD-29）。
        変換の設定 PRM-33〜36・38 は未確定（実車の原図で決める）で、stub 試験では仮値ファイル（trial）を使う。lifecycle 化は 5-6 の有効化設計で判断（現状 plain node）。
  - id: ND-03
    set_nested:
      ros_node.placement_rationale: >-
        旧 gouda_section_executor／progress_tracker（C-012）を独立主体として置かず、Nav2 の action と feedback をそのまま使う薄い client にまとめる。モードの正本は一箇所。
        工程5-1: mode_core.py（起動遷移 TR-01／TR-02、永続記録）と mode_manager_node.py（mode/state・DecisionEvent）。工程5-2: サービス IFD-02〜07 の受付（未実装の遷移は工程名付きで拒否）。
        工程5-3: TR-03（GLIM を子プロセスとして起動: glim_runner.py。IFD-45 を非同期で呼ぶ）と TR-04（GLIM 停止と dump 待ち PRM-37、原図の登録、IFD-37 の非同期起動と processing_state=map_converting、IFD-46）を実装。
        GLIM の topic／frame は設計の IF 名（IFD-19〜22）で、設定値ではない。ND-07／ND-08 が実装された後は TR-03 の guard で非活性を確認してから GLIM を起動する（RQ-I004）。
  - id: ND-06
    set_nested:
      ros_node.placement_rationale: 第三者ソフト。交換は部品と launch の変更で済ませる（RQ-I036）。版は実車PC の 1.2.2-0noble で固定（DEC-062、IFD-35）。実行設定は glim_runner が配布テンプレートから CPU モジュール・Gouda の topic／frame・viewer なしで生成し、dump は SIGINT で保存される（FILE-VEHICLE-PC-GLIM-RUN）。
  - id: TR-03
    set_nested:
      transition.guard: 自律走行系の推定器（ND-07・ND-08）が非活性で、GLIM と競合する TF 発行者がいない（RQ-I004）。GLIM が既に動いていない
      transition.actions:
        - GLIM（ND-06）を起動・有効化（glim_runner。実行設定は配布テンプレートから生成、dump 先は作業領域 mapping/{origin_id}/glim_dump）。失敗は DecisionEvent（mapping_start_failed）で monitor に表示し、遷移を拒否
        - 記録の自動開始を要求（IFD-45 record/log/start_pre_mapping。契機は人の地図作成開始ボタン：RQ-I015）。非同期で呼び、失敗・無応答でも地図作成の開始を止めない。失敗は DecisionEvent と monitor のポップアップ
        - 設定状況を記録（地図作成前：RQ-I015。GLIM の topic／frame・設定ディレクトリを DecisionEvent に残す）
  - id: TR-04
    set_nested:
      transition.actions:
        - GLIM に保存を要求（SIGINT）し dump の完了を待つ（PRM-37）。完了した dump だけを原図として map_database へ登録（由来 ID・内容ハッシュ・版・設定：RQ-I008・IFD-29）。不完全なら登録せず作業領域に残す。GLIM の TF 発行は停止する
        - 自動変換を Action（IFD-37）で非同期に起動し、processing_state=map_converting を IFD-01 で表示（DEC-010）。結果（成功・失敗）を DecisionEvent に記録。失敗しても原図は保持（RQ-I009）。変換専用モードは作らない
        - 自動開始したログ記録を停止（IFD-46 record/log/stop_auto）。手動開始の記録は停止しない（RQ-I017）
        - 設定状況を記録（地図作成後：RQ-I015）
  - id: SO-04
    set_nested:
      state_owner.state_items:
        - name: map_database
          description: 原図と変換後地図、由来ID、各成果物の内容ハッシュ、変換設定・変換器版（RQ-I009）。実装は <data_root>/maps（source_manifest.json・manifest.json・index.json）
          persistence: persisted
          restore_scope: ファイルが正本。実行中状態はない
        - name: conversion_job
          description: 実行中の変換ジョブ（原図ID・進捗・結果）。モードではなく処理状態（DEC-010）。一時領域 .converting_* に書き、検証後に converted/{revision} へ公開
          persistence: volatile
          restore_scope: 再起動で中断。不完全な成果物は破棄し、人が再変換を起動できる
