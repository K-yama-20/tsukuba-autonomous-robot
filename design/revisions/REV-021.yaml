# 変更セット REV-021（2026-10-09 第15便: 工程5-3（地図作成と変換）の実装着手。GLIM の起動・停止、地図データベース、変換、ConvertMap action、変換設定と GLIM 停止待ちの parameter、試験 TS-27）
# 適用: design/tools/apply_revision.py REV-021
id: REV-021
date: '2026-10-09'
summary: >-
  DEC-074 の許可により工程5-3 に着手。TR-03（GLIM 起動＋IFD-45 の非同期呼出し）と TR-04（GLIM 停止と dump 待ち、原図の登録 IFD-29、変換 action IFD-37 の非同期起動、IFD-46）を gouda_mode_manager に実装。
  gouda_map_creator（ND-05）を map/convert action（gouda_interfaces/action/ConvertMap）として実装し、地図データベース（原図・変換後地図を内容ハッシュと由来 ID で管理、一時領域→検証→公開）を library 化。
  Ubuntu の GLIM 1.2.2 をセンサーなしで起動・停止し dump 形式（graph.txt・values.bin・traj・config、データがあれば %06d/ submap）を確認（FILE-VEHICLE-PC-GLIM-RUN）。
  変換設定 PRM-33〜36・38（未確定。実車実測後に決める。合成データの単体試験用の仮値あり）、GLIM 停止待ち PRM-37（未確定。旧実装の 90 s を仮値）を宣言。生成器に仮値ファイル（<node>.trial.yaml、stub 試験専用）を追加。
basis_refs: [DEC-074, DEC-062, DEC-010, DEC-071]
intent_version_copy: design/baselines/intent_history/intent_v7_f69dd98b9529.md

files:
  - id: FILE-VEHICLE-PC-GLIM-RUN
    path: design/research/vehicle_pc/2026-10-09_glim_dump_format.txt
    role: evidence

