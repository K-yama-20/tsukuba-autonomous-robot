- id: DEC-216
  set:
    note: 採用：「帯の外は通れるが高い費用」。global costmap の obstacle_layer の combination_method を 2（MaxWithoutUnknownOverwrite：層の空きが不明を上書きしない）にする。上流の既定は 1（updateWithMax：空きが不明を上書きする）。根拠は分岐先が読んだ上流のソース（costmap_layer.cpp）、試験はしていない。 転記の出所は分岐セッション（local_11a193cd…「Side chat」、2026-10-21）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。設定値の変更・実装・rosbag からの作り直しは、メインのチャットで人に確かめてから行う（第103便）。 REV-134（第104便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。PRM-72・96・97 の値の変更、DEC-211・213〜218 の実装、外付けの rosbag からの地図の作り直し（VM、読むだけ）に着手して。」）。
- id: DEC-217
  set:
    note: 採用：inflate_around_unknown＝false（上流の既定のまま。true だと不明の格子に通れない値が書かれ allow_unknown＝true の意味がなくなる：分岐先が上流のソースで確認）。原文 5 の問い（base_link が帯の端を通りうるか）への分岐先の答えは提案に。monitor の /config「Nav2」タブで変えられるようにする（原文 6・7）。 転記の出所は分岐セッション（local_11a193cd…「Side chat」、2026-10-21）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。設定値の変更・実装・rosbag からの作り直しは、メインのチャットで人に確かめてから行う（第103便）。 REV-134（第104便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。PRM-72・96・97 の値の変更、DEC-211・213〜218 の実装、外付けの rosbag からの地図の作り直し（VM、読むだけ）に着手して。」）。
