- id: DEC-214
  set:
    note: 振る舞いの違い：不明な所を通る経路を引かない（intent.md:15「観測外を安全とみなさない」）。経路が引けないときは recovery の後に TR-07（計画の失敗）。未確認：obstacle_layer の clearing が static の「不明」を「空き」に上書きするか（AI の推測、上流のソースは未確認）。決まらない場合に止まる作業：案 C の 2D 地図での走行。 REV-133（第103便）：不採用：allow_unknown は true（上流の既定のまま）。帯の外は「通れるが高い費用」（NavFn：不明は COST_OBS−1。分岐先が上流のソースで確認、試験はしていない）。見えた所の扱いは DEC-216。転記の出所は分岐セッション（local_11a193cd…「Side chat」、2026-10-21）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。設定値の変更・実装・rosbag からの作り直しは、メインのチャットで人に確かめてから行う（第103便）。 REV-134（第104便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。PRM-72・96・97 の値の変更、DEC-211・213〜218 の実装、外付けの rosbag からの地図の作り直し（VM、読むだけ）に着手して。」）。
