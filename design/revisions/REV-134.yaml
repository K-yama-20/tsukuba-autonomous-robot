decision_updates:
- id: DEC-211
  set:
    note: 振る舞いの違い：走行の経路は地図作成で通った帯の中だけになる。DEC-098 の分類の設定は走行に使われなくなる（役割の変更）。決まらない場合に止まる作業：案 C の 2D 地図（自律走行の開始）。 REV-133（第103便）：分岐先の読み：承認（走行に使う map.yaml を帯の地図に替え、今の分類の地図は表示用の map_ground_band）。そのうえで、人が帯と 3D 点群の重ね図の上に描く「走行禁止」「走行可」の範囲を Nav2 の KeepoutFilter で重ねる（提案 design/proposals/drawn_areas_2026-10-21.md、承認事項は DEC-220〜224）。重ね図は原文 6 の要望。転記の出所は分岐セッション（local_11a193cd…「Side chat」、2026-10-21）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。設定値の変更・実装・rosbag からの作り直しは、メインのチャットで人に確かめてから行う（第103便）。 REV-134（第104便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。PRM-72・96・97 の値の変更、DEC-211・213〜218 の実装、外付けの rosbag からの地図の作り直し（VM、読むだけ）に着手して。」）。
- id: DEC-212
  set:
    note: 決まらない場合に止まる作業：古い原図からの帯の地図だけ（新しい原図は止まらない）。 REV-133（第103便）：採用は代わりの案 B（/config の写しがない原図からは帯を作らない。今の実装のまま）と、外付けのドライブの rosbag から製品の手順で地図を作り直すこと（原文 6・7、分岐先の推奨「B＋作り直し」）。人の申告（事実として記録）：VM に入っている地図は古い。外付け /Volumes/Crucial_4TB/Gouda に rosbag が数件ある。転記の出所は分岐セッション（local_11a193cd…「Side chat」、2026-10-21）。セッション間のメッセージで届いたもので、人がこのメインのチャットに貼ったものではない。設定値の変更・実装・rosbag からの作り直しは、メインのチャットで人に確かめてから行う（第103便）。 REV-134（第104便）：人がこのメインのチャットで転記を確かめ、着手を指示した（原文「転記は私の回答で間違いない。PRM-72・96・97 の値の変更、DEC-211・213〜218 の実装、外付けの rosbag からの地図の作り直し（VM、読むだけ）に着手して。」）。
- id: DEC-213
  set:
