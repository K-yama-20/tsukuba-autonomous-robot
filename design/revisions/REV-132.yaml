- id: ND-02
  set_nested:
    ros_node.responsibilities:
    - 現在のモードと各nodeの状態の表示（RQ-I033）、ログ・rosbagの記録状態表示と独立した Record／Stop Record 操作（RQ-I005）
    - 地図作成開始／終了、自律走行開始／一時停止／再開／終了の操作（サービス呼出し。進行の正本は持たない）。待ち時間は ROS parameter（PRM-29〜32。一時停止は別枠）で、超過は失敗を表示し自動再試行はしない
    - 判断（log/decision）は時刻付きの「履歴」欄に表示し、「現在の状態」欄（mode/state）とは分ける。保持されたメッセージの受信を契機にしない（DEC-072）。記録の自動開始の失敗（record_auto_start_failed）はポップアップで警告（DEC-071）
    - 初期位置・向きの指定（IFD-39）。開始時と、PC 再起動後の再開前（DEC-009）
    - waypoint_manager GUI の表示（RQ-I044）と waypoint・区間速度上限の編集・保存（RQ-I078）。保存時に Speed Filter 用の速度マスクと filter info を生成して同じ由来 ID・ハッシュで保存（IFD-41、DEC-031。幅は PRM-19、刻みは PRM-20）
    - 保存時に、重複する cell で上限が異なる区間を検出して警告する（対象区間と採用される低い方の値を示す。保存は拒否しない。DEC-059 案 A、TS-22）
    - 地図とwaypointの組の選択とプレビュー（RQ-I011）
    - センサTF・座標方向等の /config の保持。タブ遷移で設定が消えない永続化（RQ-I070）
    - 表示用の状態集約。ESP32 STATUS のうち取得できる項目を表示し、取得できない項目・途絶時は「不明」と表示（DEC-006）。monitor の表示断は停止の契機にせず、再接続後に transient_local の状態を取得する（DEC-014）
    - 自身の設定状況（UI の周期・待ち時間 PRM-27〜32、/config の版）を起動時と /config 保存時に DecisionEvent（event=settings）で記録する（DEC-073、RQ-I015）。中継ノードとして parameter を宣言する（ブラウザ側 UI は宣言しない）
    - 点群（IFD-21）と IMU（IFD-22）の受信状況（状態・周期・経過・header.stamp と受信時刻の差）を表示する。中身は展開せず到着だけを数える。表示のみで停止条件にしない（DEC-088）。しきい値は PRM-57・PRM-58
    - 地図作成開始ボタンの時点でどちらかのセンサーが未受信または途絶なら、ポップアップと DecisionEvent（mapping_start_sensor_warning）で警告する。開始は止めない（RQ-I011、DEC-088）
    - 「地図」タブ（RQ-I082）。地図データベースの原図と変換後地図（rev）の一覧、変換設定（PRM-33〜36・38・62〜64）の入力と再変換（IFD-37 に設定を添えて送る。一度に一つ）、rev ごとのプレビュー（2D 地図、3D 点群地図を上から見た高さの図、表示用の傾き・段差の図。DEC-095・DEC-097 A）・設定・結果の表示。既定値は gouda_map_creator の parameter を表示する。再変換の要求と結果を DecisionEvent で記録する
    - DecisionEvent の glim_exited（GLIM の異常終了）と、record/status の failures の増加（記録の失敗。last_failure を示す）をポップアップで示す。接続時に受け取った保持分はきっかけにしない（DEC-072 と同じ規則。G-GLIM-EXIT、G-REC-ROSBAG-RESTART）
    - /config の「Nav2」タブ（DEC-201・DEC-207 (a)・DEC-209）：Nav2 BT の recovery の回数を入力し IFD-54 に保存する（1 以上 PRM-18 以下の整数）。保存した値、次の gouda.sh start で使う値とその出所（monitor の値か PRM-18 か）、今の起動で使っている値（<data_root>/run/nav2/recovery.json）を表示する。保存を DecisionEvent に残す
    ros_node.publishes_refs:
    - IFD-26
    - IFD-39
    - IFD-41
    - IFD-28
    - IFD-52
    - IFD-54
  interpretation_append: REV-132（DEC-209）：「Nav2」タブを足した。
- id: ND-10
  set_nested:
    ros_node.responsibilities:
    - 経路計画・追従・後退・再計画・通過／到達判定（RQ-I011・RQ-I018・RQ-I019）
    - NavigateThroughPoses action の提供（IFD-13）と cmd_vel の発行（IFD-15。velocity_smoother を経た後の値）
    - costmap の SpeedFilter による SpeedLimit の発行と controller への適用（IFD-14、DEC-031）。mask・filter info は標準 server で配信（IFD-42）
    - map_server による静的地図の提供（IFD-24）
    - 設定・プラグイン・BT で拡張し本体は改変しない（RQ-I056・RQ-I057）
    - '構成（DEC-122）: controller は Regulated Pure Pursuit、planner は NavFn、BT は上流の navigate_through_poses_w_replanning_and_recovery.xml の写しに PRM-11・PRM-18 を入れたもの、behaviors は spin・backup・wait、velocity_smoother を使う、collision_monitor は使わない（RQ-I072）、cmd_vel は TwistStamped（PRM-12）'
    - 障害物は XT-32 の点群（IFD-21）を local の VoxelLayer・global の ObstacleLayer に直接入れ、高さの帯（PRM-70・PRM-71）で地面と頭上を除く。track_unknown_space を true にして観測していない所を空きとみなさない（RQ-I012、DEC-122）
    - 設定は上流の nav2_bringup の nav2_params.yaml を雛形に、plugin の選択、frame・topic（IF の名前）と PRM の値だけを差し込んで起動時に作る。雛形のその他の値は変えない。実車の設定（trial なし）で PRM-11・17・18・66〜73 のどれかが未確定なら Nav2 を起動せず理由を記録する（RQ-I076、intent.md:85）
    - 起動する server（gouda_nav2.launch.py。DEC-183 で名前を補足）：map_server（静的地図、IFD-24）、filter_mask_server（速度マスク用の map_server、IFD-42）、costmap_filter_info_server（IFD-42）、controller_server、smoother_server、planner_server、behavior_server、bt_navigator、velocity_smoother、lifecycle_manager_navigation（autostart false。ND-03 が IFD-36 で起動・停止）
    - velocity_smoother の後退の速度の上限（min_velocity の x）は PRM-78（車椅子の後退の上限、倒し切ったときの後退の速さ）。前進の上限は PRM-66。後退の倒し量と速度の傾きは前進より小さく（DEC-197）、Nav2 が倒し切りより速い後退を指令しないようにする（DEC-198 案 A。回転と組み合わせたときの範囲は倒し量の円で決まり、Nav2 は知らない：reports/reverse_limit_study_2026-10-21.md）
    - BT の recovery の回数は、起動のときに IFD-54（monitor で保存した値）があればその値、なければ PRM-18（DEC-207 (a)・DEC-209）。使った値と出所を <data_root>/run/nav2/recovery.json と起動の記録に残す。値の範囲は 1 以上 PRM-18 以下で、外れていれば PRM-18 を使い理由を残す
    ros_node.subscribes_refs:
    - IFD-14
    - IFD-23
    - IFD-25
    - IFD-18
    - IFD-19
    - IFD-20
    - IFD-42
    - IFD-54
  interpretation_append: REV-132（DEC-209）：recovery の回数を IFD-54 から読む。
