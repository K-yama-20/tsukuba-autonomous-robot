  question: '【承認】DAC のフルスケール電圧（PRM-46。12 bit コード 4095 に対応する電圧）を何 mV にするか。最大 4800 mV（DEC-159）は今の 4700 mV を超えるため、firmware は設定を不正として DAC に書かない。あわせて DEC-077 の回答の「フルスケール4700mv（x,y軸の合計値）」の意味（firmware は x・y の各チャンネルで、コード 4095 に対応する電圧として使う）を確かめたい。'
  answer_verbatim: ''
  affected_refs:
