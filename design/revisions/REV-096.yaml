  note: '推奨：基板の MCP4922 の VREF（とゲイン）の実際の値にする。VREF が 4800 mV 以上なら、その値を PRM-46 にする。VREF が 4800 mV 未満なら、DAC は 4800 mV を出せないので、最大を下げる（DEC-159 の見直し）。代替：測るまで 4800 mV 以上の仮の値にする（mV→コードの換算がずれ、全電圧が比例してずれるので推奨しない）。決まらない場合に止まる作業：実車向け firmware の書き込み（設定が不正のため DAC に書かない）。'
