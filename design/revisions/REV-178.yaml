- id: DEC-385
  set:
    status: answered
    answered_on: '2026-10-24'
    disposition: answered
    answer_verbatim: |
      DEC-385を承認する。
    resulting_refs:
    - DEC-356
    note: >-
      推奨は承認。理由：GNSS がどの状態でも、S2 で必ず種がある（つくばチャレンジのスタートは決まった場所：DEC-355）。S1 と S2 の差が大きいときは人に知らせる。S3 の上限：第148便では 3 m は正しく、5 m は 5.86 m 離れた誤った位置に『正常』で合った。 人は rviz2（DEC-357）で推定の位置を見て確かめてから発進する。発進の後の人の操作は失格（DEC-345）なので S4 は発進の前だけ。代替案：S2 を使わない（今の作り）、DEC-133 の条件 (2) を保つ（自動で次の段に進まない）。提案 design/proposals/localization_start_gnss_states_2026-10-24.md §2。決まらない場合に止まる作業：開始の手順の変更。 REV-178（第154便）：人の回答（原文）「DEC-385を承認する。」。開始の初期位置の順 S1 GNSS → S2 登録した開始姿勢 → S3 範囲を段階的に広げる → S4 人の入力、どの段で決まったかの記録・表示、DEC-133 の条件 (2) を発進の前の準備の段階では自動で次の段に進む形に変える、を採用。S3 の段階の値・上限・各段の時間は tbd（DEC-360 の試験。第148便では 3 m は正しく、5 m は誤った位置に『正常』で合った）。S1 は GNSS の門（DEC-384、pending）と地図との対応（DEC-388、pending）が決まるまで使えない（S2 から始める）。実装はまだ（値が未定）。
- id: DEC-356
  set:
    status: answered
    answered_on: '2026-10-24'
    disposition: answered
    answer_verbatim: |
      DEC-385を承認する。
    note: >-
      推奨は承認。注意：広げるほど 1 回の探索が長くなり（今の実車で初期化 17〜30 s）、似た景色の所で誤った位置に合う恐れが増える。探索の点の数（上流の particles_num 200）を段に合わせて増やすかも決める。 向きは一周を試すので、向きの段階は不要。スタートの規則（1 分以内にスタートライン）との関係は DEC-359 と組。決まらない場合に止まる作業：ND-07 の探索の作りの変更。 REV-176（第152便）：人の指示で判断 4 を再考した（DEC-382）。段階的な探索は、開始の初期位置の順の S3 として DEC-385 に組み込んだ。この項目は pending のまま（DEC-385 と一緒に答える）。 REV-178（第154便）：DEC-385 の承認（人の原文「DEC-385を承認する。」）に含まれるので answered とした（S3）。段階の値・上限・探索の点の数（particles_num）は tbd（DEC-360）。
- id: DEC-133
  set:
    note: >-
      推奨は承認（intent 体験 9 の「取得されて表示され、人が収束と正しさを確認する」に近い）。ND-07 の実装（DEC-115）が前提。判定の値（サンプル数・静止の判定など）は tbd。決まらない場合に止まる作業：GNSS による初期位置の実装。 2026-10-18「条件付きで承認」。条件の記載がないため DEC-137 で確認する。条件が分かるまで、この項目に基づく実装はしない。 2026-10-18 条件（DEC-137 の回答、原文「1a2a3b4ok5実機検証してから6実機検証してから7a8a9b」。番号は AI が示した条件の表の項目）: (1) 自動の初期化は、自律走行の準備の画面で人が「GNSS で初期化」を押したときに始める。(2) 収束の確認に失敗したら止めて理由を表示し、人がやり直す（自動でやり直さない）。(3) 収束していないときも開始ボタンは拒否せず、警告だけを出して人の判断で開始できる（TR-05 に条件を足さない）。(4) GNSS が使えないときの人の指定（今の初期位置の入力）は残す。(5) 静止の判定に何を使うかと (6) 判定の値は、実機での検証の後に決める（それまで tbd）。(7) 対象は GNSS との対応（DEC-135）がある地図だけ。(8) PC 再起動後も同じ流れを使う（再開は人の操作の後。DEC-009 は書き換えない）。(9) 自己位置推定の方式によらない形にする（初期姿勢を送って収束の結果を受け取ることだけを ND-07 との契約にする）。実装の前提（ND-07 の方式 DEC-115、対応 DEC-135）は変わらない。 REV-176（第152便）：開始の初期位置の順（DEC-385）は、条件 (2)「収束の確認に失敗したら止めて理由を表示し、人がやり直す（自動でやり直さない）」を、発進の前の準備の段階で自動で次の段に進む形に変える案を含む。DEC-385 で確認する。 REV-178（第154便）：DEC-385 が承認された（人の原文「DEC-385を承認する。」）。条件 (2)「収束の確認に失敗したら止めて理由を表示し、人がやり直す（自動でやり直さない）」は、発進の前の準備の段階では DEC-385 の順で自動で次の段に進む形に置き換わる（DEC-133 の回答そのものは書き換えない）。
