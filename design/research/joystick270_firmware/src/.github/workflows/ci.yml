name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install platformio==6.1.19
          python -m pip install -r tools/requirements.txt
      - name: Run native unit tests
        run: pio test -e native
      - name: Build joystick controller
        run: pio run -e joystick270
      - name: Build encoder mock
        run: pio run -d encoder_mock -e encoder_mock
      - name: Test Python protocol tools
        run: python -m unittest tools/test_tools.py

  ros2-jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v7
      - name: Install ROS build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3-colcon-common-extensions
      - name: Build ROS 2 workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
