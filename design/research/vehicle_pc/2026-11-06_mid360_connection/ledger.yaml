      local: "Sensors/MID-360/official/icm40609/ds-000330_icm-40609-d_v1.2.pdf（sha256 5e6eaca4dcd0443b40eb681dfa16345ce3d81134d7a8fe7030a9a0ea214dacb2）"
      summary: "ジャイロ（Table 1、p10）：感度の初期誤差 ±0.5 %、ゼロ点の初期誤差 ±1 °/s（基板実装後）、ゼロ点の温度変化 ±0.01 °/s/°C、雑音密度 0.0045 °/s/√Hz、軸間感度 ±1 %。加速度（Table 2、p11）：ゼロ g の初期誤差 ±40 mg（基板実装後）、温度変化 ±0.15 mg/°C、雑音密度 100 µg/√Hz、感度の初期誤差 ±0.5 %、軸間感度 ±1 %。ゼロ点・軸間感度は特性評価の値で出荷試験の保証なし（注 3）"
      verified: "AI が pdftotext で原文から読んだ。Mid-360 に載っているのが -D 版かは未確認（User Manual は ICM40609 とだけ記載）"
    - id: R-L-02
      title: Mid-360 の IMU の出力（Livox の資料）
      url: https://github.com/Livox-SDK/livox_wiki_en
      summary: "既定 200 Hz、有効・無効の切り替えあり、軸は点群と同じ向き、位置は点群の座標系で x 11.0・y 23.29・z −44.12 mm（User Manual の IMU Data の節）。UDP ではジャイロ rad/s・加速度 g（通信プロトコル v1.4.12 の 2.3 節）。周期・測定範囲の設定の項目（imu_sensor_cfg）が Mid-360 で使えるか、工場での校正、Livox が想定する用途は未確認"
      verified: false
    - id: R-L-03
      title: 公式ドライバの IMU の扱い
      url: https://github.com/Livox-SDK/livox_ros_driver2
      summary: "sensor_msgs/Imu の加速度は g のまま（ROS の決まりの m/s² ではない）、frame_id は livox_frame に固定（lddc.cpp 480〜497 行、収集の担当が確認）。時刻は同期なしで PC の受信の時刻、同期ありで機器の時刻（pub_handler.cpp 105〜118・265〜274 行）"
      verified: 時刻の扱いは AI がソースの写しで照合
    - id: R-L-04
      title: IMU の既知の問題（利用者の報告）
      url: https://github.com/Livox-SDK/livox_ros_driver2/issues/235
      summary: "driver2 の issue 235：IMU の間隔が 5 ms に揃わず 1 ms と 4 ms が混ざる。SDK2 の issue 118：IMU と点群の時刻が大きく食い違う。SDK2 の issue 37：加速度が −4 g に張り付く個体。driver2 の issue 157：単位が g。driver2 の issue 217：frame_id を変えられない"
      verified: false
    - id: R-L-05
      title: 補正に使えるかの見積もり（AI の計算。データシートの TYP 値から）
      summary: "走行中の歪みの補正：1 rad/s・0.1 s（1 枚）で、感度の誤差 0.5 % → 約 0.03°、ゼロ点 1 °/s → 約 0.1°（静止で測れば小さくできる）。補正しないときの歪み約 5.7° に対し 1/50 以下で、使える見込み。取り付けの傾き：ゼロ g の初期誤差 40 mg → 最大約 2.3°、温度 30 °C の変化で約 0.26°。そのままでは 0.5° の目標に足りない"
    - id: R-L-06
      title: 重力の向きから取り付けの角度を求める方法（AI の案。人の指摘「取り付け時の角度はあまり精度が良くない」を受けて）
      summary: "取り付けの前に、机の上で MID-360 を 6 つの向き（各面を下）に置いて静止データを取り、加速度のゼロ g の誤差と感度を軸ごとに求める（6 面法。重力 1 g が基準なので治具は要らない）。取り付けの後は、平らな所で止めて数十秒の平均の重力の向きから roll・pitch を出し、求めたゼロ g の誤差を引く。残る誤差の主な元は温度による変化（0.15 mg/°C、30 °C で約 0.26°）と床の傾き。床の当てはめ（#72 の方法 1）と突き合わせる。床の傾きは、その場で車体を 180° 向きを変えて 2 回測ると打ち消せる。yaw は重力では求まらないので、XT-32 との点群の位置合わせで求める"
  M_driver_choice:
    # 2026-11-06 追記。GitHub の数は 2026-11-06 に gh api で取得（収集の担当）
    - id: R-M-01
      title: よく使われているドライバ（鉄板）
      summary: "公式 Livox-SDK/livox_ros_driver2 が star 896、コード検索での参照 約 1860 で最多。Ericsii fork（IMU を m/s² で出す）star 45・約 164、TU Darmstadt fork（jazzy、colcon、diagnostics）star 42・約 10、他は数件。ROS の apt（Jazzy の配布の一覧）には入っていない"
    - id: R-M-02
      title: 下流のプロジェクトの前提
      url: https://github.com/koide3/glim
      summary: "FAST-LIO は公式の CustomMsg（点ごとの時刻）を前提にし、代替として Ericsii の fork を紹介。GLIM の設定に acc_scale（コメント：Livox は 9.80665）があり、公式の g の出力を前提にしている。Unitree の Go2・G1 の ROS 2 の構成も公式を指す。つくばチャレンジでは Shinsotsu が自前の fork、KBKN・t_nakabayashi は版を未確認"
    - id: R-M-03
      title: 選び方の注意
      summary: "単位を変える fork（m/s²）は、下流（GLIM の acc_scale など）と同時に変えないと二重に変換される。PointCloud2（xfer_format 0）と CustomMsg（1）は同時に出せないとされる（未照合）。推奨は公式を commit 固定、colcon に入れたい場合の 2 番手が TU Darmstadt"
