  - id: G-FLOOR-REFLECTION
    name: 床より下・地面より下の点（光沢のある床の反射、別の高さに写った地面）で地面の推定が下がり、2D 変換で床が障害物や上限より上と判定される
    category: technical
    state: open
    question: 2 回目の試験の原図で、廊下の中の点の高さは床（センサーの約 1.2 m 下）と天井（約 1.3 m 上）に山があるが、床より 0.2〜1.8 m 下にも 4109 点（全体の 12 
      %）あり、廊下の幅の中に壁に沿って並ぶ。 地面の推定は格子ごとの最も低い点の下側の包絡なので、これらに引かれて実際の床より約 1.9 m 低くなった（中央値でセンサーの 3.08 m 下）。 分析用の 2D 
      変換では、床より下の点が障害物の帯に入り廊下の中を埋め、床は上限より上と判定され、空きのセルは 325 しかなかった。FILE-VEHICLE-PC-FIELD-MAPPING-2。 x86 
      機の同じ廊下でも床より下の点が 11.4 % あり、同じく不合格（機材ではなく場所の性質）。屋外（x86）では、地面より 0.5 m 以上下の点は最初の 120 s で 3.2 % だが、 
      同じ場所を通った後の区間では別の通過の地面が 1.8 m 違う高さに写り（G-LIDAR-DROPOUT）、地面と判定された点は全体の 0.1 % だった。FILE-X86-MAPPING-MAPS。
    next_action: '地面の推定を、地面より下の外れた点と、別の高さに写った地面に強くする（設計の修正。docs/map_conversion.md §2 と map_convert.py、単体試験に床の反射と
      2 層の地面の合成データを加える）。 候補: (a) 地図作成の軌跡（センサーの高さ）から /config の取付高さを引いた床の近くだけを地面の候補にする（/config がなければ点だけで推定）。軌跡は通過ごとに使うので、通過ごとの高さのずれにも追従する。
