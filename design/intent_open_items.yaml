  - id: G-LIDAR-DROPOUT
    name: 屋外の地図作成で LiDAR の frame が 2.7〜3.5 s 途切れ、その後 GLIM がずれる
    category: technical
    state: open
    question: x86 機の屋外の地図作成（2026-10-14 06:34〜06:45）で、GLIM が受け取る LiDAR の frame が 06:38:35 に 3.5 s、06:40:29 に 
      2.7 s、06:44:22 に 3.2 s 途切れた。 それぞれの後、約 1 分間、点と IMU の時刻の差の警告が続いた（1.0〜3.6 s）。3 回目では約 9 m 
      ずれ、同じ場所を通った所で高さが中央値 1.8 m 違う。 人によると出発点にほぼ一致して戻ったので、地図の終点のずれ（水平 12.7 m、高さ 6.4 
      m）は誤差（DEC-103）。FILE-X86-MAPPING-MAPS。 カーネルのログでは、3 回とも同じ秒に LiDAR を繋いだ有線 LAN（enp2s0、本体内蔵の r8169）が Link is 
      Down になり、2〜3 s 後に Link is Up になった（物理層でのリンク断）。 サスペンドの記録はなく、GLIM は動き続けた。ACPI の処理の行が 3 回のうち 2 
      回と同じ頃にある。蓋の開閉は systemd-logind の journal に出るため、まだ確かめていない。 supervisor は反応していない（IP 
      アドレスが残り、ドライバは作り直されていない）。FILE-X86-LIDAR-DROPOUT。
    next_action: 蓋の開閉の時刻を journal で確かめ、リンク断の時刻と比べる（人に依頼。journalctl の systemd-logind の Lid closed / Lid 
