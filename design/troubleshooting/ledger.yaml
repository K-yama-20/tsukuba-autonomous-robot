- id: TRB-010
  name: LiDAR の途切れの間に EKF が最後の速度で外挿し、戻ったときの map→odom に段差が入る
  status: 監視中
  sensitivity:
  - safety
  - operation
  decision_refs:
  - DEC-365
  - DEC-374
  - DEC-354
  - DEC-351
  related_refs:
  - ND-07
  - ND-08
  symptom: >-
    LiDAR の点群が数秒途切れて戻った直後に、推定の位置が跳ぶ、長く推定不能が続く、または誤った位置で「正常」になる。経路が急に引き直され、RPP が急に切る。
  mechanism: >-
    事実（第142便の提案 §2 の読み）：Autoware NDT は収束しないと姿勢を出さず、EKF は入力が途切れても最後の vx・wz で予測を進める。途切れの間、GLIM の odometry も来ない。
    推測：車体が実際には止まっている（今なら待機）のに EKF が進み続けると、GLIM が戻った最初の odometry で計算する map→odom に、最大で速度×途切れの時間の誤差が入る
    （計算：1.25 m/s×3.5 s で約 4 m）。NDT はその EKF の姿勢を初期値に使うので、照合が捕らえる範囲を超えれば、長い推定不能か誤った収束になりうる。記録の再生ではまだ確かめていない。
  how_to_confirm: >-
    (1) 途切れの前後の EKF の姿勢・GLIM の odometry・map→odom・NDT の状態の時系列。(2) rosbag 20261014_175847（4.2 s の途切れ）の再生と、test/stack.sh で点群と odometry を 3.5 s 止める試験（DEC-374 (4)）。
  countermeasures: >-
    候補：(a) 戻ったときは EKF の外挿の姿勢ではなく、固定した map→odom×GLIM の姿勢を基準に回復の判定を通す（DEC-351・DEC-365）。(b) 途切れの間は止まって待つ（DEC-365 (c)）。どれも承認事項。
  source: >-
    proposals/kuams_adoption_review_2026-10-23/topic1.md §4.1、proposals/localization_gap_bridging_2026-10-23.md §2。
