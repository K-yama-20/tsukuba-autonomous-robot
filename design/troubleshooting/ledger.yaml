- id: TRB-012
  name: 速い旋回で、動きの歪みを補正していない点群が NDT の照合を乱す
  status: 監視中
  sensitivity:
  - operation
  decision_refs:
  - DEC-371
  - DEC-378
  - DEC-365
  related_refs:
  - PRM-67
  - PRM-60
  - ND-07
  - ND-14
  symptom: >-
    その場の回転（rotate_to_heading、spin の回復）や急な旋回の最中・直後に、NDT の照合の良さ（NVTL）が下がる、推定不能が出る（今の作りでは待機に入る）、推定の向きがずれる。
  mechanism: >-
    事実（トピック 5 のエージェントがコードで確認）：NDT への点群は gouda_a3_points で切り取りと間引きをするだけで、動きによる歪みの補正（deskew）はしない。XT-32 は 10 Hz（PRM-60）。
    計算：1 周 0.1 s の間に、1.0 rad/s（PRM-67）なら 0.1 rad 回り、20 m 先の点で最大約 2 m ずれる。並進は 1.25 m/s で 0.125 m。歪みは並進より回転で大きい。NVTL への影響は未測定。
  how_to_confirm: >-
    (1) その時刻の角速度（IMU・cmd_vel）と NVTL・推定不能の理由の時系列。(2) rosbag で、旋回の速さごとの NVTL を比べる（DEC-378 (3)）。
  countermeasures: >-
    候補：(a) その場の回転の上限を別の値に分ける（DEC-371 の後、実測で判断）。(b) NDT の入力を deskew した点群にする（GLIM の補正済みの点群などを使う案、要調査）。
    (c) 推定不能で即座に待機に入らない（DEC-365）。どれも承認事項。
  source: >-
    proposals/kuams_adoption_review_2026-10-23/topic5.md §2・H3。
