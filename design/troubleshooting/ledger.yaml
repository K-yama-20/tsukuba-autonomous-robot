- id: TRB-011
  name: 幅の広い物が waypoint を塞ぐと計画が失敗し続け、回復を繰り返して滞留する
  status: 監視中
  sensitivity:
  - operation
  - intent
  decision_refs:
  - DEC-367
  - DEC-376
  - DEC-310
  - DEC-339
  related_refs:
  - PRM-18
  - ND-10
  - IFD-13
  symptom: >-
    コースの上に集まったコーン・止めてある自転車・人の集まりがあり、その中か近くに waypoint があると、車体がその手前で回復動作（costmap の消去・回転・待機・後退）を繰り返し、先へ進まない。
    確認走行区間では、一か所に 3 分以上停滞すると走行失敗になる（regulations_2026.md、DEC-339）。
  mechanism: >-
    推測（第150便のトピック 3。上流のソースの読みはエージェントによる、未照合）：ComputePathThroughPoses は waypoint の対ごとに計画をつなぎ、1 区間でも失敗すると全体が NO_VALID_PATH になる。
    NavFn は goal が障害物でも tolerance（0.5）の正方形の中に届く格子があれば代わりの終点にするが、その外まで塞がれていると失敗する。NO_VALID_PATH は回復が効く失敗として扱われ、
    PRM-18（9999999）の回数まで BT の中で回復を繰り返す。今の作りでは waypoint を飛ばす段がない。
  how_to_confirm: >-
    (1) planner_server のログ（「Failed to create plan with tolerance」など）と、Nav2 の feedback の回復の回数。(2) waypoint と障害物の位置。(3) VM の模擬で waypoint の周り 1 m に障害物を置いて再現するか（DEC-376 (1)）。
  countermeasures: >-
    候補：(a) opt-in で waypoint を飛ばす段（DEC-367、DEC-310 の段 3）。(b) waypoint をコースの通りやすい所に置く運用。(c) 滞留の時計で段階を上げる（DEC-310）。どれも承認事項。
  source: >-
    proposals/kuams_adoption_review_2026-10-23/topic3.md §2.2。
  recorded_on: '2026-10-23'
