name: Gouda ROS 2 Jazzy Build
on:
  push:
    branches: [feature/aya-navsystem]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOUDA_WORKSPACE: /home/runner/gouda_ws
    steps:
      - uses: actions/checkout@v4
      - name: Confirm architecture
        run: test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
      - name: Clean installation using user setup
        run: bash scripts/setup.sh --no-configure
      - name: Repeat setup without replacing user data
        run: |
          mkdir -p "$HOME/.local/share/gouda/maps"
          echo keep > "$HOME/.local/share/gouda/maps/preserve.txt"
          cp "$HOME/.config/gouda/host.json" /tmp/host-before.json
          bash scripts/setup.sh --skip-system --no-configure
          cmp /tmp/host-before.json "$HOME/.config/gouda/host.json"
          test "$(cat "$HOME/.local/share/gouda/maps/preserve.txt")" = keep
      - name: Unit and protocol tests
        run: bash scripts/test.sh
      - name: Browser test dependencies
        run: |
          npm install --prefix /tmp/gouda-browser playwright@1.55.0
          /tmp/gouda-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real-input waiting screen and native RViz browser acceptance
        env:
          NODE_PATH: /tmp/gouda-browser/node_modules
        run: bash scripts/smoke.sh
      - name: Stop owned processes
        if: always()
        run: bash scripts/gouda.sh stop || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.arch }}
          path: |
            ~/gouda_ws/log/
            ~/.local/share/gouda/runtime/*.log
            ~/.local/share/gouda/logs/native_view/*.log
            /tmp/gouda-smoke/
