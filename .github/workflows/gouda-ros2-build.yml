name: Gouda ROS 2 Jazzy Build

on:
  push:
    branches:
      - feature/aya-navsystem
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            expected_arch: amd64
          - runner: ubuntu-24.04-arm
            expected_arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Gouda repository
        uses: actions/checkout@v4

      - name: Architecture
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          dpkg --print-architecture
          test "$(dpkg --print-architecture)" = "${{ matrix.expected_arch }}"

      - name: Base packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y \
            curl \
            git \
            locales \
            software-properties-common

      - name: Locale
        shell: bash
        run: |
          set -euxo pipefail
          sudo locale-gen en_US en_US.UTF-8
          sudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8

      - name: ROS apt source
        shell: bash
        run: |
          set -euxo pipefail

          sudo add-apt-repository universe -y
          sudo apt update

          ROS_APT_SOURCE_VERSION="$(
            curl -s \
              https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \
            | grep -F '"tag_name"' \
            | awk -F'"' '{print $4}'
          )"

          curl -L \
            -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"

          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt update

      - name: ROS packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt install -y \
            ros-jazzy-desktop \
            ros-dev-tools \
            python3-rosdep \
            python3-vcstool \
            python3-colcon-common-extensions \
            libboost-all-dev \
            libyaml-cpp-dev \
            ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup

      - name: rosdep init
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update

      - name: Create workspace
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/gouda_ws/src"

          cp -a \
            "$GITHUB_WORKSPACE" \
            "$HOME/gouda_ws/src/tsukuba-autonomous-robot"

          vcs import \
            "$HOME/gouda_ws/src" \
            < "$GITHUB_WORKSPACE/third_party/external.repos"

          if [ -d "$HOME/gouda_ws/src/HesaiLidar_ROS_2.0/.git" ]; then
            git -C "$HOME/gouda_ws/src/HesaiLidar_ROS_2.0" \
              submodule update --init --recursive
          fi

          if [ -d "$HOME/gouda_ws/src/urg_node2/.git" ]; then
            git -C "$HOME/gouda_ws/src/urg_node2" \
              submodule update --init --recursive
          fi

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/jazzy/setup.bash

          rosdep install \
            --from-paths "$HOME/gouda_ws/src" \
            --ignore-src \
            --rosdistro jazzy \
            -r \
            -y

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/jazzy/setup.bash
          cd "$HOME/gouda_ws"

          colcon build \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/jazzy/setup.bash
          cd "$HOME/gouda_ws"
          source install/setup.bash

          colcon test \
            --event-handlers console_direct+

          colcon test-result --verbose
